<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 32" role="img" aria-label="Exin Deploy">
  <title>Exin Deploy</title>
  <!-- Marchio: tre gradini ascendenti + spunta di consegna.
       Usa currentColor: eredita il colore del testo, quindi funziona
       identico in tema chiaro e scuro senza varianti separate. -->
  <g fill="currentColor">
    <rect x="1" y="20" width="5.5" height="5" rx="1.5"/>
    <rect x="7.5" y="15" width="5.5" height="10" rx="1.5" opacity="0.6"/>
    <rect x="14" y="10" width="5.5" height="15" rx="1.5" opacity="0.32"/>
    <path d="M0.6 9.6l1.4-1.4 1.7 1.7 4.3-4.3 1.4 1.4-5.7 5.7z"/>
  </g>
  <text x="27" y="22"
        font-family="'Instrument Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="16" font-weight="600" letter-spacing="-0.3"
        fill="currentColor">Exin<tspan font-weight="400" opacity="0.6">Deploy</tspan></text>
</svg>
