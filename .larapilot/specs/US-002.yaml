body: |
  #### US-002: Ruoli funzionali, progetti e responsabili

  **Epic:** EP-002 | **Priority:** HIGH | **Points:** 8 | **Status:** TODO
  **Blocked by:** US-001
  **Traces to:** FR-002, FR-003, FR-004, FR-005 (MoSCoW: Must)

  **Storia utente**
  Come Release Owner,
  voglio definire i ruoli funzionali del processo, i progetti su cui rilasciamo e chi ricopre ciascun ruolo — con una mappatura predefinita a livello di team —
  così che lo stesso processo si applichi a tutti i progetti senza riconfigurarlo ogni volta.

  **Dimostra**
  Dopo questa spec creo i ruoli, imposto la mappatura predefinita ruolo→persona, creo un progetto e
  ritrovo quella mappatura già precompilata, modificabile sul progetto senza alterare il valore predefinito.

  **Criteri di accettazione**
  - [ ] Un amministratore crea, modifica e disattiva ruoli funzionali (nome, descrizione)
  - [ ] Un ruolo referenziato da un template o da una release non è cancellabile: il tentativo è rifiutato con messaggio esplicito e il ruolo resta disattivabile
  - [ ] Un amministratore crea, modifica e disattiva progetti (nome, slug, descrizione)
  - [ ] Lo slug del progetto è univoco: il duplicato è rifiutato in validazione e vincolato a livello di schema
  - [ ] Un amministratore definisce la mappatura predefinita ruolo→persona valida per il team
  - [ ] Alla creazione di un progetto la mappatura predefinita viene precompilata sul progetto
  - [ ] Modificare la mappatura di un progetto non altera la mappatura predefinita, e viceversa
  - [ ] Una sola persona per coppia progetto/ruolo, con vincolo di unicità a livello di schema e non solo di validazione
  - [ ] Assegnare a un ruolo una persona disattivata è rifiutato con messaggio esplicito
  - [ ] Un `member` non accede alla configurazione di ruoli, progetti e mappature (Policy lato server)
  - [ ] Factory e seeder aggiornati per ruoli, progetti e mappature nello stesso commit delle migrazioni
