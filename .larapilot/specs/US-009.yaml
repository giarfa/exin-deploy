body: |
  #### US-009: Elenco e storico delle release

  **Epic:** EP-004 | **Priority:** HIGH | **Points:** 3 | **Status:** TODO
  **Blocked by:** US-006
  **Traces to:** FR-015 (MoSCoW: Must)

  **Storia utente**
  Come Release Owner,
  voglio elencare le release filtrandole per progetto e per stato, e accedere allo storico dei rilasci conclusi,
  così da avere una vista d'insieme e poter ricostruire un rilascio passato.

  **Dimostra**
  Dopo questa spec elenco le release in corso con step corrente e responsabile in attesa, passo a quelle
  concluse con data e autore della consegna, e filtro per progetto.

  **Criteri di accettazione**
  - [x] Elenco delle release con progetto, etichetta, stato, step corrente e responsabile in attesa
  - [x] Filtro per stato (in corso / concluse) e per progetto
  - [x] Le release concluse mostrano autore e istante della consegna
  - [x] Lo storico è consultabile a tempo indeterminato, senza limite implicito di data
  - [x] Ordinamento predefinito dalle più recenti alle più vecchie
  - [x] Indici su `release.project_id` e `release.status` creati nella stessa migrazione dello schema
  - [x] Nessuna query N+1 (verificato)
  - [x] Layout conforme al mockup `.larapilot/mockups/superficie-operativa/desktop.html`: card impilate sotto 1024 px, tabella da 1024 px, nessuno scroll orizzontale a nessun breakpoint
