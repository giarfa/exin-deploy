body: |
  #### US-010: Registro consultabile delle transizioni

  **Epic:** EP-004 | **Priority:** HIGH | **Points:** 5 | **Status:** TODO
  **Blocked by:** US-005
  **Traces to:** FR-016 (MoSCoW: Must) — la scrittura degli eventi è consegnata in US-005; questa spec copre la consultazione e le garanzie di immutabilità

  **Storia utente**
  Come Release Owner,
  voglio consultare la cronologia completa e non alterabile di una release,
  così che la tracciabilità del processo sia una prova e non un racconto.

  **Dimostra**
  Dopo questa spec apro il registro di una release e vedo in ordine cronologico avvio, chiusure di step
  con attore e istante, attivazioni, tentativi non autorizzati e conclusione. Nessuna funzione
  dell'interfaccia permette di modificare o cancellare una voce.

  **Criteri di accettazione**
  - [x] Vista cronologica degli eventi di una release: avvio, chiusura di step, attivazione dello step successivo, conclusione, tentativo non autorizzato
  - [x] Ogni voce riporta attore, istante e riferimento allo step interessato
  - [x] Nessuna rotta, comando o funzione dell'interfaccia consente la modifica o la cancellazione di una voce (verificato da test)
  - [x] Il modello degli eventi non espone operazioni di aggiornamento o cancellazione
  - [x] Gli istanti sono memorizzati in UTC e mostrati nel fuso dell'applicazione, coerentemente su tutte le viste
  - [x] I tentativi di chiusura non autorizzati compaiono nel registro con l'indicazione dell'attore
  - [x] Il registro è consultabile da ogni membro autenticato; le voci relative a tentativi non autorizzati sono visibili solo agli amministratori
  - [x] Nessuna query N+1 (verificato)
