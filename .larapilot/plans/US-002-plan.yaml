    id: TASK-09
    title: 'Schermate dei progetti e dei responsabili di progetto'
    type: Impl
    status: TODO
    dependencies:
      - TASK-07
      - TASK-05
    body: |
      ## Description
      Due schermate: l'elenco dei progetti con creazione e modifica, e la pagina dei responsabili di un progetto,
      dove la mappatura precompilata si modifica senza toccare quella predefinita. La seconda e il punto in cui la
      spec si dimostra.

      ## Files Involved
      - resources/views/components/projects/⚡index.blade.php
      - resources/views/components/projects/⚡assignments.blade.php
      - lang/it/projects.php

      ## Steps
      1. `projects.index`: tabella Flux e form inline. Lo slug e proposto automaticamente dal nome con `Str::slug`
         ma resta modificabile; validazione con `Rule::unique('projects', 'slug')->ignore($this->editingId)` e
         formato `['regex:/^[a-z0-9]+(?:-[a-z0-9]+)*$/']`. Nessuna azione di cancellazione esposta: i progetti si
         disattivano, perche contengono lo storico dei rilasci
      2. La creazione passa dall'Action `CreateProject` (TASK-05), non da `Project::create()` diretto; dopo la
         creazione mostrare l'avviso sui ruoli non precompilati quando il conteggio restituito e maggiore di zero
      3. Conteggio delle assegnazioni per riga con `withCount('assignments')` — mai una query dentro il ciclo Blade
      4. `projects.assignments`: binding di rotta sul modello `Project`. La pagina itera sui **ruoli attivi** e non
         sulle righe di assegnazione, cosi che un ruolo creato dopo il progetto compaia automaticamente come "non
         assegnato"; mostra anche i ruoli disattivati che hanno gia un'assegnazione su quel progetto, perche
         nasconderli renderebbe invisibile una responsabilita esistente
      5. Caricamento con `with(['assignments.role', 'assignments.user'])` e combinazione in memoria: e l'unico
         percorso di questa spec con relazioni annidate ed e il candidato naturale a un N+1
      6. Salvataggio di un responsabile: `Gate::authorize('manageAssignments', $project)`, validazione con la regola
         `AssignableUser` — assegnare una persona disattivata e rifiutato con messaggio esplicito. Svuotare la
         selezione rimuove l'assegnazione
      7. Una persona assegnata e successivamente disattivata resta assegnata (rimuoverla cancellerebbe una traccia),
         ma e segnalata nella riga con icona e parola
      8. Implementare **mobile first**: a 375 px la mappatura si legge come elenco di schede, non come tabella
         compressa; verifica visiva a 375, 768 e 1280 px
      9. Tutto il testo in `lang/it/projects.php`
      10. `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Un amministratore crea, modifica e disattiva un progetto
      - [ ] Uno slug duplicato e rifiutato in validazione con messaggio, prima del vincolo di database
      - [ ] Un progetto appena creato mostra la mappatura predefinita gia precompilata
      - [ ] Modificare la mappatura del progetto non altera quella predefinita
      - [ ] Assegnare una persona disattivata e rifiutato con messaggio esplicito
      - [ ] Nessuna azione di cancellazione progetto esposta
      - [ ] Nessuna query dentro cicli Blade: `withCount` sull'elenco, `with` annidato sulla pagina responsabili
      - [ ] Schermate usabili a 375, 768 e 1280 px

      ## Test Data
