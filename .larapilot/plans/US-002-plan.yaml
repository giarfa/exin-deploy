code: US-002
plan_body: |
  ## Technical Solution

  Prima spec di configurazione: introduce le quattro entita che trasformano un template astratto in un
  processo con responsabili reali. La separazione portante del PRD fra **definizione** e **istanza** vale
  gia qui — nulla di quanto scritto in questa spec viene letto in fase di esecuzione di una release, che
  leggera soltanto il proprio snapshot.

  **Entita introdotte**

  | Entita | Tabella | Contenuto |
  | --- | --- | --- |
  | `Role` | `roles` | ruolo funzionale di processo: nome, descrizione, attivo |
  | `Project` | `projects` | progetto: nome, slug, descrizione, attivo |
  | `DefaultRoleAssignment` | `default_role_assignments` | ruolo -> persona predefinita a livello di team |
  | `ProjectRoleAssignment` | `project_role_assignments` | ruolo -> persona su un singolo progetto |

  Tutte con chiave primaria UUID (`HasUuids`, UUIDv7) secondo la baseline del PRD.

  **Fuori perimetro, per spec successive.** `projects.workflow_template_id` (associazione al template) e la
  segnalazione dei ruoli previsti dal template ma non assegnati appartengono a **US-003**: qui il template
  non esiste ancora e una colonna verso una tabella inesistente non e pianificabile. Il criterio di
  accettazione FR-004 relativo alla segnalazione dei ruoli scoperti e citato in US-003, non in questa spec.
  Analogamente, lo scenario dimostrativo completo (release a meta catena e release conclusa) e di **US-011**:
  qui il seeder produce solo la fetta di configurazione.

  **Vincoli a livello di schema, non solo di validazione.** Tre criteri di accettazione lo chiedono
  esplicitamente e sono verificati da test che scrivono direttamente sul database, aggirando la validazione:

  - `projects.slug` unique
  - `project_role_assignments` unique su `(project_id, role_id)` — una sola persona per coppia progetto/ruolo
  - `default_role_assignments.role_id` unique — una sola persona predefinita per ruolo

  Chiavi esterne: `restrictOnDelete` verso `roles` e `users` (i ruoli referenziati non sono cancellabili, i
  membri non si cancellano mai), `cascadeOnDelete` verso `projects`. Prerequisito da verificare in TASK-03:
  `config/database.php` deve avere `foreign_key_constraints` attivo sulla connessione SQLite, altrimenti il
  test sulla restrizione passerebbe per il motivo sbagliato. Nessuna funzione SQLite-specifica: solo Eloquent
  e migrazioni portabili, come prescritto fra i vincoli permanenti del progetto.

  **Cancellazione del ruolo.** Un ruolo referenziato non e cancellabile ma resta disattivabile. La regola vive
  in tre punti, deliberatamente:

  1. `Role::isReferenced()` conta i riferimenti esistenti — oggi le due tabelle di mappatura, domani
     `step_definitions` (US-003) e `release_steps` (US-004). Il metodo dichiara le relazioni consultate in una
     costante, cosi che le spec successive estendano un solo punto
  2. `RolePolicy::delete()` nega quando `isReferenced()` e vera. **Deve stare fuori dal filtro `before()`**
     (elenco `NOT_FILTERED`, stessa convenzione di `UserPolicy`): un'ability filtrata concederebbe
     all'amministratore anche cio che il vincolo di dominio nega — e la lezione registrata in US-001
  3. La chiave esterna `restrictOnDelete` come ultima difesa a livello di database

  Il messaggio esplicito richiesto dal criterio di accettazione arriva dal componente, che intercetta il
  diniego della Policy e mostra il numero e il tipo di riferimenti trovati.

  **Precompilazione della mappatura predefinita.** E una Action esplicita, `App\Actions\Projects\CreateProject`,
  invocata dal componente di creazione progetto, **non** un observer sull'evento `created` del modello. Motivo:
  con un observer ogni `Project::factory()->create()` di test o di seeder erediterebbe mappature a sorpresa, e
  la logica di dominio finirebbe fuori vista. L'Action apre una sola transazione, crea il progetto e copia le
  assegnazioni predefinite.

  Due filtri consapevoli in copiatura, entrambi da documentare nel codice e da mostrare all'utente come nota:
  vengono copiate solo le predefinite il cui **ruolo e attivo** e la cui **persona e attiva**. Copiare una
  persona disattivata contraddirebbe il criterio di accettazione che ne rifiuta l'assegnazione; l'Action
  restituisce il numero di ruoli non precompilati, che la schermata riporta come avviso.

  **Indipendenza delle due mappature.** Sono due tabelle distinte senza chiave esterna reciproca: la copia
  avviene una sola volta, alla creazione del progetto. Modificare l'una non tocca l'altra per costruzione, non
  per disciplina — ed e comunque coperto da test in entrambe le direzioni.

  **Persona disattivata.** Il rifiuto e in validazione tramite una regola riusabile `App\Rules\AssignableUser`
  (la persona deve esistere e avere `is_active = true`), usata sia dalla mappatura di progetto sia da quella
  predefinita, con messaggio esplicito. Caso non coperto dai criteri di accettazione ma reale: una persona gia
  assegnata che viene disattivata in seguito. Non si rimuove l'assegnazione — cancellare la traccia sarebbe
  peggio — ma le due schermate di mappatura la segnalano con icona e parola, mai col solo colore.

  **Autorizzazione.** Tre Policy, tutte con il filtro `before()` per l'amministratore e con le ability vincolate
  escluse dal filtro:

  - `RolePolicy` — `viewAny`, `view`, `create`, `update`, `toggleActivation`, `delete` (fuori dal filtro)
  - `ProjectPolicy` — `viewAny`, `view`, `create`, `update`, `toggleActivation`, `manageAssignments`,
    `delete` (fuori dal filtro, sempre `false`: un progetto contiene lo storico dei rilasci e si disattiva)
  - `DefaultRoleAssignmentPolicy` — `viewAny`, `create`, `update`, `delete`

  Le assegnazioni di progetto **non** hanno una Policy propria: non esistono fuori dal contesto di un progetto,
  quindi sono autorizzate da `ProjectPolicy::manageAssignments`. Come in US-001 l'autorizzazione e applicata due
  volte e non e ridondanza: il middleware `can` blocca la rotta, `Gate::authorize` dentro il componente blocca
  le singole azioni Livewire, che non ripassano dalla rotta.

  **Interfaccia.** Quattro schermate Livewire, componenti single-file `⚡` sotto `resources/views/components/`,
  sullo stesso modello di `members.index` (tabella Flux, form inline, conferma su azioni distruttive). Superficie
  di configurazione: densa e a uso rado, ma comunque leggibile da 375 px, perche il contratto responsive del
  progetto non ammette schermate solo-desktop. Solo componenti **Flux free**. Testo dell'interfaccia nei file
  `lang/it/`, mai incastonato nelle viste.

  | Rotta | Componente | Contenuto |
  | --- | --- | --- |
  | `/ruoli` | `roles.index` | catalogo dei ruoli funzionali |
  | `/progetti` | `projects.index` | elenco e creazione progetti |
  | `/progetti/{project}/responsabili` | `projects.assignments` | mappatura ruolo -> persona del progetto |
  | `/responsabili-predefiniti` | `default-assignments.index` | mappatura predefinita di team |

  Binding di rotta su UUID e non su slug: lo slug e modificabile e i collegamenti si romperebbero.

  **N+1.** La pagina responsabili di progetto e l'unico percorso con relazioni annidate: carica i ruoli attivi
  e le assegnazioni del progetto con `with(['assignments.role', 'assignments.user'])`, e le combina in memoria.
  L'elenco progetti carica `withCount('assignments')`, mai un conteggio per riga nel ciclo Blade. Indici sulle
  colonne di filtro e sulle chiavi esterne, dichiarati nella stessa migrazione dello schema.

  **Ruoli aggiunti dopo la creazione di un progetto.** La pagina responsabili itera sui **ruoli attivi**, non
  sulle righe di assegnazione: un ruolo creato in seguito compare automaticamente come "non assegnato". Sono
  mostrati anche i ruoli disattivati che hanno gia un'assegnazione su quel progetto, perche nasconderli
  renderebbe invisibile una responsabilita esistente.

  ## Git & Branching

  - Mode: `GITFLOW` — un commit atomico per task in Conventional Commits, descrizione di PR preparata **in
    locale**, nessun push automatico
  - **Prerequisito non standard, da chiudere in TASK-00:** `develop` e fermo al commit iniziale `b5462ab`. I 13
    commit di US-001, gia approvata in revisione umana, non sono mai stati integrati, e l'albero di lavoro ha
    artefatti Larapilot non committati (`backlog.yaml`, `specs/US-001.yaml`, `usage/ledger.jsonl`). Creare il
    branch di US-002 dallo stato attuale di `develop` significherebbe costruire su un repository senza
    applicazione
  - Branch: `feature/US-002-ruoli-progetti-responsabili` da `develop`, **dopo** l'integrazione di US-001
  - Per task: un solo commit nel formato `type(US-002): TASK-NN riassunto`
  - Push e apertura PR remota: **omessi** (`git_mode: GITFLOW`). Solo su richiesta esplicita dell'utente
  - Merge su `develop` solo dopo approvazione umana in `/larapilot-review`

  ## Test Data Strategy

  - Factory e seeder aggiornati nello **stesso task** delle migrazioni, come prescritto dalla disciplina di
    progetto e richiesto esplicitamente da un criterio di accettazione
  - `RoleFactory`: nomi di ruolo realistici del dominio (Dev Lead, QA, DevOps, PM, Security); stato `inactive()`
  - `ProjectFactory`: nome di progetto plausibile e slug derivato con `Str::slug` sul nome, unico; stato
    `inactive()`
  - `DefaultRoleAssignmentFactory` e `ProjectRoleAssignmentFactory`: relazioni coerenti con `for()`, nessuna
    chiave esterna orfana
  - `DatabaseSeeder`: cinque ruoli funzionali, mappatura predefinita completa sui membri gia seminati in US-001,
    due progetti (uno con mappatura ereditata intatta, uno con una sostituzione, perche la differenza fra le due
    mappature deve essere visibile a colpo d'occhio in sviluppo)
  - Lo scenario dimostrativo completo (template, release in corso, release conclusa) resta di **US-011**
  - Verificare `php artisan migrate:fresh --seed` prima di ogni `task-done` che tocchi lo schema

  ## Test Strategy

  - Bar: `NORMAL`. Il repository usa **PHPUnit 12.5**, non Pest: test creati con `php artisan make:test --phpunit`
  - **Nessun** Playwright, Laravel Dusk, Pest browser, matrice di viewport o E2E di journey
  - Test interlacciati con l'implementazione (TASK-04, TASK-06, TASK-11), non accumulati alla fine
  - Copertura richiesta:
    - **Modelli e schema** (TASK-04): UUID generato, cast di `is_active`, stati delle factory, `isReferenced()`
      su ruolo libero e referenziato; **vincoli applicati dal database** scrivendo direttamente con `DB::table()`
      e attendendo `QueryException` — slug duplicato, coppia progetto/ruolo duplicata, ruolo predefinito
      duplicato, cancellazione di un ruolo referenziato
    - **Precompilazione** (TASK-06): un progetto creato tramite l'Action eredita la mappatura predefinita;
      modificare la mappatura del progetto non altera la predefinita; modificare la predefinita non altera i
      progetti esistenti; le predefinite con ruolo o persona disattivata non vengono copiate e il conteggio
      restituito lo riflette; la creazione e atomica (nessun progetto orfano se la copia fallisce)
    - **Autorizzazione e interfaccia** (TASK-11): un `member` riceve 403 su tutte e quattro le rotte **e** sulle
      azioni Livewire invocate direttamente; un `admin` passa; creazione, modifica e disattivazione di ruoli e
      progetti; slug duplicato rifiutato in validazione con messaggio; assegnazione di persona disattivata
      rifiutata con messaggio esplicito; cancellazione di ruolo referenziato rifiutata con messaggio e ruolo
      ancora disattivabile; cancellazione di ruolo libero consentita; nessuna azione di cancellazione progetto
      esposta
  - **Verifica manuale (handoff per l'umano)**, poiche il bar non prevede test browser: le quattro schermate a
    375 / 768 / 1280 px senza scroll orizzontale, form leggibili da telefono, stato attivo/disattivo distinguibile
    senza affidarsi al colore, tema chiaro e scuro

  ## Documentation

  Baseline secondo **Technical Documentation** in `runtime-delivery.md`: sezione del `README.md` sulla
  configurazione del processo (ruoli, progetti, mappature, precompilazione e sua natura non retroattiva), nota
  architetturale che estende quella di US-001 con le entita di definizione introdotte qui, `CHANGELOG.md`
  Unreleased. Nessun OpenAPI: la spec non introduce API. Nessuna documentazione estesa richiesta in approvazione
  della spec.

  ## Quality gate

  Prima di ogni `task-done`: `vendor/bin/pint --dirty --format agent` e Larastan livello 5 via
  `php artisan larapilot:quality`. Le annotazioni PHPDoc sui modelli seguono la convenzione gia adottata su
  `User`: l'analisi statica deduce il tipo dalla colonna, quindi gli attributi con cast vanno dichiarati.
tasks:
  -
    id: TASK-00
    title: 'Integrare US-001 in develop e creare il branch di lavoro'
    type: Impl
    status: DONE
    dependencies: {}
    body: |
      ## Description
      Preparare Gitflow per questa spec. Il branch non puo essere creato dallo stato attuale di `develop`: US-001 e
      stata approvata in revisione umana ma i suoi 13 commit non sono mai stati integrati, quindi `develop` e fermo
      al commit iniziale `b5462ab` e non contiene l'applicazione. Inoltre l'albero di lavoro ha artefatti Larapilot
      non committati, prodotti dalla chiusura di US-001.

      ## Files Involved
      - (git e artefatti `.larapilot/` — nessun file applicativo)

      ## Steps
      1. Committare gli artefatti pendenti sul branch di US-001: `.larapilot/backlog.yaml`,
         `.larapilot/specs/US-001.yaml`, `.larapilot/usage/ledger.jsonl` —
         `docs(US-001): registra approvazione e consuntivo`
      2. `git checkout develop`
      3. `git merge --no-ff feature/US-001-accesso-membri-team` — merge esplicito, la storia deve mostrare che US-001
         e entrata come unita approvata
      4. Verificare che `develop` contenga l'applicazione: `php artisan test --compact` verde
      5. `git checkout -b feature/US-002-ruoli-progetti-responsabili`
      6. Redigere titolo e corpo della PR interna verso `develop` e **tenerli in locale**: titolo
         `US-002: Ruoli funzionali, progetti e responsabili`; corpo con link al piano e l'elenco dei task
      7. Commit di ancoraggio del branch (commit vuoto ammesso)

      ## Completion Criteria
      - [x] Nessuna modifica pendente nell'albero di lavoro prima del merge
      - [x] `develop` contiene i commit di US-001 e la suite di test e verde su `develop`
      - [x] Il branch `feature/US-002-ruoli-progetti-responsabili` esiste in locale e deriva da `develop`
      - [x] Titolo e corpo della PR interna redatti e tenuti in locale
      - [x] Nessun push eseguito

      ## Test Data
      - N/A — nessuna modifica a schema o modelli

      ## Git Deliverables
      - Commit: `chore(US-002): TASK-00 bootstrap feature branch` (commit vuoto ammesso)
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: preparata in locale; apertura remota solo su richiesta esplicita dell'utente
