    id: TASK-11
    title: 'Test: autorizzazione e flussi di configurazione'
    type: Test
    status: TODO
    dependencies:
      - TASK-08
      - TASK-09
      - TASK-10
    body: |
      ## Description
      Coprire l'autorizzazione e i flussi delle quattro schermate. L'autorizzazione va verificata a **due livelli**,
      come gia stabilito in US-001: il middleware protegge la rotta, `Gate::authorize` protegge le singole azioni
      Livewire, che non ripassano dalla rotta. Verificare solo il primo lascerebbe scoperta la superficie reale.

      ## Files Involved
      - tests/Feature/Configuration/ConfigurationPolicyTest.php
      - tests/Feature/Configuration/RoleManagementTest.php
      - tests/Feature/Configuration/ProjectManagementTest.php
      - tests/Feature/Configuration/ProjectAssignmentsTest.php
      - tests/Feature/Configuration/DefaultAssignmentsTest.php

      ## Steps
      1. Creare i test con `php artisan make:test --phpunit`; riusare le factory esistenti
      2. `ConfigurationPolicyTest`: le tre Policy in isolamento — un `admin` puo, un `member` no; `delete` sul ruolo
         referenziato negato **anche all'amministratore**; `delete` sul progetto negato a chiunque
      3. Autorizzazione a livello di rotta: un `member` riceve 403 sulle quattro rotte, un ospite e reindirizzato al
         login, un `admin` riceve 200
      4. Autorizzazione a livello di componente: un `member` che invoca direttamente le azioni Livewire riceve un
         errore di autorizzazione
      5. Flussi: creazione, modifica e disattivazione di ruoli e progetti; nome di ruolo duplicato rifiutato; slug
         duplicato rifiutato in validazione; cancellazione di ruolo referenziato rifiutata e ruolo ancora
         disattivabile; cancellazione di ruolo libero consentita; nessuna azione di cancellazione progetto esposta
      6. Mappature: assegnazione di persona disattivata rifiutata su **entrambe** le schermate; assegnazione e
         rimozione del responsabile su un progetto; un ruolo creato dopo il progetto compare come non assegnato
      7. Nota operativa dalle regole di progetto: quando un'asserzione sulla risposta fallisce, il messaggio puo
         essere mascherato da "Call to a member function all() on array" perche `session('errors')` e un array in
         questo progetto — leggere `Location` e gli errori a mano invece di inseguire quel messaggio
      8. `php artisan test --compact` sulla cartella `tests/Feature/Configuration`
      9. Non introdurre Playwright, Dusk, Pest browser o suite di viewport

      ## Completion Criteria
      - [ ] I test passano in locale
      - [ ] L'autorizzazione e verificata sia a livello di rotta sia a livello di azione Livewire
      - [ ] Ogni criterio di accettazione della spec ha almeno un test corrispondente, esclusi quelli di sola
            verifica manuale
      - [ ] L'intera suite del progetto resta verde
      - [ ] La copertura corrisponde al bar `NORMAL`

