    id: TASK-08
    title: 'Schermata di gestione dei ruoli funzionali'
    type: Impl
    status: TODO
    dependencies:
      - TASK-07
    body: |
      ## Description
      Interfaccia di creazione, modifica, disattivazione e cancellazione dei ruoli funzionali. La cancellazione di
      un ruolo referenziato deve essere rifiutata con un messaggio che dica **perche**, e il ruolo deve restare
      disattivabile: e il criterio di accettazione piu facile da implementare male, con un errore generico.

      ## Files Involved
      - resources/views/components/roles/⚡index.blade.php
      - lang/it/roles.php

      ## Steps
      1. Componente single-file Livewire sul modello di `resources/views/components/members/⚡index.blade.php`:
         tabella Flux, form inline per creazione e modifica, conferma sulle azioni distruttive
      2. Ogni azione che muta lo stato passa da `Gate::authorize`: l'interfaccia nasconde i comandi non disponibili,
         ma non e quello il controllo. Le azioni Livewire non ripassano dal middleware di rotta
      3. Regole di validazione in `rules()` (non con attributi `#[Validate]`: due sorgenti per le stesse regole sono
         un rilievo gia emerso in revisione su US-001): nome obbligatorio, unico con `Rule::unique('roles', 'name')->ignore($this->editingId)`, max 255;
         descrizione facoltativa
      4. Cancellazione: `Gate::authorize('delete', $role)`; intercettare il diniego e mostrare un messaggio che
         riporta quanti e quali riferimenti bloccano l'operazione, ricordando che il ruolo puo essere disattivato
      5. Stato attivo/disattivo reso con **icona e parola**, mai col solo colore, come gia fatto sui membri
      6. Implementare **mobile first**: la tabella deve restare leggibile a 375 px senza scroll orizzontale;
         verifica visiva a 375, 768 e 1280 px durante l'implementazione
      7. Tutto il testo in `lang/it/roles.php`
      8. `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Un amministratore crea, modifica e disattiva un ruolo
      - [ ] Un nome di ruolo duplicato e rifiutato in validazione con messaggio
      - [ ] La cancellazione di un ruolo referenziato e rifiutata con **messaggio esplicito**, e il ruolo resta
            disattivabile
      - [ ] La cancellazione di un ruolo non referenziato funziona
      - [ ] Ogni azione Livewire e protetta da `Gate::authorize`
      - [ ] Schermata usabile a 375, 768 e 1280 px (verifica manuale ammessa al bar `NORMAL`)
      - [ ] Nessun componente Flux Pro utilizzato

      ## Test Data
