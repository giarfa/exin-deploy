    id: TASK-01
    title: 'Modello Role con migrazione, factory e seeder'
    type: Impl
    status: TODO
    dependencies:
      - TASK-00
    body: |
      ## Description
      Introdurre il catalogo dei ruoli funzionali di processo (FR-002), condiviso a livello di team e indipendente
      dai progetti. Include il punto di estensione per la regola di non cancellabilita, che le spec successive
      dovranno estendere in un solo posto.

      ## Files Involved
      - app/Models/Role.php
      - database/migrations/xxxx_create_roles_table.php
      - database/factories/RoleFactory.php
      - database/seeders/DatabaseSeeder.php

      ## Steps
      1. `php artisan make:model Role -mf --no-interaction`
      2. Migrazione: `$table->uuid('id')->primary()`, `$table->string('name')->unique()`,
         `$table->text('description')->nullable()`, `$table->boolean('is_active')->default(true)->index()`,
         `$table->timestamps()`
      3. Modello: trait `HasUuids`, attributo `#[Fillable(['name', 'description', 'is_active'])]` secondo la
         convenzione Laravel 13 gia adottata su `User` (non reintrodurre la proprieta `$fillable`), cast
         `'is_active' => 'boolean'` e annotazione PHPDoc `@property bool $is_active` per l'analisi statica
      4. Aggiungere `isReferenced(): bool` — conta i riferimenti al ruolo. Le relazioni consultate sono dichiarate
         in una costante privata cosi che US-003 (`step_definitions`) e US-004 (`release_steps`) estendano un solo
         punto. Oggi la costante e vuota: le due tabelle di mappatura arrivano in TASK-03, che la valorizza
      5. Scope di comodo `active()` per le query di interfaccia
      6. `RoleFactory`: nomi realistici del dominio via `Sequence` o elenco fisso (Dev Lead, QA, DevOps, PM,
         Security), descrizione breve in italiano, stato `inactive()`
      7. `DatabaseSeeder`: seminare i cinque ruoli funzionali con nomi fissi, perche il resto del dataset
         dimostrativo vi si appoggia
      8. `php artisan migrate:fresh --seed`
      9. `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] `roles` esiste con chiave primaria UUID, `name` unico e `is_active` indicizzato
      - [ ] Un ruolo creato riceve automaticamente un id in formato UUID
      - [ ] `Role::isReferenced()` esiste, e documentato come punto di estensione e restituisce `false` finche non
            esistono tabelle referenzianti
      - [ ] `migrate:fresh --seed` completa senza errori
      - [ ] Pint e Larastan livello 5 verdi

      ## Test Data
      - [ ] `database/factories/RoleFactory.php` creata, con stato `inactive()` e nomi di dominio
      - [ ] `DatabaseSeeder` crea i cinque ruoli funzionali con nomi fissi
      - [ ] Factory e seeder aggiornati in **questo stesso task** della migrazione e del modello

      ## Git Deliverables
      - Commit: `feat(US-002): TASK-01 catalogo dei ruoli funzionali`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
  -
    id: TASK-02
    title: 'Modello Project con slug univoco, migrazione, factory e seeder'
    type: Impl
    status: TODO
    dependencies:
      - TASK-00
    body: |
      ## Description
      Introdurre i progetti su cui il team rilascia (FR-003), contenitori delle release e del loro storico.
      L'associazione al template di workflow **non** appartiene a questa spec: la colonna
      `workflow_template_id` arriva con US-003, quando il template esiste.

      ## Files Involved
      - app/Models/Project.php
      - database/migrations/xxxx_create_projects_table.php
      - database/factories/ProjectFactory.php
      - database/seeders/DatabaseSeeder.php

      ## Steps
      1. `php artisan make:model Project -mf --no-interaction`
      2. Migrazione: `$table->uuid('id')->primary()`, `$table->string('name')`,
         `$table->string('slug')->unique()`, `$table->text('description')->nullable()`,
         `$table->boolean('is_active')->default(true)->index()`, `$table->timestamps()`.
         L'unicita dello slug e un criterio di accettazione esplicito a livello di schema, non solo di validazione
      3. Modello: `HasUuids`, `#[Fillable(['name', 'slug', 'description', 'is_active'])]`, cast
         `'is_active' => 'boolean'` con annotazione PHPDoc, scope `active()`
      4. **Non** sovrascrivere `getRouteKeyName()`: il binding di rotta resta su UUID perche lo slug e modificabile
         e i collegamenti gia diffusi si romperebbero. Motivo da annotare nel modello
      5. `ProjectFactory`: nome di progetto plausibile in italiano, `slug` derivato dal nome con `Str::slug` e reso
         unico, descrizione breve, stato `inactive()`
      6. `DatabaseSeeder`: due progetti fissi con nome e slug leggibili
      7. `php artisan migrate:fresh --seed`
      8. `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] `projects` esiste con chiave primaria UUID, `slug` con indice unico e `is_active` indicizzato
      - [ ] Un progetto creato riceve automaticamente un id in formato UUID
      - [ ] Nessuna colonna verso il template di workflow (appartiene a US-003)
      - [ ] `migrate:fresh --seed` completa senza errori
      - [ ] Pint e Larastan livello 5 verdi

      ## Test Data
      - [ ] `database/factories/ProjectFactory.php` creata, con slug unico derivato dal nome e stato `inactive()`
      - [ ] `DatabaseSeeder` crea due progetti fissi
      - [ ] Factory e seeder aggiornati in **questo stesso task** della migrazione e del modello

      ## Git Deliverables
      - Commit: `feat(US-002): TASK-02 progetti con slug univoco`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
  -
    id: TASK-03
    title: 'Mappature ruolo-persona: predefinita di team e di progetto'
    type: Impl
    status: TODO
    dependencies:
      - TASK-01
      - TASK-02
    body: |
      ## Description
      Introdurre le due mappature che trasformano un ruolo astratto in una responsabilita reale: quella predefinita
      a livello di team (FR-005) e quella specifica di progetto (FR-004). Sono due tabelle distinte senza chiave
      esterna reciproca: l'indipendenza fra le due e garantita dalla struttura, non dalla disciplina del codice.

      ## Files Involved
      - app/Models/DefaultRoleAssignment.php
      - app/Models/ProjectRoleAssignment.php
      - app/Models/Role.php (relazioni e `isReferenced()`)
      - app/Models/Project.php (relazione `assignments`)
      - app/Models/User.php (relazioni inverse)
      - database/migrations/xxxx_create_default_role_assignments_table.php
      - database/migrations/xxxx_create_project_role_assignments_table.php
      - database/factories/DefaultRoleAssignmentFactory.php
      - database/factories/ProjectRoleAssignmentFactory.php
      - database/seeders/DatabaseSeeder.php
      - config/database.php (verifica)

      ## Steps
      1. Verificare che la connessione `sqlite` in `config/database.php` abbia `foreign_key_constraints` attivo:
         senza vincoli applicati, il test sulla cancellazione di un ruolo referenziato passerebbe per il motivo
         sbagliato
      2. `php artisan make:model DefaultRoleAssignment -mf --no-interaction` — migrazione: `uuid('id')->primary()`,
         `foreignUuid('role_id')->unique()->constrained()->restrictOnDelete()`,
         `foreignUuid('user_id')->constrained()->restrictOnDelete()`, `timestamps()`.
         L'unicita di `role_id` esprime a livello di schema "una sola persona predefinita per ruolo"
      3. `php artisan make:model ProjectRoleAssignment -mf --no-interaction` — migrazione: `uuid('id')->primary()`,
         `foreignUuid('project_id')->constrained()->cascadeOnDelete()`,
         `foreignUuid('role_id')->constrained()->restrictOnDelete()`,
         `foreignUuid('user_id')->constrained()->restrictOnDelete()`, `timestamps()`,
         `$table->unique(['project_id', 'role_id'])`, `$table->index('user_id')`.
         `restrictOnDelete` verso `users` e coerente con la regola di progetto: i membri non si cancellano, si
         disattivano
      4. Modelli: `HasUuids`, attributi `#[Fillable]`, relazioni `belongsTo` verso `role`, `user` e (per la
         mappatura di progetto) `project`
      5. `Role`: relazioni `hasMany(ProjectRoleAssignment::class)` e `hasOne(DefaultRoleAssignment::class)`;
         valorizzare la costante consultata da `isReferenced()` con queste due relazioni. Documentare che US-003 e
         US-004 aggiungeranno qui `stepDefinitions` e `releaseSteps`
      6. `Project`: relazione `hasMany(ProjectRoleAssignment::class, 'project_id')` chiamata `assignments`
      7. `User`: relazioni inverse per poter rispondere a "quali ruoli ricopre questa persona", usate dalle
         schermate di mappatura
      8. Factory con relazioni coerenti (`for()`), nessuna chiave esterna orfana
      9. `DatabaseSeeder`: mappatura predefinita completa sui cinque ruoli, usando i membri gia seminati in US-001;
         sui due progetti, mappatura ereditata su uno e con **una sostituzione** sull'altro, perche la differenza
