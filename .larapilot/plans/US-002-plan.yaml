    id: TASK-07
    title: 'Policy di configurazione, rotte e navigazione'
    type: Impl
    status: TODO
    dependencies:
      - TASK-03
    body: |
      ## Description
      Applicare l'autorizzazione lato server su tutta la superficie di configurazione introdotta da questa spec, e
      renderla raggiungibile dalla navigazione. Un `member` non deve accedere a ruoli, progetti e mappature: il
      controllo vive nelle Policy, non nel nascondere comandi nell'interfaccia.

      ## Files Involved
      - app/Policies/RolePolicy.php
      - app/Policies/ProjectPolicy.php
      - app/Policies/DefaultRoleAssignmentPolicy.php
      - routes/web.php
      - resources/views/components/layouts/app.blade.php
      - lang/it/app.php

      ## Steps
      1. `php artisan make:policy RolePolicy --model=Role --no-interaction` e analoghe per `Project` e
         `DefaultRoleAssignment`
      2. Seguire la convenzione di `UserPolicy`: filtro `before()` che concede all'amministratore, **con elenco
         `NOT_FILTERED`** per le ability il cui vincolo vale anche per gli amministratori. Ogni ability usata deve
         esistere come metodo, perche `before()` non viene invocato per ability senza metodo corrispondente
      3. `RolePolicy`: `viewAny`, `view`, `create`, `update`, `toggleActivation`; **`delete` fuori dal filtro** —
         consentita solo se `! $role->isReferenced()`
      4. `ProjectPolicy`: `viewAny`, `view`, `create`, `update`, `toggleActivation`, `manageAssignments`;
         **`delete` fuori dal filtro e sempre `false`** — un progetto contiene lo storico dei rilasci, si disattiva.
         Le assegnazioni di progetto non hanno Policy propria perche non esistono fuori dal contesto di un progetto
      5. `DefaultRoleAssignmentPolicy`: `viewAny`, `create`, `update`, `delete`
      6. Rotte dentro il gruppo `auth` esistente, con middleware `can` come gia fatto per i membri:
         - `Route::livewire('/ruoli', 'roles.index')->can('viewAny', Role::class)->name('roles.index')`
         - `Route::livewire('/progetti', 'projects.index')->can('viewAny', Project::class)->name('projects.index')`
         - `Route::livewire('/progetti/{project}/responsabili', 'projects.assignments')->can('manageAssignments', 'project')->name('projects.assignments')`
         - `Route::livewire('/responsabili-predefiniti', 'default-assignments.index')->can('viewAny', DefaultRoleAssignment::class)->name('default-assignments.index')`
      7. Navigazione in `app.blade.php`: nel gruppo **Configurazione** sostituire la voce segnaposto "Ruoli" con il
         collegamento reale e aggiungere "Progetti" e "Responsabili predefiniti". Rimuovere la voce segnaposto
         "Progetti" dal gruppo **Operativo**: i progetti sono configurazione, e due voci con lo stesso nome in due
         gruppi diversi sono un errore di architettura dell'informazione. "Template di workflow" resta segnaposto
         fino a US-003
      8. Nuove chiavi in `lang/it/app.php` per le voci di navigazione
      9. `php artisan route:list --except-vendor` per verificare le rotte registrate
      10. `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Tre Policy registrate e applicate, con `delete` fuori dal filtro `before()` dove il vincolo vale anche
            per gli amministratori
      - [ ] Le quattro rotte esistono, sono sotto `auth` e protette dal middleware `can`
      - [ ] Un `member` riceve 403 su tutte e quattro le rotte
      - [ ] La navigazione mostra le voci di configurazione solo a chi e autorizzato, senza duplicati fra gruppi
      - [ ] Nessun testo dell'interfaccia incastonato nelle viste: tutto in `lang/it/`
      - [ ] Pint e Larastan livello 5 verdi

      ## Test Data
      - N/A — nessuna modifica a schema o modelli in questo task

      ## Git Deliverables
      - Commit: `feat(US-002): TASK-07 autorizzazione, rotte e navigazione della configurazione`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
