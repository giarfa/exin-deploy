  -
    id: TASK-05
    title: 'Action di creazione progetto con precompilazione della mappatura predefinita'
    type: Impl
    status: TODO
    dependencies:
      - TASK-03
    body: |
      ## Description
      Realizzare la precompilazione richiesta da FR-005: alla creazione di un progetto la mappatura predefinita di
      team viene copiata sul progetto, dove resta modificabile senza alterare il valore predefinito. E il
      comportamento che elimina la riconfigurazione manuale a ogni nuovo progetto, quindi il cuore di questa spec.

      Scelta di progettazione da documentare nel codice: **Action esplicita, non observer sull'evento `created`**.
      Con un observer ogni `Project::factory()->create()` di test o di seeder erediterebbe mappature a sorpresa, e
      la logica di dominio sarebbe invisibile a chi legge il componente.

      ## Files Involved
      - app/Actions/Projects/CreateProject.php
      - app/Rules/AssignableUser.php
      - lang/it/validation.php

      ## Steps
      1. `php artisan make:class Actions/Projects/CreateProject --no-interaction`
      2. Metodo unico `handle(array $attributes): array` (o oggetto di ritorno dedicato) che apre **una sola**
         `DB::transaction`, crea il progetto e copia le assegnazioni predefinite, restituendo il progetto e il
         numero di ruoli non precompilati
      3. Filtri in copiatura, entrambi da commentare nel codice: si copiano solo le predefinite il cui **ruolo e
         attivo** e la cui **persona e attiva**. Copiare una persona disattivata contraddirebbe il criterio di
         accettazione che ne rifiuta l'assegnazione
      4. Copia con una sola scrittura (`insert` di massa costruito dalle predefinite caricate con `with('role')`,
         `with('user')`), non un `create()` per riga dentro un ciclo
      5. `php artisan make:rule AssignableUser --no-interaction`: la persona deve esistere ed essere attiva.
         Messaggio esplicito in italiano tramite `lang/it/validation.php`. La regola e condivisa dalle due
         schermate di mappatura, per non duplicare il vincolo
      6. `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] `CreateProject` crea progetto e assegnazioni in **una sola transazione**
      - [ ] Le predefinite con ruolo o persona disattivata non vengono copiate, e il conteggio restituito lo riflette
      - [ ] Nessuna query per riga nella copiatura
      - [ ] `AssignableUser` rifiuta una persona disattivata con messaggio esplicito in italiano
      - [ ] Nessun observer o evento di modello introdotto per la precompilazione
      - [ ] Pint e Larastan livello 5 verdi

      ## Test Data
      - N/A — nessuna modifica a schema o modelli in questo task

      ## Git Deliverables
      - Commit: `feat(US-002): TASK-05 precompilazione della mappatura predefinita sui nuovi progetti`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
