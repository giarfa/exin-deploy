      ## Steps
      1. Creare i test con `php artisan make:test --phpunit` (il repository usa PHPUnit 12.5, non Pest)
      2. Riusare le factory create in TASK-01/02/03: non ridefinire dati di test nei file di test
      3. Modelli: id in formato UUID, cast di `is_active`, stati `inactive()`, scope `active()`, relazioni che
         restituiscono i record attesi
      4. `Role::isReferenced()`: `false` su ruolo libero, `true` quando referenziato dalla mappatura predefinita,
         `true` quando referenziato da una mappatura di progetto
      5. Vincoli di schema, ciascuno con `$this->expectException(QueryException::class)` e scrittura diretta:
