  -
    id: TASK-01
    title: 'Policy del registro, rotta e via di accesso dal dettaglio'
    type: Impl
    status: TODO
    dependencies:
      - TASK-00
    body: |-
      ## Description
      L'autorizzazione del registro e la sua raggiungibilita. La Policy e nuova perche l'oggetto
      della decisione e l'**evento** e non la release: la visibilita differenziata dei tentativi non
      autorizzati si decide riga per riga, e appenderla a `ReleasePolicy` la nasconderebbe dietro
      un'ability che parla di un'altra entita.

      ## Files Involved
      - app/Policies/ReleaseEventPolicy.php (nuovo)
      - routes/web.php
      - resources/views/components/releases/⚡log.blade.php (nuovo, forma minima)
      - resources/views/components/releases/⚡show.blade.php
      - lang/it/releases.php

      ## Steps
      1. `php artisan make:policy ReleaseEventPolicy --model=ReleaseEvent --no-interaction`
      2. `viewAny` → `true`; `view` → `true` tranne su `ReleaseEventAction::UnauthorizedAttempt`,
         riservata agli amministratori; `update` e `delete` → `false` per **chiunque**, con
         `update` e `delete` nell'elenco `NOT_FILTERED` del filtro `before()` (stessa convenzione di
         `ReleasePolicy`), altrimenti un amministratore le otterrebbe dal filtro.
      3. Documenta in testa alla Policy che `update`/`delete` non sono difese ridondanti rispetto a
         `ReleaseEventIsAppendOnly`: il modello rifiuta le scritture che passano da lui, la Policy
         nega l'intenzione **prima**, e il vincolo permanente 10 spiega cosa nessuno dei due copre
         (le scritture di massa del query builder).
      4. Rotta `/rilasci/{release}/registro` → `releases.log`, con `->can('viewAny', ReleaseEvent::class)`
         sul middleware e commento sul perche il `->can()` qui c'e (nessun tentativo da registrare,
         quindi vale la protezione a due livelli).
      5. Componente minimo con `Gate::authorize('viewAny', ReleaseEvent::class)` al montaggio.
      6. Dal dettaglio della release, un collegamento al registro nel riquadro dei dati: e da li che
         si passa da "dove siamo" a "come ci siamo arrivati".
      7. `php artisan larapilot:quality --fix`, poi `php artisan test --filter=Release`

      ## Completion Criteria
      - [ ] Un membro non amministratore apre `/rilasci/{release}/registro`; un anonimo e rediretto
      - [ ] `update` e `delete` negate anche a un amministratore
      - [ ] Il registro e raggiungibile dal dettaglio della release
      - [ ] Pint e Larastan (livello 5) passano

      ## Test Data
      - N/A — nessuna modifica di schema

      ## Git Deliverables
      - Commit: `feat(US-010): TASK-01 apre il registro delle transizioni e registra la rotta`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
  -
    id: TASK-02
    title: 'Lettura cronologica e filtro di visibilita sul modello'
    type: Impl
    status: TODO
    dependencies:
      - TASK-01
    body: |-
      ## Description
      Gli scope che il registro interroga, e gli stati di factory che permettono di provarlo su un
      registro realistico invece che su cinque righe uguali.

      Il filtro di visibilita vive in **database** e non in memoria: caricare tutte le righe per
      scartarle dopo significherebbe leggere righe che chi guarda non puo vedere, e il loro numero
      e a sua volta informazione di sicurezza.

      ## Files Involved
      - app/Models/ReleaseEvent.php
      - database/factories/ReleaseEventFactory.php

      ## Steps
      1. `#[Scope] chronological(Builder $query)` — `created_at` crescente, spareggio su `id`:
         gli UUIDv7 sono monotoni, quindi due eventi scritti nello stesso istante — che una sola
         transazione produce sempre, chiusura e attivazione — restano nell'ordine in cui sono
         avvenuti. Ordinare sul solo istante li lascerebbe scambiarsi di posto fra due letture.
      2. `#[Scope] visibleTo(Builder $query, User $user)` — esclude
         `ReleaseEventAction::UnauthorizedAttempt` quando chi guarda non e amministratore.
         Documenta che questo scope e la **stessa decisione** di `ReleaseEventPolicy::view()`,
         espressa in query, e che un test li tiene allineati.
      3. `#[Scope] forRelease(Builder $query, Release $release)`, che usa l'indice
         `(release_id, created_at)` creato con la tabella per questa lettura.
      4. Stati di factory con i payload che le Action scrivono davvero: `stepCompleted()`,
         `stepActivated()`, `releaseCompleted()`, `unauthorizedAttempt()`. Uno stato con un payload
         inventato produrrebbe test verdi su una resa che nessun evento reale attiva.
      5. `php artisan larapilot:quality --fix`, poi `php artisan test --filter=ReleaseEvent`

      ## Completion Criteria
      - [ ] Scope disponibili e documentati
      - [ ] Le factory producono le cinque azioni con i payload reali
      - [ ] Pint e Larastan (livello 5) passano

      ## Test Data
      - [ ] `ReleaseEventFactory` guadagna uno stato per ciascuna azione, con il payload che la
            Action corrispondente scrive
      - [ ] Nessuna modifica di schema, quindi nessuna migrazione e nessun seeder da toccare qui

      ## Git Deliverables
      - Commit: `feat(US-010): TASK-02 lettura cronologica e filtro di visibilita del registro`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
  -
    id: TASK-03
    title: 'Schermata del registro'
    type: Impl
    status: TODO
    dependencies:
      - TASK-02
    body: |-
      ## Description
      La cronologia resa: cosa e successo, per mano di chi, quando, e su quale step.

      ## Files Involved
      - resources/views/components/releases/⚡log.blade.php
      - lang/it/releases.php

      ## Steps
      1. Una sola lettura: `ReleaseEvent::forRelease($release)->visibleTo(auth()->user())->chronological()->with(['user', 'releaseStep'])->get()`.
      2. Lista **ordinata** (`<ol>`): l'ordine e parte dell'informazione, non impaginazione.
         Colonna singola a ogni larghezza — una cronologia non ha nulla da affiancare.
      3. Una riga per evento: azione con **icona e parola** (mai il solo colore), attore, istante,
         e lo step interessato quando c'e. L'avvio non ne ha, e la riga deve dirlo invece di
         lasciare un campo vuoto.
      4. Il dettaglio della riga viene dal payload, con una frase per azione — versione e template
         sull'avvio, campi compilati sulla chiusura, responsabile sull'attivazione, ability
         tentata sul tentativo non autorizzato. Il payload e nullable e le sue chiavi variano per
         tipo: leggilo con `??`, mai come se fosse garantito, perche una riga scritta da una
         versione precedente non ha le chiavi aggiunte dopo.
      5. Le voci di tentativo non autorizzato sono rese con un'evidenza propria e una nota che
         dice a chi sono visibili: un amministratore deve sapere che sta guardando qualcosa che
         gli altri non vedono.
      6. Stato vuoto: non accade su una release avviata (l'avvio scrive sempre una riga), ma una
         pagina che tacesse davanti a un registro vuoto lascerebbe senza sapere se sia un difetto.
      7. Briciole verso elenco e dettaglio, e un rientro esplicito al dettaglio.
      8. Testi in `lang/it/releases.php` con prefisso `log_`. Le etichette delle azioni restano su
         `ReleaseEventAction::label()`, dove sta il vocabolario.
      9. Verifica a 375, 768 e 1280 px. `php artisan larapilot:quality --fix`, poi `php artisan test --filter=Release`

      ## Completion Criteria
      - [ ] Le cinque azioni sono rese in ordine cronologico con attore, istante e step
      - [ ] Un membro non amministratore non vede le voci di tentativo non autorizzato
      - [ ] Nessuno scorrimento orizzontale a 375/768/1280 px
      - [ ] Pint e Larastan (livello 5) passano

      ## Test Data
      - N/A — nessuna modifica di schema

      ## Git Deliverables
      - Commit: `feat(US-010): TASK-03 schermata del registro delle transizioni`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
  -
    id: TASK-04
    title: 'Copertura della schermata e della visibilita differenziata'
    type: Test
    status: TODO
    dependencies:
      - TASK-03
    body: |-
      ## Description
      Copertura funzionale del registro e della Policy che lo governa.

      ## Files Involved
      - tests/Feature/Releases/ReleaseLogScreenTest.php (nuovo)
      - tests/Feature/Releases/ReleaseEventPolicyTest.php (nuovo)

      ## Steps
      1. Costruisci il registro passando dalle **Action reali** (`StartRelease`, `CloseStep`,
         `RecordUnauthorizedStepAttempt`) almeno in un caso: un registro assemblato solo con le
         factory dimostrerebbe la resa di righe che nessun percorso applicativo scrive.
      2. Casi della schermata: le cinque azioni in ordine cronologico; attore e istante su ogni
         voce; lo step interessato dove previsto e la sua assenza sull'avvio; due eventi della
         stessa transazione nell'ordine in cui sono avvenuti; accesso di un membro; anonimo
         rediretto.
      3. Visibilita differenziata: un amministratore vede il tentativo non autorizzato, un membro
         no — e la pagina di quest'ultimo **non** ne segnala l'esistenza in alcun modo, nemmeno con
         un conteggio.
      4. `ReleaseEventPolicyTest`: `viewAny` aperta a un membro; `view` differenziata per azione;
         `update` e `delete` negate anche a un amministratore. Piu il caso che tiene insieme le due
         decisioni: **Policy e scope `visibleTo` devono concordare** riga per riga sullo stesso
         insieme, per entrambi i livelli applicativi.
      5. `php artisan test --filter="ReleaseLogScreen|ReleaseEventPolicy"`

      ## Completion Criteria
      - [ ] Tutti i criteri di accettazione funzionali hanno un test
      - [ ] I test passano

      ## Git Deliverables
      - Commit: `test(US-010): TASK-04 copertura del registro e della visibilita differenziata`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
  -
    id: TASK-05
    title: 'Immutabilita verificata a livello di applicazione e fuso orario'
    type: Test
    status: TODO
    dependencies:
      - TASK-04
    body: |-
      ## Description
      Il criterio non chiede che il **modello** rifiuti — quello esiste da US-004 — ma che *nessuna
      rotta, comando o funzione dell'interfaccia* consenta di modificare o cancellare una voce. E
      un'affermazione sull'applicazione intera, e va verificata come tale.

      ## Files Involved
      - tests/Feature/Releases/ReleaseEventAppendOnlyTest.php
      - tests/Feature/Releases/ReleaseLogInstantTest.php (nuovo)

      ## Steps
      1. Lista bianca delle rotte: elenca le rotte applicative e pretendi che le uniche a
         dichiarare metodi diversi da GET/HEAD siano quelle note di autenticazione e
         dell'aggiornamento Livewire. Il messaggio di fallimento deve **nominare** la rotta
         inattesa: un test che dice solo "non corrisponde" costringe a cercarla a mano.
      2. Nessun comando Artisan applicativo scrive sugli eventi: verifica che
         `app/Console` non contenga percorsi di cancellazione (oggi la cartella non esiste — il
         test lo dichiara invece di lasciarlo implicito).
      3. `ReleaseLogInstantTest`: l'istante e memorizzato in UTC — confronto con il **valore
         grezzo** letto via query builder, non con l'attributo gia trasformato dal cast — ed e reso
         nel fuso dell'applicazione. Lo stesso istante deve comparire identico su registro e
         dettaglio: la coerenza fra le viste e quello che il criterio chiede, e si dimostra
         confrontandole, non ispezionando una vista sola.
      4. `php artisan test --filter="ReleaseEventAppendOnly|ReleaseLogInstant"`

      ## Completion Criteria
      - [ ] Nessuna rotta applicativa fuori dalla lista bianca accetta metodi di scrittura
      - [ ] Gli istanti sono memorizzati in UTC e resi nel fuso dell'applicazione
      - [ ] Lo stesso istante e reso identico su registro e dettaglio
      - [ ] I test passano

      ## Git Deliverables
      - Commit: `test(US-010): TASK-05 immutabilita a livello di applicazione e fuso orario`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
  -
