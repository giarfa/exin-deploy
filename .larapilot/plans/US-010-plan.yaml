code: US-010
plan_body: |-
  ## Soluzione tecnica

  La **scrittura** degli eventi e gia consegnata: `StartRelease`, `CloseStep` e
  `RecordUnauthorizedStepAttempt` scrivono le cinque azioni di `ReleaseEventAction`, e
  `ReleaseEvent` rifiuta gia modifica e cancellazione (`ReleaseEventIsAppendOnly`, vincolo
  permanente 10 del README). Questa spec porta la **consultazione** e trasforma le garanzie di
  immutabilita da proprieta del modello a proprieta verificata dell'intera applicazione.

  **Schermata** — `resources/views/components/releases/⚡log.blade.php` sulla rotta
  `/rilasci/{release}/registro` (`releases.log`), raggiunta dal dettaglio della release. Rotta
  propria e non una sezione del dettaglio: le due rispondono a domande diverse — "dove siamo e
  chi stiamo aspettando" contro "cosa e successo e per mano di chi" — e il dettaglio e gia una
  pagina lunga. Il registro e inoltre l'unica superficie con righe **a visibilita differenziata**,
  e mescolarla a una schermata che mostra tutto a tutti renderebbe quella differenza invisibile
  a chi legge il codice.

  **Autorizzazione** — nuova `ReleaseEventPolicy`:

  | Ability | Chi | Perche |
  | --- | --- | --- |
  | `viewAny` | ogni membro autenticato | la tracciabilita e una prova consultabile, non un privilegio |
  | `view` | ogni membro, **tranne** sui tentativi non autorizzati, riservati agli amministratori | una riga che nomina chi ha provato a fare cosa non e informazione di processo ma di sicurezza |
  | `update`, `delete` | **nessuno**, amministratori inclusi | un registro correggibile a posteriori non e una prova |

  `update` e `delete` stanno fra le `NOT_FILTERED` — la stessa convenzione di
  `ReleasePolicy::delete()` — altrimenti il filtro `before()` le concederebbe a un
  amministratore proprio dove il vincolo vale anche per lui.

  **Filtro delle righe** — la Policy decide sul singolo evento, ma la schermata non puo
  caricarli tutti e scartarli in memoria: sarebbe un conteggio che rivela quante righe nascoste
  esistono, e uno spreco su un registro che cresce con il rilascio. Il filtro vive quindi in uno
  scope `ReleaseEvent::visibleTo(User)`, e **Policy e scope devono dire la stessa cosa**: un
  test li confronta riga per riga sullo stesso insieme, cosi che aprire l'una senza l'altra
  faccia fallire la suite.

  **Fuso orario** — `config('app.timezone')` e `UTC` e i cast Eloquent restituiscono istanti in
  quel fuso: memorizzazione e visualizzazione coincidono gia oggi, e tutte le viste usano lo
  stesso formato `d/m/Y H:i`. Questa spec non rifattorizza nulla: verifica l'invariante con un
  test che legge il **valore grezzo** in tabella e lo confronta con quello reso, e che pretende
  lo stesso istante identico su due schermate diverse. Un formato ripetuto in dieci viste e
  poco elegante; un formato centralizzato in un helper che nessun test copre sarebbe peggio.

  **Lettura** — una query, ordine cronologico crescente (`created_at`, spareggio su `id` UUIDv7
  che e monotono), con `user` e `releaseStep` in eager loading. Usa l'indice
  `(release_id, created_at)` creato con la tabella proprio per questa lettura.

  ## Decisioni

  **Ordine crescente e non decrescente.** Le altre schermate mostrano il piu recente in cima
  perche rispondono a "cosa devo fare ora". Il registro racconta **come e andata**, e una
  cronologia si legge dall'inizio: l'avvio in cima, la consegna in fondo. E anche l'unico ordine
  in cui "step attivato" ha senso subito dopo "step completato".

  **Le voci nascoste non sono contate.** A un membro non amministratore il registro non dice
  "3 voci non visibili": il numero dei tentativi non autorizzati e esso stesso informazione di
  sicurezza, e dichiararlo senza mostrarlo sarebbe il peggiore dei due mondi.

  **L'immutabilita si verifica anche a livello di rotte.** Il criterio chiede che *nessuna
  rotta, comando o funzione dell'interfaccia* consenta la modifica: il modello che rifiuta non
  basta a dimostrarlo. Il test elenca le rotte applicative e pretende che le uniche non-GET
  siano quelle di autenticazione, su una lista bianca esplicita — chi aggiungera un percorso di
  scrittura dovra passare da quella lista, non aggirarla.

  **Nessuna paginazione.** Un registro ha un numero di righe proporzionale alla lunghezza della
  catena — dell'ordine della decina per rilascio, piu i tentativi. Non e la tabella che cresce
  senza limiti.

  ## Git & Branching

  - Mode: `GITFLOW` (nessun push automatico)
  - Precondizione: US-009 e in `REVIEW` e non ancora integrata in `develop` — TASK-00 rami dalla
    sua punta, perche il registro si raggiunge dal dettaglio e cita l'elenco nelle briciole
  - Branch: `feature/US-010-registro-transizioni` dalla punta di US-009
  - Un solo commit per task, Conventional Commits con codice spec e task
  - PR verso `develop` preparata localmente; nessun push finche l'utente non lo chiede
  - Merge in `develop` solo dopo approvazione umana in `/larapilot-review`

  ## Strategia dei dati di prova

  - Nessuna modifica di schema. `ReleaseEventFactory` guadagna gli stati mancanti — chiusura,
    attivazione, conclusione, tentativo non autorizzato — con i payload che le Action scrivono
    davvero: un registro di prova con cinque righe uguali non dimostrerebbe la resa per tipo.
  - Lo scenario dimostrativo (registro popolato nel seeder) resta di US-011.
  - `php artisan migrate:fresh --seed` deve continuare a completare senza errori.

  ## Strategia di test

  - Bar: `NORMAL` — Pest/PHPUnit feature, unit e policy. Nessun browser, nessuna suite di
    viewport.
  - `ReleaseLogScreenTest` — le cinque azioni rese in ordine cronologico con attore, istante e
    step; visibilita differenziata dei tentativi; accesso di un membro; rifiuto all'anonimo.
  - `ReleaseEventPolicyTest` — `viewAny` aperta, `view` differenziata, `update` e `delete`
    negate **anche** a un amministratore; Policy e scope `visibleTo` in accordo sullo stesso
    insieme.
  - `ReleaseEventAppendOnlyTest` — esteso con la lista bianca delle rotte non-GET e con
    l'assenza di percorsi di scrittura verso gli eventi.
  - `ReleaseLogInstantTest` — istanti memorizzati in UTC e resi nel fuso dell'applicazione, con
    lo stesso valore su registro e dettaglio.
  - `ReleaseLogQueryBudgetTest` — stesso costo con una voce e con dieci.

  ## Verifica manuale (handoff)

  1. Avvia una release, chiudi uno step, prova ad aprire lo step di un altro da un account non
     autorizzato, concludi la release: il registro deve mostrare le cinque azioni in ordine.
  2. Rileggi lo stesso registro da un account **non** amministratore: il tentativo non
     autorizzato non compare, e nulla ne segnala l'esistenza.
  3. A 375 px la cronologia resta leggibile in colonna singola, senza scorrimento orizzontale.
