    body: |-
      ## Description
      Il registro carica per ogni voce l'attore e lo step interessato: e la stessa forma di N+1 gia
      vista sulle altre schermate operative, su una tabella che cresce per tutta la vita del
      rilascio.

      ## Files Involved
      - tests/Feature/Releases/ReleaseLogQueryBudgetTest.php (nuovo)

      ## Steps
      1. Stessa forma di `ReleaseIndexQueryBudgetTest`: contatore su `DB::listen`, confronto fra un
