      2. Alterna gli eventi con e senza step (l'avvio non ne ha): un insieme di sole chiusure non
         proverebbe che la relazione nullable non fa scattare una query per riga.
      3. Un caso letto da un amministratore, cioe con le voci di tentativo incluse: e l'insieme piu
         grande, e il filtro di visibilita non deve introdurre una lettura per riga.
      4. `php artisan test --filter=ReleaseLogQueryBudget`

