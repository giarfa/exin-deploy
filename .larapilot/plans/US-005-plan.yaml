    id: TASK-10
    title: 'Rotta e schermata di chiusura dello step'
    body: |-
      ## Description
      La schermata su cui il responsabile compila e chiude, conforme al mockup
      `.larapilot/mockups/superficie-operativa/chiusura-step.html`. Componente Livewire a file singolo, sulla
      convenzione delle schermate esistenti.

      ## Files Involved
      - routes/web.php
      - resources/views/components/releases/⚡step.blade.php
      - lang/it/releases.php

      ## Steps
      1. Rotta `Route::livewire('/step/{releaseStep}', 'releases.step')->name('releases.step')` dentro il gruppo
         `auth`. **Un solo parametro** e non `/rilasci/{release}/step/{releaseStep}`: lo step ha chiave primaria
         UUID e la release si raggiunge dalla relazione; la forma annidata con `scopeBindings()` avrebbe richiesto
         su `Release` una relazione di nome `releaseSteps()`, cioe un secondo nome per `steps()`. Commentarlo
      2. **Nessun `->can()` sul middleware**, in deroga dichiarata alla protezione a due livelli del progetto: il
         middleware rifiuta prima che il codice applicativo possa registrare il tentativo, e la registrazione e un
         criterio di accettazione. Il commento della rotta deve spiegarlo, altrimenti la prossima revisione lo
         leggera come un buco
      3. Autorizzazione in `mount()` e su **ogni** azione (`close`, `save`) attraverso un unico punto privato che
         invoca `RecordUnauthorizedStepAttempt` e poi `abort(403)`. Le azioni Livewire non ripassano dal middleware
      4. Caricamento con eager loading: campi dello step, release, progetto, responsabile e step successivo — nessuna
         query per campo. Solo snapshot
      5. Form dai quattro tipi: `flux:input` (testo breve), `flux:textarea` (testo lungo), `flux:input type="url"`
         (link), `flux:checkbox` (conferma). Solo componenti Flux **gratuiti**
      6. Contratto di accessibilita del mockup: riepilogo errori in cima con `role="alert"`, collegamenti ai campi e
         focus dopo un rifiuto; `aria-invalid` e `aria-describedby` verso errore **e** testo di aiuto;
         obbligatorieta annunciata a parole (asterisco `aria-hidden` piu `sr-only` " (obbligatorio)"). Verificare il
         markup generato da Flux: se non emette entrambi i riferimenti, scendere a
         `flux:field` + `flux:label` + `flux:description` + `flux:error`
      7. Istruzioni congelate sopra i campi e dichiarazione di **a chi passa il flusso** alla chiusura: e la
         mitigazione progettuale dell'assenza di notifiche (rischio accettato n.1 del PRD)
      8. Stato non apribile: step completato in sola lettura con i valori forniti, step bloccato con l'indicazione di
         chi si sta aspettando. Nessun form — e comunque la Policy a rifiutare l'azione
      9. Rifiuti dell'Action catturati e resi come messaggi, mai come 500: stesso trattamento di `releases.start`.
         `StepValuesAreInvalid` alimenta il bag di errori del componente; `StepAlreadyClosed` e
         `ReleaseCompletionIsNotAvailableYet` diventano callout
      10. Mobile first: azione primaria a piena larghezza sotto 768 px, azioni in linea sopra, target touch 44x44 px
          sotto 1024 px, soglia unica a 1024 px. `wire:loading` con `wire:target` sul pulsante di chiusura contro il
          doppio invio dall'interfaccia — comodita, non correttezza
      11. Testi in `lang/it/releases.php`, con il tono del mockup ("Chiudi lo step e prosegui", non "Salva")
      12. Verifica manuale del layout a 375, 768 e 1280 px in tema chiaro e scuro
      13. `npm run build` se necessario, `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] La schermata compila e chiude uno step attivo, e salva senza chiudere
