code: US-005
plan_body: |-
  ## Technical Solution

  Cuore dell'epica EP-003: US-004 ha congelato la catena e attivato il primo step, questa spec la fa
  **avanzare**. Fin qui l'unica transizione scritta era l'avvio; da qui in poi esiste una macchina a stati con
  un invariante che vale a ogni istante — al massimo **uno** step attivo per release — e un percorso di
  scrittura che deve restare unico.

  Le due regole di `.ai/rules/app.md` diventano entrambe esigibili: l'esecuzione legge **solo** lo snapshot, e
  chiusura piu attivazione del successivo piu scrittura del registro stanno in **una sola transazione** con
  protezione dal doppio invio.

  **Nessuna migrazione.** Le colonne che questa spec riempie — `release_steps.completed_by`,
  `release_steps.completed_at`, `release_step_fields.value` — esistono da US-004, create nullable e dichiarate
  nel PHPDoc dei modelli come proprieta di US-005. Nessuna nuova tabella, nessun nuovo indice:
  `unique(release_id, position)` e cio che rende decidibile "lo step successivo", e
  `index(assigned_user_id, status)` copre la lettura per responsabile.

  ### Le regole di chiusura vivono sullo snapshot

  `FieldType` dichiara nel proprio PHPDoc che la semantica del valore fornito **non** gli appartiene. La regola
  va dove sta il dato congelato:

  | Metodo | Dove | Cosa decide |
  | --- | --- | --- |
  | `ReleaseStepField::closingRules()` | modello di istanza | le regole di validazione del proprio valore, da tipo e obbligatorieta |
  | `ReleaseStepField::normalizeValue(mixed)` | modello di istanza | la forma con cui il valore finisce in colonna |
  | `ReleaseStep::closingRules()` | modello di istanza | le regole dell'intero form, indicizzate per identificativo di campo |
  | `ReleaseStep::closingAttributes()` | modello di istanza | i nomi leggibili per i messaggi, presi dalle etichette congelate |
  | `ReleaseStep::nextStep()` | modello di istanza | lo step alla posizione successiva, `null` sull'ultimo |

  Una sola fonte, due consumatori: il componente Livewire (per i messaggi sul campo) e l'Action (che rifiuta
  comunque, perche e l'unico percorso di scrittura e non puo fidarsi di chi la chiama).

  Regole per tipo, con `nullable` al posto di `required` sui campi opzionali:

  | Tipo | Obbligatorio | Opzionale |
  | --- | --- | --- |
  | testo breve | `required`, `string`, `max:255` | `nullable`, `string`, `max:255` |
  | testo lungo | `required`, `string`, `max:5000` | `nullable`, `string`, `max:5000` |
  | link | `required`, `string`, `max:2048`, `App\Rules\WellFormedLink` | `nullable` + le stesse |
  | conferma | `accepted` | `boolean` |

  `App\Rules\WellFormedLink` e una regola propria e non `url:http,https`, e il motivo e il mockup: l'errore
  deve dire **cosa correggere** ("manca lo schema `https://` e contiene uno spazio"), non "campo non valido". La
  regola ispeziona il valore e compone il motivo — schema assente o diverso da http/https, spazi, host
  mancante — riusando lo stile di `App\Rules\AssignableUser`, che gia oggi spiega il proprio rifiuto.

  **Normalizzazione.** Il testo viene ripulito ai bordi (`trim`); la conferma finisce in colonna come `'1'`;
  un campo **opzionale lasciato vuoto resta `null`**, non stringa vuota. La distinzione non e cosmetica: in
  US-008 il dettaglio deve poter dire "non fornito" invece di mostrare una riga vuota, e una colonna che
  contiene `''` non lo consente piu.

  ### Action `App\Actions\Releases\CloseStep`

  Unico percorso di avanzamento, `handle(ReleaseStep $step, array $values, User $actor): ReleaseStep`, tutto
  dentro una `DB::transaction`:

  1. **Lock sulla riga della release** — `Release::query()->whereKey(...)->lockForUpdate()->firstOrFail()`,
     come impone `.ai/rules/app.md`.
  2. **Rilettura dello step dentro la transazione**, con i campi in eager loading: lo stato che il chiamante
     aveva in mano e di un istante prima.
  3. **Rifiuto se lo step non e apribile** — release conclusa, step bloccato o gia completato:
     `StepIsNotOpen`.
  4. **Validazione dei valori** contro `closingRules()` — `StepValuesAreInvalid` porta il `MessageBag`, cosi
     che il componente renda gli stessi messaggi senza rivalidare.
  5. **Scrittura dei valori** sui campi dello snapshot.
  6. **Chiusura in compare-and-swap** — un solo `update()` condizionato allo stato atteso:
     `ReleaseStep::query()->whereKey($step)->where('status', Active)->update([...completato, completed_by, completed_at])`.
     Se torna **0 righe**, un'altra transazione e passata prima: `StepAlreadyClosed`, rollback, nessun evento.
  7. **Attivazione del successivo**, anch'essa condizionata (`where('status', Blocked)`).
  8. **Due eventi** nel registro: `step_completato` (posizione, nome, numero di campi compilati) e
     `step_attivato` (posizione, nome, responsabile). Non i valori: quelli vivono sui campi, e duplicarli nel
     registro darebbe due fonti per lo stesso dato — FR-019, che avra bisogno del valore precedente, e uno
     Should rinviato dal PRD.

  **Perche il compare-and-swap e non il solo lock.** Su SQLite `lockForUpdate()` non produce SQL: la
  grammatica non supporta `FOR UPDATE`, e la chiamata viene compilata a nulla. Il lock resta perche il
  vincolo di portabilita del PRD impone che il codice sia corretto anche su MySQL e PostgreSQL, dove serve
  davvero; la garanzia **effettiva su SQLite** e l'update condizionato, che e l'alternativa esplicitamente
  prevista dall'invariante 3 del PRD ("un blocco pessimistico sulla riga della release **o** un controllo di
  stato dentro la transazione"). Le due misure non si sovrappongono per ridondanza: coprono due motori
  diversi, e il commento nel codice deve dirlo, altrimenti una revisione futura togliera quella che sul
  proprio motore sembra inutile.

  ### La chiusura dell'ultimo step e un confine dichiarato, non un buco

  Chiudere l'ultimo step della catena **conclude la release**, ed e US-006 (FR-017). Qui il ramo terminale
  esiste ed e chiuso da un rifiuto esplicito, `ReleaseCompletionIsNotAvailableYet`, con un messaggio che dice
  che la conclusione arriva con la prossima spec.

  E la scelta corretta fra le tre possibili: chiudere e lasciare la release `in_corso` senza step attivo
  violerebbe l'invariante che questa spec ha il compito di **dimostrare con un test**; chiudere e concludere
  significherebbe implementare US-006 dentro US-005 senza i suoi criteri di accettazione; rifiutare lascia il
  sistema sempre coerente e concentra su un solo punto la modifica che US-006 dovra fare — sostituire il
  `throw` con la conclusione. Il PHPDoc dell'eccezione lo dichiara.

  ### Salvataggio senza chiusura

  Il mockup espone "Salva senza chiudere" accanto alla chiusura, e su un form con testi lunghi compilato da
  telefono e la differenza fra uno strumento usabile e uno da cui si esce perdendo il lavoro.
  `App\Actions\Releases\SaveStepValues` scrive i valori **senza** transizione: stessa autorizzazione,
  stesso requisito di step attivo, nessuna validazione di obbligatorieta (una bozza incompleta e il suo
  scopo), ma **si** la validazione di forma sui campi compilati — salvare un link malformato significherebbe
  riproporlo identico e rotto alla ripresa.

  **Nessun evento nel registro.** Il registro documenta le **transizioni** (FR-016) e una bozza non lo e; il
  vocabolario di `ReleaseEventAction` e nato completo in US-004 e non prevede questo caso. Aggiungere un
  valore in colonna per un salvataggio intermedio gonfierebbe lo storico di righe che non raccontano nulla su
  chi ha fatto cosa nel processo.

  ### Autorizzazione, e il tentativo che va registrato

  `App\Policies\ReleaseStepPolicy` nuova, sulla convenzione di `ReleasePolicy`:

  | Ability | Chi | Nel filtro `before()` |
  | --- | --- | --- |
  | `view` | responsabile o amministratore, qualunque sia lo stato dello step | si |
  | `fill` | responsabile o amministratore, **solo** su step attivo di release in corso | **no** (`NOT_FILTERED`) |
  | `close` | come `fill` | **no** (`NOT_FILTERED`) |

  `fill` e `close` restano fuori dal filtro dell'amministratore per la stessa ragione per cui `delete` ne e
  fuori su `ReleasePolicy`: il vincolo "solo lo step attivo e compilabile" vale **anche** per un
  amministratore, e un filtro che risponde `true` prima del metodo lo cancellerebbe. La riapertura di uno step
  chiuso e FR-019, Should rinviato: nessuna scorciatoia che la lasci intendere.

  **Deroga dichiarata alla protezione a due livelli.** Le altre rotte del progetto sono protette due volte —
  `->can()` sul middleware e `Gate::authorize()` dentro il componente. Su questa rotta il middleware `can`
  **non** viene applicato, e non e una dimenticanza: il criterio di accettazione chiede che il tentativo non
  autorizzato sia registrato nel registro delle transizioni, e il middleware rifiuta **prima** che qualunque
  codice applicativo possa scrivere. L'autorizzazione vive quindi in `mount()` e su ogni azione del
  componente, sempre attraverso un unico punto che registra e poi rifiuta. Il commento sulla rotta deve
  spiegarlo, altrimenti la prossima revisione lo leggera come un buco.

  `App\Actions\Releases\RecordUnauthorizedStepAttempt` scrive `ReleaseEvent` con
  `tentativo_non_autorizzato` (payload: ability negata, step, posizione) e un `Log::warning` con contesto
  strutturato, distinto dal registro funzionale come prescrive il PRD (`### Sicurezza`).

  **Solo i tentativi mutanti finiscono nel registro.** Un `view` negato produce log applicativo ma non riga di
  registro: il registro e in sola aggiunta e non cancellabile, quindi chiunque potrebbe gonfiarlo
  ricaricando un indirizzo. I tentativi che il prodotto deve poter dimostrare sono quelli di **compilare o
  chiudere** uno step di cui non si risponde, ed e quello che FR-012 chiede.

  ### Schermata

  | Rotta | Componente | Contenuto |
  | --- | --- | --- |
  | `/step/{releaseStep}` | `releases.step` | istruzioni congelate, form dei quattro tipi, chiusura, salvataggio, riepilogo errori |

  **Un solo parametro, e non `/rilasci/{release}/step/{releaseStep}`.** Lo step ha chiave primaria UUID: e
  identificato da se, e la release si raggiunge dalla relazione. La forma annidata con `scopeBindings()`
  avrebbe richiesto su `Release` una relazione di nome `releaseSteps()` — il binding annidato ricava il nome
  dalla forma plurale del parametro, come dice il commento della rotta dei campi in US-003 — cioe un secondo
  nome per `steps()`, destinato a divergere. Con un parametro solo non esiste ne il problema di scoping ne
  l'identificativo ridondante nell'indirizzo.

  Contratto del mockup `chiusura-step.html`, da rispettare voce per voce:

  - **Riepilogo errori** in cima al form, `role="alert"`, con collegamenti ai campi in errore; riceve il focus
    dopo un tentativo rifiutato.
  - **Errori collegati** al proprio campo: `aria-invalid="true"` e `aria-describedby` verso il paragrafo di
    errore **e** verso il testo di aiuto. Da verificare sul markup che Flux genera: se `flux:input` non emette
    entrambi i riferimenti, si scende a `flux:field` + `flux:label` + `flux:description` + `flux:error`, che
    danno controllo pieno e restano nel perimetro gratuito.
  - **Obbligatorieta a parole**: asterisco `aria-hidden`, accanto `<span class="sr-only"> (obbligatorio)</span>`.
  - **Istruzioni dello step** sopra i campi, e la dichiarazione di **a chi passa il flusso** alla chiusura —
    e la mitigazione progettuale dell'assenza di notifiche (rischio accettato n.1 del PRD).
  - **Un'azione primaria**, a piena larghezza sotto 768 px; `wire:loading` con `wire:target` sul pulsante di
    chiusura contro il doppio invio dall'interfaccia — che resta una comodita: la correttezza e nell'Action.
  - **Stati mai dal solo colore**, target touch 44x44 px sotto 1024 px, soglia responsive unica a 1024 px
    (vincolo permanente 4 del README).
  - Step **bloccato o completato**: nessun form. Lo step completato e in sola lettura con i valori forniti;
    quello bloccato dice di chi si sta aspettando. Nascondere il form non e autorizzazione — la Policy
    rifiuta comunque l'azione, ed e cio che il test verifica.

  **Ponte di ingresso.** "I miei step" (US-007) e il dettaglio release (US-008) non esistono ancora: senza un
  punto d'accesso la spec non sarebbe dimostrabile. Sulla catena mostrata dalla schermata di avvio (US-004) lo
  step attivo espone "Apri e compila", visibile solo a chi la Policy autorizza. E dichiarato nel codice come
  **ponte** verso US-007: la voce di navigazione **Release** resta `x-nav.planned`, perche la pagina che
  promette e l'elenco (US-009).

  Testi in `lang/it/releases.php` sotto un blocco dedicato alla chiusura, mai incastonati nelle viste, con il
  tono del mockup: "Chiudi lo step e prosegui", non "Salva".

  ### Documentazione

  Il README chiude oggi la sezione sullo snapshot con "I diagrammi (entita-relazioni e macchina a stati)
  arrivano con US-005". Questa spec paga quella promessa: `stateDiagram-v2` delle transizioni di step e
  release, e `erDiagram` con le entita raggruppate in **definizione** e **istanza** e la copia all'avvio
  marcata sul bordo. Piu la sezione narrativa su chiusura e avanzamento (ordine dei controlli, transazione,
  doppio invio) e le voci di `CHANGELOG.md`.

  ### Fuori perimetro

  Conclusione della release e ultimo step (US-006); vista "i miei step" (US-007); dettaglio release completo
  con registro (US-008); elenco, filtri e storico (US-009); consultazione del registro e visibilita dei
  tentativi non autorizzati (US-010); scenario dimostrativo con release a meta catena (US-011, proprietario
  della composizione in `DatabaseSeeder`). Riapertura (FR-019) e annullamento (FR-020) sono Should rinviati
  dal PRD: nessun percorso, nessun messaggio e nessuno stato che li lascino intendere.

  ## Git & Branching

  - Mode: `GITFLOW` (da `data.settings.git_mode`) — **nessun push automatico**
  - Branch: `feature/US-005-chiusura-step-avanzamento` da `develop`
  - TASK-00: bootstrap. `develop` e fermo al merge di US-003: i **15 commit di US-004**, approvata in revisione
    umana il 2026-08-13, non sono ancora integrati, e questa spec avanza proprio sulle tabelle che US-004
    introduce. TASK-00 li integra con un merge esplicito e poi crea il branch. Nell'albero di lavoro ci sono
    tre file Larapilot modificati (`backlog.yaml`, `specs/US-004.yaml`, `usage/ledger.jsonl`): vanno committati
    prima del merge, non trascinati sul nuovo branch
  - Per task: un solo commit atomico in Conventional Commits (`type(US-005): TASK-NN sommario`)
  - PR interna verso `develop`: titolo e corpo redatti e **tenuti in locale**; apertura remota e push solo su
    richiesta esplicita dell'utente in sessione
  - Merge in `develop` solo dopo approvazione umana in `/larapilot-review`
  - Prima di ogni `task-done`: `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`
    (Larastan livello 5) e suite verde

  ## Test Data Strategy

  - **Nessuna migrazione, nessun modello nuovo**: le factory delle quattro entita di istanza esistono da US-004
    e coprono gia gli stati che questa spec attraversa — `ReleaseStepFactory::active()`, `blocked()`,
    `completed()`, e i cinque stati per tipo di `ReleaseStepFieldFactory` piu `optional()`.
  - **Un'aggiunta sola**: `ReleaseStepFieldFactory::filled(?string $value = null)` — campo dello snapshot con
    un valore coerente col proprio tipo (URL valido per `link`, `'1'` per `confirmation`). Serve ai test di
    questa spec e sara il mattone del dettaglio release (US-008) e dello scenario dimostrativo (US-011).
    Scritta nello stesso task che introduce la normalizzazione del valore, cosi che le due convenzioni non
    divergano.
  - **Seeder non toccato.** `DatabaseSeeder` compone oggi solo la configurazione; la release a meta catena e
    quella conclusa sono i deliverable di US-011, che se ne dichiara proprietario. Anticiparli qui creerebbe
    due punti di composizione dello stesso scenario.
  - Verifica prima di ogni `task-done` che tocca i dati: `php artisan migrate:fresh --seed`.

  ## Test Strategy

  - Bar: `NORMAL` (da `data.settings.testing`) — PHPUnit 12.5, feature e unit. **Nessun** test browser, Dusk,
    Playwright o matrice di viewport: sono di competenza `BEST`.
  - **Unit** — regole di chiusura per tipo e obbligatorieta; `App\Rules\WellFormedLink` sui suoi casi (schema
    assente, schema non http/https, spazi, host mancante, indirizzo valido); normalizzazione del valore
    (`trim`, conferma a `'1'`, opzionale vuoto a `null`); `ReleaseStep::nextStep()` incluso l'ultimo.
  - **Feature, percorso felice** — chiusura valida: valori scritti, autore e istante registrati, step a
    `completato`, successivo ad `attivo`, due eventi nel registro con attore e istante.
  - **Feature, rifiuti** — obbligatorio vuoto (con indicazione del campo), link malformato, conferma
    obbligatoria non spuntata; campo opzionale vuoto che **non** impedisce la chiusura. Nessuna scrittura
    parziale dopo un rifiuto.
  - **Feature, invarianti** — dopo ogni chiusura esiste al massimo uno step attivo per release; uno step
    bloccato e uno completato non sono compilabili ne chiudibili nemmeno invocando l'azione Livewire
    direttamente, che e il percorso che salta il middleware.
  - **Feature, concorrenza** — due chiusure dello **stesso** step a partire dallo stato che il chiamante aveva
    in mano: la seconda e rifiutata, l'avanzamento e uno e gli eventi sono due in totale, non quattro. E il
    modo praticabile di dimostrare il compare-and-swap in un test a processo singolo; il PHPDoc del test dice
    perche non si simulano due processi.
  - **Feature, transazione unica** — un fallimento iniettato dopo la chiusura e prima dell'evento non deve
    lasciare lo step chiuso: verifica di rollback completo.
  - **Feature, autorizzazione** — responsabile ammesso; amministratore ammesso; altro membro rifiutato con
    **403**, una riga `tentativo_non_autorizzato` nel registro e una voce nel log applicativo
    (`Log::spy()`); membro disattivato rifiutato.
  - **Feature, isolamento dallo snapshot** — la chiusura non interroga `workflow_templates`,
    `step_definitions`, `field_definitions` ne `project_role_assignments`: stesso ascolto di query di
    `SnapshotIsolationTest`, che questa spec estende invece di duplicare.
  - **Feature, costo costante** — la lettura del form di chiusura costa lo stesso numero di query su uno step
    con un campo e su uno con quattordici, sul modello di `StartReleaseQueryBudgetTest`.
  - **Manual test handoff** (ammesso al bar `NORMAL`, e necessario qui): focus sul riepilogo errori dopo un
    rifiuto, annuncio degli aggiornamenti Livewire, ordine di tabulazione, resa a 375 / 768 / 1280 px in tema
    chiaro e scuro. Da riportare in `.larapilot/docs/test-results/US-005.md`.
tasks:
  -
    id: TASK-00
    title: 'Integrare US-004 in develop e creare il branch di lavoro'
    body: |-
      ## Description
      Preparare Gitflow per questa spec. Il branch non puo partire dallo stato attuale di `develop`: US-004 e stata
      approvata in revisione umana ma i suoi 15 commit non sono mai stati integrati, quindi `develop` e fermo al
      merge di US-003 e non contiene `releases`, `release_steps`, `release_step_fields` e `release_events` — cioe
      esattamente le tabelle su cui questa spec fa avanzare la catena.

      ## Files Involved
      - (solo git — nessun file applicativo)

      ## Steps
      1. `git status --short`: committare i tre file Larapilot modificati (`.larapilot/backlog.yaml`,
         `.larapilot/specs/US-004.yaml`, `.larapilot/usage/ledger.jsonl`) sul branch di US-004, per non trascinare
         modifiche non committate sul nuovo branch
      2. `git checkout develop`
      3. `git merge --no-ff feature/US-004-avvio-release-snapshot -m "merge: integra US-004 avvio della release con snapshot congelato"`
      4. `php artisan test --compact` su `develop` dopo il merge: l'integrazione non deve rompere la suite
      5. `git checkout -b feature/US-005-chiusura-step-avanzamento`
      6. Commit di ancoraggio del branch: `chore(US-005): TASK-00 bootstrap feature branch` (commit vuoto ammesso)
      7. Redigere titolo e corpo della PR interna verso `develop` e **tenerli in locale**: nessun push

      ## Completion Criteria
      - [x] `develop` contiene i commit di US-004 e la suite e verde su `develop`
      - [x] Il branch `feature/US-005-chiusura-step-avanzamento` esiste in locale e parte da `develop`
      - [x] Nessuna modifica non committata trascinata dal branch precedente
      - [x] Descrizione della PR interna redatta e tenuta in locale

      ## Test Data
      - N/A — nessuna modifica a schema, modelli o dati

      ## Git Deliverables
      - Commit: `chore(US-005): TASK-00 bootstrap feature branch` (piu il commit di merge su `develop`)
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: preparata in locale verso `develop`, apertura remota solo su richiesta esplicita
