    title: 'Action SaveStepValues: salvataggio senza chiusura'
    body: |-
      ## Description
      `App\Actions\Releases\SaveStepValues` scrive i valori compilati **senza** far avanzare la catena. Il mockup
      espone "Salva senza chiudere" accanto alla chiusura, e su un form con testi lunghi compilato da telefono e la
      differenza fra uno strumento usabile e uno da cui si esce perdendo il lavoro.

      ## Files Involved
      - app/Actions/Releases/SaveStepValues.php

      ## Steps
      1. `handle(ReleaseStep $step, array $values, User $actor): ReleaseStep` dentro `DB::transaction`
      2. Stesse precondizioni di stato della chiusura: release in corso e step attivo (`StepIsNotOpen`). Una bozza
         su uno step bloccato o completato non ha significato
      3. Validazione **di forma sui soli campi compilati**, senza obbligatorieta: una bozza incompleta e il suo
         scopo, ma salvare un link malformato significherebbe riproporlo identico e rotto alla ripresa. Riuso di
         `closingRules()` con `required` rilassato — nessuna seconda copia delle regole
      4. Scrittura dei valori normalizzati; nessuna transizione di stato, nessuna scrittura su `completed_by` o
         `completed_at`
      5. **Nessun evento nel registro**, e dichiararlo nel PHPDoc: il registro documenta le transizioni (FR-016) e
         una bozza non lo e. Il vocabolario di `ReleaseEventAction` e nato completo in US-004 e non prevede il caso;
         aggiungerne uno gonfierebbe lo storico di righe che non raccontano nulla sul processo
      6. `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] I valori vengono salvati senza chiudere lo step ne attivare il successivo
      - [ ] Nessuna riga scritta nel registro delle transizioni
      - [ ] Un campo obbligatorio vuoto non impedisce il salvataggio; un link malformato si
      - [ ] Le regole di forma sono riusate da `closingRules()`, non riscritte

