    id: TASK-02
    title: 'Regole di chiusura e normalizzazione del valore sullo snapshot'
    body: |-
      ## Description
      Portare sui modelli di istanza le regole che decidono se uno step e chiudibile e come il valore fornito finisce
      in colonna. `App\Enums\FieldType` dichiara nel proprio PHPDoc che questa semantica non gli appartiene: la
      regola va dove sta il dato congelato, in una sola copia usata sia dal componente sia dall'Action.

      ## Files Involved
      - app/Models/ReleaseStepField.php
      - app/Models/ReleaseStep.php
      - database/factories/ReleaseStepFieldFactory.php

      ## Steps
      1. `ReleaseStepField::closingRules(): array` — regole da tipo e obbligatorieta:
         testo breve `string|max:255`; testo lungo `string|max:5000`; link `string|max:2048` piu
         `App\Rules\WellFormedLink`; conferma `accepted` se obbligatoria, `boolean` se opzionale. `required` sui
         campi obbligatori, `nullable` sugli opzionali
      2. `ReleaseStepField::normalizeValue(mixed $value): ?string` — `trim` sul testo, `'1'` sulla conferma
         spuntata, **`null`** su un campo opzionale lasciato vuoto: in US-008 il dettaglio deve poter dire "non
         fornito", e una colonna che contiene `''` non lo consente piu. Dichiararlo nel PHPDoc
      3. `ReleaseStep::closingRules(): array` — le regole dell'intero form, indicizzate per identificativo di campo,
         e `ReleaseStep::closingAttributes(): array` con le etichette congelate come nomi leggibili
      4. `ReleaseStep::nextStep(): ?ReleaseStep` — lo step alla posizione successiva della stessa release, `null`
         sull'ultimo. Legge solo lo snapshot; nessun accesso a `step_definitions`
      5. `ReleaseStepFieldFactory::filled(?string $value = null)`: valore coerente col tipo (URL valido per `link`,
         `'1'` per `confirmation`), cosi che lo stato prodotto sia uno che la chiusura puo davvero generare —
         stessa disciplina con cui `ReleaseStepFactory::completed()` allinea `completed_by` al responsabile
      6. `php artisan migrate:fresh --seed`, `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] `closingRules()` distingue i quattro tipi e i due livelli di obbligatorieta
      - [ ] Un campo opzionale vuoto viene normalizzato a `null`, non a stringa vuota
      - [ ] `nextStep()` legge solo lo snapshot e torna `null` sull'ultimo step
      - [ ] `ReleaseStepFieldFactory::filled()` produce valori validi per il tipo del campo
      - [ ] `migrate:fresh --seed` riesce

      ## Test Data
      - [ ] `database/factories/ReleaseStepFieldFactory.php` aggiornato con lo stato `filled()`
      - [ ] `DatabaseSeeder` non toccato: lo scenario con release a meta catena e di US-011
      - [ ] Factory aggiornata nello **stesso** task della convenzione di normalizzazione

