    title: 'Test: doppio invio concorrente, transazione unica e isolamento dallo snapshot'
    body: |-
      ## Description
      I tre criteri che nessuna prova manuale puo dimostrare: un solo avanzamento su due richieste concorrenti, il
      rollback completo di una transazione interrotta, e l'assenza di letture sulle tabelle di definizione.

      ## Files Involved
      - tests/Feature/Releases/CloseStepConcurrencyTest.php
      - tests/Feature/Releases/SnapshotIsolationTest.php (esistente — da estendere)
      - tests/Feature/Releases/CloseStepQueryBudgetTest.php

      ## Steps
      1. Concorrenza: due chiamate a `CloseStep` sullo **stesso** modello step, la seconda a partire dallo stato che
         il chiamante aveva in mano prima della prima. Attese: `StepAlreadyClosed`, un solo avanzamento, due eventi
         in totale e non quattro. Il PHPDoc del test dichiara perche non si simulano due processi — su SQLite in
         memoria non e riproducibile — e perche il compare-and-swap e cio che viene effettivamente verificato
      2. Transazione unica: iniettare un fallimento dopo la chiusura e prima della scrittura dell'evento (per
         esempio un guardiano temporaneo su `ReleaseEvent::creating`) e verificare che lo step sia tornato `attivo`,
         il successivo `bloccato` e i valori non scritti
      3. Estendere `SnapshotIsolationTest` con la chiusura: ascolto delle query e fallimento se ne compare una su
         `workflow_templates`, `step_definitions`, `field_definitions` o `project_role_assignments`. Estendere il
         test esistente invece di duplicarne l'impianto
      4. Budget di query sul modello di `StartReleaseQueryBudgetTest`: la lettura del form di chiusura costa lo
         stesso su uno step con un campo e su uno con quattordici
      5. `php artisan test --compact --filter=CloseStepConcurrency`, `--filter=SnapshotIsolation`,
         `--filter=CloseStepQueryBudget`

      ## Completion Criteria
      - [ ] Il doppio invio produce un solo avanzamento e due eventi in totale
      - [ ] Un fallimento a meta transazione non lascia lo step chiuso
      - [ ] La chiusura non interroga nessuna tabella di definizione
      - [ ] Il costo in query non dipende dal numero di campi dello step
