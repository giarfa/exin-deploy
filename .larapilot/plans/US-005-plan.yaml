    title: 'Documentazione: diagrammi Mermaid, nota architetturale e CHANGELOG'
    body: |-
      ## Description
      Pagare la promessa che il README ha lasciato in US-004 ("I diagrammi arrivano con US-005") e documentare
      chiusura e avanzamento. E un criterio di accettazione esplicito della spec, non un extra.

      ## Files Involved
      - README.md
      - CHANGELOG.md
      - .larapilot/docs/test-results/US-005.md

      ## Steps
      1. `README.md` — `stateDiagram-v2` della macchina a stati: lo step (`bloccato` -> `attivo` -> `completato`) e
         la release (`in_corso` -> `conclusa`, con la conclusione marcata come US-006), con le transizioni
         annotate dall'evento che scrivono nel registro
      2. `README.md` — `erDiagram` con le entita raggruppate in **definizione** e **istanza**, la copia all'avvio
         marcata sul bordo fra i due gruppi, e la dichiarazione che nessuna freccia di lettura torna dall'istanza
         alla definizione
      3. `README.md` — sezione narrativa "Chiusura di uno step e avanzamento": ordine dei controlli, transazione
         unica, compare-and-swap e perche convive con il lock, invariante dello step attivo, confine con US-006,
         deroga alla protezione a due livelli sulla rotta di chiusura, registrazione dei tentativi non autorizzati
      4. Sostituire la frase "I diagrammi ... arrivano con US-005": una promessa mantenuta non va lasciata scritta
         al futuro
      5. Aggiornare l'elenco dei vincoli permanenti: il punto 9 dice che la semantica per tipo di `value`
         "appartiene alla chiusura dello step (US-005)" — ora esiste, e va indicato dove
      6. `CHANGELOG.md`, sezione `Unreleased` / `Added`: chiusura con validazione, avanzamento sequenziale,
         salvataggio senza chiusura, autorizzazione e tracciamento dei tentativi
      7. `.larapilot/docs/test-results/US-005.md` con l'esito della suite e le **verifiche manuali** consegnate:
         focus sul riepilogo errori, annuncio degli aggiornamenti Livewire, ordine di tabulazione, resa a
         375 / 768 / 1280 px nei due temi
      8. Verificare che i due diagrammi Mermaid siano sintatticamente validi

      ## Completion Criteria
      - [ ] `stateDiagram-v2` della macchina a stati presente e valido
      - [ ] `erDiagram` presente, con definizione e istanza distinte
      - [ ] Nota architetturale su chiusura e avanzamento scritta, e la promessa al futuro rimossa
      - [ ] `CHANGELOG.md` aggiornato
