    id: TASK-07
    title: 'Registrazione del tentativo non autorizzato: registro e log applicativo'
    body: |-
      ## Description
      `App\Actions\Releases\RecordUnauthorizedStepAttempt`: il criterio di accettazione chiede che un tentativo
      non autorizzato sia rifiutato con 403 **e** tracciato sia nel log applicativo sia nel registro delle
      transizioni. Sono due destinazioni distinte, come prescrive il PRD (`### Sicurezza`), e una sola non basta.

      ## Files Involved
      - app/Actions/Releases/RecordUnauthorizedStepAttempt.php

      ## Steps
      1. `handle(ReleaseStep $step, User $actor, string $ability): void`
      2. `ReleaseEvent` con azione `tentativo_non_autorizzato` e payload: ability negata, posizione e nome dello
         step. E l'unico valore del vocabolario di US-004 rimasto non scritto oltre a quelli di US-006
      3. `Log::warning` con contesto strutturato (release, step, attore, ability), distinto dal registro funzionale:
         il primo serve a chi presidia il sistema, il secondo e una prova di processo
      4. Registrare **solo i tentativi mutanti** (`fill`, `close`). Un `view` negato produce log ma non riga di
         registro: il registro e in sola aggiunta e non cancellabile, quindi un ricaricamento di indirizzo potrebbe
         gonfiarlo. FR-012 parla di compilare e chiudere. Dichiararlo nel PHPDoc
      5. Nessuna transazione: la registrazione non deve poter essere annullata dal rifiuto che l'ha causata
      6. `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Il tentativo mutante non autorizzato produce una riga nel registro e una voce nel log
      - [ ] Un `view` negato produce solo la voce di log
      - [ ] La scrittura non viene annullata insieme al rifiuto
      - [ ] Il PHPDoc spiega perche i tentativi di sola lettura non entrano nel registro

      ## Test Data
