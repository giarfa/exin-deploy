    id: TASK-08
    title: 'Test: chiusura valida, rifiuti di validazione e invariante dello step attivo'
    body: |-
      ## Description
      Coprire il percorso felice e i rifiuti dell'Action, e l'invariante che il PRD dichiara portante: al massimo uno
      step attivo per release.

      ## Files Involved
      - tests/Feature/Releases/CloseStepTest.php
      - tests/Feature/Releases/SaveStepValuesTest.php

      ## Steps
      1. `php artisan make:test --phpunit Releases/CloseStepTest` e `Releases/SaveStepValuesTest`
      2. Percorso felice: valori scritti sui campi, `completed_by` e `completed_at` registrati, step a `completato`,
         successivo ad `attivo`, due eventi (`step_completato`, `step_attivato`) con attore e istante
      3. Rifiuti: campo obbligatorio vuoto (il messaggio nomina il campo), link malformato, conferma obbligatoria non
         spuntata. Dopo ogni rifiuto: nessun valore scritto, nessuna transizione, nessun evento
      4. Campo opzionale lasciato vuoto: la chiusura riesce e la colonna resta `null`
      5. Invariante: dopo ogni chiusura esiste esattamente uno step attivo per release; su una catena di tre step
         percorsa fino al secondo, il terzo resta bloccato
      6. Ultimo step: `ReleaseCompletionIsNotAvailableYet`, release ancora `in_corso` e ultimo step ancora `attivo`
         dopo il rifiuto — il confine con US-006 non deve lasciare stati intermedi
      7. Step bloccato e step completato: `StepIsNotOpen` in entrambi i casi
      8. `SaveStepValuesTest`: valori salvati senza transizione, obbligatorio vuoto ammesso, link malformato
         rifiutato, registro invariato
      9. Usare le factory esistenti (`active()`, `blocked()`, `completed()`, `filled()`)
      10. `php artisan test --compact --filter=CloseStep` e `--filter=SaveStepValues`

      ## Completion Criteria
      - [ ] Test verdi in locale
      - [ ] Percorso felice, quattro rifiuti di validazione e campo opzionale coperti
      - [ ] Invariante "al massimo uno step attivo" verificato da test
