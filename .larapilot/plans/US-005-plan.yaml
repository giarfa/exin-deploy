    id: TASK-12
    title: "Test: autorizzazione, tracciamento del rifiuto e flusso dall'interfaccia"
    body: |-
      ## Description
      Coprire FR-012 lato interfaccia: chi puo compilare e chiudere, cosa accade a chi non puo, e il flusso completo
      dalla schermata. Il percorso che conta e quello che **salta** il middleware, cioe l'invocazione diretta
      dell'azione Livewire.

      ## Files Involved
      - tests/Feature/Releases/ReleaseStepPolicyTest.php
      - tests/Feature/Releases/CloseStepScreenTest.php

      ## Steps
      1. `php artisan make:test --phpunit Releases/ReleaseStepPolicyTest` e `Releases/CloseStepScreenTest`
      2. Policy: responsabile ammesso su `view`, `fill`, `close`; amministratore ammesso; altro membro negato;
         `fill` e `close` negati **anche all'amministratore** su step bloccato o completato e su release conclusa
      3. Interfaccia, percorso felice: il responsabile compila i quattro tipi, chiude, e la pagina conferma
         l'avanzamento; il successivo risulta attivo
      4. Rifiuti resi a schermo: obbligatorio mancante, link malformato, conferma non spuntata — con il messaggio
         collegato al campo e nessuna transizione avvenuta
      5. Tentativo non autorizzato: un altro membro invoca `close` direttamente sull'azione Livewire. Attese:
         **403**, una riga `tentativo_non_autorizzato` nel registro, una voce nel log applicativo (`Log::spy()`),
         nessuna transizione
      6. Step bloccato e completato: nessun form reso, e l'azione invocata direttamente comunque rifiutata
      7. Ingresso dalla catena: il comando "Apri e compila" e presente per il responsabile e assente per chi non e
         autorizzato
      8. Attenzione a `.ai/rules/tests.md`: in questo progetto `session('errors')` e un array e le asserzioni di
         risposta fallite riportano un errore fuorviante. Leggere `Location` e gli errori a mano quando serve
      9. `php artisan test --compact --filter=ReleaseStepPolicy` e `--filter=CloseStepScreen`
      10. Suite completa: `php artisan test --compact`

      ## Completion Criteria
      - [ ] Test verdi in locale e suite completa verde
      - [ ] 403, riga di registro e voce di log verificati sul tentativo non autorizzato
      - [ ] Rifiuto di `fill`/`close` all'amministratore su step non attivo verificato
      - [ ] Flusso completo dall'interfaccia coperto, senza test browser

      ## Git Deliverables
