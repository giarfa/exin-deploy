      2. Il comando compare solo quando la Policy lo consente (`@can('fill', $step)`): nasconderlo non e
         autorizzazione, ma mostrarlo a chi verrebbe rifiutato e cattiva interfaccia
      3. Commentare nel codice che e un **ponte** verso US-007, non la navigazione definitiva
      4. La voce di navigazione **Release** resta `x-nav.planned`: la pagina che promette e l'elenco (US-009), e
         trasformarla ora direbbe il falso
      5. Eager loading invariato: la catena mostrata carica gia il responsabile con `with`
