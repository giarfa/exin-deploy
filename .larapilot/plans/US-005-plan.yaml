  -
    id: TASK-01
    title: 'Regola di validazione WellFormedLink con motivo esplicito'
    body: |-
      ## Description
      Introdurre `App\Rules\WellFormedLink`, la regola che valida i campi di tipo link **dicendo cosa correggere**.
      `url:http,https` rifiuterebbe con un messaggio generico; il mockup `chiusura-step.html` fissa il contratto
      opposto ("Indirizzo non valido: manca lo schema (`https://`) e contiene uno spazio"), e un errore che non dice
      la correzione costringe chi compila a indovinare.

      ## Files Involved
      - app/Rules/WellFormedLink.php
      - lang/it/validation.php

      ## Steps
      1. `php artisan make:rule WellFormedLink --no-interaction`
      2. Implementare `ValidationRule` sullo stile di `App\Rules\AssignableUser`: il rifiuto compone il motivo
         dai difetti trovati, invece di emettere un messaggio unico
      3. Casi da distinguere: schema assente; schema diverso da `http`/`https`; presenza di spazi; host mancante o
         malformato. Piu difetti sullo stesso valore vengono elencati insieme, come nel mockup
      4. Messaggi in `lang/it/validation.php` (sezione dedicata), mai stringhe nella classe: il PRD prescrive che
         il testo dell'interfaccia passi da `lang/`
      5. Nessuna verifica di raggiungibilita dell'indirizzo: sarebbe una chiamata di rete dentro una validazione, e
         un report interno non e raggiungibile dal server. Dichiararlo nel PHPDoc
      6. `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `WellFormedLink` rifiuta schema assente, schema non http/https, spazi e host mancante
      - [x] Il messaggio nomina i difetti trovati, non un generico "non valido"
      - [x] Nessun testo incastonato nella classe: tutto in `lang/it/validation.php`
      - [x] Il PHPDoc dichiara che la raggiungibilita non viene verificata, e perche

      ## Test Data
      - N/A — nessuna modifica a schema, modelli o dati

      ## Git Deliverables
      - Commit: `feat(US-005): TASK-01 regola di validazione dei campi link`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornamento della descrizione locale
    type: Impl
    status: DONE
    dependencies:
      - TASK-00
