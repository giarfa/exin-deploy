    id: TASK-05
    title: 'Action CloseStep: transazione unica, compare-and-swap e avanzamento'
    body: |-
      ## Description
      Il cuore della spec: `App\Actions\Releases\CloseStep`, unico percorso di avanzamento. Chiusura dello step,
      attivazione del successivo e scrittura dei due eventi in **una sola transazione**, con protezione dal doppio
      invio come impone `.ai/rules/app.md`.

      ## Files Involved
      - app/Actions/Releases/CloseStep.php

      ## Steps
      1. `handle(ReleaseStep $step, array $values, User $actor): ReleaseStep`, interamente dentro `DB::transaction`
      2. Lock sulla riga della release: `Release::query()->whereKey(...)->lockForUpdate()->firstOrFail()`
      3. Rilettura dello step dentro la transazione con i campi in eager loading — lo stato del chiamante e di un
         istante prima. Nessuna query per campo, qualunque sia la lunghezza del form
      4. Rifiuti, nell'ordine: release conclusa, step non attivo (`StepIsNotOpen`); valori non validi contro
         `closingRules()` (`StepValuesAreInvalid` con il `MessageBag`)
      5. Scrittura dei valori normalizzati sui campi dello snapshot
      6. Chiusura in **compare-and-swap**: un solo `update()` condizionato a `status = attivo` che scrive
         `completato`, `completed_by` e `completed_at`. Zero righe aggiornate significa che un'altra transazione e
         passata prima: `StepAlreadyClosed`, rollback, nessun evento
      7. Attivazione del successivo da `nextStep()`, anch'essa condizionata a `status = bloccato`. Nessun
         successivo: `ReleaseCompletionIsNotAvailableYet` (US-006), con la transazione annullata
      8. Due eventi: `step_completato` (posizione, nome, numero di campi compilati) e `step_attivato` (posizione,
         nome, responsabile). **Non** i valori: vivono sui campi, e duplicarli darebbe due fonti per lo stesso dato
      9. Commentare **perche** lock e compare-and-swap coesistono: su SQLite `lockForUpdate()` non produce SQL (la
         grammatica non supporta `FOR UPDATE`), quindi la garanzia effettiva e l'update condizionato — che e
         l'alternativa prevista dall'invariante 3 del PRD; il lock serve su MySQL e PostgreSQL, dove il vincolo di
         portabilita impone che il codice resti corretto. Senza il commento, una revisione futura toglierebbe quella
         che sul proprio motore sembra inutile
      10. Nessuna lettura di `step_definitions`, `field_definitions`, `workflow_templates` o
          `project_role_assignments`: l'esecuzione legge solo lo snapshot
      11. `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Chiusura, attivazione del successivo e due eventi in una sola transazione
      - [ ] Compare-and-swap sullo stato: il secondo invio e rifiutato e non produce ne avanzamento ne evento
      - [ ] Il ramo dell'ultimo step rifiuta con `ReleaseCompletionIsNotAvailableYet`
      - [ ] Nessuna query sulle tabelle di definizione
      - [ ] Costo in query indipendente dal numero di campi dello step

      ## Test Data
      - N/A — nessuna modifica a schema, modelli o dati

      ## Git Deliverables
      - Commit: `feat(US-005): TASK-05 chiusura dello step e avanzamento in una transazione`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornamento della descrizione locale
