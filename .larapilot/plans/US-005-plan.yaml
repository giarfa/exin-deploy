    id: TASK-04
    title: 'Eccezioni di dominio della chiusura e Policy dello step'
    body: |-
      ## Description
      Introdurre le eccezioni che descrivono i rifiuti dell'avanzamento e la Policy che decide chi puo compilare e
      chiudere. Ogni rifiuto ha la propria eccezione e il proprio messaggio: un errore unico costringerebbe chi
      chiude a indovinare quale delle cinque situazioni lo sta bloccando, come gia deciso in US-004 per l'avvio.

      ## Files Involved
      - app/Exceptions/StepIsNotOpen.php
      - app/Exceptions/StepValuesAreInvalid.php
      - app/Exceptions/StepAlreadyClosed.php
      - app/Exceptions/ReleaseCompletionIsNotAvailableYet.php
      - app/Policies/ReleaseStepPolicy.php
      - lang/it/releases.php

      ## Steps
      1. `StepIsNotOpen` — release conclusa, step bloccato o gia completato, con costruttori nominati che
         distinguono i tre casi
      2. `StepValuesAreInvalid` — porta il `MessageBag` prodotto dalla validazione, cosi che il componente renda gli
         stessi messaggi senza rivalidare (due validazioni divergerebbero)
      3. `StepAlreadyClosed` — sollevata quando l'update condizionato non trova piu lo step attivo: e il doppio
         invio, non un errore dell'utente, e il messaggio lo dice
      4. `ReleaseCompletionIsNotAvailableYet` — ramo terminale della catena. Il PHPDoc dichiara che US-006 (FR-017)
         sostituisce il `throw` con la conclusione, e perche rifiutare e preferibile a lasciare una release
         `in_corso` senza step attivo — violerebbe l'invariante che questa spec deve dimostrare
      5. `ReleaseStepPolicy`: `view` (responsabile o amministratore, qualunque stato), `fill` e `close`
         (responsabile o amministratore **e** step attivo di release in corso). `fill` e `close` in `NOT_FILTERED`
         fuori dal filtro `before()`, come `delete` su `ReleasePolicy`: il vincolo dello step attivo vale anche per
         un amministratore
      6. Messaggi in `lang/it/releases.php`, nel blocco della chiusura
      7. `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Quattro eccezioni di dominio, ciascuna con il proprio messaggio
      - [ ] `ReleaseStepPolicy` nega `fill` e `close` su step bloccato o completato anche all'amministratore
      - [ ] Il PHPDoc di `ReleaseCompletionIsNotAvailableYet` dichiara il confine con US-006
      - [ ] Nessun messaggio incastonato nel codice

      ## Test Data
      - N/A — nessuna modifica a schema, modelli o dati

