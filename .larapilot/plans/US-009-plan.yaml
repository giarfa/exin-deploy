    id: TASK-01
    title: "Apre l'elenco alle persone e registra la rotta"
    type: Impl
    status: DONE
    dependencies:
      - TASK-00
    body: |-
      ## Description
      Apre `ReleasePolicy::viewAny()` a ogni membro autenticato, registra la rotta `/rilasci` e
      promuove la voce di navigazione da "in arrivo" a collegamento reale. La decisione su `viewAny`
      era esplicitamente rinviata a questa spec da `.ai/rules/policies.md`: la ragione e la stessa
      gia scritta per `view()` — senza notifiche, sapere dove sono ferme le release e la funzione
      dello strumento, non un privilegio.

      Il componente nasce qui nella sua forma minima (intestazione e contenitore) perche la rotta
      non puo puntare al nulla; contenuto e filtri arrivano in TASK-03.

      ## Files Involved
      - app/Policies/ReleasePolicy.php
      - routes/web.php
      - resources/views/components/releases/⚡index.blade.php (nuovo)
      - resources/views/components/layouts/app.blade.php
      - resources/views/components/nav/planned.blade.php (rimozione, se non piu usato)
      - lang/it/releases.php

      ## Steps
      1. `viewAny()` torna `true`; riscrivi il blocco di documentazione: la domanda a cui l'elenco
         risponde, perche e aperta come `view()`, e cosa **resta** chiuso (`create` ai soli
         amministratori tramite il filtro `before()`, `delete` a nessuno).
      2. Registra `Route::livewire('/rilasci', 'releases.index')->can('viewAny', Release::class)->name('releases.index')`
         **prima** di `/rilasci/{release}`, con il commento che spiega perche qui il `->can()` c'e —
         nessun tentativo da registrare, quindi vale la protezione a due livelli.
      3. Componente minimo con `Gate::authorize('viewAny', Release::class)` al montaggio: secondo
         livello dopo il middleware, come su tutte le altre schermate.
      4. Sostituisci `<x-nav.planned icon="rocket-launch">` con una `flux:navlist.item` verso
         `releases.index`, con `:current="request()->routeIs('releases.index')"` — **non**
         `releases.*`, altrimenti il dettaglio di una release marcherebbe la voce come corrente
         mentre l'elenco non e aperto.
      5. `grep -rn "nav.planned" resources/` — se non resta alcun uso, elimina il componente:
         nessuna sezione del prodotto e piu "in arrivo", e un componente senza chiamanti e codice
         morto. Se un uso resta, lascialo e annotalo.
      6. `php artisan larapilot:quality --fix`, poi `php artisan test --filter=Release`

      ## Completion Criteria
      - [x] Un membro non amministratore raggiunge `/rilasci`; un utente anonimo viene rediretto al login
      - [x] La voce "Release" della sidebar non e piu marcata "in arrivo"
      - [x] `delete` resta negata a chiunque
      - [x] Pint e Larastan (livello 5) passano

      ## Test Data
      - N/A — nessuna modifica di modelli o schema

      ## Git Deliverables
      - Commit: `feat(US-009): TASK-01 apre l'elenco delle release e registra la rotta`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
    commit:
