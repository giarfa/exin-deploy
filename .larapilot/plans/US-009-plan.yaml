    id: TASK-05
    title: 'Copertura della schermata e delle autorizzazioni'
    type: Test
    status: TODO
    dependencies:
      - TASK-04
    body: |-
      ## Description
      Copertura funzionale dell'elenco e della Policy che lo apre.

      ## Files Involved
      - tests/Feature/Releases/ReleaseIndexScreenTest.php (nuovo)
      - tests/Feature/Releases/ReleasePolicyTest.php
      - tests/Feature/Releases/SnapshotIsolationTest.php

      ## Steps
      1. Usa le factory esistenti (`ReleaseFactory`, `ReleaseStepFactory`) — nessuna definizione
         duplicata nel test. Ricorda che `completed_at`/`completed_by` **non** sono assegnabili in
         massa: negli scenari a mano serve `forceFill()`, oppure gli stati di factory
         (`.ai/rules/tests.md`).
      2. Casi: sezione in corso con step corrente e responsabile in attesa; sezione conclusa con
         autore e istante della consegna; filtro per stato nei tre valori; filtro per progetto;
         ordinamento dalle piu recenti; stato vuoto; accesso concesso a un membro non
         amministratore; utente anonimo rediretto al login.
      3. Nessun limite implicito di data: una release conclusa con `completed_at` di due anni fa
         compare comunque nello storico. E il criterio piu facile da rompere con un `where` di
         comodo, e il piu difficile da accorgersi che si e rotto.
      4. `ReleasePolicyTest`: `viewAny` ora concessa a un membro; `delete` resta negata anche a un
         amministratore.
      5. `SnapshotIsolationTest`: la resa dell'elenco non interroga `step_definitions`,
         `field_definitions` ne `project_role_assignments` — asserzione sulla pagina resa, non su una
         query scritta nel test.
      6. `php artisan test --filter=ReleaseIndexScreen` e `--filter=ReleasePolicy`

      ## Completion Criteria
      - [ ] Tutti i criteri di accettazione funzionali hanno un test
      - [ ] I test passano

      ## Git Deliverables
      - Commit: `test(US-009): TASK-05 copertura dell'elenco delle release`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
  -
    id: TASK-06
    title: "Budget di query dell'elenco"
    type: Test
    status: TODO
    dependencies:
      - TASK-05
    body: |-
      ## Description
      L'elenco carica per ogni riga il progetto, lo step corrente, il suo responsabile, la lunghezza
