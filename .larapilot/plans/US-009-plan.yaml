      url: null
  -
    id: TASK-03
    title: "Schermata dell'elenco con filtri per stato e progetto"
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Description
      Il contenuto della schermata: due sezioni — in corso e concluse — con filtri per stato e per
      progetto persistiti nell'indirizzo, e una tabella che sotto 1024 px diventa card impilate.

      ## Files Involved
      - resources/views/components/releases/⚡index.blade.php
      - lang/it/releases.php

      ## Steps
      1. Proprieta `#[Url] public string $stato = 'tutte'` e `#[Url] public ?string $progetto = null`;
         `updated*` che non richiedono altro stato da azzerare (nessuna paginazione).
      2. Proprieta calcolata *in corso*: `Release::inProgress()->forProject($this->progetto)` con
         `with(['project', 'activeStep' => fn ($q) => $q->withActivationInstant()->with('assignedUser')])`
         e `withCount('steps')`, ordinata `started_at desc`. **Attenzione all'ordine delle
         aggiunte**: `withActivationInstant()` ridefinisce la select (vedi
         `.ai/rules/components-releases.md`), quindi va applicato prima di ogni altra addizione sullo
         step; il `withCount` sta sulla release e non sullo step.
      3. Proprieta calcolata *concluse*: `Release::completed()->forProject(...)` con `project` e
         `completedBy`, ordinata `completed_at desc`.
      4. Una release in corso senza step attivo e un dato incoerente: rendi la riga **senza**
         nascondere la release e scrivi una riga di `Log::warning`, come fa "i miei step" — su uno
         strumento che esiste perche nulla resti fermo in silenzio, una release sparita dall'elenco
         senza traccia sarebbe il difetto peggiore.
      5. Filtro progetto: `flux:select` con i soli progetti che hanno almeno una release (una query
         distinta, non l'anagrafica intera: un progetto senza rilasci filtrerebbe verso il vuoto).
      6. Tabella semantica unica per sezione: `<caption class="sr-only">`, `<th scope="col">`,
         `data-label` su ogni cella e utility `max-lg:` che impilano (`max-lg:block` su
         `table/tbody/tr/td`, `max-lg:hidden` su `thead`, `max-lg:before:content-[attr(data-label)]`).
         Nessun `overflow-x`: niente deve poter scorrere in orizzontale.
      7. Stato reso con **icona e parola**, mai dal solo colore. Colonne: in corso — progetto,
         etichetta, stato, step corrente (`n di m`), in attesa di (con da quanto), avviata;
         concluse — progetto, etichetta, stato, consegnata da, conclusa, durata
         (`started_at->diffForHumans($completed_at, absolute)`).
      8. Stati vuoti espliciti e distinti per sezione e per filtro attivo: dire "nessun risultato"
         senza dire quale filtro lo produce lascia senza sapere cosa cambiare.
      9. Il progetto della riga e il collegamento al dettaglio; sotto 1024 px il bersaglio deve
         essere di almeno 44x44 px.
      10. Testi in `lang/it/releases.php` con prefisso `index_`. Verifica a 375, 768 e 1280 px.
      11. `php artisan larapilot:quality --fix`, poi `php artisan test --filter=Release`

      ## Completion Criteria
      - [x] Le due sezioni mostrano quanto chiede il criterio di accettazione
      - [x] Filtri per stato e per progetto funzionanti e persistiti nell'indirizzo
      - [x] Ordinamento dalle piu recenti alle piu vecchie in entrambe le sezioni
      - [x] Card impilate sotto 1024 px, tabella sopra, nessuno scroll orizzontale a 375/768/1280 px
      - [x] Pint e Larastan (livello 5) passano

      ## Test Data
      - N/A — nessuna modifica di modelli o schema

      ## Git Deliverables
      - Commit: `feat(US-009): TASK-03 schermata dell'elenco delle release con filtri`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
