      short_sha: 990ad16
      subject: "feat(US-009): TASK-03 schermata dell'elenco delle release con filtri"
      committed_at: '2026-08-14T00:05:59+02:00'
      url: null
  -
    id: TASK-04
    title: "Riporta le briciole del dettaglio all'elenco"
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Description
      US-008 apre le briciole del dettaglio su "i miei step" in **deroga dichiarata** al mockup,
      motivata dal fatto che l'elenco non esisteva ancora e che la pagina dei progetti e riservata
      agli amministratori. Ora l'elenco esiste ed e aperto a ogni membro: la deroga cade, e va
      rimosso anche il commento che la annunciava — un commento che promette un cambiamento gia
      avvenuto e peggio di nessun commento.

      ## Files Involved
      - resources/views/components/releases/⚡show.blade.php
      - lang/it/releases.php

      ## Steps
      1. Prima briciola verso `releases.index`, etichetta "Release"; sostituisci la chiave
         `detail_breadcrumb_my_steps` con `detail_breadcrumb_releases` (rimuovendo la vecchia: una
         chiave senza chiamanti e testo morto).
      2. Riscrivi il commento sopra le briciole: non piu la deroga, ma il percorso ora completo.
      3. Verifica che il ritorno dopo l'avvio di una release (`⚡start.blade.php`) non resti un
         vicolo cieco per un amministratore; se manca il rientro all'elenco, aggiungilo.
      4. `php artisan larapilot:quality --fix`, poi `php artisan test --filter=ReleaseDetail`

      ## Completion Criteria
