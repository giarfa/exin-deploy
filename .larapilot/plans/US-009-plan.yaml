  -
    id: TASK-02
    title: "Scope di lettura per l'elenco e per lo storico"
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Description
      Aggiunge a `Release` gli scope che l'elenco interroga, accanto a `inProgress()` e
      `involving()` che gia esistono: `completed()` per lo storico e `forProject()` per il filtro.
      Cosa significhi "conclusa" resta deciso in un posto solo, come gia per "in corso".

      Nessuna migrazione: `releases.status` e gia indicizzato e `unique(['project_id','label'])`
      copre il solo `project_id` come suo prefisso — la migrazione di US-004 lo dichiara nel proprio
      commento, citando proprio gli elenchi filtrati di questa spec. Il criterio di accettazione e
      gia soddisfatto; qui si aggiunge la verifica che nessuna migrazione futura lo tolga in
      silenzio.

      ## Files Involved
      - app/Models/Release.php
      - tests/Feature/Releases/ReleaseSchemaConstraintsTest.php

      ## Steps
      1. `#[Scope] completed(Builder $query)` — simmetrico a `inProgress()`, con il commento che
         dice perche non e una condizione scritta a mano nella schermata.
      2. `#[Scope] forProject(Builder $query, ?string $projectId)` — filtro inerte quando l'argomento
         e `null`, cosi che la schermata non debba costruire la query in due rami.
      3. Estendi `ReleaseSchemaConstraintsTest` con l'asserzione sulla presenza degli indici
         `releases.status` e del prefisso `project_id`, letta da `Schema::getIndexes('releases')` —
         nessuna funzione specifica di SQLite (vincolo permanente 1).
      4. `php artisan larapilot:quality --fix`, poi `php artisan test --filter=ReleaseSchemaConstraints`

      ## Completion Criteria
      - [x] `Release::completed()` e `forProject()` disponibili e documentati
      - [x] Il test di schema verifica entrambi gli indici richiesti dal criterio di accettazione
      - [x] Pint e Larastan (livello 5) passano

      ## Test Data
      - N/A — nessuna modifica di schema. `ReleaseFactory::completed()` copre gia lo stato concluso.

      ## Git Deliverables
      - Commit: `feat(US-009): TASK-02 scope di lettura dell'elenco e verifica degli indici`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
    commit:
