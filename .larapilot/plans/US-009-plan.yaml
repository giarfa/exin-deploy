code: US-009
plan_body: |-
  ## Soluzione tecnica

  L'elenco delle release e la terza superficie operativa dopo "i miei step" (US-007) e il
  dettaglio (US-008), e chiude la navigazione: oggi la voce "Release" della sidebar e ancora
  marcata "in arrivo" e il dettaglio apre le briciole su "i miei step" in deroga dichiarata al
  mockup. Questa spec sostituisce entrambe le cose.

  **Componente** — `resources/views/components/releases/⚡index.blade.php`, Livewire in file
  singolo come tutte le altre schermate, sulla rotta `/rilasci` (`releases.index`). Il plurale
  nomina la collezione, come `/progetti` e `/membri`; `/rilasci/{release}` resta il dettaglio.

  **Autorizzazione** — `ReleasePolicy::viewAny()` passa da `false` a **aperta a ogni utente
  autenticato**, come gia `view()`. La decisione era esplicitamente rinviata a questa spec
  (`.ai/rules/policies.md`): ora la schermata esiste, e la sua ragione e la stessa del
  dettaglio — lo strumento non invia notifiche (rischio accettato n.1 del PRD), quindi sapere
  dove sono ferme le release non e un privilegio ma la funzione del prodotto. `delete` resta
  negata a chiunque. La rotta porta il `->can()` sul middleware: qui non c'e alcun tentativo da
  registrare nel registro, quindi vale la protezione a due livelli e non la deroga di
  `/step/{releaseStep}` (vincolo permanente 12 del README).

  **Lettura** — due query di dominio, una per sezione, entrambe sullo snapshot:

  - *In corso*: `Release::inProgress()` con `project`, `activeStep.assignedUser` e
    `withCount('steps')` in eager loading; lo step attivo porta `withActivationInstant()` per
    dire da quanto il flusso e fermo. Ordinamento `started_at desc`.
  - *Concluse*: `Release::completed()` con `project` e `completedBy`; ordinamento
    `completed_at desc`. Nessun limite di data: lo storico e consultabile a tempo indeterminato.

  Le due sezioni hanno **colonne diverse** perche rispondono a domande diverse — la prima "chi
  stiamo aspettando", la seconda "chi ha consegnato e quando": e la forma del mockup, non una
  duplicazione.

  **Ordinamento** — "dalle piu recenti alle piu vecchie" ha due letture a seconda della
  sezione: una release in corso e recente se e stata **avviata** da poco, una conclusa se e
  stata **consegnata** da poco. Ordinare entrambe su `started_at` metterebbe in cima allo
  storico un rilascio avviato a marzo e chiuso ieri, sotto uno avviato e chiuso ad aprile.

  **Indici** — `releases.status` e gia indicizzato e `unique(['project_id','label'])` copre il
  solo `project_id` come prefisso: il criterio di accettazione e soddisfatto dalla migrazione di
  US-004, che lo dichiara nel proprio commento. Nessuna nuova migrazione; un test di schema
  verifica la presenza di entrambi gli indici, cosi che una migrazione futura non li tolga in
  silenzio.

  **Responsive** — tabella semantica unica con `max-lg:` che la impila in card sotto 1024 px
  (`thead` nascosto, celle a blocco, etichetta resa da `before:content-[attr(data-label)]`),
  esattamente come `.exd-table` del mockup. Nessuna duplicazione del contenuto in due alberi
  DOM: una sola tabella, nessuno scroll orizzontale a nessun breakpoint, e la soglia resta
  l'unica dell'applicazione (vincolo permanente 4).

  ## Decisioni

  **Filtri nella barra dell'indirizzo, non nello stato del componente.** `#[Url]` su `stato` e
  `progetto`: un elenco filtrato deve essere condivisibile e ricaricabile: e la vista che una
  persona incolla in chat per dire "guarda qui". Costa due parametri in piu nella query string.

  **Tre valori di stato, non due.** `tutte` (predefinito), `in_corso`, `conclusa`. Il mockup
  mostra entrambe le sezioni con "In corso" premuto, cioe un filtro che nasconde l'altra
  sezione e non un interruttore fra due schermate: senza il terzo valore non esisterebbe il
  ritorno alla vista d'insieme.

  **Nessuna paginazione.** Lo storico cresce di qualche riga a settimana su un team interno, e
  un paginatore su due sezioni indipendenti nella stessa pagina introdurrebbe due parametri di
  pagina e due stati vuoti. Il costo di lettura e comunque vincolato da un test a **non
  dipendere dal numero di release**. Quando lo storico superera l'ordine delle centinaia, la
  sezione conclusa va paginata: e la stessa soglia oltre la quale l'ordinamento di "i miei
  step" va spostato in SQL (nota nel piano di US-007).

  **Nessun comando "Avvia una release" in cima.** Il mockup lo mostra, ma l'avvio si decide su
  un progetto (`/progetti/{project}/rilascio`) e un comando senza progetto non porta da nessuna
  parte. Deroga dichiarata, come quella che questa spec rimuove dal dettaglio.

  ## Git & Branching

  - Mode: `GITFLOW` (nessun push automatico)
  - Precondizione: US-008 e approvata ma non ancora integrata in `develop` — TASK-00 la integra
    prima di ramificare, altrimenti il ramo di US-009 nascerebbe senza il dettaglio della release
    che questa spec collega
  - Branch: `feature/US-009-elenco-storico-release` da `develop`
  - Un solo commit per task, Conventional Commits con codice spec e task
  - PR verso `develop` preparata localmente; nessun push finche l'utente non lo chiede
  - Merge in `develop` solo dopo approvazione umana in `/larapilot-review`

  ## Strategia dei dati di prova

  - Nessuna modifica di schema: nessuna nuova factory. `ReleaseFactory::completed()` gia
    produce release concluse con autore e istante della consegna; `ReleaseStepFactory` ha gli
    stati `blocked()` e `completed()`.
  - Lo scenario dimostrativo (release a meta catena e release conclusa nel seeder) appartiene a
    US-011 e **non** viene anticipato qui: l'elenco si verifica con le factory nei test.
  - `php artisan migrate:fresh --seed` deve continuare a completare senza errori.

  ## Strategia di test

  - Bar: `NORMAL` — Pest/PHPUnit feature, unit e policy. Nessun Playwright, Dusk o suite di
    viewport: la conformita responsive si verifica a mano ai tre breakpoint e si annota nel
    passaggio in revisione.
  - `ReleaseIndexScreenTest` — contenuto delle due sezioni, filtri per stato e per progetto,
    ordinamento predefinito, stati vuoti, accesso di un membro non amministratore, rifiuto
    all'utente anonimo.
  - `ReleasePolicyTest` — `viewAny` ora concessa a ogni membro; `delete` resta negata a
    chiunque, amministratori inclusi.
  - `ReleaseIndexQueryBudgetTest` — stesso costo con una e con dieci release per sezione.
  - `ReleaseSchemaConstraintsTest` — presenza degli indici su `status` e `project_id`.
  - `SnapshotIsolationTest` — l'elenco non legge `step_definitions`, `field_definitions` ne
    `project_role_assignments`.

  ## Verifica manuale (handoff)

  1. `php artisan migrate:fresh --seed`, accedi come membro non amministratore: la voce
     "Release" della sidebar non e piu "in arrivo" e apre l'elenco.
  2. A 375, 768 e 1280 px: sotto 1024 px le righe sono card impilate, sopra una tabella;
     nessuno scroll orizzontale a nessuna delle tre larghezze.
  3. Filtra per stato e per progetto, ricarica la pagina: i filtri sopravvivono perche vivono
     nell'indirizzo.
