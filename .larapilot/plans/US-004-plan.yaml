      2. Un `member` riceve 403 sulla rotta di avvio e 403 sull'azione Livewire invocata direttamente; un
         amministratore avvia
      3. Flusso completo dall'interfaccia: etichetta valida, release creata, conferma che mostra la catena congelata
         con responsabili e stati
      4. Etichetta mancante e duplicata rifiutate in validazione, senza release create
      5. Progetto non avviabile: il comando e disabilitato e il motivo compare; l'azione invocata comunque rifiuta con
         messaggio e non con un errore non gestito
      6. `ReleasePolicy`: `delete` negato anche all'amministratore
      7. `php artisan test --compact --filter=Release`

