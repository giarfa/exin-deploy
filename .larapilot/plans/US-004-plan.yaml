    title: 'Test: snapshot congelato, precondizioni rifiutate ed evento di avvio'
    body: |-
      ## Description
      Copertura dei criteri di accettazione dell'avvio. Il test dello snapshot e quello che vale la spec: dimostra che
      modificare il template dopo l'avvio non tocca la release, che e il motivo per cui esistono tabelle separate.

      ## Files Involved
      - tests/Feature/Releases/StartReleaseTest.php
      - tests/Feature/Releases/SnapshotIsolationTest.php

      ## Steps
      1. Usare le factory esistenti di template, step, campi, progetti e mappature: nessun dato costruito a mano
      2. Avvio riuscito: step e campi copiati uno a uno (posizione, nome, istruzioni, etichetta, tipo, obbligatorieta,
         testo di aiuto), responsabile risolto su ogni step, primo step `attivo` e tutti gli altri `bloccato`, release
         `in_corso`; **esattamente uno** step attivo
      3. Snapshot congelato: dopo l'avvio rinominare uno step, riordinarne due, cancellarne uno, cambiare etichetta e
         obbligatorieta di un campo, rinominare il ruolo e disattivare il template — la release conserva numero,
         ordine, testi, campi e responsabili
      4. Precondizioni, un test per criterio, ciascuna con messaggio esplicito e **nessuna riga scritta** (release,
         step, campi ed eventi restano a zero): progetto senza template, template senza step, template disattivato,
         ruolo previsto senza responsabile, responsabile disattivato, progetto disattivato
      5. Etichetta: obbligatoria; duplicata sullo stesso progetto rifiutata; uguale su un altro progetto ammessa
      6. Registro: l'avvio scrive un solo evento `release_avviata` con attore, istante e riferimento alla release
      7. `php artisan test --compact --filter=Release`

      ## Completion Criteria
      - [ ] Copia verificata campo per campo, non solo per conteggio
      - [ ] Modifiche al template dopo l'avvio non alterano la release
      - [ ] Ogni precondizione ha il proprio test, con rifiuto esplicito e nessuna scrittura parziale
