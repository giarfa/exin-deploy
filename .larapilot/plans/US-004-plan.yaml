      1. `php artisan make:policy ReleasePolicy --model=Release --no-interaction`
      2. Struttura come `ProjectPolicy` e `WorkflowTemplatePolicy`: filtro `before()` che concede
         all'amministratore, costante `NOT_FILTERED` con `delete` fuori dal filtro. Ability `create(User $user,
         Project $project)`; i metodi di consultazione (`viewAny`, `view`) restano negati e verranno aperti da US-008 e
         US-009, con il PHPDoc che lo dice
      3. PHPDoc su `delete()`: una release non si cancella per nessuno, amministratori inclusi — portarsela via
         significa portarsi via lo storico che lo strumento accumula, cioe il valore del prodotto
      4. Rotta `/progetti/{project}/rilascio`, nome `releases.start`, componente `releases.start`, protetta con
         `->can('create', [Release::class, 'project'])`; commento sul doppio livello, come sulle rotte esistenti
      5. Nessuna modifica alla navigazione: la voce **Release** resta `x-nav.planned` perche la pagina che promette e
         l'elenco (US-009); annotarlo a commento accanto alla voce cosi che non sembri una dimenticanza
      6. Pint, `larapilot:quality`, `php artisan test --compact`

