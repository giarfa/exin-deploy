code: US-004
plan_body: |-
  ## Technical Solution

  Prima spec di **esecuzione**: fin qui il repo conteneva solo configurazione. Questa spec introduce le tabelle
  di **istanza** e la Action che le riempie congelando la definizione, cioe il punto su cui poggia tutto il resto
  dell'epica EP-003.

  Valgono da subito le due regole gia scritte in `.ai/rules/app.md`: la release legge solo il proprio snapshot, e
  l'avanzamento vive in una sola transazione. Qui si consegna la prima meta della prima regola (la copia) e la
  prima transizione (il primo step attivo); chiusura e avanzamento sono di US-005.

  **Entita introdotte**

  | Entita | Tabella | Contenuto |
  | --- | --- | --- |
  | `Release` | `releases` | progetto, etichetta, stato, template di origine, autore e istante di avvio |
  | `ReleaseStep` | `release_steps` | copia dello step: posizione, nome, istruzioni, ruolo congelato, responsabile risolto, stato |
  | `ReleaseStepField` | `release_step_fields` | copia del campo: etichetta, tipo, obbligatorieta, posizione, aiuto, valore |
  | `ReleaseEvent` | `release_events` | registro in sola aggiunta: release, step, attore, azione, dati, istante |

  Tutte con chiave primaria UUID (`HasUuids`), `#[Fillable]` con le sole colonne previste, cast dichiarati anche in
  PHPDoc perche Larastan deduce il tipo dalla colonna e non dal cast — stessa disciplina di `User` e `Project`.

  **Cosa viene congelato, e cosa resta un riferimento vivo.** La distinzione e il cuore della spec e va decisa una
  volta sola, non caso per caso in US-005 e US-008:

  - **Congelato in colonna** — tutto cio che descrive la *forma* del processo: nome dello step, istruzioni,
    posizione, etichetta / tipo / obbligatorieta / testo di aiuto di ogni campo, e il **nome del ruolo**
    (`release_steps.role_name`). Rinominare o disattivare un ruolo dopo l'avvio non deve cambiare come si legge
    una release gia partita.
  - **Riferimento vivo** — l'*identita* delle persone e del progetto: `assigned_user_id`, `started_by`,
    `project_id`. Un membro che cambia cognome deve comparire con il nome corrente anche sulle release passate;
    i membri non si cancellano mai, quindi il riferimento non si rompe.
  - `release_steps.role_id` resta come chiave esterna **accanto** al nome congelato, e non in sua sostituzione:
    serve solo a rendere il ruolo non cancellabile (`restrictOnDelete` piu `Role::REFERENCING_RELATIONS`, che il
    PHPDoc di `Role` indica gia come punto di estensione di questa spec). Nessun percorso di esecuzione lo
    dereferenzia per leggere il nome.
  - `releases.workflow_template_id` e provenienza, non dipendenza: serve a dire da quale processo la release
    deriva (FR-022 lo mostrera, Should, fuori MVP). Nessuna lettura di `step_definitions` o `field_definitions`
    dopo l'avvio.

  Il criterio "il codice di esecuzione non legge le tabelle di definizione" e verificato da un test che ascolta le
  query e fallisce se ne compare una su `workflow_templates`, `step_definitions`, `field_definitions` o
  `project_role_assignments`.

  **Lo snapshot non si riordina.** `release_steps.position` e `release_step_fields.position` sono
  `unsignedInteger` e **non** usano `App\Models\Concerns\OrderedByPosition`: quel concern esiste per rinumerare
  una sequenza modificabile, e le posizioni negative temporanee servivano solo a quello. Qui la sequenza e
  immutabile per definizione, e la differenza di tipo rispetto a `step_definitions.position` e il segnale che lo
  dice a chi legge lo schema. L'unicita `(release_id, position)` e `(release_step_id, position)` resta applicata
  dallo schema.

  **Colonne create ora e riempite dopo.** `release_steps.completed_by` / `completed_at`,
  `releases.completed_by` / `completed_at` e `release_step_fields.value` nascono qui, nullable e non scritte.
  Scelta dichiarata: l'entita e definita una volta sola nel PRD (`## Modello dati`), e crearla monca costringerebbe
  US-005 e US-006 a una migrazione di sola aggiunta di colonne su tabelle appena create. Il PHPDoc di ciascun
  modello dice quale spec da significato a quelle colonne.

  `value` e **una** colonna `text` nullable per tutti e quattro i tipi di campo, non quattro colonne tipizzate: la
  semantica di lettura e scrittura per tipo (URL valido, conferma spuntata) e di US-005, come gia dichiarato nel
  PHPDoc di `App\Enums\FieldType`.

  **Enum di stato.** Due enum nativi con chiavi TitleCase e valori italiani stabili in colonna, sulla convenzione di
  `UserLevel` e `FieldType`:

  | Enum | Casi | Valore in colonna |
  | --- | --- | --- |
  | `ReleaseStatus` | `InProgress`, `Completed` | `in_corso`, `conclusa` |
  | `ReleaseStepStatus` | `Blocked`, `Active`, `Completed` | `bloccato`, `attivo`, `completato` |
  | `ReleaseEventAction` | `ReleaseStarted`, `StepCompleted`, `StepActivated`, `ReleaseCompleted`, `UnauthorizedAttempt` | `release_avviata`, `step_completato`, `step_attivato`, `release_conclusa`, `tentativo_non_autorizzato` |

  `ReleaseEventAction` nasce con il vocabolario **completo** di FR-016 anche se questa spec scrive solo
  `release_avviata`: sono i valori che finiscono in colonna e sopravvivono nello storico, quindi vanno decisi una
  volta, non rinominati in US-005 quando esistono gia righe scritte. Colonne `string` con cast, mai `$table->enum`:
  lo stesso motivo di portabilita di US-003.

  **Action `App\Actions\Releases\StartRelease`.** Unico percorso di avvio, invocato dal componente Livewire e dai
  test. Firma `handle(Project $project, string $label, User $actor): Release`, tutto dentro una `DB::transaction`:

  1. Precondizioni, nell'ordine, ciascuna con la propria eccezione di dominio e un messaggio che dice **cosa**
     manca (mai un generico "impossibile avviare"):
     - progetto disattivato — `Project::active()` dichiara gia nel suo PHPDoc di essere il filtro dei progetti su
       cui si avviano release;
     - nessun template associato, template disattivato o senza step — decisi da `WorkflowTemplate::isUsable()` e
       `unusableReason()`, scritti in US-003 **proprio** per essere invocati qui: la regola non viene riscritta;
     - ruoli previsti dagli step senza responsabile sul progetto — da `Project::uncoveredRoles()`, che nomina i
       ruoli scoperti;
     - responsabile disattivato. **Estensione dichiarata oltre la lettera del criterio di accettazione**: un
       membro disattivato non accede allo strumento, quindi il suo step non sarebbe chiudibile da nessuno tranne
       un amministratore e la release nascerebbe ferma. Stessa logica con cui `CreateProject` gia salta le
       predefinite disattivate e con cui la regola `AssignableUser` rifiuta l'assegnazione.
  2. Creazione della `Release` (`in_corso`, `started_by`, `started_at`).
  3. Copia degli step: un solo `insert()` di massa con UUID generati in PHP (`Str::uuid7()`, come `CreateProject`),
     posizione e nome dal template, `role_name` congelato, `assigned_user_id` risolto dalla mappatura del
     progetto, primo step `attivo` e tutti gli altri `bloccato`.
  4. Copia dei campi: un solo `insert()` di massa, che riusa gli UUID degli step gia generati.
  5. Scrittura dell'evento `release_avviata` con attore, istante e dati (etichetta, template di origine, numero di
     step congelati).

  Costo in query **costante** rispetto al numero di step e di campi: circa sei letture (progetto, template, step,
  campi, mappature, responsabili, precaricati con `with`) e quattro scritture. Un test lo verifica confrontando un
  template da due step con uno da cinque.

  **Concorrenza.** L'avvio non ha bisogno del lock pessimistico che `.ai/rules/app.md` impone all'avanzamento:
  non esiste stato preesistente da leggere e riscrivere. Il doppio invio e chiuso dall'unicita
  `(project_id, label)` a livello di schema; il secondo tentativo viola l'indice, la transazione torna indietro
  e il componente rende lo stesso messaggio della validazione, come `setAsDefault()` gia fa con la propria
  eccezione TOCTOU dopo la revisione di US-003.

  **Registro in sola aggiunta.** `ReleaseEvent` ha `const UPDATED_AT = null` (la tabella ha il solo `created_at`) e
  un guardiano sugli eventi `updating` / `deleting` che solleva `ReleaseEventIsAppendOnly`. La consultazione del
  registro, l'immutabilita verificata dall'interfaccia e la visibilita dei tentativi non autorizzati restano di
  **US-010**: qui si consegna la scrittura del primo evento e la garanzia strutturale che non sia modificabile.

  **Indici.** `unique(project_id, label)` — che serve anche da indice sui filtri per progetto, quindi un secondo
  indice su `project_id` sarebbe ridondante e il commento della migrazione lo dice, cosi che la revisione di US-009
  non lo legga come mancante — piu `index(status)` (US-009), `unique(release_id, position)`,
  `index(assigned_user_id, status)` per la vista "i miei step" (US-007), `index(role_id)` per il conteggio dei
  riferimenti di un ruolo, `index(release_id, created_at)` per la lettura cronologica del registro (US-010). Sono
  gli indici prescritti dall'invariante 5 del PRD, creati nella stessa migrazione dello schema.

  **Autorizzazione.** `ReleasePolicy` nuova, con il filtro `before()` per l'amministratore e `delete` fuori dal
  filtro (`NOT_FILTERED`) come `ProjectPolicy` e `WorkflowTemplatePolicy`: una release non si cancella per nessuno,
  e il PHPDoc spiega che portarsi via una release significa portarsi via lo storico. L'ability e
  `create(User $user, Project $project)` — l'oggetto della decisione e il progetto, perche la release non esiste
  ancora — autorizzata sulla rotta (`->can('create', [Release::class, 'project'])`) e di nuovo dentro l'azione
  Livewire, che non ripassa dal middleware.

  **Schermata.** Una sola, deliberatamente minima:

  | Rotta | Componente | Contenuto |
  | --- | --- | --- |
  | `/progetti/{project}/rilascio` | `releases.start` | etichetta, riepilogo delle precondizioni, avvio, conferma con la catena congelata |

  Il comando "Avvia una release" compare come azione di riga sull'elenco progetti, dove l'amministratore gia vede
  template associato e ruoli scoperti; quando il progetto non e avviabile il comando e disabilitato e accanto
  compare il motivo, invece di portare a una pagina che rifiuta. Dopo l'avvio la stessa pagina mostra in sola
  lettura la catena appena congelata — posizione, nome, ruolo, responsabile, stato — con stati resi da **icona e
  parola** e mai dal solo colore, secondo il contratto del mockup. E la prova visiva del criterio "primo step
  attivo, gli altri bloccati", non l'anticipazione del dettaglio release: elenco, filtri e storico sono di US-009,
  il dettaglio completo con valori e registro di US-008.

  La voce di navigazione **Release** resta `x-nav.planned`: la pagina che promette e l'elenco, che arriva con
  US-009. Trasformarla ora in un collegamento a una schermata di solo avvio direbbe il falso.

  **Fuori perimetro.** Compilazione e chiusura degli step, avanzamento e lock pessimistico (US-005); conclusione
  della release (US-006); "i miei step" (US-007); dettaglio release (US-008); elenco e storico (US-009);
  consultazione del registro (US-010); scenario dimostrativo con release a meta catena e conclusa (US-011, che si
  dichiara proprietario della composizione in `DatabaseSeeder`). Annullamento (FR-020) e riapertura (FR-019) sono
  Should rinviati dal PRD: nessuno stato `annullata` in `ReleaseStatus`, e nessun messaggio che lo lasci intendere.

  ## Git & Branching

  - Mode: `GITFLOW` (da `data.settings.git_mode`) — **nessun push automatico**
  - Branch: `feature/US-004-avvio-release-snapshot` da `develop`
  - TASK-00: bootstrap. `develop` e fermo al merge di US-002: i 22 commit di US-003, approvata in revisione umana,
    non sono ancora integrati, e questa spec copia proprio le tabelle che US-003 introduce. TASK-00 li integra con
    un merge esplicito e poi crea il branch
  - Per task: un solo commit atomico in Conventional Commits (`type(US-004): TASK-NN sommario`)
  - PR interna verso `develop`: titolo e corpo redatti e **tenuti in locale**; apertura remota e push solo su
    richiesta esplicita dell'utente in sessione
  - Merge in `develop` solo dopo approvazione umana in `/larapilot-review`
  - Prima di ogni `task-done`: `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`
    (Larastan livello 5) e suite verde

  ## Test Data Strategy

  - Factory per i quattro modelli introdotti, scritte **nello stesso task** di migrazione e modello:
    - `ReleaseFactory` — etichette di dominio (`v2.4.0`, `2026.08.1`), stati `completed()` e `for(Project)`;
    - `ReleaseStepFactory` — stati `active()`, `blocked()`, `completed()`, posizione progressiva coerente per
      release, `role_name` coerente con il ruolo collegato;
    - `ReleaseStepFieldFactory` — uno stato per ciascuno dei quattro tipi piu `optional()`, riusando le etichette
      di dominio gia adottate da `FieldDefinitionFactory`;
    - `ReleaseEventFactory` — azione `release_avviata` come predefinita, `payload` plausibile.
  - Nessun `lorem`: nomi di step, etichette e valori devono somigliare a un rilascio reale, come il catalogo di
    `RoleFactory` e `StepDefinitionFactory`.
  - **Seeder: nessuna modifica in questa spec.** Lo scenario dimostrativo di esecuzione — release a meta catena e
    release conclusa con registro popolato — e il perimetro esplicito di **US-011** ("qui si compone lo scenario in
    `DatabaseSeeder`"). Comporlo ora significherebbe scriverlo due volte, e senza la chiusura degli step (US-005)
    sarebbe comunque incompleto. Il dataset attuale basta a dimostrare questa spec: i due progetti seminati hanno
    template predefinito e mappatura completa, quindi una release si avvia dall'interfaccia subito dopo
    `migrate:fresh --seed`.
  - `php artisan migrate:fresh --seed` deve chiudere senza errori prima di ogni `task-done` che tocchi schema o
    modelli.

  ## Test Strategy

  - Bar: `NORMAL` (da `data.settings.testing`) — PHPUnit 12.5, nessun test browser, Dusk, Playwright o matrice di
    viewport. La verifica dell'interfaccia e consegnata come nota di handoff manuale
  - Test interlacciati con l'implementazione (TASK-04, TASK-06, TASK-07, TASK-10), non tutti alla fine
  - Percorsi coperti obbligatoriamente:
    1. **Vincoli di schema** scritti con `DB::table()`, aggirando modelli e validazione: unicita di
       `(project_id, label)` e di `(release_id, position)`, `restrict` su `role_id`, `assigned_user_id`,
       `project_id`, `cascade` da release a step e da step a campi
    2. **Registro in sola aggiunta**: `update()` e `delete()` sollevano; la tabella non ha `updated_at`
    3. **Snapshot congelato** (criterio esplicito): avviata la release si rinomina uno step, se ne riordinano due,
       se ne cancella uno, si cambia un campo, si disattiva il template — la release conserva step, ordine, campi,
       testi e responsabili
    4. **Isolamento dalle definizioni** (criterio esplicito): con `DB::listen`, nessuna query su
       `workflow_templates`, `step_definitions`, `field_definitions`, `project_role_assignments` mentre si legge
       una release avviata con la sua catena
    5. **Stato iniziale**: primo step `attivo`, tutti gli altri `bloccato`, release `in_corso`; esattamente uno
       step attivo per release
    6. **Precondizioni rifiutate**, una per criterio, ciascuna con messaggio esplicito e **nessuna scrittura
       parziale** (la transazione torna indietro): progetto senza template, template senza step, template
       disattivato, ruolo scoperto, responsabile disattivato, progetto disattivato
    7. **Etichetta**: obbligatoria, univoca per progetto (il duplicato e rifiutato in validazione **e** dallo
       schema), ammessa uguale su un altro progetto
    8. **Registro**: l'avvio scrive un evento `release_avviata` con attore, istante e riferimento alla release
    9. **Autorizzazione a due livelli**: un `member` riceve 403 sulla rotta e sull'azione Livewire di avvio;
       l'amministratore avvia
    10. **Query costanti**: avviare una release da un template con cinque step e quattordici campi non costa piu
        query di una da due step; la lettura della catena congelata non e proporzionale al numero di step
  - Nessuna API pubblica introdotta: nessun test di contratto, nessun OpenAPI (coerente con il PRD)

  ## Quality gate

  `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality` (Pint + Larastan livello 5) prima di
  ogni `task-done`, piu `php artisan test --compact`. Gli attributi con cast — stati, `payload`, istanti — vanno
  annotati in PHPDoc sui modelli: l'analisi statica non li deduce dalla colonna.
tasks:
  -
    id: TASK-00
    title: 'Integrare US-003 in develop e creare il branch di lavoro'
    body: |-
      ## Description
      Preparare Gitflow per questa spec. Il branch non puo essere creato dallo stato attuale di `develop`: US-003 e
      stata approvata in revisione umana ma i suoi 22 commit non sono mai stati integrati, quindi `develop` e fermo al
      merge di US-002 e non contiene template, step e campi — cioe esattamente le tabelle che questa spec deve copiare.

      ## Files Involved
      - (solo git — nessun file applicativo)

      ## Steps
      1. Verificare che l'albero di lavoro sia pulito (`git status --short`); committare il ledger Larapilot se presente
      2. `git checkout develop`
      3. `git merge --no-ff feature/US-003-template-workflow-step-campi -m "merge: integra US-003 template di workflow, step e campi richiesti"`
      4. `php artisan test --compact` su `develop` dopo il merge: l'integrazione non deve rompere la suite
      5. `git checkout -b feature/US-004-avvio-release-snapshot`
      6. Commit di ancoraggio del branch: `chore(US-004): TASK-00 bootstrap feature branch` (commit vuoto ammesso)
      7. Redigere titolo e corpo della PR interna verso `develop` e **tenerli in locale**: nessun push

      ## Completion Criteria
      - [x] `develop` contiene i commit di US-003 e la suite e verde su `develop`
      - [x] Il branch `feature/US-004-avvio-release-snapshot` esiste in locale e parte da `develop`
      - [x] Descrizione della PR interna redatta e tenuta in locale

      ## Test Data
      - N/A — nessuna modifica a schema, modelli o dati

      ## Git Deliverables
      - Commit: `chore(US-004): TASK-00 bootstrap feature branch` (piu il commit di merge su `develop`)
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: preparata in locale verso `develop`, apertura remota solo su richiesta esplicita
