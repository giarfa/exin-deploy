    id: TASK-02
    title: 'Snapshot della catena: ReleaseStep e ReleaseStepField'
    body: |-
      ## Description
      Le due tabelle che rendono possibile il congelamento. Copiano forma e testi della definizione e vi aggiungono cio
      che la definizione non sa: chi e il responsabile e a che punto e lo step.

      Il ruolo viene congelato **per nome** accanto alla chiave esterna: l'esecuzione legge `role_name`, mentre
      `role_id` serve solo a rendere il ruolo non cancellabile. `Role::REFERENCING_RELATIONS` indica gia questa spec
      come punto di estensione, e il suo PHPDoc avverte che chi la estende deve aggiungere la relazione anche ai
      `withCount()` degli elenchi che chiamano `usageLabel()` per riga, altrimenti il conteggio mancante diventa un N+1.

      ## Files Involved
      - app/Enums/ReleaseStepStatus.php
      - app/Models/ReleaseStep.php
      - app/Models/ReleaseStepField.php
      - database/migrations/xxxx_create_release_steps_table.php
      - database/migrations/xxxx_create_release_step_fields_table.php
      - database/factories/ReleaseStepFactory.php
      - database/factories/ReleaseStepFieldFactory.php
      - app/Models/Role.php
      - resources/views/components/roles/⚡index.blade.php

      ## Steps
