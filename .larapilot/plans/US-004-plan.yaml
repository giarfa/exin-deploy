    title: 'Policy delle release, rotta di avvio e autorizzazione'
    body: |-
      ## Description
      Autorizzazione lato server prima dell'interfaccia, come nelle spec precedenti: il comando nascosto non e
      autorizzazione. L'oggetto della decisione e il **progetto**, perche al momento del controllo la release non
