    title: 'Action StartRelease: snapshot, responsabili risolti ed eccezioni di dominio'
    body: |-
      ## Description
      Il cuore della spec: unico percorso di avvio, una sola transazione, nessuna lettura della definizione dopo la
      copia. Le precondizioni riusano le regole gia scritte invece di riscriverle — `WorkflowTemplate::isUsable()` e
      `unusableReason()` sono stati introdotti in US-003 dichiarando esplicitamente che sarebbero serviti qui, e
      `Project::uncoveredRoles()` e la segnalazione che questa Action trasforma in rifiuto.

      ## Files Involved
      - app/Actions/Releases/StartRelease.php
      - app/Exceptions/ProjectWithoutUsableTemplate.php
      - app/Exceptions/RolesWithoutResponsible.php
      - app/Exceptions/InactiveResponsibleOnProject.php
      - app/Exceptions/InactiveProjectCannotStartRelease.php

      ## Steps
      1. Eccezioni di dominio con costruttori nominati sul modello di `InactiveTemplateCannotBeDefault::for()`, ognuna
         con un messaggio che dice **cosa** manca: il template mancante, disattivato o senza step; i ruoli scoperti,
         nominati; i responsabili disattivati, nominati; il progetto disattivato
      2. `StartRelease::handle(Project $project, string $label, User $actor): Release`, tutto dentro `DB::transaction`
      3. Eager loading unico in apertura:
         `loadMissing(['workflowTemplate.stepDefinitions.role', 'workflowTemplate.stepDefinitions.fieldDefinitions', 'assignments.user'])`
         — da qui in poi nessuna query per step o per campo
      4. Precondizioni nell'ordine: progetto attivo; template presente e `isUsable()` (motivo da `unusableReason()`);
         `uncoveredRoles()` vuota; nessun responsabile disattivato fra quelli risolti. Ogni rifiuto solleva prima di
         qualsiasi scrittura
      5. Creazione della release: stato `in_corso`, `started_by`, `started_at`
      6. Copia degli step in **un solo** `insert()`: UUID generati in PHP con `Str::uuid7()`, posizione / nome /
         istruzioni dalla definizione, `role_name` congelato dal ruolo, `assigned_user_id` dalla mappatura del
         progetto, primo step `attivo` e restanti `bloccato`
      7. Copia dei campi in **un solo** `insert()`, riusando gli UUID degli step gia generati
      8. Scrittura dell'evento `release_avviata` con attore, istante e `payload` (etichetta, template di origine,
         numero di step congelati)
      9. PHPDoc dell'Action: perche non serve il lock pessimistico richiesto da `.ai/rules/app.md` per l'avanzamento
         (nessuno stato preesistente da leggere e riscrivere) e come il doppio invio e chiuso dall'unicita di schema
      10. Pint, `larapilot:quality`, `php artisan test --compact`

      ## Completion Criteria
      - [ ] Unico percorso di avvio, con tutte le precondizioni prima di qualsiasi scrittura
      - [ ] Snapshot completo di step e campi in due sole scritture di massa
      - [ ] Responsabile risolto e nome del ruolo congelato su ogni step
      - [ ] Primo step attivo, gli altri bloccati, release `in_corso`, evento di avvio registrato
      - [ ] Numero di query indipendente dal numero di step e di campi
      - [ ] Pint e Larastan verdi, suite verde

