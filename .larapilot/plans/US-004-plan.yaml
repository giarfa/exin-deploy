    id: TASK-09
    title: 'Schermata di avvio con conferma della catena congelata'
    body: |-
      ## Description
      L'unica interfaccia della spec: un amministratore indica progetto ed etichetta e ottiene la conferma visiva che
      lo snapshot esiste. Deliberatamente minima — elenco e filtri sono di US-009, il dettaglio completo con valori e
      registro e di US-008.

      Il comando di ingresso vive sull'elenco progetti, dove l'amministratore gia vede template associato e ruoli
      scoperti: quando il progetto non e avviabile il comando e disabilitato e accanto compare il motivo, invece di
      portare a una pagina che rifiuta.

      ## Files Involved
      - resources/views/components/releases/⚡start.blade.php
      - resources/views/components/projects/⚡index.blade.php
      - lang/it/releases.php

      ## Steps
      1. Componente Livewire a file singolo sulla struttura dei componenti esistenti: proprieta `label`, `rules()` con
         `required`, `max:255` e `Rule::unique('releases', 'label')->where('project_id', ...)`,
         `validationAttributes()` con le etichette italiane
      2. `Gate::authorize('create', [Release::class, $this->project])` **dentro** l'azione di avvio, non solo sulla
         rotta: le azioni Livewire non ripassano dal middleware
      3. Riepilogo delle precondizioni prima dell'avvio: template associato, numero di step, ruoli scoperti,
         responsabili disattivati. Quando qualcosa manca, il pulsante e disabilitato e il motivo e esplicito
      4. L'azione invoca `StartRelease` e cattura le eccezioni di dominio rendendole come messaggio tradotto — stesso
         trattamento TOCTOU adottato da `setAsDefault()` dopo la revisione di US-003: un rifiuto e un messaggio, mai un
         500. Catturare anche la violazione di unicita sull'etichetta e renderla con il messaggio della validazione
      5. Dopo l'avvio, pannello di conferma in sola lettura con la catena congelata: `<ol>` con posizione, nome, ruolo
         congelato, responsabile e stato. Stati resi con **icona e parola**, mai dal solo colore, secondo il contratto
         del mockup `.larapilot/mockups/superficie-operativa/README.md`
      6. Elenco progetti: azione di riga "Avvia una release", visibile ai soli amministratori, disabilitata con motivo
         quando il progetto non e avviabile; riusare le relazioni gia precaricate dall'elenco, senza aggiungere query
         per riga
      7. `lang/it/releases.php` con tutti i testi, condizioni plurali esplicite (`{0}`, `{1}`, `[2,*]`) dove c'e un
         conteggio — il rilievo di revisione di US-003 su `projects_count` vale identico qui
      8. Implementazione **mobile first**: verifica manuale a 375, 768 e 1280 px, nessuno scorrimento orizzontale
      9. Pint, `larapilot:quality`, `php artisan test --compact`

      ## Completion Criteria
      - [ ] Un amministratore avvia una release indicando progetto ed etichetta
      - [ ] Le precondizioni non soddisfatte sono spiegate prima del tentativo, e ogni rifiuto e un messaggio e non un errore
      - [ ] La conferma mostra la catena congelata con responsabile e stato, resi da icona e parola
      - [ ] Il comando compare sull'elenco progetti senza introdurre query per riga
      - [ ] Interfaccia usabile a 375, 768 e 1280 px
      - [ ] Pint e Larastan verdi, suite verde

