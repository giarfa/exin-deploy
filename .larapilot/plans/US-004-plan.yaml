         `foreignUuid('completed_by')->nullable()->constrained('users')->restrictOnDelete()`,
         `timestamp('completed_at')->nullable()`, `timestamps()`
      3. Vincoli e indici: `unique(['release_id', 'position'])`, `index(['assigned_user_id', 'status'])` per la vista
         "i miei step" (US-007), `index('role_id')`. Commentare perche `position` e `unsignedInteger` e non `integer`
         come in `step_definitions`: lo snapshot non si riordina, quindi non servono posizioni temporanee negative
      4. Migrazione `release_step_fields`: `foreignUuid('release_step_id')->constrained()->cascadeOnDelete()`,
