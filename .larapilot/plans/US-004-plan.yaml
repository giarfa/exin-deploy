         `unique(['release_step_id', 'position'])`. Commentare che `value` e una sola colonna per tutti e quattro i
         tipi e che la semantica per tipo e di US-005
      5. Modelli: `HasUuids`, `#[Fillable]`, cast (`status`, `type` a `FieldType`, `is_required`, `position`,
         `completed_at`), PHPDoc dei tipi effettivi. **Nessun uso di `OrderedByPosition`**, con il motivo scritto nel
