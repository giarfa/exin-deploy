    id: TASK-03
    title: 'Registro delle transizioni in sola aggiunta'
    body: |-
      ## Description
      La tabella su cui poggia FR-016. Questa spec vi scrive un solo tipo di evento — l'avvio — ma ne fissa da subito
      il vocabolario e la garanzia strutturale: una riga scritta non si modifica e non si cancella.

      Il vocabolario nasce completo di proposito: i valori finiscono in colonna e sopravvivono nello storico, quindi
      rinominarli in US-005 quando esistono gia righe scritte sarebbe una migrazione di dati evitabile.

      ## Files Involved
      - app/Enums/ReleaseEventAction.php
      - app/Models/ReleaseEvent.php
      - app/Exceptions/ReleaseEventIsAppendOnly.php
      - database/migrations/xxxx_create_release_events_table.php
      - database/factories/ReleaseEventFactory.php

      ## Steps
      1. `App\Enums\ReleaseEventAction` con i cinque casi di FR-016: `ReleaseStarted` (`release_avviata`),
         `StepCompleted` (`step_completato`), `StepActivated` (`step_attivato`), `ReleaseCompleted`
         (`release_conclusa`), `UnauthorizedAttempt` (`tentativo_non_autorizzato`), con `label()` in italiano. PHPDoc:
         questa spec scrive solo il primo, gli altri sono di US-005 / US-006 / US-010
      2. Migrazione `release_events`: `foreignUuid('release_id')->constrained()->cascadeOnDelete()`,
         `foreignUuid('release_step_id')->nullable()->constrained('release_steps')->cascadeOnDelete()`,
         `foreignUuid('user_id')->constrained('users')->restrictOnDelete()`, `string('action')->index()`,
         `json('payload')->nullable()`, `timestamp('created_at')` **senza** `updated_at`, con il motivo a commento;
         `index(['release_id', 'created_at'])` per la lettura cronologica di US-010
      3. Modello: `const UPDATED_AT = null`, cast `action` e `payload` (`array`), relazioni `release()`, `releaseStep()`,
         `user()`. PHPDoc: registro in sola aggiunta, la consultazione e di US-010
      4. Guardiano in `booted()`: sugli eventi `updating` e `deleting` sollevare `ReleaseEventIsAppendOnly`, con
         costruttore nominato sul modello di `InactiveTemplateCannotBeDefault::for()`. E la garanzia strutturale che
         US-010 verifichera anche a livello di interfaccia
      5. `ReleaseEventFactory` con `action` predefinita `release_avviata` e `payload` plausibile
      6. `php artisan migrate:fresh --seed`, Pint, `larapilot:quality`, `php artisan test --compact`

      ## Completion Criteria
      - [x] Tabella senza `updated_at`, con indice cronologico per release
      - [x] Enum con il vocabolario completo di FR-016 e il PHPDoc che dice quale spec scrive cosa
      - [x] `update()` e `delete()` sul modello sollevano `ReleaseEventIsAppendOnly`
      - [x] Factory creata; `migrate:fresh --seed` senza errori, Pint e Larastan verdi, suite verde

