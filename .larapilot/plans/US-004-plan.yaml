    id: TASK-01
    title: 'Enum di stato e modello Release con migrazione e factory'
    body: |-
      ## Description
      Introdurre l'entita di istanza radice e il vocabolario dei suoi stati. La release e il contenitore dello
      snapshot: nasce `in_corso` con autore e istante di avvio, e porta gia le colonne di conclusione che US-006
      riempira.

      ## Files Involved
      - app/Enums/ReleaseStatus.php
      - app/Models/Release.php
      - database/migrations/xxxx_create_releases_table.php
      - database/factories/ReleaseFactory.php
      - app/Models/Project.php (relazione `releases()`)

      ## Steps
      1. `php artisan make:enum` non esiste: creare `App\Enums\ReleaseStatus` a mano sul modello di `App\Enums\UserLevel`
         — casi `InProgress` (`in_corso`) e `Completed` (`conclusa`), metodo `label()` in italiano. **Nessun caso
         `Annullata`**: FR-020 e Should rinviato dal PRD
      2. `php artisan make:model Release -mf --no-interaction`
      3. Migrazione: `uuid('id')->primary()`, `foreignUuid('project_id')->constrained()->restrictOnDelete()`,
         `foreignUuid('workflow_template_id')->constrained()->restrictOnDelete()`, `string('label')`,
         `string('status')->index()`, `foreignUuid('started_by')->constrained('users')->restrictOnDelete()`,
         `timestamp('started_at')`, `foreignUuid('completed_by')->nullable()->constrained('users')->restrictOnDelete()`,
         `timestamp('completed_at')->nullable()`, `timestamps()`
      4. Vincoli e indici nella stessa migrazione: `unique(['project_id', 'label'])` e `index('status')`. Commentare
         che l'unicita composta serve anche da indice sui filtri per progetto, quindi un secondo `index('project_id')`
         sarebbe ridondante — la nota vale per la revisione di US-009, che quegli indici li richiede
      5. Modello: `HasUuids`, `#[Fillable]` con le sole colonne scritte dalla Action, cast `status` a `ReleaseStatus` e
         `started_at` / `completed_at` a `datetime`, PHPDoc dei tipi effettivi per Larastan. Relazioni `project()`,
         `workflowTemplate()`, `startedBy()`. PHPDoc: la provenienza del template non e una dipendenza, e le colonne di
         conclusione ricevono significato in US-006
      6. `Project::releases()` come `HasMany`, con PHPDoc che ricorda che il progetto non si cancella proprio perche
         contiene lo storico
      7. `ReleaseFactory`: etichette di dominio (`v2.4.0`, `2026.08.1`), `for(Project)` coerente con il template del
         progetto, stato `completed()` che valorizza autore e istante di conclusione
      8. `php artisan migrate:fresh --seed`, `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`,
         `php artisan test --compact`

      ## Completion Criteria
      - [x] `ReleaseStatus` con due soli casi ed etichette italiane
      - [x] Tabella `releases` con unicita `(project_id, label)` e indice su `status` creati nella stessa migrazione
      - [x] Modello con cast dichiarati anche in PHPDoc e relazioni verso progetto, template e autore
      - [x] `ReleaseFactory` produce etichette plausibili e uno stato `completed()`
      - [x] `migrate:fresh --seed` senza errori, Pint e Larastan verdi, suite verde

      ## Test Data
      - [x] `database/factories/ReleaseFactory.php` creata nello stesso task della migrazione
      - [x] Seeder non toccato: lo scenario di esecuzione e perimetro dichiarato di US-011

      ## Git Deliverables
      - Commit: `feat(US-004): TASK-01 modello della release e stato del rilascio`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: descrizione locale aggiornata
