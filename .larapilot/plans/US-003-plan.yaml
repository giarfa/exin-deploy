    id: TASK-00
    title: 'Integrare US-002 in develop e creare il branch di lavoro'
    body: |-
      ## Description
      Preparare Gitflow per questa spec. Il branch non puo essere creato dallo stato attuale di `develop`: US-002 e
      stata approvata in revisione umana (`spec-approve`, commit `3dd9485`) ma i suoi commit non sono mai stati
      integrati, quindi `develop` e fermo al merge di US-001 e non contiene ruoli, progetti e mappature — su cui
      questa spec si appoggia direttamente. L'albero di lavoro ha inoltre il ledger Larapilot non committato,
      prodotto dalla chiusura di US-002.

      ## Files Involved
      - (git e artefatti `.larapilot/` — nessun file applicativo)

      ## Steps
      1. Committare gli artefatti pendenti sul branch di US-002 (`.larapilot/usage/ledger.jsonl` e ogni altro file
         di workflow modificato): `docs(US-002): registra consuntivo`
      2. `git checkout develop`
      3. `git merge --no-ff feature/US-002-ruoli-progetti-responsabili` — merge esplicito, la storia deve mostrare
         US-002 entrata come unita approvata
      4. Verificare che `develop` contenga la configurazione di processo: `php artisan test --compact` verde
      5. `git checkout -b feature/US-003-template-workflow-step-campi`
      6. Redigere titolo e corpo della PR interna verso `develop` e **tenerli in locale**: titolo
         `US-003: Template di workflow con step ordinati e campi richiesti`; corpo con link al piano e l'elenco dei task
      7. Commit di ancoraggio del branch (commit vuoto ammesso)

      ## Completion Criteria
      - [x] Nessuna modifica pendente nell'albero di lavoro prima del merge
      - [x] `develop` contiene i commit di US-002 e la suite di test e verde su `develop`
      - [x] Il branch `feature/US-003-template-workflow-step-campi` esiste in locale e deriva da `develop`
      - [x] Titolo e corpo della PR interna redatti e tenuti in locale
      - [x] Nessun push eseguito

      ## Test Data
      - N/A — nessuna modifica a schema o modelli

      ## Git Deliverables
      - Commit: `chore(US-003): TASK-00 bootstrap feature branch` (commit vuoto ammesso)
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: preparata in locale; apertura remota solo su richiesta esplicita dell'utente
