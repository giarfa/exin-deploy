code: US-003
plan_body: |-
  ## Technical Solution

  Ultima spec di configurazione: introduce la **definizione** del processo di rilascio — template, step ordinati,
  campi richiesti — e chiude i due punti di FR-004 rimasti aperti in US-002 perche il template non esisteva
  ancora (associazione progetto -> template e segnalazione dei ruoli previsti ma non assegnati).

  Vale la separazione portante del PRD fra **definizione** e **istanza**: tutto cio che questa spec introduce e
  definizione. All'avvio di una release (US-004) queste righe vengono **copiate** in `release_steps` /
  `release_step_fields`, e da quel momento l'esecuzione legge solo il proprio snapshot. Nessun codice scritto in
  questa spec va invocato dal percorso di esecuzione di una release.

  **Entita introdotte**

  | Entita | Tabella | Contenuto |
  | --- | --- | --- |
  | `WorkflowTemplate` | `workflow_templates` | nome, descrizione, attivo, predefinito |
  | `StepDefinition` | `step_definitions` | template, posizione, nome, istruzioni, ruolo responsabile |
  | `FieldDefinition` | `field_definitions` | step, posizione, etichetta, tipo, obbligatorieta, testo di aiuto |

  Piu una colonna su una tabella esistente: `projects.workflow_template_id` (nullable, `restrictOnDelete`).

  Tutte con chiave primaria UUID (`HasUuids`), `#[Fillable]` con le sole colonne previste, cast dichiarati per
  Larastan come su `User` / `Project` / `Role`.

  **Tipo di campo come enum PHP nativo.** `App\Enums\FieldType` con esattamente quattro casi e chiavi TitleCase,
  valori tecnici stabili in colonna e etichette italiane in `label()`, sulla convenzione gia adottata da
  `App\Enums\UserLevel`:

  | Caso | Valore in colonna | Etichetta |
  | --- | --- | --- |
  | `ShortText` | `short_text` | Testo breve |
  | `LongText` | `long_text` | Testo lungo |
  | `Link` | `link` | Link |
  | `Confirmation` | `confirmation` | Conferma |

  La colonna e `string` con cast a enum, **non** `$table->enum`: aggiungere un quinto tipo con un vincolo di
  check costringerebbe SQLite a ricostruire la tabella, mentre il cast Eloquent rifiuta comunque un valore
  sconosciuto in lettura (`ValueError`) e `Rule::enum(FieldType::class)` lo rifiuta in scrittura. Il criterio di
  accettazione chiede l'enum nativo e il rifiuto, non il vincolo di schema — ed e verificato da test su entrambi
  i percorsi. La semantica di validazione dei valori forniti (URL valido sul tipo link, conferma spuntata) e di
  **US-005/US-006**: qui l'enum descrive solo la forma del campo.

  **Ordinamento: posizioni contigue e senza duplicati.** E il punto tecnicamente delicato della spec e ha un
  criterio di accettazione dedicato. Impianto:

  - Unicita a livello di **schema** su `(workflow_template_id, position)` e `(step_definition_id, position)`: il
    divieto di duplicati non vive nella sola validazione, come per i vincoli di US-002.
  - Colonna `position` di tipo `integer` **con segno** (non `unsignedInteger`): la rinumerazione ha bisogno di
    posizioni temporanee negative per non collidere con l'indice unico durante la scrittura.
  - Concern condiviso `App\Models\Concerns\OrderedByPosition`, usato sia da `StepDefinition` sia da
    `FieldDefinition`: `nextPosition()`, `moveUp()`, `moveDown()`, `deleteAndResequence()` e la rinumerazione a
    due passaggi (prima tutte le righe a `-(indice+1)`, poi il valore assoluto) dentro **una** transazione.
  - Il riordino e reso da comandi **sposta su / sposta giu** e non da trascinamento: e accessibile da tastiera,
    funziona a 375 px e non richiede test browser, che a bar `NORMAL` non sono previsti.
  - Ogni cancellazione passa da `deleteAndResequence()`: la contiguita non e una responsabilita del chiamante.

  2N piccole `update` per riordino, con N pari al numero di step o campi (unita): stessa scelta consapevole
  accettata in revisione di US-002 per il salvataggio della mappatura, preferita a un upsert di massa.

  **Un solo template predefinito.** Invariante applicata da una Action esplicita
  `App\Actions\Workflows\SetDefaultWorkflowTemplate`: dentro una transazione azzera `is_default` su tutti gli
  altri e lo imposta su quello scelto. **Trade-off dichiarato:** l'invariante non e applicata dallo schema. Un
  indice unico parziale non e portabile fra SQLite, MySQL e PostgreSQL con migrazioni Laravel, e il trucco della
  colonna nullable con indice unico renderebbe `is_default` ambigua (`null` invece di `false`) proprio dove il
  codice la legge come booleana. Contropartite: unico percorso di scrittura del flag, transazione, e un test che
  verifica l'assenza di due predefiniti dopo una sequenza di operazioni. Se in futuro il flag venisse scritto da
  un secondo percorso, l'indice parziale va rivalutato con Mike.

  **Template utilizzabile.** `WorkflowTemplate::isUsable()` (attivo e con almeno uno step) e
  `unusableReason()` per il messaggio esplicito. Qui il metodo serve alle segnalazioni nelle schermate di
  configurazione; **US-004** lo invochera come precondizione dell'avvio di una release. Definire il metodo qui
  evita che US-004 duplichi la regola.

  **Associazione progetto -> template (chiusura di FR-004).** `projects.workflow_template_id` nullable, perche i
  due progetti dimostrativi esistono gia e un progetto senza template resta uno stato legittimo (semplicemente
  non ci si avviano release). `CreateProject` propone il template predefinito come valore iniziale; il form lo
  lascia sostituibile con qualunque template attivo, e la modifica del progetto pure. Il predefinito e una
  **proposta al momento della creazione**, non un legame permanente: stessa semantica della mappatura
  predefinita di US-002, coerente per chi usa lo strumento.

  **Ruoli previsti dal template e non assegnati.** `Project::uncoveredRoles()` restituisce i ruoli richiesti
  dagli step del template associato che non hanno un responsabile su quel progetto. Percorso a rischio N+1 per
  costruzione: la segnalazione compare sia nell'elenco progetti sia nella pagina responsabili. Eager load
  obbligatorio (`workflowTemplate.stepDefinitions:id,workflow_template_id,role_id` piu `assignments:id,project_id,role_id`)
  e calcolo in PHP; l'elenco progetti deve restare a numero di query costante rispetto al numero di progetti, e
  un test conta le query.

  **Rifinitura rinviata da US-002.** La pagina responsabili segnala quando una persona ricopre piu ruoli sullo
  stesso progetto, cosi che la ripetizione si legga come intenzionale e non come difetto: e il punto 1 delle
  rifiniture rinviate nella revisione di US-002, e questa spec tocca gia quella schermata. Il vincolo resta su
  `(project_id, role_id)` — nessun vincolo su `(project_id, user_id)`, come registrato in `.ai/rules/models.md`.

  **Punto di estensione del ruolo non cancellabile.** `Role::REFERENCING_RELATIONS` era stato scritto in US-002
  proprio per questo: si aggiunge `stepDefinitions`, e la regola vale in elenco, nel rifiuto della cancellazione
  e nell'etichetta di utilizzo senza altre modifiche. `step_definitions.role_id` e `restrictOnDelete` come
  ultima difesa.

  **Autorizzazione.** Una sola Policy nuova, `WorkflowTemplatePolicy`, con il filtro `before()` per
  l'amministratore e `delete` fuori dal filtro (`NOT_FILTERED`), come `RolePolicy` e `ProjectPolicy`. Step e
  campi **non** hanno Policy proprie: non esistono fuori dal contesto di un template, quindi sono decisi da
  `manageSteps`. Autorizzazione a due livelli come nelle spec precedenti: middleware `can` sulle rotte e
  `Gate::authorize` su **ogni** azione Livewire, perche le azioni non ripassano dal middleware.

  **Schermate** (Livewire 4 a file singolo con Flux gratuito, sulla struttura di US-002):

  | Rotta | Componente | Contenuto |
  | --- | --- | --- |
  | `/template` | `templates.index` | elenco, creazione, modifica, disattivazione, impostazione del predefinito, avviso "senza step" |
  | `/template/{template}/step` | `templates.steps` | step ordinati, riordino, ruolo responsabile, istruzioni |
  | `/template/{template}/step/{step}/campi` | `templates.fields` | campi dello step nei quattro tipi, obbligatorieta, aiuto, riordino |

  Tre schermate e non una annidata: la configurazione di step e campi in un unico componente diventerebbe un
  componente grande con tre livelli di form, difficile da leggere a 375 px e da testare. Binding di rotta con
  `scopeBindings()` sulle rotte annidate, cosi che uno step di un altro template non sia raggiungibile
  cambiando identificativo nell'indirizzo. La voce di navigazione "Template di workflow" passa da
  `x-nav.planned` a voce reale.

  **Fuori perimetro.** Avvio della release e snapshot (US-004), compilazione e chiusura degli step (US-005/006),
  duplicazione del template (FR-023, Could, non in MVP), versionamento visibile dello snapshot (FR-022, Should),
  scenario dimostrativo con release in corso e conclusa (US-011). La cancellazione di un **template** non e
  prevista da nessun criterio di accettazione: come i progetti, un template si disattiva —
  `WorkflowTemplatePolicy::delete()` nega a tutti, amministratori inclusi, e il motivo e nel PHPDoc.

  ## Git & Branching

  - Mode: `GITFLOW` (da `data.settings.git_mode`) — **nessun push automatico**
  - Branch: `feature/US-003-template-workflow-step-campi` da `develop`
  - TASK-00: bootstrap. `develop` e fermo al merge di US-001: i 15 commit di US-002, approvata in revisione
    umana, non sono ancora integrati. TASK-00 li integra con un merge esplicito e poi crea il branch
  - Per task: un solo commit atomico in Conventional Commits (`type(US-003): TASK-NN sommario`)
  - PR interna verso `develop`: titolo e corpo redatti e **tenuti in locale**; apertura remota e push solo su
    richiesta esplicita dell'utente in sessione
  - Merge in `develop` solo dopo approvazione umana in `/larapilot-review`
  - Prima di ogni `task-done`: `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality`
    (Larastan livello 5), suite verde

  ## Test Data Strategy

  - Factory per ogni modello introdotto, aggiornate **nello stesso task** di migrazione e modello:
    `WorkflowTemplateFactory` (stati `inactive()`, `isDefault()`, `withSteps(int $count)`),
    `StepDefinitionFactory` (posizione progressiva coerente per template), `FieldDefinitionFactory` (uno stato
    per ciascuno dei quattro tipi, piu `optional()`)
  - Nomi di dominio e non `lorem`: gli step e i campi generati devono somigliare a un processo di rilascio reale,
    come il catalogo di `RoleFactory`
  - Seeder: template **"Rilascio standard"**, attivo e predefinito, con cinque step ordinati
    (Preparazione del codice / Dev Lead, Verifica funzionale / QA, Valutazione di sicurezza / Security,
    Preparazione dell'ambiente / DevOps, Consegna in produzione / DevOps) e i relativi campi, con tutti e
    quattro i tipi rappresentati e un misto di obbligatori e opzionali. I due progetti dimostrativi vengono
    associati al template
  - Volumi dimostrativi: 1 template predefinito con 5 step e 12-14 campi, 1 template secondario disattivato
    (dimostra il filtro sull'elenco e la sostituibilita), 2 progetti associati
  - `php artisan migrate:fresh --seed` deve chiudere senza errori prima di ogni `task-done` che tocchi schema,
    modelli o seeder
  - Lo scenario di **esecuzione** (release a meta catena, release conclusa) resta di US-011

  ## Test Strategy

  - Bar: `NORMAL` (da `data.settings.testing`) — PHPUnit 12.5, nessun test browser, Dusk, Playwright o matrice
    di viewport. Verifica manuale dell'interfaccia consegnata come nota di handoff
  - Test interlacciati con l'implementazione (TASK-04, TASK-05, TASK-08, TASK-15), non tutti alla fine
  - Percorsi coperti obbligatoriamente:
    1. **Vincoli di schema** verificati scrivendo con `DB::table()`, aggirando modelli e validazione: unicita di
       `(template, posizione)` e `(step, posizione)`, `restrict` su `step_definitions.role_id` e su
       `projects.workflow_template_id`
    2. **Enum**: un valore fuori dai quattro casi e rifiutato in validazione, e la lettura di un valore invalido
       scritto a mano solleva `ValueError`
    3. **Ordinamento** (criterio di accettazione esplicito): dopo una sequenza di aggiunte, spostamenti e
       cancellazioni le posizioni sono `1..N` senza duplicati e senza salti, su step e su campi
    4. **Template predefinito unico**: impostarne uno nuovo azzera il precedente; dopo N operazioni esiste al
       massimo un predefinito
    5. **Template senza step non utilizzabile**, con messaggio esplicito
    6. **Ruolo referenziato da uno step non cancellabile**, con messaggio che nomina il template
    7. **Autorizzazione a due livelli**: un `member` riceve 403 sulle tre rotte e su ogni azione Livewire
       (creazione, modifica, disattivazione, impostazione del predefinito, aggiunta/riordino/cancellazione di
       step e campi); nessun aggiramento per identificativo fra template diversi grazie a `scopeBindings`
    8. **Proposta del template predefinito** alla creazione di un progetto e sua sostituibilita
    9. **Segnalazione dei ruoli scoperti** sul progetto associato
    10. **N+1**: elenco template e elenco progetti a numero di query costante rispetto al numero di righe, con
        test che contano le query come in US-002
  - Nessuna API pubblica introdotta: nessun test di contratto, nessun OpenAPI (coerente con il PRD)

  ## Quality gate

  `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality` (Pint + Larastan livello 5) prima di
  ogni `task-done`, piu `php artisan test --compact`. Gli attributi con cast vanno annotati in PHPDoc sui modelli:
  l'analisi statica non li deduce dalla colonna.
tasks:
