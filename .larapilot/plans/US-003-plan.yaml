    id: TASK-08
    title: 'Test: predefinito unico, proposta alla creazione, utilizzabilita e ruoli scoperti'
    body: |-
      ## Description
      Coprire le regole di dominio di TASK-06 e TASK-07 prima che l'interfaccia le usi. Sono le regole che, sbagliate,
      si manifestano solo in US-004 come release avviata su un processo incoerente.

      ## Files Involved
      - tests/Feature/Configuration/DefaultWorkflowTemplateTest.php
      - tests/Feature/Configuration/TemplateUsabilityTest.php
      - tests/Feature/Configuration/ProjectTemplateAssociationTest.php

      ## Steps
      1. Predefinito unico: impostarne uno nuovo azzera il precedente; dopo una sequenza di operazioni
         (impostazioni ripetute, disattivazioni, creazioni) esiste **al massimo** un predefinito; un template
         disattivato non puo diventare predefinito; disattivare il predefinito ne rimuove il flag
      2. Utilizzabilita: un template attivo senza step non e utilizzabile e `unusableReason()` distingue "senza step"
         da "disattivato"; con almeno uno step diventa utilizzabile; cancellare l'ultimo step lo rende di nuovo
         inutilizzabile
      3. Associazione: creare un progetto senza indicare il template applica il predefinito attivo; indicandone uno
         diverso viene rispettato; senza alcun predefinito il progetto nasce senza template; modificare il progetto
         permette di sostituire il template
      4. Indipendenza: cambiare il template predefinito **non** modifica i progetti gia creati — stessa semantica
         della mappatura predefinita di US-002, e stesso rischio di regressione
      5. Ruoli scoperti: con un template i cui step richiedono cinque ruoli e un progetto con quattro assegnati,
         `uncoveredRoles()` restituisce esattamente il ruolo mancante; con la mappatura completa restituisce una
         collezione vuota; un ruolo **disattivato** ma assegnato non risulta scoperto
      6. Contare le query di `uncoveredRoles()` su un elenco di progetti precaricato: numero costante rispetto al
         numero di progetti
      7. `php artisan test --compact --filter='DefaultWorkflowTemplate|TemplateUsability|ProjectTemplateAssociation'`

      ## Completion Criteria
      - [ ] Non esistono due predefiniti in nessuna sequenza di operazioni provata
      - [ ] Il rifiuto sul template disattivato e coperto
      - [ ] Le tre situazioni di utilizzabilita sono distinte da messaggi diversi
      - [ ] Proposta, sostituzione e assenza di predefinito coperte alla creazione del progetto
      - [ ] `uncoveredRoles()` corretta e a query costanti
      - [ ] Suite verde

