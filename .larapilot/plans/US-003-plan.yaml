    id: TASK-05
    title: 'Test: contiguita e unicita delle posizioni dopo riordini e cancellazioni'
    body: |-
      ## Description
      Criterio di accettazione esplicitamente verificato da test: "dopo un riordino o una cancellazione le posizioni
      restano contigue e senza duplicati". Un test dedicato e non una asserzione dentro un test piu grande, perche e
      la regola che rompendosi rende incomprensibile il processo configurato.

      ## Files Involved
      - tests/Unit/Models/OrderedByPositionTest.php

      ## Steps
      1. Helper locale che asserisce l'invariante su una sequenza: le posizioni sono esattamente `1..N`, senza
         duplicati e senza salti
      2. Step: creare cinque step, poi eseguire una sequenza di operazioni (sposta su, sposta giu, sposta il primo su
         — nessun effetto, sposta l'ultimo giu — nessun effetto, cancella un elemento centrale, cancella il primo,
         aggiungi in coda) verificando l'invariante **dopo ogni operazione** e l'ordine relativo atteso
      3. Campi: la stessa sequenza su un altro modello, per dimostrare che il concern e riusabile e non tarato sugli
         step
      4. Isolamento fra fratelli: riordinare gli step di un template non tocca le posizioni di un altro template;
         riordinare i campi di uno step non tocca quelli di un altro step
      5. Cancellazione del padre: cancellare uno step porta via i suoi campi senza lasciare posizioni orfane sugli
         altri step
      6. `php artisan test --compact --filter=OrderedByPosition`

      ## Completion Criteria
      - [ ] L'invariante `1..N` e verificata dopo ogni operazione, non solo alla fine
      - [ ] Coperti gli estremi: primo elemento verso l'alto e ultimo verso il basso non cambiano nulla
      - [ ] Verificato l'isolamento fra sequenze di padri diversi
      - [ ] Lo stesso test copre step e campi
      - [ ] Suite verde

