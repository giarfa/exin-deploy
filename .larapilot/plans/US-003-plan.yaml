    id: TASK-13
    title: 'Progetti: scelta del template e segnalazioni sulla mappatura dei responsabili'
    body: |-
      ## Description
      Portare il template dentro le schermate dei progetti e chiudere le due segnalazioni che FR-004 chiede e che
      US-002 ha dovuto rinviare.

      1. **Scelta del template** nel form del progetto: il predefinito e il valore proposto in creazione, ma resta
         sostituibile con qualunque template attivo, e modificabile dopo. L'elenco progetti mostra il template
         associato.
      2. **Ruoli previsti dal template e non assegnati**: segnalati sia in elenco progetti sia nella pagina
         responsabili, nominando i ruoli scoperti e spiegando la conseguenza — una release avviata con ruoli scoperti
         si bloccherebbe.
      3. **Rifinitura rinviata da US-002**: la pagina responsabili segnala quando una persona ricopre piu ruoli sullo
         stesso progetto (es. "Davide Rossi ricopre 2 ruoli su questo progetto"), cosi che la ripetizione si legga
         come intenzionale. Il vincolo resta su `(project_id, role_id)`: nessun vincolo su `(project_id, user_id)`,
         come registrato in `.ai/rules/models.md`.
      4. Segnalazione quando il template associato **non e utilizzabile** (disattivato o senza step), con il motivo.

      ## Files Involved
      - resources/views/components/projects/⚡index.blade.php
      - resources/views/components/projects/⚡assignments.blade.php
      - lang/it/projects.php

      ## Steps
      1. Form progetto: `flux:select` sui template **attivi**, piu il template attualmente associato anche se
         disattivato (nasconderlo mostrerebbe un'associazione diversa da quella reale); opzione "nessun template".
         Validazione con `Rule::in` sulle sole opzioni in elenco, non sull'intera tabella
      2. In creazione il valore iniziale e il predefinito attivo; `CreateProject` riceve la scelta effettiva
      3. Elenco progetti: eager load `workflowTemplate` con `stepDefinitions:id,workflow_template_id,role_id` e
         `assignments:id,project_id,role_id,user_id` — l'elenco deve restare a **query costanti** rispetto al numero
         di progetti; colonna con template e badge dei ruoli scoperti
      4. Pagina responsabili: banner con i ruoli previsti dal template e non assegnati, con i nomi dei ruoli; nota
         per ciascuna persona che ricopre piu ruoli sul progetto; avviso se il template non e utilizzabile
      5. Testi nuovi in `lang/it/projects.php`, con `trans_choice` dove il numero varia
      6. Verifica a 375 / 768 / 1280 px: i banner non devono spingere fuori schermo i comandi
      7. `php artisan test --compact`, Pint, `larapilot:quality`

      ## Completion Criteria
      - [ ] Il template e scegliibile in creazione (predefinito proposto) e sostituibile in modifica
      - [ ] Un identificativo di template fuori dalle opzioni in elenco e rifiutato
      - [ ] I ruoli scoperti sono nominati in elenco progetti e nella pagina responsabili, con la conseguenza spiegata
      - [ ] Il cumulo di ruoli sulla stessa persona e segnalato come intenzionale
      - [ ] Un template associato non utilizzabile e segnalato con il motivo
      - [ ] Elenco progetti a query costanti rispetto al numero di progetti
      - [ ] Interfaccia usabile a 375 / 768 / 1280 px
      - [ ] Pint e Larastan verdi

