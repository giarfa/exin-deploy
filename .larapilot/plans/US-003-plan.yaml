    title: 'Test: modelli, vincoli di schema, enum del tipo di campo e ruolo referenziato'
    body: |-
      ## Description
      Coprire la fondazione dati prima di costruirvi sopra l'interfaccia. I vincoli dichiarati a livello di schema
      vanno verificati **scrivendo direttamente sul database** con `DB::table()`, aggirando modelli e validazione:
      un test che passa dalla validazione non dimostra nulla sullo schema. E la convenzione di
      `tests/Feature/Configuration/SchemaConstraintsTest.php` introdotta in US-002.

      ## Files Involved
      - tests/Feature/Configuration/WorkflowSchemaConstraintsTest.php
      - tests/Unit/Models/WorkflowTemplateTest.php
      - tests/Unit/Models/StepDefinitionTest.php
      - tests/Unit/Enums/FieldTypeTest.php
      - tests/Unit/Models/RoleTest.php (estensione)

      ## Steps
      1. Usare le factory esistenti; nessuna definizione di dati duplicata nei test
      2. Vincoli di schema, con scrittura diretta: due step con la stessa posizione sullo stesso template sono
         rifiutati; due campi con la stessa posizione sullo stesso step sono rifiutati; la stessa posizione su
         template (o step) **diversi** e ammessa; cancellare un ruolo referenziato da uno step e rifiutato
         (`restrict`); cancellare un template cancella i suoi step e, a cascata, i campi
      3. Verificare il prerequisito del punto precedente: `foreign_key_constraints` attivo sulla connessione di test,
         altrimenti il test su `restrict` passerebbe per il motivo sbagliato
      4. Enum: i casi sono esattamente quattro; `FieldType::from()` su un valore fuori enum solleva `ValueError`;
         leggere via Eloquent un `type` invalido scritto con `DB::table()` solleva; `label()` copre tutti i casi
      5. Relazioni ordinate: `stepDefinitions` e `fieldDefinitions` restituiscono le righe per posizione crescente
         anche quando sono state create in ordine sparso
      6. `Role`: `isReferenced()` e vera per un ruolo usato da uno step; `usageLabel()` nomina l'uso nei template
      7. `php artisan test --compact --filter='WorkflowSchemaConstraints|WorkflowTemplateTest|StepDefinitionTest|FieldTypeTest|RoleTest'`
      8. Nessun test browser, Dusk o Playwright: il bar e `NORMAL`

      ## Completion Criteria
