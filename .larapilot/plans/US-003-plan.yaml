    id: TASK-15
    title: 'Test: autorizzazione, flussi di configurazione e assenza di N+1'
    body: |-
      ## Description
      Coprire la superficie aperta dalle tre schermate nuove e dalle modifiche a quelle dei progetti. Autorizzazione
      verificata su **entrambi** i livelli — rotta e azione Livewire — perche le azioni non ripassano dal middleware:
      e la convenzione di `ConfigurationPolicyTest` in US-002.

      Attenzione ai due inganni registrati in `.ai/rules/tests.md`: `session('errors')` e un array in questo
      progetto, quindi il fallimento di `assertRedirect()` produce un errore fuorviante — leggere a mano
      `$response->headers->get('Location')` quando un'asserzione sulla risposta fallisce.

      ## Files Involved
      - tests/Feature/Configuration/WorkflowTemplateManagementTest.php
      - tests/Feature/Configuration/StepDefinitionManagementTest.php
      - tests/Feature/Configuration/FieldDefinitionManagementTest.php
      - tests/Feature/Configuration/ConfigurationPolicyTest.php (estensione)

      ## Steps
      1. Usare le factory esistenti, con gli stati introdotti nei task precedenti
      2. Rotte: un `member` autenticato riceve 403 su `/template`, `/template/{template}/step` e
         `/template/{template}/step/{step}/campi`; un anonimo viene rediretto al login
      3. Azioni Livewire: un `member` che invoca `save`, `toggleActivation`, `setAsDefault`, `moveUp`, `moveDown` e
         `delete` sui tre componenti riceve 403 — non basta che i comandi siano nascosti
      4. Aggiramento per identificativo: uno step appartenente a un **altro** template non e raggiungibile dalla
         rotta dei campi (`scopeBindings`); un `roleId` o un `type` fuori dalle opzioni in elenco e rifiutato in
         validazione
      5. Flussi da amministratore: creazione con nome duplicato rifiutata; modifica; disattivazione; impostazione del
         predefinito; aggiunta di step con ruolo; riordino; cancellazione di uno step con i suoi campi; aggiunta di
         campi nei quattro tipi; obbligatorieta salvata
      6. Progetti: creazione con template proposto e con template sostituito; segnalazione dei ruoli scoperti
         presente quando manca un'assegnazione e assente quando la mappatura e completa
      7. N+1: contare le query su elenco template (con step e progetti) e su elenco progetti (con template e
         assegnazioni) e asserire che il numero non cresca aggiungendo righe — come i due test di US-002 che
         falliscono al reintrodursi di un conteggio per riga
      8. `php artisan test --compact` sull'intera suite prima di chiudere il task
      9. Nessun test browser, Dusk, Playwright o matrice di viewport: il bar e `NORMAL`

      ## Completion Criteria
      - [ ] 403 verificato su rotte **e** azioni Livewire per un `member`
      - [ ] Nessun aggiramento per identificativo fra template diversi
      - [ ] I flussi di configurazione di template, step e campi sono coperti nei percorsi felici e nei rifiuti
      - [ ] Segnalazione dei ruoli scoperti coperta in presenza e in assenza
      - [ ] Due test contano le query e falliscono se ricompare un N+1
      - [ ] Suite intera verde

      ## Git Deliverables
      - Commit: `test(US-003): TASK-15 copre autorizzazione, configurazione e query`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornamento della descrizione tenuta in locale
