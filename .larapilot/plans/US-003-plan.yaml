    id: TASK-12
    title: 'Schermata dei campi richiesti di uno step'
    body: |-
      ## Description
      Terza schermata: i campi informativi che il responsabile dovra fornire per chiudere lo step (FR-008) —
      etichetta, tipo fra i quattro previsti, obbligatorieta, posizione e testo di aiuto facoltativo.

      E la schermata in cui l'enum diventa visibile: le opzioni del tipo sono generate da `FieldType::cases()` e le
      etichette da `label()`, cosi che un quinto tipo non richieda modifiche alla vista. La validazione usa
      `Rule::enum(FieldType::class)`: un valore fuori dall'enum e rifiutato lato server, non solo assente dal menu.

      ## Files Involved
      - resources/views/components/templates/⚡fields.blade.php
      - lang/it/templates.php

      ## Steps
      1. `php artisan make:livewire templates.fields`
      2. `public WorkflowTemplate $template` e `public StepDefinition $step` dal binding con `scopeBindings`; briciole
         di navigazione verso template e step, perche e la pagina piu profonda del prodotto
      3. Elenco campi come `#[Computed]` ordinato per posizione — una sola query
      4. Form in linea: `label` obbligatorio (max 255), `type` obbligatorio con `Rule::enum(FieldType::class)`,
         `isRequired` booleano (`flux:switch`), `helpText` facoltativo con aiuto che spiega a chi e rivolto
      5. Azioni: `openCreateForm`, `openEditForm`, `closeForm`, `save` (posizione in coda), `moveUp`, `moveDown`,
         `delete`, ognuna con `Gate::authorize('manageSteps', $this->template)`
      6. Ogni riga mostra tipo (etichetta dall'enum) e obbligatorieta con **icona e parola**, mai col solo colore
      7. Nota esplicita per chi configura: un campo obbligatorio non compilato impedira la chiusura dello step, uno
         facoltativo no. E la frase che rende comprensibile la scelta di obbligatorieta
      8. Stato vuoto: "nessun campo: il responsabile potra chiudere lo step senza fornire informazioni" — e una
         configurazione lecita ma va detta, altrimenti sembra un difetto
      9. Implementazione mobile first: schede a 375 px. Verifica a 375 / 768 / 1280 px
      10. `php artisan test --compact`, Pint, `larapilot:quality`

      ## Completion Criteria
      - [ ] Aggiunta, modifica, cancellazione e riordino dei campi funzionanti
      - [ ] Le opzioni del tipo derivano da `FieldType::cases()`: nessun elenco duplicato nella vista
      - [ ] Un tipo fuori dall'enum e rifiutato lato server
      - [ ] Obbligatorieta e tipo leggibili senza affidarsi al colore
      - [ ] Uno step di un altro template non e raggiungibile cambiando identificativo nell'indirizzo
