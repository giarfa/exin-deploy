    id: TASK-01
    title: 'Enum FieldType e modello WorkflowTemplate con migrazione, factory e seeder'
    body: |-
      ## Description
      Introdurre il tipo di campo come enum PHP nativo e il modello del template (FR-006, FR-008 per la sola parte
      di enum). L'enum arriva in questo task e non con `FieldDefinition` perche e il vocabolario del dominio: la
      factory dei campi, la validazione e l'interfaccia lo useranno tutti, e definirlo prima evita di riscriverlo.

      `FieldType` ha esattamente quattro casi con chiavi TitleCase, valori tecnici stabili in colonna ed etichette
      italiane in `label()`, sulla convenzione di `App\Enums\UserLevel`: `ShortText` = `short_text` (Testo breve),
      `LongText` = `long_text` (Testo lungo), `Link` = `link` (Link), `Confirmation` = `confirmation` (Conferma).
      Nessun metodo di validazione dei valori forniti: quella semantica appartiene alla chiusura dello step
      (US-005/US-006).

      `WorkflowTemplate`: nome univoco, descrizione, `is_active`, `is_default`. Il flag `is_default` in questo task e
      solo una colonna con cast: l'invariante "un solo predefinito" arriva in TASK-06 con la Action che lo scrive.

      ## Files Involved
      - app/Enums/FieldType.php
      - app/Models/WorkflowTemplate.php
      - database/migrations/xxxx_create_workflow_templates_table.php
      - database/factories/WorkflowTemplateFactory.php

      ## Steps
      1. `php artisan make:enum FieldType --string` (o `make:class`) — quattro casi e `label()`
      2. `php artisan make:model WorkflowTemplate -mf`
      3. Migrazione: `uuid('id')->primary()`, `string('name')->unique()`, `text('description')->nullable()`,
         `boolean('is_active')->default(true)->index()`, `boolean('is_default')->default(false)->index()`,
         `timestamps()`. Solo tipi portabili, nessuna funzione specifica di SQLite
      4. Modello: `HasUuids`, `#[Fillable(['name', 'description', 'is_active', 'is_default'])]`, cast booleani,
         `#[Scope] active()`, PHPDoc con `@property bool $is_active` e `@property bool $is_default` per Larastan
      5. Factory: nomi di dominio plausibili da un catalogo (Rilascio standard, Rilascio urgente, Rilascio
         infrastrutturale, ...) con progressivo deterministico come `RoleFactory`, perche il nome e univoco a livello
         di schema; stati `inactive()` e `isDefault()`
      6. `php artisan migrate:fresh --seed` e `php artisan test --compact`
      7. `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `FieldType` ha esattamente quattro casi, chiavi TitleCase ed `label()` in italiano
      - [x] Migrazione con nome univoco e flag indicizzati, reversibile
      - [x] `WorkflowTemplateFactory` produce nomi non collidenti e ha gli stati `inactive()` e `isDefault()`
      - [x] `migrate:fresh --seed` chiude senza errori e la suite resta verde
      - [x] Pint e Larastan livello 5 verdi

      ## Test Data
      - [x] `database/factories/WorkflowTemplateFactory.php` creata, con stati `inactive()` e `isDefault()`
      - [x] Seeder non ancora toccato: il dataset dimostrativo del template arriva in TASK-14, quando esistono step
            e campi da comporre in uno scenario coerente

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-01 enum del tipo di campo e modello del template`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornamento della descrizione tenuta in locale
