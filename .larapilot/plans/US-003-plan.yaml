    id: TASK-10
    title: 'Schermata di elenco e configurazione dei template'
    body: |-
      ## Description
      Prima delle tre schermate: creazione, modifica, disattivazione e impostazione del predefinito (FR-006). Mostra
      anche quando un template non e utilizzabile, con messaggio esplicito, e quanti progetti lo usano.

      Struttura sulla schermata dei ruoli di US-002: componente Livewire 4 a file singolo, form in linea per
      creazione e modifica, `Gate::authorize` in ogni azione, stato reso con **icona e parola** e mai col solo
      colore, testi da `lang/it/templates.php`.

      ## Files Involved
      - resources/views/components/templates/⚡index.blade.php
      - lang/it/templates.php

      ## Steps
      1. `php artisan make:livewire templates.index`
      2. Proprieta del form: `editingId`, `showingForm`, `name`, `description`. Regole: nome obbligatorio e univoco
         con `Rule::unique('workflow_templates', 'name')->ignore($this->editingId)`, descrizione facoltativa;
         `validationAttributes()` in italiano
      3. Elenco come proprieta `#[Computed]` con `withCount(['stepDefinitions', 'projects'])`: il conteggio degli
         step serve a `isUsable()` e quello dei progetti a spiegare l'impatto di una disattivazione. Una sola query
         per l'elenco — nessun conteggio per riga
      4. Azioni: `openCreateForm`, `openEditForm`, `closeForm`, `save`, `toggleActivation`, `setAsDefault`. Ognuna
         apre con `Gate::authorize`; `setAsDefault` delega a `SetDefaultWorkflowTemplate` e non scrive il flag da se
      5. Disattivare il template predefinito rimuove il flag: la conferma lo dice prima di procedere, non dopo
      6. Avvisi espliciti: template senza step ("non e utilizzabile per avviare una release: aggiungi almeno uno
         step"), template predefinito marcato in modo evidente, nota sul fatto che i template non si cancellano
      7. Ogni riga ha il comando verso `templates.steps`, con il numero di step
      8. Implementazione **mobile first**: a 375 px la tabella non deve richiedere scorrimento orizzontale —
         colonne essenziali e comandi impilati, come la pagina responsabili di US-002. Verifica a 375 / 768 / 1280 px
      9. `php artisan test --compact`, Pint, `larapilot:quality`

      ## Completion Criteria
