    id: TASK-06
    title: 'Action del template predefinito unico e utilizzabilita del template'
    body: |-
      ## Description
      Due regole di dominio del template, entrambe destinate a essere lette da spec successive.

      **Un solo predefinito** (`App\Actions\Workflows\SetDefaultWorkflowTemplate`): dentro una transazione azzera
      `is_default` su tutti gli altri template e lo imposta su quello scelto. Unico percorso di scrittura del flag,
      invocato dalla schermata dei template e dai test. Un template **disattivato** non puo diventare predefinito:
      proporre ai nuovi progetti un template inutilizzabile sarebbe un errore silenzioso, e il rifiuto e esplicito.
      Se il template predefinito viene disattivato, il flag viene rimosso nella stessa operazione.

      **Utilizzabilita** (`WorkflowTemplate::isUsable()` e `unusableReason()`): un template e utilizzabile quando e
      attivo e ha almeno uno step. Qui il metodo alimenta le segnalazioni nelle schermate di configurazione;
      **US-004** lo invochera come precondizione dell'avvio di una release. Definirlo qui evita che la regola venga
      riscritta in due posti. `unusableReason()` restituisce la chiave di traduzione del motivo (disattivato /
      senza step), cosi che il messaggio sia esplicito e non generico.

      Trade-off dichiarato: l'invariante del predefinito unico non e applicata dallo schema. Un indice unico parziale
      non e portabile fra SQLite, MySQL e PostgreSQL con migrazioni Laravel, e la variante con colonna nullable
      renderebbe `is_default` ambigua dove il codice la legge come booleana. Contropartite: percorso di scrittura
      unico, transazione e test dedicato (TASK-08).

      ## Files Involved
      - app/Actions/Workflows/SetDefaultWorkflowTemplate.php
      - app/Models/WorkflowTemplate.php
      - lang/it/templates.php (nuovo file di traduzioni)

      ## Steps
      1. `php artisan make:class Actions/Workflows/SetDefaultWorkflowTemplate`
      2. `handle(WorkflowTemplate $template): void` — rifiuta un template disattivato con un'eccezione di dominio
         esplicita; dentro `DB::transaction`: `WorkflowTemplate::whereKeyNot(...)->where('is_default', true)->update([...])`
         e poi imposta il flag sul template scelto. Una sola `update` di massa per l'azzeramento, non un ciclo
      3. Metodo o Action per la disattivazione che rimuove il flag di predefinito nella stessa transazione
      4. `WorkflowTemplate::isUsable(): bool` e `unusableReason(): ?string`, che riusano un conteggio degli step gia
         caricato con `withCount('stepDefinitions')` quando presente — stessa lezione di `Role::referenceCounts()`:
         un metodo chiamato per riga in elenco non deve produrre una query per riga
      5. Creare `lang/it/templates.php` con le chiavi dei messaggi di utilizzabilita e dell'esito delle operazioni
      6. `php artisan test --compact`, Pint, `larapilot:quality`

      ## Completion Criteria
      - [ ] Impostare un predefinito azzera il precedente dentro una sola transazione
      - [ ] Un template disattivato non puo diventare predefinito, con rifiuto esplicito
      - [ ] Disattivare il template predefinito ne rimuove il flag
      - [ ] `isUsable()` / `unusableReason()` non producono una query per riga quando il conteggio e precaricato
      - [ ] `lang/it/templates.php` creato: nessun testo incastonato nelle viste
      - [ ] Pint e Larastan verdi

      ## Test Data
      - N/A — nessuna modifica a schema, modelli o relazioni; la copertura arriva in TASK-08

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-06 template predefinito unico e utilizzabilita`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornamento della descrizione tenuta in locale
