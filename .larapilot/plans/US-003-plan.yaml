    title: 'Documentazione baseline e CHANGELOG'
    body: |-
      ## Description
      Aggiornare il set baseline previsto dal PRD nello stesso ciclo in cui il codice cambia. Nessuna documentazione
      estesa: diagrammi, runbook e manuali non sono previsti, e non esiste OpenAPI perche non esiste superficie API.

      Il punto da spiegare bene e quello che un nuovo arrivato fraintende: la definizione del processo vive qui, ma
      l'esecuzione di una release leggera **solo il proprio snapshot**. La nota architetturale del README va estesa
      di conseguenza, perche da questa spec in avanti esistono davvero le tabelle di definizione che US-004 copiera.

      ## Files Involved
      - README.md
      - CHANGELOG.md

      ## Steps
      1. README, sezione `### Configurazione del processo`: aggiungere template, step e campi, con la tabella delle
         entita e i vincoli (una sola predefinita, posizioni contigue, quattro tipi di campo)
      2. README, sezione `### Definizione e istanza sono separate`: chiarire che `workflow_templates`,
         `step_definitions` e `field_definitions` sono la definizione che US-004 congelera in snapshot, e che nessun
         percorso di esecuzione deve leggerle
      3. README, sezione `### Vincoli permanenti`: annotare il trade-off del predefinito unico applicato dalla Action
         e non dallo schema, con la motivazione di portabilita, e la scelta di `type` come `string` con cast invece di
         `enum` di schema
      4. README: aggiornare l'elenco delle schermate e delle credenziali dimostrative se cambiate
      5. CHANGELOG, sezione `## [Unreleased] / ### Added`: voci per FR-006, FR-007, FR-008 e per la chiusura di
         FR-004 (associazione al template e ruoli scoperti), nello stile delle voci esistenti — cosa cambia per chi
         usa lo strumento, non l'elenco dei file
      6. Verificare che i comandi citati nel README funzionino davvero come scritti
      7. Pint (nessun PHP toccato, ma il gate resta), `php artisan test --compact`

      ## Completion Criteria
      - [ ] README descrive template, step e campi e il confine con lo snapshot di US-004
      - [ ] I due trade-off (predefinito unico, tipo come string) sono annotati fra i vincoli permanenti
      - [ ] CHANGELOG aggiornato con voci leggibili da chi usa lo strumento
      - [ ] I comandi documentati sono stati eseguiti come scritti
      - [ ] Suite verde

