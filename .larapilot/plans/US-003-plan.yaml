    id: TASK-07
    title: 'Associazione progetto-template, proposta del predefinito e ruoli scoperti'
    body: |-
      ## Description
      Chiudere i due punti di FR-004 rinviati da US-002 perche il template non esisteva: l'associazione del progetto
      al template di workflow e la segnalazione dei ruoli previsti dal template ma non ancora assegnati sul progetto.

      `projects.workflow_template_id` e **nullable**: i progetti dimostrativi esistono gia, e un progetto senza
      template resta uno stato legittimo — semplicemente non ci si avviano release, cosa che US-004 fara rispettare.
      `restrictOnDelete` verso `workflow_templates`, coerente con il fatto che un template non si cancella.

      `CreateProject` viene esteso per **proporre** il template predefinito quando il chiamante non ne indica uno.
      Proposta e non legame: il form la mostra come valore iniziale sostituibile, come la mappatura predefinita di
      US-002. L'Action resta l'unico posto in cui la precompilazione avviene, e continua a restituire il numero di
      ruoli non precompilati.

      `Project::uncoveredRoles()` restituisce i ruoli richiesti dagli step del template associato che non hanno un
      responsabile sul progetto. E un percorso a rischio N+1 per costruzione, perche compare in elenco: il metodo
      deve riusare le relazioni precaricate e non interrogare per riga.

      ## Files Involved
      - database/migrations/xxxx_add_workflow_template_id_to_projects_table.php
      - app/Models/Project.php
      - app/Models/WorkflowTemplate.php (relazione `projects`)
      - app/Actions/Projects/CreateProject.php
      - database/factories/ProjectFactory.php

      ## Steps
      1. `php artisan make:migration add_workflow_template_id_to_projects_table` —
         `foreignUuid('workflow_template_id')->nullable()->constrained()->restrictOnDelete()`, con indice implicito
         dalla chiave esterna; `down()` che rimuove vincolo e colonna
      2. `Project`: aggiungere `workflow_template_id` a `#[Fillable]`, relazione `workflowTemplate()` (BelongsTo),
         `uncoveredRoles()` che legge `workflowTemplate.stepDefinitions.role` e `assignments` **gia precaricate**
         (`relationLoaded()` / `loadMissing`), restituendo una collezione di ruoli distinti ordinati per nome
      3. `WorkflowTemplate::projects()` (HasMany) — serve per dire in elenco quanti progetti usano il template
      4. `CreateProject`: se `workflow_template_id` non e passato, risolvere il template predefinito **attivo** e
         usarlo; se non esiste un predefinito, lasciare `null` e riportarlo nell'esito. Estendere il valore di
         ritorno con l'indicazione del template applicato, senza rompere la chiave `skipped` esistente
      5. `ProjectFactory`: nessun template per impostazione predefinita (i test esistenti non devono cambiare
         comportamento), piu uno stato `withTemplate()` che ne collega uno
      6. `php artisan migrate:fresh --seed`, `php artisan test --compact` — verificare che i test di US-002 su
         `CreateProject` restino verdi, Pint, `larapilot:quality`

      ## Completion Criteria
      - [ ] Colonna nullable con `restrict` verso `workflow_templates`, migrazione reversibile
      - [ ] `CreateProject` propone il template predefinito attivo e accetta una scelta diversa
      - [ ] Senza alcun predefinito il progetto viene creato senza template, senza errori
      - [ ] `uncoveredRoles()` non esegue query quando le relazioni sono precaricate
      - [ ] `ProjectFactory` ha lo stato `withTemplate()` e il comportamento predefinito e invariato
      - [ ] I test di US-002 sulla precompilazione della mappatura restano verdi
      - [ ] `migrate:fresh --seed` verde, Pint e Larastan verdi

      ## Test Data
      - [ ] `database/factories/ProjectFactory.php` aggiornata nello stesso task della migrazione, con
            `withTemplate()`
      - [ ] Seeder: l'associazione dei progetti dimostrativi al template arriva in TASK-14, insieme al template stesso

      ## Git Deliverables
