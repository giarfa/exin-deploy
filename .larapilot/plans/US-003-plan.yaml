    id: TASK-14
    title: 'Seeder: template Rilascio standard con cinque step e campi'
    body: |-
      ## Description
      Portare il dataset dimostrativo alla forma richiesta dal criterio di accettazione: il template "Rilascio
      standard" con cinque step realistici e i relativi campi, con tutti e quattro i tipi rappresentati. Serve allo
      sviluppo, ai test e a valutare l'usabilita reale delle schermate senza tabelle vuote (FR-018).

      Il seeder descrive lo **stato finale voluto** con dati espliciti, non simula il percorso dell'interfaccia: e
      la convenzione stabilita in US-002 per le mappature.

      Struttura del processo dimostrativo:

      | # | Step | Ruolo | Campi |
      | --- | --- | --- | --- |
      | 1 | Preparazione del codice | Dev Lead | Versione (testo breve, obbl.), Link alla pipeline (link, obbl.), Note di preparazione (testo lungo, opz.) |
      | 2 | Verifica funzionale | QA | Esito della verifica (testo lungo, obbl.), Link al report di test (link, opz.), Regressioni verificate (conferma, obbl.) |
      | 3 | Valutazione di sicurezza | Security | Rischi rilevati (testo lungo, obbl.), Verifica delle dipendenze eseguita (conferma, obbl.) |
      | 4 | Preparazione dell'ambiente | DevOps | Ambiente di destinazione (testo breve, obbl.), Backup eseguito (conferma, obbl.), Link al piano di rientro (link, opz.) |
      | 5 | Consegna in produzione | DevOps | Consegna completata (conferma, obbl.), Link al changelog pubblicato (link, opz.), Note di consegna (testo lungo, opz.) |

      L'ultimo step e la consegna effettiva in produzione, coerente con FR-017. Il ruolo `PM` resta non usato da
      questo template: e realistico e dimostra che non ogni ruolo del catalogo compare in ogni processo.

      Aggiungere anche un secondo template **disattivato** ("Rilascio urgente", tre step): dimostra il filtro
      sull'elenco, la sostituibilita del template sul progetto e il fatto che un template disattivato non e
      proponibile.

      ## Files Involved
      - database/seeders/DatabaseSeeder.php
      - lang/it/templates.php (se emergono testi mancanti)

      ## Steps
      1. Estendere `DatabaseSeeder` con `seedWorkflowTemplates()`, richiamato dopo `seedRoles()` e prima di
         `seedProjects()`: i progetti nascono gia associati
      2. Definire template, step e campi in costanti di classe, nello stile di `TEAM`, `ROLES`, `PROJECTS`
      3. Comporre con le factory di TASK-01/02/03, risolvendo i ruoli per nome come fa `seedAssignments()`
      4. Associare entrambi i progetti dimostrativi al template predefinito, scrivendo `workflow_template_id`
         esplicitamente e non tramite `CreateProject`
      5. Verificare che la mappatura dimostrativa **copra** i ruoli del template: nessun ruolo scoperto sui progetti
         di partenza, cosi che lo stato iniziale sia quello sano; il caso con ruoli scoperti si ottiene disattivando
         un'assegnazione a mano e va descritto nelle note di verifica
      6. `php artisan migrate:fresh --seed` e ispezione delle tre schermate nuove piu quelle dei progetti
      7. `php artisan test --compact`, Pint, `larapilot:quality`

      ## Completion Criteria
      - [ ] Il template "Rilascio standard" e attivo, predefinito e ha esattamente cinque step ordinati
      - [ ] I quattro tipi di campo sono tutti rappresentati, con un misto di obbligatori e facoltativi
      - [ ] Esiste un secondo template disattivato
      - [ ] I due progetti dimostrativi risultano associati al template predefinito
      - [ ] Nessun ruolo scoperto nello stato iniziale del dataset
      - [ ] `migrate:fresh --seed` produce un ambiente navigabile senza tabelle vuote
      - [ ] Pint e Larastan verdi

      ## Test Data
      - [ ] `DatabaseSeeder` compone template, step e campi con le factory, senza duplicare definizioni
      - [ ] Le factory di TASK-01/02/03 restano la sola sorgente dei valori generati
      - [ ] Nessuno scenario di release nel seeder: resta di US-011

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-14 dataset dimostrativo del template di rilascio`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornamento della descrizione tenuta in locale
