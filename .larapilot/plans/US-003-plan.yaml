    id: TASK-09
    title: 'Policy dei template, rotte annidate e navigazione'
    body: |-
      ## Description
      Aprire la superficie di configurazione dei template con autorizzazione a due livelli, come nelle spec
      precedenti: middleware `can` sulle rotte e `Gate::authorize` su ogni azione Livewire, perche le azioni
      Livewire non ripassano dal middleware. Nascondere un comando nell'interfaccia non e autorizzazione.

      Una sola Policy nuova. Step e campi non hanno Policy proprie: non esistono fuori dal contesto di un template,
      quindi sono decisi da `manageSteps`, come le assegnazioni di progetto sono decise da `manageAssignments`.

      `WorkflowTemplatePolicy::delete()` nega a **tutti**, amministratori inclusi, e sta fuori dal filtro `before()`
      (`NOT_FILTERED`): un template e la forma di processo a cui si appoggiano progetti e release, quindi si
      disattiva. Il PHPDoc lo motiva, come in `ProjectPolicy`.

      ## Files Involved
      - app/Policies/WorkflowTemplatePolicy.php
      - routes/web.php
      - resources/views/components/layouts/app.blade.php
      - lang/it/app.php

      ## Steps
      1. `php artisan make:policy WorkflowTemplatePolicy --model=WorkflowTemplate`
      2. Ability: `viewAny`, `view`, `create`, `update`, `toggleActivation`, `setDefault`, `manageSteps`,
         `delete` (fuori dal filtro, nega sempre). Ogni ability usata deve esistere come metodo: `before()` non viene
         invocato per ability senza metodo corrispondente — lezione registrata in US-001
      3. Rotte dentro il gruppo `auth` esistente, con percorsi in italiano e nomi in inglese come le rotte attuali:
         - `Route::livewire('/template', 'templates.index')->can('viewAny', WorkflowTemplate::class)->name('templates.index')`
         - `Route::livewire('/template/{template}/step', 'templates.steps')->can('manageSteps', 'template')->name('templates.steps')`
         - `Route::livewire('/template/{template}/step/{step}/campi', 'templates.fields')->can('manageSteps', 'template')->scopeBindings()->name('templates.fields')`
         `scopeBindings()` non e cosmetico: senza di esso uno step di un altro template sarebbe raggiungibile
         cambiando identificativo nell'indirizzo
      4. Navigazione: sostituire `<x-nav.planned icon="queue-list">` con una voce reale verso `templates.index`,
         marcata corrente su `templates.*`. La chiave `app.nav_templates` esiste gia
      5. Commenti nelle rotte nello stile del file: spiegare il doppio livello di autorizzazione e il motivo di
         `scopeBindings`
      6. `php artisan route:list --except-vendor`, `php artisan test --compact`, Pint, `larapilot:quality`

      ## Completion Criteria
      - [ ] Tre rotte registrate, tutte con middleware `can` e binding sull'identificativo
      - [ ] `scopeBindings()` sulla rotta annidata dei campi
      - [ ] Ogni ability usata esiste come metodo nella Policy
      - [ ] `delete()` nega a tutti ed e fuori dal filtro `before()`
      - [ ] La voce di navigazione "Template di workflow" non e piu marcata "in arrivo"
      - [ ] Pint e Larastan verdi

      ## Test Data
      - N/A — nessuna modifica a schema o modelli

