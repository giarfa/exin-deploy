  -
    id: TASK-02
    title: 'Concern OrderedByPosition e modello StepDefinition con migrazione e factory'
    body: |-
      ## Description
      Introdurre gli step del template (FR-007) e, con essi, il meccanismo di ordinamento condiviso che anche i campi
      useranno. E il cuore tecnico della spec: il criterio di accettazione chiede posizioni **contigue e senza
      duplicati** dopo riordini e cancellazioni, verificato da test.

      `App\Models\Concerns\OrderedByPosition` espone:

      - `sequence(): Builder` — dichiarato dal modello che usa il concern, restituisce i fratelli (stesso template /
        stesso step)
      - `nextPosition(): int` — ultima posizione + 1, per l'inserimento in coda
      - `moveUp(): void` / `moveDown(): void` — scambio con il vicino
      - `deleteAndResequence(): void` — cancellazione e rinumerazione, cosi che la contiguita non sia responsabilita
        del chiamante
      - rinumerazione **a due passaggi** dentro una sola transazione: prima tutte le righe interessate a
        `-(indice + 1)`, poi al valore assoluto. Il passaggio intermedio negativo serve a non violare l'indice unico
        durante la scrittura, ed e il motivo per cui `position` e `integer` **con segno** e non `unsignedInteger`

      Il concern e un concern di modello e non una Action perche opera su una sola tabella entro un solo padre; le
      Action del progetto restano riservate alle operazioni che coordinano piu entita (`CreateProject`).

      ## Files Involved
      - app/Models/Concerns/OrderedByPosition.php
      - app/Models/StepDefinition.php
      - app/Models/WorkflowTemplate.php (relazione `stepDefinitions`)
      - database/migrations/xxxx_create_step_definitions_table.php
      - database/factories/StepDefinitionFactory.php

      ## Steps
      1. `php artisan make:class Models/Concerns/OrderedByPosition` e implementare i metodi sopra, con PHPDoc che
         spieghi il passaggio negativo intermedio
      2. `php artisan make:model StepDefinition -mf`
      3. Migrazione: `uuid('id')->primary()`, `foreignUuid('workflow_template_id')->constrained()->cascadeOnDelete()`
         (gli step non sopravvivono al proprio template), `integer('position')`, `string('name')`,
         `text('instructions')->nullable()`, `foreignUuid('role_id')->constrained()->restrictOnDelete()`,
         `timestamps()`, `unique(['workflow_template_id', 'position'])`, `index('role_id')`
      4. Modello `StepDefinition`: `HasUuids`, `OrderedByPosition`, `#[Fillable([...])]`, relazioni
         `workflowTemplate()` (BelongsTo), `role()` (BelongsTo), `fieldDefinitions()` arrivera in TASK-03,
         `#[Scope] ordered()` su `position`
      5. `WorkflowTemplate::stepDefinitions()` come `HasMany` **ordinata per posizione**: l'ordine e parte del
         significato della relazione, non una scelta del chiamante
      6. Factory: nomi e istruzioni di dominio da un catalogo di step di rilascio, `role_id` risolto con
         `Role::factory()`, `position` assegnata in coda al template (`afterMaking`/`afterCreating` o closure sul
         template) per non collidere con l'indice unico; stato `withoutInstructions()`
      7. `php artisan migrate:fresh --seed`, `php artisan test --compact`, Pint, `larapilot:quality`

      ## Completion Criteria
      - [x] Il concern rinumera senza violare l'indice unico e dentro una sola transazione
      - [x] `position` e `integer` con segno, e il PHPDoc spiega perche
      - [x] Vincolo unico `(workflow_template_id, position)` a livello di schema
      - [x] `role_id` in `restrictOnDelete`
      - [x] `WorkflowTemplate::stepDefinitions()` restituisce gli step gia ordinati per posizione
      - [x] `StepDefinitionFactory` genera step consecutivi sullo stesso template senza collisioni
      - [x] `migrate:fresh --seed` verde, suite verde, Pint e Larastan verdi

      ## Test Data
      - [x] `database/factories/StepDefinitionFactory.php` creata, con posizionamento in coda e nomi di dominio
      - [x] Seeder aggiornato in TASK-14, dove template, step e campi formano uno scenario coerente

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-02 step del template con ordinamento condiviso`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornamento della descrizione tenuta in locale
    type: Impl
    status: DONE
