    id: TASK-11
    title: 'Schermata degli step di un template con riordino'
    body: |-
      ## Description
      Seconda schermata: aggiunta, modifica, cancellazione e **riordino** degli step di un template (FR-007). Ogni
      step ha nome, istruzioni per chi lo esegue e ruolo responsabile scelto fra i ruoli attivi.

      Le istruzioni sono il punto in cui il processo diventa autoesplicativo per chi lo eredita: il campo e in
      evidenza e non un dettaglio nascosto, con testo di aiuto che spiega a chi sono rivolte.

      Riordino con comandi **sposta su / sposta giu** e non con trascinamento: accessibile da tastiera, utilizzabile
      a 375 px, verificabile senza test browser (che a bar `NORMAL` non sono previsti). I comandi delegano a
      `OrderedByPosition`; la cancellazione passa da `deleteAndResequence()`.

      ## Files Involved
      - resources/views/components/templates/⚡steps.blade.php
      - lang/it/templates.php

      ## Steps
      1. `php artisan make:livewire templates.steps`
      2. `public WorkflowTemplate $template` dal binding di rotta; elenco step come `#[Computed]` con
         `with('role:id,name')` e `withCount('fieldDefinitions')` — la colonna "campi richiesti" non deve costare una
         query per riga
      3. Form in linea: `name` obbligatorio, `instructions` facoltativo (textarea), `roleId` obbligatorio fra i
         **ruoli attivi**, piu i ruoli disattivati gia usati da uno step di questo template — nasconderli renderebbe
         invisibile una responsabilita che esiste, come nella pagina responsabili di US-002
      4. Validazione della chiave del ruolo contro le sole opzioni realmente in elenco (`Rule::in`), non contro
         l'intera tabella: e la difesa contro l'indicazione per identificativo che US-002 ha adottato con
         `->only($allowedRoles)`
      5. Azioni: `openCreateForm`, `openEditForm`, `closeForm`, `save` (assegna `nextPosition()` in coda alla
         creazione), `moveUp`, `moveDown`, `delete` (con conferma che avvisa della perdita dei campi definiti).
         Ognuna apre con `Gate::authorize('manageSteps', $this->template)`
      6. Stato vuoto esplicito: "nessuno step: un template senza step non e utilizzabile per avviare una release"
      7. Ogni step ha il comando verso `templates.fields` con il numero di campi
      8. Riordino accessibile: comandi disabilitati sugli estremi con `aria-disabled`, etichette che nominano lo step
         spostato (non solo una freccia), messaggio `aria-live` che conferma lo spostamento
      9. Implementazione mobile first: elenco di schede a 375 px, non tabella compressa. Verifica a 375 / 768 / 1280 px
      10. `php artisan test --compact`, Pint, `larapilot:quality`

      ## Completion Criteria
      - [ ] Aggiunta, modifica e cancellazione degli step funzionanti, con ruolo responsabile obbligatorio
      - [ ] Le istruzioni sono modificabili e mostrate a chi configura
      - [ ] Riordino con sposta su / sposta giu, accessibile da tastiera e annunciato
      - [ ] Dopo cancellazione e riordino le posizioni restano contigue (regola nel concern, non nel componente)
      - [ ] Un ruolo indicato per identificativo ma fuori dalle opzioni in elenco e rifiutato
      - [ ] Elenco a query costanti rispetto al numero di step
      - [ ] Interfaccia usabile a 375 / 768 / 1280 px
      - [ ] Pint e Larastan verdi

