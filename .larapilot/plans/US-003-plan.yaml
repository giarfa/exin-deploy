    title: 'Modello FieldDefinition con migrazione, factory e punto di estensione del ruolo'
    body: |-
      ## Description
      Introdurre i campi informativi richiesti da ciascuno step (FR-008) e chiudere il punto di estensione lasciato
      aperto da US-002 sulla non cancellabilita del ruolo.

      `FieldDefinition` riusa `OrderedByPosition`: e la prova che il concern di TASK-02 non era sovradimensionato.
      Il tipo e la colonna `type` (string) con cast a `FieldType::class`.

      `Role::REFERENCING_RELATIONS` era stato scritto in US-002 come punto di estensione unico: si aggiunge
      `stepDefinitions` e la regola vale automaticamente in elenco, nel rifiuto della cancellazione e in
      `usageLabel()`. Serve la relazione `Role::stepDefinitions()` e una nuova chiave di traduzione per l'etichetta
      di utilizzo (`roles.used_templates`).

      ## Files Involved
      - app/Models/FieldDefinition.php
      - app/Models/StepDefinition.php (relazione `fieldDefinitions`)
      - app/Models/Role.php (relazione `stepDefinitions` e `REFERENCING_RELATIONS`)
      - database/migrations/xxxx_create_field_definitions_table.php
      - database/factories/FieldDefinitionFactory.php
      - lang/it/roles.php

      ## Steps
      1. `php artisan make:model FieldDefinition -mf`
      2. Migrazione: `uuid('id')->primary()`, `foreignUuid('step_definition_id')->constrained()->cascadeOnDelete()`,
         `integer('position')`, `string('label')`, `string('type')`, `boolean('is_required')->default(false)`,
         `string('help_text')->nullable()`, `timestamps()`, `unique(['step_definition_id', 'position'])`.
         Colonna `type` come `string` e non `enum`: motivazione nel commento della migrazione e nel piano
      3. Modello: `HasUuids`, `OrderedByPosition`, `#[Fillable([...])]`, cast `'type' => FieldType::class` e
         `'is_required' => 'boolean'`, relazione `stepDefinition()`, `#[Scope] ordered()`
      4. `StepDefinition::fieldDefinitions()` come `HasMany` ordinata per posizione
      5. `Role::stepDefinitions()` (HasMany) e `stepDefinitions` aggiunta a `REFERENCING_RELATIONS`; estendere
         `usageLabel()` con `trans_choice('roles.used_templates', ...)` che nomina il numero di step che lo usano
      6. Factory: `label` e `help_text` di dominio, uno stato per ciascun tipo (`shortText()`, `longText()`,
         `link()`, `confirmation()`) piu `optional()` per `is_required = false`; posizione in coda allo step
      7. `php artisan migrate:fresh --seed`, `php artisan test --compact`, Pint, `larapilot:quality`

      ## Completion Criteria
      - [ ] `FieldDefinition` usa `OrderedByPosition` senza duplicare logica di ordinamento
      - [ ] `type` castato a `FieldType` e `is_required` a booleano, entrambi annotati in PHPDoc
      - [ ] Vincolo unico `(step_definition_id, position)` a livello di schema
      - [ ] `Role::REFERENCING_RELATIONS` include `stepDefinitions` e `usageLabel()` nomina l'uso nei template
      - [ ] `FieldDefinitionFactory` ha uno stato per ciascuno dei quattro tipi piu `optional()`
      - [ ] `migrate:fresh --seed` verde, suite verde, Pint e Larastan verdi

      ## Test Data
