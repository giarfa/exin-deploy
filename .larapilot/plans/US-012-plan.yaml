      - [x] Regola con entrambe le forme corrette, le occorrenze reali e il riferimento al test di guardia
      - [x] Riga corrispondente in `.ai/rules/index.md`
      - [x] Voce `Fixed` in `CHANGELOG.md`
      - [x] `larapilot:quality` verde

