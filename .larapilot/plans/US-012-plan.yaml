    id: TASK-04
    title: 'Registrare la regola condivisa sulle direttive negli attributi e aggiornare il changelog'
    body: |-
      ## Description
      Rendere la trappola patrimonio del progetto invece che di questa sessione: una regola in `.ai/rules` che dichiara il divieto e mostra le due forme corrette, più la voce di changelog per un difetto visibile all'utente.

      ## Files Involved
      - `.ai/rules/views.md` (nuovo, glob `resources/views/**`)
      - `.ai/rules/index.md`
      - `CHANGELOG.md`

      ## Steps
      1. Registrare la regola con lo strumento `record-rule` di Boost — glob `resources/views/**`, mai la memoria personale dell'agente: `.ai/rules` è ciò che resta nel repository
      2. Contenuto della regola: negli attributi di un **componente** Blade (`<x-…>`, `<flux:…>`, `<livewire:…>`) l'interpolazione `{{ }}` viene compilata, `@js()` **no** — resta testo e raggiunge il browser. Le due forme corrette, entrambe verificate su questo progetto:
         - vocabolario chiuso e privo di apici → `wire:click="$set('campo', '{{ $valore }}')"`
         - valore arbitrario → attributo legato: `:wire:click="'$set(\'campo\', '.Js::from($valore).')'"` (gli apici escono come entità HTML che il browser ridecodifica)
         - testo con apici destinato a un'espressione Alpine → nessuna stringa JavaScript: elementi alternati con `x-show`, come nella sfida 2FA
         Citare le due occorrenze reali e il test di guardia che le intercetta
      3. Aggiungere in `.ai/rules/index.md` la riga `resources/views/**` → `.ai/rules/views.md`, rispettando l'ordine e la forma della tabella esistente
      4. `CHANGELOG.md`, sezione Unreleased, voce `Fixed`: filtri di stato dell'elenco dei rilasci e etichetta del comando di scambio nella sfida 2FA
      5. `php artisan larapilot:quality` — Pint e Larastan livello 5 verdi

      ## Completion Criteria
