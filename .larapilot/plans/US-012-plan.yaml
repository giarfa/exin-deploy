code: US-012
plan_body: |-
  ## Soluzione tecnica

  Un solo difetto, due occorrenze, una regola mancante.

  **Causa.** Blade compila le direttive nel testo del template, ma gli attributi di un **componente** Blade (`<flux:button>`, `<flux:link>`, `<x-…>`) vengono estratti dal compilatore dei tag e passati alla attribute bag come **stringhe PHP letterali**. L'interpolazione `{{ }}` viene convertita in concatenazione e sopravvive; `@js()` **no**: resta testo e raggiunge il browser così com'è. La vista compilata di `/rilasci` lo mostra senza ambiguità:

  ```php
  'wire:click' => '$set(\'statusFilter\', @js($filter[\'value\']))'
  ```

  Livewire riceve un'espressione che non sa valutare, solleva `Invalid or unexpected token` e **non parte alcuna richiesta**: da qui l'assenza totale di effetto sul filtro.

  **Forme corrette (entrambe verificate su questo progetto).**

  | Forma | Reso | Quando usarla |
  | --- | --- | --- |
  | `wire:click="$set('statusFilter', '{{ $valore }}')"` | `$set('statusFilter', 'in_corso')` | Vocabolario **chiuso e privo di apici** — enum, costanti, slug |
  | `:wire:click="'$set(\'statusFilter\', '.Js::from($valore).')'"` | idem, con gli apici come entità HTML che il browser ridecodifica | Valore arbitrario: `Js::from` mette al sicuro apici e virgolette |

  **Filtri dell'elenco (TASK-01).** I valori sono `tutte`, `in_corso`, `conclusa` — la costante `ALL` e i casi di `ReleaseStatus`, un vocabolario chiuso senza apici. Si usa l'interpolazione: diff minimo, nessuna azione pubblica nuova. Non si introduce un metodo `filterByStatus()` pubblico: il componente documenta già perché evita metodi invocabili dal browser, e qui non servirebbe a nulla — `$set` fa esattamente lo stesso lavoro.

  **Sfida 2FA (TASK-02).** Qui l'interpolazione **non** basta: `auth.two_factor_use_code` vale `Usa il codice dell'app di autenticazione` e contiene un apice, che il browser ridecodifica dentro la stringa JavaScript rompendo l'espressione Alpine. Invece di scegliere una forma di escaping si eliminano le stringhe JavaScript: due `<span>` alternati da `x-show`, con il testo reso da Blade come ovunque nel resto del file (`x-show="! recovery"` / `x-show="recovery" x-cloak` sono già l'idioma di quella pagina). Prima che Alpine avvii, la prima etichetta è comunque quella giusta.

  **Guardia (TASK-03 + TASK-04).** Il difetto è passato due volte perché nulla lo intercettava: un test di guardia scandisce `resources/views` e fallisce su ogni `@js(` dentro un tag di componente, e la regola condivisa in `.ai/rules` spiega la trappola e le due forme corrette al prossimo agente.

  ## Precondizione Git — `develop` è indietro di tre spec

  ⌨️ Sarah: `develop` si ferma a US-008. US-009, US-010 e US-011 sono `DONE` e approvate ma vivono solo su `feature/US-011-ambiente-dimostrativo`; il file difettoso `resources/views/components/releases/⚡index.blade.php` **non esiste su `develop`**. Un `feature/US-012-*` creato da `develop` partirebbe da un albero che non contiene il bug.

  TASK-00 integra quindi la catena approvata in `develop` con un merge esplicito (`--no-ff`, come `merge: integra US-008 dettaglio della release`) e solo dopo dirama US-012. Ripiego se l'integrazione va rimandata per ragioni fuori da questa spec: diramare dalla punta di `feature/US-011-ambiente-dimostrativo` e annotarlo nel corpo della PR — mai lavorare su un albero privo del difetto da correggere.

  Gli artefatti `.larapilot/` non committati in albero di lavoro (backlog, `intake.md`, `specs/US-012.yaml`, questo piano) seguono il checkout e vanno committati sul ramo US-012 in TASK-00.

  ## Git & Branching

  - Modalità: `GITFLOW` — nessun push automatico, nessuna PR remota
  - Ramo: `feature/US-012-filtri-stato-rilasci` da `develop` (dopo l'integrazione di TASK-00)
  - TASK-00: bootstrap del ramo + integrazione della catena approvata in `develop`
  - Un commit atomico per task, Conventional Commits `tipo(US-012): TASK-NN …`
  - Descrizione della PR verso `develop` preparata in locale; apertura remota solo su richiesta esplicita
  - Merge dopo l'approvazione umana in `/larapilot-review`

  ## Strategia dei dati di test

  Nessuna modifica a schema, modelli, factory o seeder: la correzione vive interamente nel livello di presentazione. Le factory di `Release`, `ReleaseStep` e `User` e lo scenario di `DatabaseSeeder` (US-011) restano invariati e sono la sorgente dei dati per i test di regressione — nessuna fixture nuova, nessun record inventato nel test.

  Verifica manuale sul dataset dimostrativo esistente: `php artisan migrate:fresh --seed` produce già una release in corso e una conclusa, cioè entrambe le sezioni che i filtri devono separare.

  ## Strategia di test

  - Bar: `NORMAL` — nessun Playwright, nessun Dusk, nessun Pest browser, nessuna matrice di viewport
  - 🧪 Anne: la lacuna da chiudere è precisa — `ReleaseIndexScreenTest` esercita `->set('statusFilter', …)`, cioè la proprietà lato server, che ha sempre funzionato. I test nuovi asseriscono il **markup reso**: l'espressione `wire:click` prodotta deve contenere il valore dello stato e nessun `@js(`
  - Test di guardia a livello di repository su `resources/views/**`: nessun `@js(` dentro un attributo di componente Blade — è ciò che avrebbe intercettato entrambe le occorrenze
  - Le asserzioni esistenti di `ReleaseIndexScreenTest` restano invariate e verdi: il comportamento lato server non cambia
  - **Verifica manuale (handoff).** Non automatizzabile sotto `NORMAL`, da eseguire prima della revisione su `http://exin-deploy.test/rilasci`:
    1. Premere "In corso" → resta la sola sezione in corso, indirizzo `?stato=in_corso`, bottone con stato premuto
    2. Premere "Conclusa" → resta il solo storico, indirizzo `?stato=conclusa`
    3. Premere "Tutte" → tornano entrambe le sezioni, il parametro sparisce dall'indirizzo
    4. Ricaricare `/rilasci?stato=conclusa` → l'elenco riapre già filtrato
    5. Combinare stato e progetto → i due filtri si applicano insieme
    6. Console del browser vuota in tutti i passaggi (nessun errore Livewire o Alpine)
    7. Sfida 2FA: il comando mostra "Usa un codice di recupero", premuto mostra "Usa il codice dell'app di autenticazione", console pulita

  ## Qualità e documentazione

  - `php artisan larapilot:quality` (Pint + Larastan livello 5) prima della consegna in revisione
  - 📝 Albert: voce `Fixed` in `CHANGELOG.md` — è un difetto visibile all'utente. README e note architetturali non sono toccati: nulla cambia nel modello o nel processo
  - La regola condivisa si registra con lo strumento `record-rule` di Boost su glob `resources/views/**`, con la riga corrispondente in `.ai/rules/index.md`

  ## Rischi residui

  - L'assenza di errori in console è verificabile solo a mano sotto `NORMAL`: il test di guardia copre la causa (la direttiva non compilata), non l'effetto osservato nel browser
  - Il merge di TASK-00 porta in `develop` tre spec approvate in un colpo solo: è integrazione dovuta, ma va annunciata in revisione perché allarga il diff rispetto alla sola correzione
