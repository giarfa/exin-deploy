    id: TASK-03
    title: "Copertura di regressione sul markup reso e guardia sull'intera cartella delle viste"
    body: |-
      ## Description
      Chiudere la lacuna che ha lasciato passare il difetto due volte. I test esistenti esercitano `->set('statusFilter', …)`, cioè la proprietà lato server, che ha sempre funzionato: il cablaggio del bottone reso non è mai stato attraversato. I test nuovi asseriscono il **markup**, e una guardia a livello di repository impedisce che la stessa forma rientri altrove.

      Bar `NORMAL`: nessun Playwright, nessun Dusk, nessun Pest browser, nessuna matrice di viewport.

      ## Files Involved
      - `tests/Feature/Releases/ReleaseIndexScreenTest.php`
      - `tests/Feature/Auth/TwoFactorTest.php` (o il file esistente che copre la sfida 2FA)
      - `tests/Unit/Views/BladeComponentAttributesTest.php` (nuovo — guardia)

      ## Steps
      1. Usare le factory esistenti di `Release`, `ReleaseStep` e `User`: nessuna fixture nuova
      2. Elenco dei rilasci — asserire sul markup reso che l'espressione del bottone contenga `$set('statusFilter', 'in_corso')` e `$set('statusFilter', 'conclusa')`, e che la pagina non contenga la stringa `@js(`. Usare `assertSee(..., false)` per confrontare il markup non escapato
      3. Sfida 2FA — asserire che la pagina contenga entrambe le etichette come testo reso e nessun `@js(`
      4. Guardia — test che scandisce ricorsivamente `resources/views/**/*.blade.php` e fallisce quando `@js(` compare dentro un attributo di un tag di componente (`<x-…`, `<flux:…`, `<livewire:…`), riportando file e riga. Il testo libero e gli elementi HTML nativi restano leciti: la direttiva lì viene compilata
      5. Verificare che la guardia sia significativa: rimettendo per prova la forma con `@js()` in TASK-01 il test deve fallire, poi ripristinare
      6. `php artisan test --compact --filter=ReleaseIndexScreenTest`, `--filter=TwoFactor`, `--filter=BladeComponentAttributes`
      7. Suite completa: `php artisan test --compact`

      ## Completion Criteria
      - [x] Test di regressione sull'espressione `wire:click` resa nell'elenco dei rilasci
      - [x] Test di regressione sulle etichette rese nella sfida 2FA
      - [x] Test di guardia che fallisce su `@js(` dentro un attributo di componente in tutto `resources/views`
      - [x] Guardia verificata rimettendo temporaneamente la forma difettosa
      - [x] Asserzioni preesistenti di `ReleaseIndexScreenTest` invariate e verdi
      - [x] Suite completa verde

