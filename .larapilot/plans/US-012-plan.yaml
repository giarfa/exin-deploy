    id: TASK-02
    title: "Ripristinare l'etichetta del comando di scambio nella sfida 2FA"
    body: |-
      ## Description
      Fix: nella sfida 2FA il comando che scambia codice dell'app e codice di recupero usa `@js()` dentro `x-text` su `<flux:link>` — stessa causa di TASK-01: l'espressione Alpine arriva al browser non compilata e il comando resta senza testo.

      Qui l'interpolazione `{{ }}` **non** è sufficiente: `auth.two_factor_use_code` vale `Usa il codice dell'app di autenticazione` e l'apice, ridecodificato dal browser, romperebbe la stringa JavaScript. Si eliminano le stringhe JavaScript invece di inseguirne l'escaping.

      ## Files Involved
      - `resources/views/auth/two-factor-challenge.blade.php`

      ## Steps
      1. Sostituire l'attributo `x-text` con due `<span>` alternati dentro il corpo del comando:
         - `<span x-show="! recovery">{{ __('auth.two_factor_use_recovery') }}</span>`
         - `<span x-show="recovery" x-cloak>{{ __('auth.two_factor_use_code') }}</span>`
      2. Trasformare `<flux:link … />` in tag aperto e chiuso per ospitare il corpo; conservare `as="button"`, `type="button"`, `class="text-sm"` e `x-on:click="recovery = ! recovery"`
      3. `x-cloak` sul secondo span, coerentemente con i due blocchi di campo già presenti nella pagina: prima dell'avvio di Alpine deve comparire una sola etichetta, quella corretta
      4. Non aggiungere `@js()` nell'`x-data` di `<flux:card>`: è a sua volta un attributo di componente, la trappola sarebbe la stessa
      5. Verificare a mano la pagina della sfida in entrambi gli stati, con la console aperta
      6. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] Il comando mostra "Usa un codice di recupero" allo stato iniziale e "Usa il codice dell'app di autenticazione" dopo il click
      - [x] Nessun errore Alpine in console sulla pagina della sfida
      - [x] Il campo mostrato segue il comando, come prima: codice dell'app oppure codice di recupero
      - [x] Nessuna etichetta doppia visibile prima dell'avvio di Alpine

      ## Test Data
      - N/A — nessuna modifica a schema o modelli

      ## Git Deliverables
