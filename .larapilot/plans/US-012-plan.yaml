    id: TASK-01
    title: "Rendere operativi i filtri di stato nell'elenco dei rilasci"
    body: |-
      ## Description
      Fix: i bottoni "Tutte", "In corso" e "Conclusa" su `/rilasci` non producono alcuna richiesta Livewire perché `@js()` non viene compilato dentro l'attributo di un componente Blade. Sostituire con l'interpolazione `{{ }}`, che il compilatore dei tag converte in concatenazione e che quindi sopravvive.

      ## Files Involved
      - `resources/views/components/releases/⚡index.blade.php`

      ## Steps
      1. Nel `@foreach` sui filtri, sostituire
         `wire:click="$set('statusFilter', @js($filter['value']))"`
         con
         `wire:click="$set('statusFilter', '{{ $filter['value'] }}')"`
      2. Aggiungere accanto una nota breve sul perché dell'interpolazione — la forma con `@js()` è quella che un lettore scriverebbe d'istinto, e senza nota tornerebbe alla prima modifica
      3. Non introdurre metodi pubblici nuovi sul componente: in Livewire sarebbero azioni invocabili dal browser, e il componente documenta già perché li evita
      4. Lasciare invariati `#[Url]`, `selectedStatus()`, `showsInProgress()`, `showsCompleted()` e le due query: il difetto è solo nel cablaggio del bottone
      5. Verificare la vista compilata: `php artisan view:clear`, ricaricare `/rilasci`, controllare che l'attributo reso contenga `$set('statusFilter', 'in_corso')`
      6. `php artisan test --compact tests/Feature/Releases/ReleaseIndexScreenTest.php` — deve restare verde
      7. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] Premendo "In corso" resta la sola sezione in corso; "Conclusa" il solo storico; "Tutte" entrambe
      - [x] L'indirizzo acquisisce `?stato=in_corso` / `?stato=conclusa` e un indirizzo incollato riapre l'elenco già filtrato
      - [x] Il bottone attivo conserva `aria-pressed="true"` e la variante `primary`; gli altri `aria-pressed="false"`
      - [x] Stato e progetto si combinano: le due scelte si applicano insieme
      - [x] Nessun errore in console su `/rilasci`, né al caricamento né al click
      - [x] `ReleaseIndexScreenTest` verde senza modifiche alle asserzioni esistenti

      ## Test Data
      - N/A — nessuna modifica a schema o modelli

      ## Git Deliverables
      - Commit: `fix(US-012): TASK-01 filtri di stato dell'elenco dei rilasci`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
