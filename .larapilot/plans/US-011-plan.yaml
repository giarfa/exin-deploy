code: US-011
plan_body: |-
  ## Soluzione tecnica

  `DatabaseSeeder` semina gia team, ruoli, template, progetti e mappature. Manca lo scenario di
  **esecuzione**: una release a meta catena e una conclusa, con i valori forniti e il registro
  delle transizioni popolato. Nessuna nuova factory e nessuna migrazione: le factory dei singoli
  modelli restano di competenza delle rispettive spec, qui si compone lo scenario.

  **Lo scenario passa dalle Action reali** — `StartRelease` e `CloseStep` — e non da scritture
  esplicite. E una **deroga dichiarata** alla convenzione che il seeder stesso enuncia ("descrive
  lo stato finale voluto invece di simulare il percorso dell'interfaccia"), e la ragione e che
  qui le due cose non coincidono:

  - la configurazione e uno **stato**: quale template e predefinito, chi copre quale ruolo. Si
    dichiara, e dichiararlo e piu chiaro che ricostruirlo;
  - un rilascio e un **processo**: il suo stato *e* la sequenza di transizioni che lo ha
    prodotto. Scriverlo a mano significherebbe replicare nel seeder lo snapshot, la risoluzione
    dei responsabili, l'invariante dello step attivo unico, i valori congelati e i payload di
    cinque tipi di evento — cioe reimplementare il dominio in un secondo posto, destinato a
    divergere al primo cambiamento. Il criterio "registro popolato" e proprio quello che una
    scrittura a mano falsificherebbe meglio: righe di forma giusta e contenuto inventato.

  Il seeder resta quindi dichiarativo sui **dati** (chi rilascia cosa, con quali valori) e
  delegante sul **comportamento**.

  **Scenario prodotto:**

  | Release | Progetto | Stato |
  | --- | --- | --- |
  | `v2.4.0` | Portale Clienti | in corso: primo step chiuso con valori realistici, secondo attivo |
  | `v2.3.0` | Portale Clienti | conclusa: tutti e cinque gli step chiusi, registro completo |
  | `2026.08.1` | Gestionale Magazzino | in corso: appena avviata, primo step attivo |

  La terza non e un di piu: e l'unica forma in cui lo step attivo e il **primo** della catena,
  dove `ReleaseStep::activationInstant()` ripiega su `release.started_at`. E il ramo che le
  schermate operative percorrono su ogni rilascio appena avviato, e un ambiente dimostrativo che
  non lo contenesse lo lascerebbe non verificabile a mano.

  **Istanti** — le release non nascono tutte "adesso": il seeder le sposta indietro nel tempo
  (`started_at`, `completed_at` degli step) cosi che le schermate mostrino durate plausibili —
  "aperto da 2 giorni" invece di "aperto da 0 secondi", e uno storico con date distinte da
  ordinare. Le colonne di conclusione non sono assegnabili in massa e vanno scritte con
  `forceFill` (vedi `.ai/rules/tests.md`), oppure lasciate all'Action che le possiede.

  **Valori dei campi** — coerenti col tipo e col dominio: un link e un indirizzo `https://`, una
  conferma e spuntata, i testi sono frasi di rilascio vere. Nessun `lorem ipsum`, che il criterio
  esclude esplicitamente.

  ## Decisioni

  **Le release del seeder non usano il template disattivato.** "Rilascio urgente" resta senza
  release: e li per dimostrare il filtro dell'elenco template e la sostituibilita del processo,
  e avviarci sopra una release ne farebbe un caso che l'applicazione non permette di creare
  (`StartRelease` rifiuta un template disattivato).

  **Un solo membro disattivato, e senza ruoli sui progetti.** Paolo Venturi resta fuori dalle
  mappature: assegnargli un ruolo renderebbe i progetti non avviabili e il primo comando che
  chiunque prova in ambiente dimostrativo — "avvia una release" — risponderebbe con un rifiuto.

  **Nessun tentativo non autorizzato seminato.** Il registro dimostrativo contiene le quattro
  transizioni di processo ma non un tentativo rifiutato: seminare la traccia di qualcuno che ha
  provato a fare qualcosa che non poteva, con il nome di una persona reale del team
  dimostrativo, e una riga che in un ambiente condiviso si presta a essere letta male. Chi vuole
  vederla la produce in trenta secondi aprendo uno step altrui.

  ## Git & Branching

  - Mode: `GITFLOW` (nessun push automatico)
  - Precondizione: US-009 e US-010 sono in `REVIEW` e non ancora integrate — TASK-00 rami dalla
    punta di US-010, perche lo scenario dimostrativo popola il registro che quella spec rende
    consultabile e va verificato sulle schermate che entrambe hanno introdotto
  - Branch: `feature/US-011-ambiente-dimostrativo` dalla punta di US-010
  - Un solo commit per task, Conventional Commits con codice spec e task
  - PR verso `develop` preparata localmente; nessun push finche l'utente non lo chiede

  ## Strategia dei dati di prova

  - **Nessuna nuova factory**: il criterio lo dice esplicitamente. Gli stati esistenti bastano,
    e lo scenario passa dalle Action.
  - `php artisan migrate:fresh --seed` deve completare senza errori ed essere **ripetibile**.
  - Attenzione a `WithoutModelEvents` gia attivo sul seeder: verificare che le Action producano
    comunque chiavi UUID e righe di registro, e rimuoverlo se lo impedisce — documentando il
    perche.

  ## Strategia di test

  - Bar: `NORMAL` — Pest/PHPUnit feature.
  - `DatabaseSeederTest` — esegue il seeder e verifica lo scenario: numeri e livelli dei membri,
    progetti con mappatura completa, template con cinque step e quattro tipi di campo, una
    release a meta catena con il secondo step attivo e valori sul primo, una conclusa con
    registro popolato, una appena avviata.
  - Verifiche di coerenza che valgono piu dei conteggi: **nessun record orfano** (nessuno step
    senza responsabile, nessun campo obbligatorio vuoto su uno step chiuso), **nessun lorem
    ipsum** in alcun campo di testo seminato, e l'invariante di dominio — al massimo uno step
    attivo per release, zero sulle concluse.
  - Il seeder e eseguito **una volta sola** per classe di test dove possibile: e l'operazione
    piu lenta della suite.

  ## Verifica manuale (handoff)

  1. `php artisan migrate:fresh --seed`, accedi come `f.giarola@gruppoexcellence.com`.
  2. "I miei step" deve mostrare qualcosa in carico e il blocco delle release in attesa
     popolato; l'elenco deve avere due sezioni non vuote; il dettaglio di `v2.3.0` deve mostrare
     la catena tutta chiusa e il suo registro le quattro transizioni.
  3. Ripeti `migrate:fresh --seed`: deve completare identico, senza errori di unicita.
