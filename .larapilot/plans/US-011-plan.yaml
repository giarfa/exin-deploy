    id: TASK-03
    title: 'Changelog, README e regola sul seeder'
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Description
      Documentazione di baseline: cosa trova chi esegue il seeder, e perche lo scenario di esecuzione
      e costruito diversamente dal resto.

      ## Files Involved
      - CHANGELOG.md
      - README.md
      - .ai/rules (tramite `record-rule`)

      ## Steps
      1. `CHANGELOG.md` Unreleased: ambiente dimostrativo completo (US-011, FR-018), con l'elenco di
         cio che si trova dopo il seed.
      2. `README.md`: la sezione di avvio locale dichiara oggi che l'ambiente nasce **senza release**
         e che per provarne una bisogna avviarla a mano — non e piu vero e va riscritto, altrimenti
         chi legge cerca un problema che non esiste. Descrivi le tre release e cosa ciascuna serve a
         dimostrare.
      3. `record-rule` sul seeder: la distinzione fra configurazione dichiarata e processo delegato
         alle Action, con la ragione. E la scelta che la prossima revisione leggerebbe come
         incoerenza — meta seeder scrive stati, meta chiama Action.

      ## Completion Criteria
      - [x] Changelog e README aggiornati, senza affermazioni superate
      - [x] Regola registrata sul seeder

