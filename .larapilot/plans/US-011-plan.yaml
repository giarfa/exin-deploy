    id: TASK-01
    title: 'Scenario di esecuzione nel seeder'
    type: Impl
    status: DONE
    dependencies:
      - TASK-00
    body: |-
      ## Description
      Compone nel `DatabaseSeeder` lo scenario di esecuzione: tre release che coprono le forme che
      le schermate devono saper mostrare — una a meta catena, una conclusa, una appena avviata.

      Passa dalle **Action reali** e non da scritture esplicite. E una deroga dichiarata alla
      convenzione del seeder, e va scritta come tale nel codice: la configurazione e uno stato che si
      dichiara, un rilascio e un processo il cui stato *e* la sequenza di transizioni che lo ha
      prodotto. Ricostruirlo a mano significherebbe replicare snapshot, risoluzione dei responsabili,
      invariante dello step attivo e payload di cinque tipi di evento in un secondo posto.

      ## Files Involved
      - database/seeders/DatabaseSeeder.php

      ## Steps
      1. Metodo `seedReleases()`, chiamato per ultimo in `run()`.
      2. Valori per campo **coerenti col tipo e col dominio**: un link e un indirizzo `https://`
         plausibile, una conferma e spuntata, i testi sono frasi di rilascio vere. Il criterio
         esclude esplicitamente il lorem ipsum. Indicizzali per **etichetta** del campo e non per
         posizione: le posizioni sono un dettaglio del template e cambiano, le etichette sono cio
         che il seeder sta rispondendo.
      3. Sposta indietro gli istanti (`started_at`, e i `completed_at` degli step chiusi) cosi che
         le schermate mostrino durate plausibili invece di "aperto da 0 secondi". Le colonne di
         conclusione non sono assegnabili in massa: `forceFill` (vedi `.ai/rules/tests.md`).
      4. La terza release — appena avviata, ferma sul **primo** step — non e un di piu: e l'unica
         forma in cui `activationInstant()` ripiega su `release.started_at`, cioe il ramo che ogni
         rilascio nuovo percorre. Un ambiente dimostrativo che non lo contenesse lo lascerebbe non
         verificabile a mano.
      5. Nessuna release sul template disattivato: `StartRelease` lo rifiuta, e un ambiente
         dimostrativo che contenga uno stato irriproducibile dall'applicazione mente.
      6. Verifica `WithoutModelEvents`: se impedisce alle Action di produrre chiavi UUID o righe di
         registro, va rimosso o circoscritto — documentando il perche nel codice.
      7. `php artisan migrate:fresh --seed`, due volte di seguito.
      8. `php artisan larapilot:quality --fix`

      ## Completion Criteria
      - [x] `migrate:fresh --seed` completa senza errori, ed e ripetibile
      - [x] Una release a meta catena, una conclusa, una appena avviata
      - [x] Registro delle transizioni popolato dalle Action, non scritto a mano
      - [x] Nessun lorem ipsum, nessun record orfano
      - [x] Pint e Larastan (livello 5) passano

      ## Test Data
      - [x] Nessuna nuova factory: il criterio riserva le factory dei singoli modelli alle rispettive
            spec, e qui si compone soltanto lo scenario
      - [x] `migrate:fresh --seed` verificato prima di `task-done`

      ## Git Deliverables
      - Commit: `feat(US-011): TASK-01 scenario di esecuzione nell'ambiente dimostrativo`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
