    id: TASK-02
    title: 'Copertura dello scenario dimostrativo'
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Description
      Il seeder e l'unica parte del progetto che nessun test tocca oggi, ed e quella che ogni nuovo
      sviluppatore esegue per prima: se si rompe, si rompe nel momento peggiore.

      ## Files Involved
      - tests/Feature/DatabaseSeederTest.php (nuovo)

      ## Steps
      1. Esegui il seeder una volta per classe dove possibile: e l'operazione piu lenta della suite.
      2. Casi sui numeri dichiarati dal criterio: un amministratore e almeno quattro membri con ruoli
         distinti; due progetti attivi con mappatura completa per il template associato; il template
         "Rilascio standard" con cinque step e i **quattro** tipi di campo rappresentati.
      3. Casi sullo scenario di esecuzione: una release in corso con il primo step chiuso e valori
         presenti e il secondo attivo; una conclusa con tutti gli step chiusi e il registro
         popolato; l'invariante di dominio — al massimo uno step attivo per release, **zero** sulle
         concluse.
      4. Verifiche che valgono piu dei conteggi, perche non si rompono con lo scenario ma con la
         sua qualita: **nessun record orfano** (nessuno step senza responsabile, nessun campo
         obbligatorio vuoto su uno step chiuso) e **nessun lorem ipsum** in alcun campo di testo
         seminato — il criterio lo chiede a parole, e a parole si verifica.
      5. `php artisan test --filter=DatabaseSeeder`

      ## Completion Criteria
      - [x] Ogni criterio di accettazione ha un test
      - [x] I test passano

      ## Git Deliverables
      - Commit: `test(US-011): TASK-02 copertura dello scenario dimostrativo`
      - Push: **saltato** (`git_mode: GITFLOW`)
      - PR: aggiornata in locale
