    id: TASK-01
    title: 'StartRelease accetta gli override e risolve la mappatura effettiva in una query batch'
    body: |-
      ## Description
      Aggiungere a `StartRelease::handle()` il parametro `overrides` (array `role_id` => `user_id`, sempre presente, default vuoto) e far risolvere a `responsibles()` la mappatura **effettiva**: l'override sostituisce integralmente il responsabile di progetto per il ruolo indicato, copre i ruoli scoperti, e resta soggetto al rifiuto per persona disattivata. Zero modifiche di schema, zero scritture sulle tabelle di mappatura.

      ## Files Involved
      - app/Actions/Releases/StartRelease.php
      - app/Exceptions/RolesWithoutResponsible.php (solo docblock)
      - app/Exceptions/InactiveResponsibleOnProject.php (solo docblock)

      ## Steps
      1. Firma: `public function handle(Project $project, string $label, User $actor, array $overrides = []): Release`. Docblock con array shape `array<string, string>` e i due `@throws` esistenti invariati. Verificare che i due chiamanti attuali (`database/seeders/DatabaseSeeder.php:493`, `resources/views/components/releases/⚡start.blade.php:144`) restino validi senza modifiche.
      2. Passare `$overrides` a `responsibles($project, $template, $overrides)`.
      3. In `responsibles()`, igiene dell'input: tenere solo le chiavi che corrispondono a un `role_id` previsto dagli step del template; scartare valori vuoti. Commentare che e difesa al confine, non regola di prodotto: dalla UI il caso e chiuso dal `Rule::in` sul select.
      4. Risolvere le persone indicate con **una sola query batch**: `User::query()->whereIn('id', array_unique(array_values($overrides)))->get()->keyBy('id')`, eseguita solo quando l'array non e vuoto. Nessuna query per ruolo. Un identificativo che non risolve **non e un override**: si scarta, e il ruolo torna a dipendere dalla mappatura di progetto con le precondizioni odierne.
      5. Ruoli scoperti: `$project->uncoveredRoles()` al netto dei ruoli con un override risolto. Se l'insieme residuo non e vuoto, `throw RolesWithoutResponsible::on($project, $residuo)` — l'eccezione nomina quindi i soli ruoli davvero scoperti.
      6. Persona effettiva per ruolo: override quando presente, altrimenti `$byRole->get($roleId)->user`. Nessun ripiego sul dato di progetto per un ruolo overridden.
      7. Controllo dei disattivati sull'insieme **effettivo**, dopo il controllo dei ruoli scoperti (ordine odierno preservato): `throw InactiveResponsibleOnProject::on($project, $inattivi)` con lo stesso errore di oggi, sia che la persona disattivata arrivi dal progetto sia che arrivi da un override.
      8. Aggiornare il docblock di `responsibles()` e quello delle due classi di eccezione: oggi dichiarano che l'elenco e calcolato sulla mappatura di progetto, e da qui in poi e calcolato al netto degli override. **Nessuna modifica alla forma delle eccezioni**: costruttore, campi pubblici e firma di `on()` restano identici.
      9. Verifiche di non-modifica dichiarate dal piano: il payload di `ReleaseEvent` a riga 142 resta `label` / `template` / `steps`; nessun caso nuovo in `App\Enums\ReleaseEventAction`; nessuna scrittura su `ProjectRoleAssignment` o `DefaultRoleAssignment`; nessuna migrazione.
      10. `vendor/bin/pint --dirty --format agent`
      11. `php artisan test --compact tests/Feature/Releases/StartReleaseTest.php` — la suite senza override deve passare **senza modifiche al file**: e la prova che il default vuoto conserva il comportamento.

      ## Test Data
      - N/A — nessun modello, nessuna migrazione, nessun cambio di relazione. Il seeder resta invariato per decisione (cella `DatabaseSeeder.php:411`).

      ## Git Deliverables
      - Commit: `feat(US-013): TASK-01 risoluzione dei responsabili con override per singola release`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare la descrizione locale

      ## Completion Criteria
      - [x] `handle()` accetta `overrides` con default vuoto e i due chiamanti esistenti non sono stati modificati
      - [x] Un override sostituisce integralmente il responsabile di progetto per quel ruolo, senza ripiego
      - [x] Un ruolo scoperto coperto da un override valido non compare piu in `RolesWithoutResponsible`
      - [x] Un responsabile disattivato sostituito da un override attivo non compare piu in `InactiveResponsibleOnProject`
      - [x] Un override verso una persona disattivata e rifiutato con `InactiveResponsibleOnProject`
      - [x] Le persone indicate come override si risolvono in una sola query `whereIn`
      - [x] Payload dell'evento, enum, Policy, schema e seeder invariati
      - [x] `StartReleaseTest.php` passa senza essere stato toccato
      - [x] Pint pulito
