    body: |-
      ## Description
      Nell'elenco progetti il comando "avvia release" resta raggiungibile quando il blocco riguarda ruoli scoperti o responsabili disattivati: l'utente entra nella schermata di avvio, dove il form obbliga a fornire un override per i ruoli bloccanti. Resta disabilitato per i blocchi che un override non risolve.

