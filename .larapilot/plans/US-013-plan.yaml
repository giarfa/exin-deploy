      ## Steps
      1. `CHANGELOG.md`, sezione Unreleased, voce `Added`: in fase di creazione di una release il responsabile di ciascun ruolo e sovrascrivibile per quella sola release, senza toccare la mappatura di progetto ne i default di team.
      2. Registrare la regola durevole con il tool `record-rule` di Boost, glob `resources/views/components/releases/**`: la mappatura **effettiva** del form di avvio si ottiene sovrapponendo istanze `ProjectRoleAssignment` non persistite alla relazione `assignments` di un clone del progetto, cosi `uncoveredRoles()`, `inactiveResponsibles()` e `startBlocker()` ricalcolano senza che la regola venga duplicata nel componente. Annotare la trappola: le istanze non vanno mai salvate, e il clone serve a non contaminare `$this->project`, che deve continuare a descrivere lo stato persistito.
      3. Se il tool non e disponibile, aggiungere la stessa voce a mano in `.ai/rules/components-releases.md` e verificare che `.ai/rules/index.md` copra gia il glob (lo copre).
      4. `php artisan larapilot:quality` — Pint + Larastan livello 5. Correggere i rilievi; non abbassare il livello.
      5. `php artisan test --compact` — suite completa, per escludere regressioni fuori dal perimetro.
      6. Nessuna documentazione estesa: la spec non ha registrato deliverable oltre la baseline, e non ci sono rotte API pubbliche che tocchino OpenAPI.

