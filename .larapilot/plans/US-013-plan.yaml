    id: TASK-02
    title: "Etichette e messaggi dell'override nel namespace releases"
    body: |-
      ## Description
      Aggiungere in `lang/it/releases.php` le etichette e i messaggi dell'override: titolo della sezione dei responsabili nel form, etichetta e testo di aiuto del select per ruolo, marcatura del valore predefinito, indicazione del responsabile disattivato in elenco, richiesta di un override per un ruolo bloccante, indicazione accanto al comando di avvio in elenco progetti, nota informativa sulla mappatura di progetto.

      Tutte le chiavi nuove vivono nel namespace **`releases` esistente** (cella `lang/it/releases.php`), inclusa quella resa dalla schermata progetti: e una scelta decisa, e la nota nel file la dichiara perche altrimenti sembrerebbe una chiave finita nel posto sbagliato.

      ## Files Involved
      - lang/it/releases.php

      ## Steps
      1. Aggiungere le chiavi in un blocco commentato subito dopo quelle delle precondizioni, seguendo lo stile del file (commento che spiega **perche** la stringa dice quello che dice, non cosa fa il codice).
      2. Chiavi previste (nomi da confermare in implementazione, prefisso coerente con le esistenti):
         - `override_heading` — titolo della sezione dei responsabili nel form di avvio
         - `override_explained` — l'override vale solo per questa release e non modifica la mappatura del progetto
         - `override_role_label` — etichetta del select per ruolo
         - `override_default_option` — marcatura della persona risolta dalla mappatura di progetto
         - `override_unassigned_option` — nessuna persona scelta, per un ruolo scoperto
         - `override_required` — messaggio di validazione: questo ruolo non ha un responsabile di progetto, indicane uno per avviare
         - `override_inactive_person` — la persona scelta e disattivata
         - `start_needs_override` — indicazione accanto al comando in elenco progetti: si entra nel form e si indica un responsabile
