    id: TASK-08
    title: 'Test della schermata: selettori, rifiuti per campo, autorizzazione e le due asserzioni di US-004 che cambiano'
    body: |-
      ## Descrizione
      Copertura PHPUnit del modulo di avvio e dell'autorizzazione, piu l'aggiornamento delle due asserzioni di US-004 che la decisione sulle precondizioni rende obsolete. Bar `NORMAL`: verifica dell'HTML reso e delle interazioni Livewire, nessun browser.

      ## File coinvolti
      - `tests/Feature/Releases/StartReleaseOverrideScreenTest.php` (nuovo)
      - `tests/Feature/Releases/StartReleaseScreenTest.php` (due asserzioni aggiornate)

      ## Passi
      1. `php artisan make:test --phpunit StartReleaseOverrideScreenTest --no-interaction`, poi spostalo in `tests/Feature/Releases/`
      2. Casi da coprire:
         - i selettori elencano i **ruoli** del processo, ciascuno una sola volta anche quando un ruolo e usato da due step
         - ogni selettore e precompilato con il responsabile risolto dalla mappatura
         - un membro disattivato **non** compare fra le opzioni
         - un ruolo senza predefinito compare vuoto e la pagina dice che va indicato un responsabile
         - avvio senza toccare i selettori: release identica al comportamento odierno
         - avvio con override su un ruolo: tutti gli step di quel ruolo alla persona scelta
         - ruolo scoperto: avviso presente e comando di avvio **abilitato**; fornendo un responsabile la release parte
         - ruolo lasciato vuoto: errore agganciato a `responsibles.{roleId}` con il **nome del ruolo** nel messaggio, nessuna release creata
         - payload manipolato — ruolo non previsto dal processo, membro disattivato, membro inesistente — rifiutato con nessuna release creata
         - precondizioni coerenti dopo un rifiuto, e selezioni dell'utente conservate
         - doppio invio: messaggio di etichetta duplicata, nulla lasciato dietro
         - un utente non amministratore non puo avviare ne inviare override (`ReleasePolicy::create`): rifiuto anche invocando l'azione Livewire direttamente, non solo con il comando nascosto
         - `startAnother()` riporta i selettori sui predefiniti freschi
         - budget: nessuna query per ruolo ne per membro nel disegno della pagina, con un processo a molti ruoli e molti membri attivi (riusa `queriesWhile()` come nelle suite esistenti)
      3. Sul tracciamento del tentativo non autorizzato: **verifica cosa fa oggi US-004** prima di scrivere l'asserzione. Il registro delle transizioni si aggancia a una release, e in avvio la release non esiste ancora — il criterio dice "tracciato **come gia previsto** da FR-016", quindi non introdurre un percorso di tracciamento nuovo: asserisci il comportamento esistente, non uno desiderato
      4. Aggiorna in `StartReleaseScreenTest` le due asserzioni rese obsolete dalla decisione registrata:
         - `test_a_project_without_a_responsible_shows_the_reason_and_disables_the_command` -> avviso presente, comando **abilitato**, scelta richiesta sul ruolo
         - `test_an_inactive_responsible_blocks_the_start_and_is_named` -> la persona disattivata e nominata, il selettore del suo ruolo e vuoto, il comando e abilitato
         Aggiorna anche il commento sopra ciascuna: la ragione del cambio e FR-029, e senza scriverlo qui il prossimo lettore le ripristinera
      5. Le altre asserzioni di `StartReleaseScreenTest` non si toccano
      6. Trappola `.ai/rules/tests.md`: in questo progetto `session('errors')` e un array, e quando un'asserzione sulla risposta fallisce il messaggio riportato ("Call to a member function all() on array") **non** e il bug. Per capire il motivo vero leggi `json_encode(session('errors'))` a mano
      7. `php artisan test tests/Feature --compact` — l'intera suite verde

      ## Criteri di completamento
