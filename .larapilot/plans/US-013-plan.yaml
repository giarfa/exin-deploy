    id: TASK-01
    title: 'Snapshot: colonna responsible_overridden su release_steps, con factory e seeder'
    body: |-
      ## Descrizione
      Aggiungi allo snapshot il fatto che il responsabile di uno step e stato **indicato in avvio** invece che ereditato dalla mappatura del progetto. Una colonna booleana su `release_steps`, non una tabella di override: il dettaglio della release deve poter disegnare la segnalazione senza join e senza tornare a leggere le entita di definizione (invariante 4 del PRD, `.ai/rules/app.md`).

      In questo task la colonna nasce e resta sempre `false`: la scrive TASK-02. Serve prima perche Action, schermata, dettaglio e registro dipendono tutti da lei.

      ## File coinvolti
      - `database/migrations/xxxx_add_responsible_overridden_to_release_steps_table.php` (nuova)
      - `app/Models/ReleaseStep.php` (`#[Fillable]` + cast booleano + PHPDoc `@property`)
      - `database/factories/ReleaseStepFactory.php`
      - `database/seeders/DatabaseSeeder.php` (solo se la factory richiede un allineamento; la release con override e di TASK-09)

      ## Passi
      1. `php artisan make:migration add_responsible_overridden_to_release_steps_table --no-interaction`
      2. Colonna `boolean('responsible_overridden')->default(false)` — **nessun indice**: non e una colonna di filtro ne di ordinamento, e su SQLite un indice booleano a bassa selettivita non paga (`.ai/rules/general.md`: solo migrazioni portabili, nessuna funzione SQLite-specifica). Migrazione reversibile con `dropColumn`
      3. Il default `false` e cio che rende la migrazione applicabile alle release gia esistenti senza backfill: uno step storico non e stato sovrascritto, e dichiararlo e corretto — non un ripiego
      4. `ReleaseStep`: aggiungi la colonna a `#[Fillable]` (la scrive `StartRelease` via `insert()`, quindi il cast conta piu del fillable, ma l'incoerenza fra i due sarebbe una trappola) e il cast `'responsible_overridden' => 'boolean'`; annota `@property bool $responsible_overridden`
      5. `ReleaseStepFactory`: campo con default `false`, piu uno stato `overriddenResponsible()` che lo porta a `true` — serve ai test del dettaglio senza passare da un avvio completo
      6. `php artisan migrate:fresh --seed` e verifica che il seed produca un ambiente coerente
      7. `php artisan test --filter=ReleaseSchemaConstraintsTest` e `--filter=DatabaseSeederTest`

      ## Criteri di completamento
      - [x] Migrazione applicata e reversibile; nessuna funzione SQLite-specifica
      - [x] `ReleaseStep` espone la colonna con cast booleano e PHPDoc allineato
      - [x] `ReleaseStepFactory` produce `false` per default e `true` con lo stato dedicato
      - [x] `migrate:fresh --seed` verde
      - [x] `ReleaseSchemaConstraintsTest` e `DatabaseSeederTest` verdi

      ## Dati di test
      - [x] `database/factories/ReleaseStepFactory.php` aggiornata **in questo stesso task** della migrazione
      - [x] Stato di factory `overriddenResponsible()` disponibile per i test di interfaccia
      - [x] Seeder verificato con `migrate:fresh --seed` (il caso dimostrativo con override e di TASK-09)

      ## Consegne Git
      - Commit: `feat(US-013): TASK-01 add responsible_overridden to release steps snapshot`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiorna le note locali della PR
