code: US-013
plan_body: |-
  ## Soluzione tecnica

  L'override e **risolto in avvio e congelato nello snapshot**: nessun percorso di esecuzione torna a leggere `project_role_assignments` a release avviata (invariante 4 del PRD, `.ai/rules/app.md`). Questo fissa tre scelte portanti.

  **1. Una colonna sullo snapshot, non una tabella di override.** `release_steps.responsible_overridden` (booleano, default `false`) dice se il responsabile di quello step e stato *indicato in avvio* invece che ereditato dalla mappatura. Una tabella `release_responsible_overrides` sarebbe un secondo posto da interrogare per rispondere a una domanda che lo step gia porta con se, e il dettaglio della release (US-008) dovrebbe fare una join per disegnare un'icona. Scartata anche l'alternativa di ricavare il flag dal payload dell'evento di avvio: il dettaglio non legge il registro, e farlo introdurrebbe una dipendenza fra due schermate che oggi non si conoscono.

  **2. Firma additiva su `StartRelease`.** `handle(Project $project, string $label, User $actor, array $responsibleOverrides = [])`, con `array<string, string>` ruolo => persona. Il default `[]` e cio che tiene verdi i chiamanti esistenti — `DatabaseSeeder::seedReleases()`, `StartReleaseTest`, `StartReleaseQueryBudgetTest`, `SnapshotIsolationTest`, `ReleaseLogScreenTest` — senza riscriverli per accomodare la nuova firma (criterio di accettazione esplicito). `StartRelease` resta l'**unico percorso di avvio**: la schermata non risolve nulla da se e non decide cosa sia un override.

  **3. La schermata propone, l'Action decide.** Il componente valida i selettori per dare un messaggio agganciato al campo del ruolo (caso normale), l'Action rivalida sul dato fresco ed e l'unica autorita (payload manipolato, e finestra di corsa fra riepilogo e scrittura — lo stesso trattamento gia adottato per gli altri rifiuti in `⚡start.blade.php`). Il componente passa **tutte** le persone selezionate: e l'Action a calcolare quali differiscono dal default, cosi la regola "cos'e un override" vive in un posto solo. Un selettore lasciato sulla persona predefinita non e un override: non alza il flag e non compare nel payload dell'evento.

  ### Precondizioni: da blocco ad avviso

  Decisione registrata (`larapilot:decision-log`, US-013): **ruolo scoperto** e **responsabile predefinito disattivato** smettono di bloccare l'avvio, perche sono esattamente i casi che l'override esiste per coprire. `Project::startBlocker()` conserva quindi solo: progetto disattivato, processo mancante, processo disattivato o senza step — le regole che nessun override puo sanare. `uncoveredRoles()` e `inactiveResponsibles()` restano invariati e diventano **avvisi** sulla schermata di avvio e sull'elenco progetti.

  Conseguenza dichiarata: due test schermata di US-004 (`test_a_project_without_a_responsible_shows_the_reason_and_disables_the_command`, `test_an_inactive_responsible_blocks_the_start_and_is_named`) cambiano asserzione da "comando disabilitato con il motivo" a "avviso non bloccante + scelta richiesta sul ruolo". Non e un adattamento alla nuova firma: e la regola di dominio che cambia, ed e per questo che il criterio "i test di US-004 restano verdi" vale sulla suite dell'Action (`StartReleaseTest`, dove il default `[]` riproduce il comportamento odierno riga per riga), non su queste due asserzioni di interfaccia.

  ### Granularita e ordine dei selettori

  L'unita e il **ruolo funzionale**: un ruolo usato da due step compare una sola volta e la scelta vale su entrambi (coerente con `.ai/rules/models.md` — il cumulo di ruoli e la norma, e uno snapshot che non lo reggesse sarebbe inutile). L'ordine dei selettori segue la **posizione del primo step che usa quel ruolo**, non l'alfabeto: la schermata racconta la catena, e un ordine alfabetico costringerebbe a ricostruirla a mente.

  ### Ammissibilita e superficie di rifiuto

  | Caso | Chi rifiuta | Come si presenta |
  | --- | --- | --- |
  | Ruolo lasciato senza responsabile | Componente (validazione) + Action (`RolesWithoutResponsible`) | Errore sul campo di **quel** ruolo, col nome del ruolo |
  | Persona inesistente | Componente (`AssignableUser`) + Action | Errore sul campo del ruolo |
  | Persona disattivata | Componente (`AssignableUser`) + Action | Errore sul campo del ruolo, con il nome della persona |
  | Ruolo non previsto dal processo | Componente (`only()` sulle chiavi ammesse) + Action | Rifiuto: payload manipolato, nessun campo a cui agganciarlo |
  | Progetto disattivato / processo inutilizzabile | Action, come oggi | Messaggio in testa, comando disabilitato |

  `AssignableUser` (`app/Rules/AssignableUser.php`) e riusata cosi com'e: distingue gia inesistente da disattivato, che si risolvono in modi diversi. Sul versante Action serve una nuova eccezione che porti i **ruoli** e non solo i nomi delle persone, perche il messaggio va agganciato al campo giusto.

  ### Autorizzazione

  Nessun nuovo permesso: gli override sono ammessi a chi puo gia avviare (`ReleasePolicy::create`, concessa dal solo filtro `before()` agli amministratori). `Gate::authorize` resta al montaggio e su ogni azione Livewire — le azioni Livewire non ripassano dal middleware di rotta.

  ### Prestazioni

  - La schermata carica ruoli, assegnazioni e membri attivi con eager loading: nessuna query per ruolo mentre la vista disegna i selettori, e nessuna al crescere del numero di membri (una sola lista di persone selezionabili, riusata da tutti i selettori).
  - L'Action carica le persone degli override con **una** query `whereIn`: il costo dell'avvio resta indipendente dalla lunghezza della catena e dal numero di override (budget gia sotto test in `StartReleaseQueryBudgetTest`).
  - Il flag sul dettaglio della release non costa nulla: la colonna arriva con lo step gia caricato.

  ### Trappole del progetto da rispettare

  - `.ai/rules/views.md` — nessuna direttiva Blade dentro l'attributo di un componente. `wire:model="responsibles.{{ $role->id }}"` e interpolazione diretta di un UUID senza apici: forma corretta. `tests/Unit/Views/BladeComponentAttributesTest.php` scandisce le viste da se.
  - `.ai/rules/seeders.md` — i rilasci si seminano chiamando le Action, mai scrivendo righe: la release dimostrativa con override passa da `StartRelease`.
  - `.ai/rules/tests.md` — `session('errors')` e un array in questo progetto: quando un'asserzione sulla risposta fallisce, il messaggio riportato mente. Leggere `json_encode(session('errors'))` a mano.
  - `.ai/rules/general.md` — SQLite, solo Eloquent e migrazioni portabili; `larastan` non e in `vendor/`, serve `composer install` prima di `larapilot:quality`.

  ## Git e branching

  - Modalita: **GITFLOW** (`data.settings.git_mode`) — nessun push automatico, nessuna PR remota
  - Branch: `feature/US-013-responsabili-per-release` da `develop`
  - TASK-00: bootstrap del branch + descrizione PR preparata **in locale**
  - Un commit atomico per task, Conventional Commits `type(US-013): TASK-NN ...` — mai un commit che copre due task
  - Push e apertura/aggiornamento della PR remota **solo** su richiesta esplicita in sessione
  - Merge verso `develop` solo dopo l'approvazione umana in `/larapilot-review`
  - Rebase su `develop` in caso di deriva (Sarah guida la risoluzione dei conflitti)
  - `CHANGELOG.md` Unreleased aggiornato: il comportamento visibile all'utente cambia

  ## Strategia dei dati di test

  - La colonna nuova su `release_steps` e accompagnata da factory e seeder **nello stesso task** della migrazione (TASK-01), mai differiti
  - `ReleaseStepFactory`: la colonna entra con default `false` e uno stato dedicato per il caso sovrascritto
  - Dataset dimostrativo (FR-018): `DatabaseSeeder::seedReleases()` semina almeno **una release avviata con un responsabile sovrascritto**, chiamando `StartRelease` con override — le Action restano l'unico percorso, cosi snapshot, flag e payload dell'evento sono quelli veri e non righe inventate
  - Verifica `php artisan migrate:fresh --seed` verde prima di ogni `task-done` sui task che toccano schema o seeder
  - Volumi invariati rispetto a oggi: il seeder aggiunge un override su una release esistente, non una release in piu

  ## Strategia di test

  - Bar: **NORMAL** (`data.settings.testing`) — PHPUnit, nessun Playwright, nessun Dusk, nessun Pest browser, nessuna matrice di viewport automatizzata
  - Test interlacciati con l'implementazione, non tutti in coda: TASK-07 chiude l'Action, TASK-08 la schermata
  - **Suite nuove:** `tests/Feature/Releases/StartReleaseOverridesTest.php` (Action) e `tests/Feature/Releases/StartReleaseOverrideScreenTest.php` (schermata + autorizzazione)
  - **Budget di query:** casi aggiunti a `StartReleaseQueryBudgetTest` — l'avvio con override costa come l'avvio senza, e la schermata non interroga per ruolo ne per membro
  - **Invarianza verificata in test, non osservata a schermo:** `ProjectRoleAssignment` e `DefaultRoleAssignment` confrontati riga per riga prima e dopo un avvio con override
  - **Isolamento fra release:** un override sulla release A non tocca la release B avviata subito dopo sullo stesso progetto
  - **Regressione su US-004:** il caso "avvio senza override" confronta lo snapshot prodotto con quello odierno (step, responsabili, campi, payload dell'evento), cosi la nuova firma resta osservabilmente neutra
  - **Suite esistenti attese verdi senza riscrittura:** `StartReleaseTest`, `SnapshotIsolationTest`, `StartReleaseQueryBudgetTest`, `ReleaseDetailScreenTest`, `ReleaseLogScreenTest`, `ReleaseIndexScreenTest`, `DatabaseSeederTest`, `BladeComponentAttributesTest`
  - **Aggiornate di proposito:** due asserzioni in `StartReleaseScreenTest` (blocco -> avviso), per la decisione registrata sulle precondizioni
  - **Consegna manuale (ammessa a NORMAL):** verifica a mano di 375 / 768 / 1280 px sul modulo di avvio, in tema chiaro e scuro, con tastiera; annotata in `## Criteri di completamento` dei task di interfaccia
  - Gate finale: `php artisan larapilot:quality` verde (Pint + Larastan livello 5)
