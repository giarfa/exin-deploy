    id: TASK-03
    title: 'Form di avvio: select per ruolo, insieme selezionabile e banner ricalcolato sugli override'
    body: |-
      ## Description
      Aggiungere al form di avvio un select per ogni ruolo previsto dal processo, con il responsabile di default preselezionato e sovrascrivibile, e far ricalcolare il riepilogo delle precondizioni sulla mappatura **effettiva** — override compresi — senza modificare alcun metodo di modello.

      ## Files Involved
      - resources/views/components/releases/⚡start.blade.php

      ## Steps
      1. Proprieta `public array $overrides = []` indicizzata per `role_id`. `mount()` la precompila con l'assegnato di progetto per ogni ruolo previsto dal template, stringa vuota quando il ruolo e scoperto. Le relazioni servono gia al primo render e sono gia caricate in `mount()`: non aggiungere un secondo `load()`.
      2. Computed `processRoles()` — i ruoli previsti dagli step del template, deduplicati e ordinati per nome, letti dalle relazioni gia precaricate (zero query).
      3. Computed `assignableUsers()` — ogni membro attivo, piu gli assegnati correnti su questo progetto anche se disattivati, cosi la selezione in corso non sparisce dall'elenco. Stessa forma del computed omonimo di `⚡assignments.blade.php`: una sola query, `select` sulle sole colonne servite, ordinamento per nome.
      4. **Mappatura effettiva** — metodo privato che costruisce la collezione delle assegnazioni effettive (riga reale di progetto oppure istanza `ProjectRoleAssignment` non persistita con `role_id`, `user_id` e relazione `user` popolata via `setRelation`) e la sovrappone a un **clone** del progetto con `setRelation('assignments', ...)`. Commento obbligatorio: le istanze sono in memoria e non vengono mai salvate: l'effetto e one-shot sulla singola release, e `$this->project` continua a descrivere lo stato persistito.
      5. Ricalcolare i tre computed esistenti sul clone: `uncoveredRoles()`, `inactiveResponsibles()` e `blockingReason()` chiamano gli **stessi** metodi di modello sul progetto con la mappatura effettiva. `Project::uncoveredRoles()`, `::inactiveResponsibles()` e `::startBlocker()` **non vengono modificati** (tre celle decise). Nessuna copia della regola nel componente.
      6. Regole di validazione: `overrides` array; chiavi limitate ai `role_id` di `processRoles()`; valori vincolati con `Rule::in` ai soli identificativi di `assignableUsers()`; un ruolo che risulta bloccante nella mappatura effettiva richiede un valore non vuoto, con messaggio `releases.override_required`. Vincolare le chiavi in `start()` prima di validare, come fa `save()` in `⚡assignments.blade.php` con `only($allowedRoles)`.
      7. Passare gli override sanificati alla Action: `$startRelease->handle($this->project, $validated['label'], auth()->user(), $overrides)`. `Gate::authorize('create', ...)` resta dov'e ed e invariato (cella `ReleasePolicy` decided-null).
      8. Le quattro `catch` esistenti **non cambiano**: il messaggio di rifiuto per i ruoli non coperti da override resta identico a oggi e continua a leggere i nomi dall'eccezione, non dallo stato corrente (cella `:144`).
      9. Abilitazione dei comandi: etichetta e pulsante di invio sono attivi quando la mappatura effettiva non ha blocchi; restano disabilitati per progetto disattivato, processo assente o inutilizzabile. Il riquadro delle precondizioni mostra il motivo residuo con lo stesso stile di oggi.
      10. `refuse()` e `startAnother()` invalidano anche i computed nuovi, altrimenti dopo un rifiuto la schermata mostrerebbe un insieme selezionabile di un istante prima.
      11. Vista: una scheda per ruolo con `flux:select`, impilate a piena larghezza — mai una tabella con select dentro, che a 375 px obbligherebbe allo scorrimento orizzontale (stessa scelta gia motivata in `⚡assignments.blade.php`). Verifica a mano a 375 / 768 / 1280 px.
      12. **Nessuna direttiva Blade dentro gli attributi dei componenti** (`.ai/rules/views.md`): interpolazione diretta o attributo legato con la stringa costruita in PHP. `tests/Unit/Views/BladeComponentAttributesTest.php` fallirebbe riportando file e riga.
