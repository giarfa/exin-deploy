  -
    id: TASK-09
    title: 'Dataset dimostrativo: una release avviata con un responsabile sovrascritto'
    body: |-
      ## Descrizione
      FR-018 chiede un ambiente dimostrativo coerente. Dopo questa spec deve contenere almeno **una release avviata con un responsabile sovrascritto**, altrimenti la segnalazione sul dettaglio e la voce del registro non si vedono mai senza costruirle a mano.

      Il rilascio e un **processo**: si semina chiamando `StartRelease`, non scrivendo righe (`.ai/rules/seeders.md`). Uno snapshot scritto a mano falsificherebbe proprio cio che il registro serve a provare: righe di forma giusta e contenuto inventato.

      ## File coinvolti
      - `database/seeders/DatabaseSeeder.php`
      - `tests/Feature/DatabaseSeederTest.php`

      ## Passi
      1. In `seedReleases()`, su una delle release gia seminate, passa a `StartRelease` un override su **un** ruolo: una persona attiva del team diversa da quella della mappatura. Nessuna release in piu — il caso si aggiunge a uno esistente
      2. Scegli il ruolo in modo che l'override sia leggibile nella pagina: preferibilmente uno usato da **due** step, cosi il dataset dimostra anche la granularita per ruolo
      3. La mappatura del progetto **non** va modificata: e proprio il punto della funzione, e un seeder che la cambiasse mostrerebbe il contrario di quello che dichiara
      4. Le Action scrivono `now()`: se gli istanti vanno riportati indietro, farlo **dopo** con `forceFill` (`completed_at`/`completed_by` non sono assegnabili in massa)
      5. Nessuna release su un template disattivato: `StartRelease` la rifiuterebbe, e un ambiente dimostrativo con uno stato irriproducibile dall'applicazione mente a chi lo usa per capire come funziona
      6. `DatabaseSeederTest`: **un** caso aggiunto — esiste una release con almeno uno step sovrascritto e la mappatura del progetto e rimasta quella dichiarata. La suite tiene pochi casi di proposito: con `RefreshDatabase` ognuno ripaga l'intero seed
      7. `php artisan migrate:fresh --seed` e verifica a schermo il dettaglio della release e il registro
      8. `composer install` (larastan non e in `vendor/`, `.ai/rules/general.md`), poi `php artisan larapilot:quality`
      9. `php artisan test --compact` — suite completa verde

      ## Criteri di completamento
      - [x] Il seed produce almeno una release avviata con un responsabile sovrascritto
      - [x] La mappatura del progetto e quella predefinita di team restano invariate dal seed
      - [x] Nessuna release seminata su un template disattivato
      - [x] `migrate:fresh --seed` verde e ambiente verificato a schermo (dettaglio + registro)
      - [x] `DatabaseSeederTest` verde con il caso aggiunto
      - [x] `php artisan larapilot:quality` verde (Pint + Larastan livello 5)
      - [x] Suite completa verde

      ## Dati di test
      - [x] `DatabaseSeeder::seedReleases()` aggiornato passando dalle Action, non scrivendo righe
      - [x] `ReleaseStepFactory` gia aggiornata in TASK-01; nessuna modifica di schema qui

