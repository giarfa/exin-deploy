    id: TASK-06
    title: 'Registro delle transizioni: la voce di avvio racconta i ruoli sovrascritti'
    body: |-
      ## Descrizione
      Sulla voce di avvio del registro (US-010), quando il payload porta la chiave `overrides`, mostra quali ruoli sono stati sovrascritti, da chi erano coperti e a chi sono finiti. Un avvio senza override non aggiunge nulla: la frase resta quella di oggi.

      Il registro resta in **sola aggiunta**: nessuna scrittura retroattiva sugli eventi gia registrati, e le righe scritte prima di questa spec non hanno la chiave — il rendering deve reggerlo senza inventare nulla.

      ## File coinvolti
      - `resources/views/components/releases/⚡log.blade.php`
      - `lang/it/releases.php`

      ## Passi
      1. In `detailFor()`, ramo `ReleaseEventAction::ReleaseStarted`: la frase esistente resta, e quando `overrides` e presente e non vuota si aggiunge la parte sulle sovrascritture. Il payload e **nullable** e le sue chiavi variano per azione: continua a leggerlo con `??`, come fa il resto del metodo
      2. Un ruolo sovrascritto senza predefinito (era scoperto) ha `from` a `null`: serve una forma di frase distinta — "era senza responsabile" — non un nome vuoto o un trattino da interpretare
      3. Plurale con `trans_choice` sul numero di ruoli sovrascritti
      4. I nomi arrivano dal payload, che e **dato**: vanno passati come **parametri** della traduzione, mai concatenati dentro una chiave di traduzione. La stessa avvertenza che `recordedAbility()` porta scritta per `ability` vale qui per ruoli e persone
      5. Una riga scritta prima di questa spec (nessuna chiave `overrides`) deve rendere esattamente come oggi
      6. Nessuna query in piu: il payload e sull'evento gia caricato. Verifica il budget con `ReleaseLogQueryBudgetTest`
      7. Nessun metodo pubblico nuovo sul componente del registro: in Livewire ogni metodo pubblico e un'azione invocabile dal browser, e l'elenco atteso e sotto test in `ReleaseEventAppendOnlyTest` (`.ai/rules/policies.md`)
      8. `php artisan test --filter=ReleaseLogScreenTest`, `--filter=ReleaseEventAppendOnlyTest` e `--filter=ReleaseLogQueryBudgetTest`

      ## Criteri di completamento
      - [x] La voce di avvio di una release con override nomina ruolo, responsabile predefinito e responsabile scelto
      - [x] Un ruolo prima scoperto e reso con una frase propria, non con un nome mancante
      - [x] La voce di avvio di una release senza override e identica a oggi
      - [x] Una voce scritta prima di questa spec rende senza errori
      - [x] Nessun metodo pubblico aggiunto al componente; `ReleaseEventAppendOnlyTest` verde
      - [x] Budget di query del registro invariato
      - [x] Testo dalle chiavi `lang/`; leggibile a 375 px in tema chiaro e scuro (verifica manuale)

      ## Dati di test
      - N/A — nessuna modifica a schema o modelli in questo task

