code: US-013
plan_body: |-
  ## Soluzione Tecnica

  L'override e **stato effimero del form di avvio**, non un dato di dominio: nessuna tabella, nessuna colonna, nessuna scrittura sulla mappatura di progetto o sui default di team (cella `ProjectRoleAssignment` — one-shot). Cio che finisce in `release_steps.assigned_user_id` e semplicemente la persona **effettiva** risolta all'avvio, esattamente come oggi: lo snapshot non distingue la provenienza (celle `create_release_steps_table.php:39` e `⚡show.blade.php`, entrambe decided-null).

  ### 1. Action — `StartRelease`

  La firma diventa:

  ```php
  public function handle(Project $project, string $label, User $actor, array $overrides = []): Release
  ```

  `$overrides` e un array indicizzato per `role_id` con valore `user_id`, **sempre presente** e con default vuoto: le due chiamate esistenti (`database/seeders/DatabaseSeeder.php:493` e `resources/views/components/releases/⚡start.blade.php:144`) restano valide senza modifiche (cella `StartRelease.php:55`).

  Dentro `responsibles()` la risoluzione diventa, nell'ordine:

  1. **Igiene dell'input** — si tengono solo le chiavi che corrispondono a un ruolo previsto dagli step del template; il resto si scarta. Un identificativo di persona che non risolve non e un override: si scarta anche quello, e il ruolo torna a dipendere dalla mappatura di progetto con le precondizioni odierne. Non e una decisione di prodotto ma difesa al confine: dalla UI il caso e irraggiungibile, perche il select e validato contro il solo insieme in elenco.
  2. **Una query batch** — `User::query()->whereIn('id', array_unique(array_values($overrides)))->get()->keyBy('id')`, eseguita una volta sola e solo quando ci sono override. Zero query per ruolo, il costo non cresce con la lunghezza della catena (cella `StartReleaseQueryBudgetTest.php:1`).
  3. **Ruoli scoperti** — `$project->uncoveredRoles()` **al netto** dei ruoli coperti da un override risolto: un ruolo senza responsabile di progetto ma con un override valido si considera coperto per questa release (celle `StartRelease.php:204` e `RolesWithoutResponsible.php:19`). L'elenco nominato dall'eccezione e quindi quello residuo.
  4. **Sostituzione integrale** — per ogni ruolo previsto la persona effettiva e l'override quando c'e, altrimenti l'assegnato di progetto. Nessun ripiego sul dato di progetto per un ruolo overridden (cella `StartRelease.php:199`).
  5. **Responsabili disattivati** — il controllo si applica all'insieme **effettivo**: un override verso una persona disattivata e rifiutato con lo stesso `InactiveResponsibleOnProject` di oggi, e un override verso una persona attiva rimuove dall'elenco il responsabile di progetto disattivato che sostituisce (celle `StartRelease.php:216` e `InactiveResponsibleOnProject.php:20`).

  L'ordine dei due rifiuti resta quello odierno — prima i ruoli scoperti, poi i disattivati: sono due problemi con due soluzioni diverse, e il commento in testa a `responsibles()` lo dichiara gia.

  Le due classi di eccezione **non cambiano forma**: nessun costruttore, nessun campo, nessuna firma nuova. Cambia cio che il chiamante passa loro, cioe l'elenco residuo. Il docblock di ciascuna viene aggiornato per dirlo, perche il testo attuale afferma che l'elenco e calcolato sulla mappatura di progetto e da qui in poi non e piu vero.

  ### 2. Mappatura effettiva — un solo punto di verita

  Il banner delle precondizioni deve tenere conto degli override **gia scelti nel form**, ma `Project::uncoveredRoles()`, `Project::inactiveResponsibles()` e `Project::startBlocker()` restano invariati (celle `Project.php:101`, `:136`, `:172`): il ricalcolo vive nel componente Livewire.

  Invece di riscrivere quelle tre regole nel componente — due copie della stessa regola divergono, ed e l'avvertenza scritta sul modello stesso — il componente costruisce la **mappatura effettiva** e la sovrappone alla relazione `assignments` di un **clone** del progetto:

  ```php
  $effective = clone $this->project;
  $effective->setRelation('assignments', $merged);
  ```

  `$merged` contiene, per ogni ruolo previsto, l'assegnazione di progetto reale oppure una istanza `ProjectRoleAssignment` **non persistita** (`role_id`, `user_id`, relazione `user` popolata a mano con `setRelation`) che rappresenta la selezione corrente. Nessun `save()`, nessun `create()`: e un oggetto in memoria che serve solo a far ricalcolare i metodi esistenti. `clone` copia l'array delle relazioni per valore, quindi `$this->project` continua a descrivere lo stato **persistito** e non viene contaminato.

  Con questo, `$effective->uncoveredRoles()`, `$effective->inactiveResponsibles()` e `$effective->startBlocker()` restituiscono il quadro reale della release che si sta per avviare, senza toccare il modello e senza duplicare nulla. Le relazioni sono gia precaricate da `mount()`, quindi il ricalcolo non interroga il database.

  Rischio noto e sua mitigazione: un'istanza `ProjectRoleAssignment` in memoria puo essere confusa per un percorso di scrittura. Il commento nel componente lo dichiara, e `StartReleaseOverrideTest` verifica che nessuna riga di `project_role_assignments` (ne di `default_role_assignments`) risulti creata o modificata dopo un avvio con override.

  ### 3. Form di avvio — `⚡start.blade.php`

  - `public array $overrides = []` indicizzato per `role_id`, precompilato in `mount()` con l'assegnato di progetto (stringa vuota quando il ruolo e scoperto). Select **sempre visibile** per ogni ruolo previsto, default preselezionato (cella `:39`).
  - Insieme selezionabile identico a quello della mappatura di progetto: ogni membro attivo, piu l'assegnato corrente anche se disattivato per non far sparire la selezione, nessuna restrizione legata al ruolo (cella `:53`). Stessa forma del computed `assignableUsers()` di `⚡assignments.blade.php`, una sola query.
  - Validazione: chiavi limitate ai ruoli previsti dal template, valori vincolati con `Rule::in` ai soli identificativi in elenco — cosi una persona fuori insieme non e scegliibile nemmeno indicandone l'identificativo, com'e gia per `workflowTemplateId` in `⚡index.blade.php`.
  - Etichetta e comando di invio sono abilitati quando la mappatura **effettiva** non ha piu blocchi: un progetto con ruoli scoperti o responsabili disattivati diventa avviabile appena ogni ruolo bloccante ha un override valido selezionato. Restano disabilitati per i blocchi che un override non risolve — progetto disattivato, processo assente o inutilizzabile.
  - Il messaggio di rifiuto post-submit resta **identico a oggi** per i ruoli non coperti da override: le quattro `catch` esistenti non cambiano forma, e i nomi arrivano dall'eccezione come adesso (cella `:144`).
  - `refuse()` e `startAnother()` invalidano anche i computed nuovi.

  Nessuna modifica a `ReleasePolicy` (cella decided-null): l'autorizzazione resta il solo `create` da amministratore gia in vigore, e resta verificata sia in `start()` sia in `startAnother()`.

  ### 4. Elenco progetti — `⚡index.blade.php:325`

  Il comando "avvia release" resta raggiungibile quando il blocco e risolvibile con un override; il form obbliga poi a fornirlo prima dell'invio (cella `:325`). La condizione si esprime in positivo, evitando di riclassificare il messaggio di `startBlocker()`:

  ```php
  $reachable = $project->is_active && (bool) $project->workflowTemplate?->isUsable();
  ```

  Due condizioni, non quattro: se il progetto e attivo e il processo utilizzabile, qualunque motivo residuo riguarda ruoli scoperti o responsabili disattivati, cioe esattamente i due casi che un override risolve. `startBlocker()` resta l'unica fonte del **messaggio**, mostrato accanto al comando come indicazione invece che come motivo di disabilitazione. Le relazioni sono gia precaricate dal computed `projects()`: nessuna query per riga, invariante gia protetta da `StartReleaseScreenTest::test_the_project_list_does_not_query_per_row_for_the_start_command`.

  ### 5. Mappatura di progetto — `⚡assignments.blade.php:45`

  Nota informativa: le singole release possono sovrascrivere questa mappatura in fase di creazione. Nessuna modifica al comportamento di salvataggio (cella `:45`).

  ### Celle decise → task

  | Cella | Task |
  | --- | --- |
  | `StartRelease.php:55` (firma `overrides`) | TASK-01 |
  | `StartRelease.php:199` (sostituzione integrale) | TASK-01 |
  | `StartRelease.php:204` (ruolo coperto da override) | TASK-01 |
  | `StartRelease.php:216` (override disattivato) | TASK-01 |
  | `RolesWithoutResponsible.php:19` | TASK-01 |
  | `InactiveResponsibleOnProject.php:20` | TASK-01 |
  | `lang/it/releases.php` | TASK-02 |
  | `⚡start.blade.php:39` (select per ruolo) | TASK-03 |
  | `⚡start.blade.php:53` (insieme selezionabile) | TASK-03 |
  | `⚡start.blade.php:144` (messaggi di rifiuto) | TASK-03 |
  | `Project.php:101` (banner: ruoli scoperti) | TASK-03 |
  | `Project.php:136` (banner: disattivati) | TASK-03 |
  | `ProjectRoleAssignment.php` (one-shot) | TASK-01 + TASK-06 |
  | `projects/⚡index.blade.php:325` | TASK-04 |
  | `projects/⚡assignments.blade.php:45` | TASK-05 |
  | `tests/.../StartReleaseTest.php:97` (divisione suite) | TASK-06 |
  | `tests/.../StartReleaseQueryBudgetTest.php:1` | TASK-08 |
  | `tests/Feature/DatabaseSeederTest.php:73` | TASK-08 |

  ### Non-modifiche dichiarate (celle decided-null)

  Queste sei celle sono **invariate per decisione**, non per dimenticanza: un diff che le tocca e un errore, non un miglioramento.

  - `database/migrations/2026_08_12_221632_create_release_steps_table.php:39` — nessuna colonna, nessun flag di provenienza: `assigned_user_id` accetta gia qualsiasi utente attivo.
  - `app/Actions/Releases/StartRelease.php:142` — il payload dell'evento `release_avviata` resta `label` / `template` / `steps`, senza elenco dei ruoli sovrascritti.
  - `app/Enums/ReleaseEventAction.php:20` — nessun caso enum nuovo: l'override e parte dello stesso evento `ReleaseStarted`.
  - `app/Policies/ReleasePolicy.php` — nessuna ability nuova, nessuna condizione nuova.
  - `resources/views/components/releases/⚡show.blade.php` — nessuna distinzione visiva per gli step con responsabile overridden.
  - `database/seeders/DatabaseSeeder.php:411` — dati dimostrativi invariati, nessun esempio di override seminato.

  Fuori perimetro per decisione: `tests/Feature/Configuration/ProjectTemplateAssociationTest.php:125` — verifica la sola associazione progetto/template, non l'avvio release.

  ### Nota di organizzazione file (nessuna cella)

  `tests/Feature/Releases/StartReleaseScreenTest.php` non e enumerato nella tabella (non usa i simboli in `sources`), ma tre suoi test asseriscono il comportamento precedente del comando disabilitato: aggiornarli e conseguenza meccanica delle celle `⚡index.blade.php:325` e `⚡start.blade.php:39`, non una scelta di prodotto. Gli scenari override di livello schermata restano nello stesso file: la divisione decisa dalla cella `StartReleaseTest.php:97` riguarda la suite dell'Action, e nessuna cella prescrive un secondo file per la schermata. Scelta reversibile, dichiarata qui e verificabile in review.

  ## Git & Branching

  - Mode: `GITFLOW` (da `settings.git_mode`)
  - Branch: `feature/US-013-responsabile-override-release` da `develop`
  - TASK-00: bootstrap del branch; descrizione della PR verso `develop` preparata **in locale**
  - **Nessun push e nessuna PR remota**: `GITFLOW` non li implica: solo su richiesta esplicita in sessione
  - Un commit atomico per task, Conventional Commits: `type(US-013): TASK-NN riepilogo`
  - `CHANGELOG.md` sezione Unreleased aggiornata in TASK-09 (cambia comportamento visibile all'utente)
  - Merge verso `develop` solo dopo approvazione umana in `/larapilot-review`
  - Su drift da `develop`: rebase con Sarah alla guida della meccanica Git

  ## Test Data Strategy

  - **Nessuna modifica di schema, nessun modello nuovo**: nessuna factory nuova e nessuna migrazione. `ProjectRoleAssignmentFactory`, `UserFactory` (stato `admin`, membri disattivati), `WorkflowTemplateFactory`, `StepDefinitionFactory`, `RoleFactory` bastano cosi come sono.
  - **Seeder invariato per decisione** (cella `DatabaseSeeder.php:411`): nessun override seminato. `seedReleases()` continua a chiamare `StartRelease::handle()` con tre argomenti e il quarto a default: se il diff tocca il seeder, e un errore.
  - Le suite di test costruiscono gli scenari override con le factory esistenti: progetto con ruolo scoperto, progetto con responsabile disattivato, progetto sano con override verso un'altra persona attiva, override verso una persona disattivata.
  - `php artisan migrate:fresh --seed` deve continuare a riuscire e a produrre lo stesso ambiente dimostrativo di oggi: e la verifica di TASK-08.

  ## Test Strategy

  - Bar: **`NORMAL`** (da `settings.testing`) — feature test PHPUnit, test di componente Livewire, test di budget query. **Nessun** Playwright, Dusk, Pest browser, matrice di viewport o E2E di percorso.
  - I test sono interlacciati con l'implementazione, non accodati: TASK-06 segue TASK-01, TASK-07 segue le tre task di UI, TASK-08 chiude su budget e regressione dei dati dimostrativi.
  - **Livello Action** — `StartReleaseTest.php` resta il percorso **senza** override e non viene modificato (cella `:97`); il nuovo `StartReleaseOverrideTest.php` copre: override che sostituisce un default sano, ruolo scoperto sbloccato da un override valido, responsabile disattivato sostituito da uno attivo, override verso una persona disattivata rifiutato con `InactiveResponsibleOnProject`, elenco dell'eccezione al netto degli override, override per un ruolo non previsto ignorato, assenza di qualsiasi scrittura su `project_role_assignments` e `default_role_assignments`, payload dell'evento invariato.
  - **Livello schermata** — tre test esistenti di `StartReleaseScreenTest.php` cambiano asserzione (comando raggiungibile invece che disabilitato); si aggiungono: select per ruolo con default preselezionato, insieme selezionabile che include l'assegnato disattivato, banner che smette di segnalare il blocco quando l'override lo copre, invio bloccato finche un ruolo bloccante resta senza override, messaggio di rifiuto identico a oggi per i ruoli non coperti, comando in elenco progetti raggiungibile con ruoli scoperti e disabilitato con progetto disattivato o processo inutilizzabile, nota informativa sulla mappatura di progetto.
  - **Budget query** — `StartReleaseQueryBudgetTest.php` esteso: l'avvio con override costa lo stesso su catena corta e lunga, e su un ruolo o su cinque. L'invariante misurata resta la costanza, non un numero assoluto.
  - **Regressione dati dimostrativi** — `DatabaseSeederTest.php` asserisce che in assenza di override la risoluzione dei responsabili sui progetti seminati resta quella odierna.
  - **Manual test handoff** (bar `NORMAL`, spec con UI): verifica a mano su Herd a 375 / 768 / 1280 px che i select non producano scorrimento orizzontale e che il comando di invio si abiliti alla selezione dell'ultimo override mancante. Passi elencati in TASK-07.
  - Gate di qualita prima della consegna: `php artisan larapilot:quality` (Pint + Larastan livello 5) e `vendor/bin/pint --dirty`.
