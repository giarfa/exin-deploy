  -
    id: TASK-03
    title: 'Precondizioni: ruoli scoperti e responsabili disattivati diventano avvisi, non blocchi'
    body: |-
      ## Descrizione
      Applica al modello la decisione registrata per US-013: `Project::startBlocker()` conserva solo le regole che nessun override puo sanare — progetto disattivato, processo mancante, processo disattivato o senza step. Ruolo scoperto e responsabile predefinito disattivato restano **segnalati** ma non bloccano piu l'avvio, perche sono esattamente i casi che l'override esiste per coprire.

      La regola vive sul modello e non sul componente perche serve in due posti — la schermata di avvio e l'elenco progetti, che disabilita il comando con il motivo accanto — e due copie divergerebbero. Questo task tocca il modello e l'elenco; la schermata di avvio e di TASK-04.

      Qui nasce anche il dato che la schermata iterera: i ruoli previsti dal processo con il proprio responsabile predefinito, ciascuno una sola volta.

      ## File coinvolti
      - `app/Models/Project.php`
      - `resources/views/components/projects/⚡index.blade.php`
      - `lang/it/projects.php` e/o `lang/it/releases.php` (testi degli avvisi)

      ## Passi
      1. `startBlocker()`: rimuovi i rami `uncoveredRoles()` e `inactiveResponsibles()`. Conserva `is_active`, template assente, `isUsable()`. Aggiorna il PHPDoc del metodo: dichiara **perche** i due casi sono usciti e rimanda a FR-029, altrimenti sembrera una dimenticanza da ripristinare
      2. `uncoveredRoles()` e `inactiveResponsibles()` restano **invariati**: cambia chi li interpreta, non cosa calcolano. Non toccarne la logica ne le avvertenze N+1
      3. Nuovo metodo `responsibleChoices(): Collection` sul modello — per ogni ruolo previsto dagli step del processo, una volta sola:
         - il `Role`
         - la persona predefinita risolta dalla mappatura, **`null` quando il ruolo e scoperto oppure quando la persona risolta e disattivata** (un disattivato non e selezionabile, quindi non e un valore precompilabile)
         - se richiede una scelta esplicita (predefinito `null`)
         Ordine: **posizione del primo step che usa quel ruolo**, non alfabetico — la schermata segue la catena. Stessa avvertenza N+1 degli altri due metodi: con le relazioni precaricate non interroga il database, e `loadMissing` e la rete di sicurezza per l'uso su un singolo progetto, non una licenza a chiamarlo in un ciclo
      4. Elenco progetti: il comando "Avvia una release" resta **abilitato** quando l'unico problema e un ruolo scoperto o un responsabile disattivato. Il badge dei ruoli scoperti resta dov'e — informa senza impedire
      5. Verifica che il budget di query dell'elenco non cambi: `StartReleaseScreenTest::test_the_project_list_does_not_query_per_row_for_the_start_command` deve restare verde con le stesse relazioni precaricate
      6. Testi: l'avviso nomina i ruoli **e la conseguenza** ("va indicato un responsabile in fase di avvio"), non un generico "attenzione" da ignorare
      7. `php artisan test --filter=ProjectManagementTest` e `--filter=ProjectAssignmentsTest`

      ## Criteri di completamento
