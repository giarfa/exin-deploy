      - [x] Continua a rifiutare progetto disattivato, processo mancante, disattivato o senza step
      - [x] `responsibleChoices()` elenca ogni ruolo una sola volta, nell'ordine del primo step che lo usa, con predefinito `null` per ruolo scoperto o persona disattivata
      - [x] Elenco progetti: comando di avvio abilitato con ruoli scoperti, badge di segnalazione ancora presente
      - [x] Nessuna query per riga nell'elenco progetti (test di budget esistente verde)
      - [x] `uncoveredRoles()` e `inactiveResponsibles()` invariati nel comportamento
      - [x] Interfaccia usabile a 375 / 768 / 1280 px, tema chiaro e scuro (verifica manuale)

