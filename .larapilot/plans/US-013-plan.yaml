    body: |-
      ## Description
      Nuovo file `tests/Feature/Releases/StartReleaseOverrideTest.php` per gli scenari **con** override a livello di Action. `StartReleaseTest.php` resta la suite del percorso **senza** override e non viene modificato (cella decisa).

      ## Files Involved
      - tests/Feature/Releases/StartReleaseOverrideTest.php (nuovo)

      ## Steps
      1. `php artisan make:test --phpunit Releases/StartReleaseOverrideTest --no-interaction`
      2. Riusare le factory esistenti (`ProjectRoleAssignmentFactory`, `UserFactory` stato `admin` e membri disattivati, `WorkflowTemplateFactory`, `StepDefinitionFactory`, `RoleFactory`) e un helper locale sullo stile di `projectReadyToRelease()`: non duplicare definizioni di factory nel test.
      3. Casi da coprire:
         - un override su un progetto sano congela lo step con la persona indicata e non con l'assegnato di progetto
         - un ruolo senza responsabile di progetto, coperto da un override valido, si considera coperto: l'avvio riesce
         - un responsabile di progetto disattivato, sostituito da un override verso una persona attiva, non blocca piu l'avvio
         - un override verso una persona disattivata e rifiutato con `InactiveResponsibleOnProject` e la persona e **nominata**
         - `RolesWithoutResponsible` nomina i soli ruoli residui: un ruolo coperto da override non compare nell'elenco
         - `InactiveResponsibleOnProject` non nomina i responsabili disattivati sostituiti da un override
         - un override per un ruolo non previsto dal processo viene ignorato e non altera l'avvio
         - un override con un identificativo di persona inesistente non vale come override: il ruolo torna a dipendere dalla mappatura di progetto, e se e scoperto l'avvio viene rifiutato
         - **effetto one-shot**: dopo un avvio con override, nessuna riga di `project_role_assignments` e di `default_role_assignments` risulta creata, modificata o cancellata
         - il payload dell'evento `ReleaseStarted` resta `label` / `template` / `steps`, senza traccia dei ruoli sovrascritti
         - un rifiuto non lascia una release a meta: riusare la forma di `assertRefusedWithoutWriting()` gia presente nella suite senza override
      4. Nessun test di browser, viewport o E2E: bar `NORMAL`.
      5. `php artisan test --compact tests/Feature/Releases/StartReleaseOverrideTest.php`
      6. `php artisan test --compact tests/Feature/Releases/StartReleaseTest.php` — deve passare senza che il file sia stato toccato.
