    id: TASK-10
    title: 'Documentazione baseline: vincolo permanente nel README e CHANGELOG'
    body: |-
      ## Descrizione
      Aggiornamento documentale baseline (`effort: STANDARD`). Nessuna OpenAPI: il perimetro non tocca API pubbliche o partner.

      Due cose vanno messe per iscritto, perche entrambe sembrano difetti a chi le incontra senza contesto: che le precondizioni sui responsabili sono **avvisi** e non blocchi, e che la sovrascrittura del responsabile e un dato dello **snapshot** e non una lettura della configurazione.

      ## File coinvolti
      - `README.md` (elenco dei vincoli permanenti)
      - `CHANGELOG.md` (sezione Unreleased)

      ## Passi
      1. README, nuovo vincolo permanente numerato in coda all'elenco esistente: gli override dei responsabili si risolvono **in avvio** e finiscono nello snapshot (`release_steps.responsible_overridden`); nessun percorso di esecuzione torna a leggere `project_role_assignments`, e l'override non modifica ne la mappatura del progetto ne quella predefinita di team
      2. Secondo punto, sullo stesso elenco o accanto: ruolo scoperto e responsabile predefinito disattivato **non** bloccano piu l'avvio (FR-029) — `startBlocker()` conserva solo progetto disattivato e processo mancante/disattivato/senza step. Scrivi la ragione, non solo la regola: senza, qualcuno rimettera i due rami dentro credendo di riparare una dimenticanza
      3. `CHANGELOG.md`, sezione Unreleased: voce `Added` per la scelta dei responsabili in avvio, voce `Changed` per le precondizioni che diventano avvisi. Formato Keep a Changelog
      4. Verifica che i due testi rimandino a FR-029 e a US-013, cosi il percorso verso il PRD resta percorribile

      ## Criteri di completamento
      - [x] README: vincolo permanente aggiunto, con la ragione e non solo la regola
      - [x] README: il cambio di comportamento delle precondizioni e dichiarato e attribuito a FR-029
      - [x] `CHANGELOG.md` Unreleased aggiornato con `Added` e `Changed`
      - [x] Nessuna OpenAPI toccata (fuori perimetro)

      ## Dati di test
      - N/A — solo documentazione

