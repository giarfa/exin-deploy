    id: TASK-07
    title: "Test dell'Action: override, rifiuti, invarianza della configurazione e budget di query"
    body: |-
      ## Descrizione
      Copertura PHPUnit dell'avvio con override al livello dove la decisione vive davvero: l'Action. Bar `NORMAL` — nessun browser, nessuna matrice di viewport.

      Il caso portante non e l'override: e l'**avvio senza override**, che deve restare osservabilmente identico a quello odierno. Se quel caso passa, la nuova firma e neutra e i test di US-004 non hanno bisogno di essere riscritti.

      ## File coinvolti
      - `tests/Feature/Releases/StartReleaseOverridesTest.php` (nuovo)
      - `tests/Feature/Releases/StartReleaseQueryBudgetTest.php` (casi aggiunti)

      ## Passi
      1. `php artisan make:test --phpunit StartReleaseOverridesTest --no-interaction`, poi spostalo in `tests/Feature/Releases/`
      2. Riusa le factory esistenti (`WorkflowTemplate`, `StepDefinition`, `FieldDefinition`, `Project`, `ProjectRoleAssignment`, `User`) — non duplicare definizioni di factory nel test. Riprendi la forma di `projectReadyToRelease()` da `StartReleaseTest`, dove **un ruolo e usato da due step**: e il caso che dimostra la granularita per ruolo
      3. Casi da coprire:
         - avvio senza override: snapshot, responsabili, campi, stato e payload dell'evento identici al comportamento odierno; `responsible_overridden` falso su ogni step; chiave `overrides` **assente** dal payload
         - override su un ruolo usato da due step: **entrambi** riportano la persona scelta e hanno il flag a vero; gli step degli altri ruoli restano sui predefiniti col flag falso
         - override che indica la **stessa** persona del predefinito: nessun flag alzato, nessuna voce nel payload
         - ruolo scoperto coperto da un override: l'avvio riesce, il flag e vero, e nel payload `from` e `null`
         - ruolo lasciato scoperto: `RolesWithoutResponsible` con nome **e** identificativo del ruolo, nessuna riga scritta
         - persona disattivata e persona inesistente: rifiuto con il motivo indicizzato per ruolo, nessuna riga scritta
         - ruolo non previsto dal processo nel payload: rifiuto, nessuna riga scritta
         - invarianza: `ProjectRoleAssignment` e `DefaultRoleAssignment` confrontate **riga per riga** prima e dopo un avvio con override
         - isolamento: override sulla release A, poi release B avviata subito dopo sullo stesso progetto ripartendo dai predefiniti
         - regole immutate: progetto disattivato, processo mancante, disattivato e senza step rifiutano anche con override validi
         - payload dell'evento con override: un solo evento di avvio, con i **soli** ruoli sovrascritti
      4. Riusa il pattern `assertRefusedWithoutWriting()` di `StartReleaseTest` (il `fail()` fuori dal `try`, altrimenti il `catch` lo inghiotte e riporta l'errore sbagliato)
      5. Budget: in `StartReleaseQueryBudgetTest` aggiungi che l'avvio con override costa **come** l'avvio senza, su catena corta e lunga — la risoluzione degli override e una sola `whereIn`, non una query per ruolo
      6. `php artisan test tests/Feature/Releases --compact` e verifica che le suite esistenti dell'Action siano verdi **senza modifiche**

      ## Criteri di completamento
      - [x] Tutti i casi elencati coperti e verdi
      - [x] Nessuna definizione di factory duplicata nel test
      - [x] `StartReleaseTest`, `SnapshotIsolationTest` e `DatabaseSeederTest` verdi senza essere toccati
      - [x] Budget di query invariato con override, su catena corta e lunga
      - [x] Nessun Playwright, Dusk, Pest browser o suite di viewport (bar `NORMAL`)

