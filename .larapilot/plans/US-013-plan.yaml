  -
    id: TASK-02
    title: 'StartRelease accetta gli override per ruolo, li valida prima di ogni scrittura e li annota nel registro'
    body: |-
      ## Descrizione
      Porta l'override nell'unico percorso di avvio. `StartRelease` riceve una mappatura ruolo => persona, la valida **prima di qualsiasi scrittura** e dentro la stessa transazione, risolve i responsabili dando precedenza all'override, alza `responsible_overridden` sugli step interessati e annota nel payload dell'evento di avvio i **soli** ruoli effettivamente sovrascritti.

      La firma resta additiva perche i chiamanti esistenti non devono essere riscritti: e un criterio di accettazione, non una comodita.

      ## File coinvolti
      - `app/Actions/Releases/StartRelease.php`
      - `app/Exceptions/ResponsibleOverrideRefused.php` (nuova)
      - `app/Exceptions/RolesWithoutResponsible.php` (aggiunta additiva)
      - `lang/it/releases.php` (motivi di rifiuto degli override)

      ## Passi
      1. Firma: `handle(Project $project, string $label, User $actor, array $responsibleOverrides = []): Release` con PHPDoc `@param array<string, string> $responsibleOverrides ruolo => persona`. Il default `[]` deve riprodurre il comportamento odierno **riga per riga**
      2. Nuova eccezione `ResponsibleOverrideRefused` sul modello di `RolesWithoutResponsible` (costruttore privato, costruttori statici, proprieta `readonly`): porta `array<string, string> $reasonsByRole` — ruolo => chiave di traduzione — piu i nomi dei ruoli per il messaggio. Due costruttori statici, perche i due casi si risolvono in modi diversi:
         - `notAssignable()` — persona inesistente o disattivata su uno o piu ruoli
         - `roleNotInProcess()` — il payload nomina un ruolo che il processo non prevede: non e un errore di campo, e un payload manipolato
      3. `RolesWithoutResponsible`: aggiungi `public readonly array $roleIds` accanto a `$roleNames` (aggiunta additiva — il messaggio e la forma esistente non cambiano, cosi `StartReleaseTest` resta verde). Serve alla schermata per agganciare l'errore al campo del ruolo giusto
      4. In `responsibles()`, prima di ogni scrittura e nell'ordine in cui si risolvono:
         a. **Chiavi ammesse** — i soli `role_id` previsti dagli step del processo; una chiave estranea solleva `ResponsibleOverrideRefused::roleNotInProcess()`
         b. **Persone degli override** — caricate con **una sola** query `whereIn('id', ...)` sui valori distinti; una persona mancante o con `is_active` falso alimenta `reasonsByRole` e solleva `ResponsibleOverrideRefused::notAssignable()`
         c. **Copertura** — un ruolo e coperto quando ha un override valido **oppure** un'assegnazione di progetto con persona attiva; i ruoli residui sollevano `RolesWithoutResponsible` con nomi **e** identificativi
         d. **Risoluzione** — override se presente, altrimenti la persona della mappatura
      5. Ordine dei controlli: i ruoli non previsti e le persone non ammissibili **prima** della copertura. Un override invalido che lasciasse anche un ruolo scoperto deve riportare la causa vera, non quella derivata
      6. `responsible_overridden` per step: `true` **solo** quando la persona risolta differisce da quella che la mappatura avrebbe dato. Un selettore lasciato sulla persona predefinita non e una sovrascrittura, e un ruolo scoperto coperto qui **lo e** (nessun default da cui ereditare). Il confronto e per identificativo di persona, non per presenza della chiave nell'array
      7. Payload dell'evento `ReleaseStarted`: aggiungi la chiave `overrides` **solo quando non vuota** — lista di `{role, from, to}` con **nomi** (`from` vale `null` per un ruolo scoperto). Un avvio senza override deve produrre lo stesso payload di oggi, chiave assente compresa: e il criterio "nessun rumore"
      8. Nessuna query in piu per ruolo o per step: la risoluzione lavora sulle relazioni gia precaricate dalla rilettura del progetto, piu l'unica `whereIn` degli override
      9. Aggiorna il PHPDoc di classe: cosa viene congelato ora comprende il fatto che il responsabile e stato indicato in avvio; e resta scritto che l'override **non** modifica `ProjectRoleAssignment` ne `DefaultRoleAssignment`
      10. Chiavi di traduzione dei motivi in `lang/it/releases.php` (prefisso coerente con le esistenti `blocked_*`)
      11. `php artisan test --filter=StartReleaseTest` e `--filter=SnapshotIsolationTest` — verdi **senza modifiche**: e la prova che la firma e neutra

      ## Criteri di completamento
      - [x] Con `$responsibleOverrides` vuoto la release prodotta e indistinguibile da quella odierna: step, responsabili, campi, stato e payload dell'evento
      - [x] Un override su un ruolo assegna la persona scelta a **tutti** gli step di quel ruolo; gli altri ruoli restano sui predefiniti
      - [x] Un ruolo scoperto coperto da un override rende l'avvio possibile
      - [x] Ruolo lasciato scoperto, persona inesistente, persona disattivata e ruolo non previsto dal processo rifiutano l'avvio **prima** di ogni scrittura, nella stessa transazione; nessuna release a meta
      - [x] `RolesWithoutResponsible` porta nomi e identificativi dei ruoli; `ResponsibleOverrideRefused` porta il motivo per ruolo
      - [x] `responsible_overridden` e `true` solo dove la persona differisce dal predefinito
      - [x] La chiave `overrides` e assente nel payload quando non ci sono sovrascritture
      - [x] `ProjectRoleAssignment` e `DefaultRoleAssignment` non vengono scritte da questo percorso
      - [x] Progetto disattivato e processo mancante/disattivato/senza step continuano a rifiutare, override o no
      - [x] `StartReleaseTest` e `SnapshotIsolationTest` verdi senza essere modificati

      ## Dati di test
      - [x] Nessuna modifica di schema in questo task (la colonna e di TASK-01)
      - [x] Le factory esistenti bastano; il caso dimostrativo con override e di TASK-09

      ## Consegne Git
      - Commit: `feat(US-013): TASK-02 resolve responsible overrides when starting a release`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiorna le note locali della PR
