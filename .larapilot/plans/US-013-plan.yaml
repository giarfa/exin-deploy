    id: TASK-04
    title: 'Schermata di avvio: un selettore di responsabile per ruolo, precompilato e con errori agganciati al campo'
    body: |-
      ## Descrizione
      Aggiungi al modulo di avvio l'elenco dei **ruoli previsti dal processo**, ciascuno con un selettore di responsabile precompilato col predefinito. Il caso normale resta "compila l'etichetta e avvia": nessuna scelta obbligata dove un predefinito esiste. La sovrascrittura e un'azione deliberata; un ruolo senza predefinito (scoperto o con persona disattivata) chiede una scelta e la nomina.

      ## File coinvolti
      - `resources/views/components/releases/⚡start.blade.php`
      - `lang/it/releases.php`

      ## Passi
      1. Stato: `public array $responsibles = []` — ruolo => persona, stringa vuota per "nessuno". Precompilato in `mount()` da `Project::responsibleChoices()`, dove il predefinito `null` diventa stringa vuota
      2. `mount()` continua a precaricare il processo e le assegnazioni in un colpo solo: la vista non deve interrogare per ruolo
      3. Computed `responsibleChoices` (delega al modello) e `assignableUsers`: **solo membri attivi**, `select(['id','name'])`, ordinati per nome. Divergenza deliberata da `⚡assignments.blade.php`, che tiene in elenco i disattivati gia assegnati perche la loro riga mostrerebbe altrimenti qualcun altro: qui una release nuova non deve poter nascere in carico a chi non accede piu. Annotalo nel PHPDoc del computed, altrimenti la differenza fra le due pagine si legge come incoerenza
      4. Una sola lista di persone per tutti i selettori: il costo non deve crescere col numero di ruoli
      5. `rules()`: `responsibles` array, e `responsibles.*` con `['required','string', new AssignableUser]` — la regola esistente distingue gia inesistente da disattivato. `validationAttributes()` mappa `responsibles.{roleId}` sul **nome del ruolo**, cosi il messaggio nomina il ruolo mancante invece di dire "il campo responsibles.uuid"
      6. In `start()`, prima di validare: `only()` sulle sole chiavi ammesse (i ruoli previsti dal processo) e normalizzazione a stringa — stesso pattern di `save()` in `⚡assignments.blade.php`. Un ruolo estraneo non deve nemmeno arrivare all'Action, che lo rifiuterebbe comunque
      7. `Gate::authorize('create', [Release::class, $this->project])` resta al montaggio e su **ogni** azione Livewire: le azioni Livewire non ripassano dal middleware di rotta
      8. Passa all'Action **tutte** le persone selezionate: e l'Action a calcolare quali sono override. La schermata non deve conoscere quella regola
      9. Nuovi `catch`, accanto a quelli esistenti:
         - `ResponsibleOverrideRefused` -> `addError("responsibles.{roleId}", ...)` per ogni voce di `reasonsByRole`; il caso "ruolo non previsto dal processo" non ha un campo a cui agganciarsi e diventa il messaggio in testa via `refuse()`
         - `RolesWithoutResponsible` -> non piu solo il messaggio in testa: `addError` sul campo di ogni ruolo elencato in `roleIds`, cosi si corregge dove si sbaglia
         Il messaggio resta **ricavato dall'eccezione**, non ricalcolato dallo stato corrente: ricalcolarlo direbbe cosa manca adesso, e potrebbe indicare il problema sbagliato
      10. `refuse()`: dopo un rifiuto rilegge le precondizioni come oggi e invalida anche `responsibleChoices`, **senza** azzerare le scelte gia fatte dall'utente — perdere le selezioni dopo un errore su un solo campo obbligherebbe a ricompilare tutto
      11. `startAnother()`: reimposta i selettori sui predefiniti freschi (un avvio non deve lasciare in giro le scelte del precedente) e invalida i computed
      12. Avviso non bloccante in testa quando `uncoveredRoles` o `inactiveResponsibles` non sono vuoti: nomina i ruoli/le persone e la conseguenza ("indica un responsabile qui sotto per avviare"), con il collegamento alla pagina responsabili come alternativa permanente
      13. Vista, mobile-first (`.larapilot/runtime-ux.md`): schede impilate a piena larghezza sotto la soglia, area di tocco >= 44 px (`min-h-11`), nessuno scorrimento orizzontale a 375 px. Ogni `flux:select` ha `:label` col **nome del ruolo**; l'errore e reso accanto al campo che lo ha generato (associazione programmatica, WCAG 2.2 AA) in tema chiaro **e** scuro. Il ruolo che richiede una scelta e distinto da icona e parola, mai dal solo colore
      14. `wire:model="responsibles.{{ $role->id }}"`: interpolazione diretta di un UUID senza apici — la forma corretta secondo `.ai/rules/views.md`. **Nessuna** direttiva Blade (`@js`, `@json`, `@class`) dentro l'attributo di un componente `<flux:…>`: resterebbe testo e morirebbe in console
      15. Tutte le stringhe nuove in `lang/it/releases.php`; nessuna incastonata nella vista. Verifica se `lang/en` porta un gemello di `releases.php` e, in tal caso, allinealo
      16. `php artisan test --filter=StartReleaseScreenTest` e `--filter=BladeComponentAttributesTest`

      ## Criteri di completamento
      - [x] I selettori elencano i **ruoli** del processo (non gli step), uno per ruolo anche quando il processo lo usa su piu step
      - [x] Ogni selettore e precompilato col responsabile risolto dalla mappatura; un ruolo senza predefinito resta vuoto e lo dichiara
      - [x] Solo membri attivi selezionabili; un disattivato non compare in elenco
      - [x] Avviando senza toccare nulla la release prodotta e identica a quella odierna
      - [x] Un ruolo lasciato vuoto rifiuta l'avvio con il **nome del ruolo** sul campo di quel ruolo; nessuna release creata
      - [x] Un rifiuto dell'Action su una persona non ammissibile compare sul campo del ruolo interessato
      - [x] Le precondizioni restano coerenti dopo un rifiuto e le selezioni dell'utente non vanno perse
      - [x] Doppio invio: messaggio di etichetta duplicata sul campo etichetta, nulla lasciato dietro
      - [x] Nessuna query per ruolo ne per membro nel disegno della pagina
      - [x] Usabile a 375 / 768 / 1280 px, tema chiaro e scuro, navigabile da tastiera; errori associati ai campi (verifica manuale)
      - [x] Nessuna stringa incastonata nella vista

