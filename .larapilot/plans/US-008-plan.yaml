    id: TASK-06
    title: 'Budget di query del dettaglio della release'
    body: |-
      ## Descrizione

      Fissare l'invariante di costo della schermata: il PRD indica l'N+1 come rischio strutturale delle catene annidate, e questa e la vista che ne carica di piu — per ogni step la release, il responsabile, l'autore della chiusura e tutti i campi.

      Come nelle altre prove di budget del progetto, il test **non fissa un numero assoluto** (lo cambierebbe ogni ottimizzazione legittima) ma l'invariante che conta: lo stesso costo su una catena corta e su una lunga.

      ## File coinvolti

      - tests/Feature/Releases/ReleaseDetailQueryBudgetTest.php (nuovo)

      ## Passi

      1. Misurare con `DB::listen` come in `MyStepsQueryBudgetTest`: stesso costo su una release di 3 step e su una di 12.
      2. Secondo caso: stesso costo con 1 campo per step e con 5 campi per step.
      3. Terzo caso: leggere gli istanti di attivazione sugli step gia caricati **non** deve produrre alcuna query — ne l'alias della sottoquery ne la relazione inversa verso la release.
      4. Alternare le forme nello scenario di prova: una release appena avviata (step attivo in prima posizione, senza precedente da cui leggere l'istante) e una a meta catena. E il ramo di ripiego su `release->started_at`, il piu facile da lasciare scoperto.
      5. `php artisan test --compact --filter=ReleaseDetailQueryBudgetTest`

      ## Criteri di completamento

      - [x] Il costo non cresce con il numero di step
      - [x] Il costo non cresce con il numero di campi per step
      - [x] La lettura degli istanti di attivazione costa zero query
      - [x] I messaggi di fallimento dicono **cosa manca** (quale eager loading), non solo che i numeri differiscono

      ## Dati di prova

      - Riuso delle factory esistenti; nessuno stato nuovo

