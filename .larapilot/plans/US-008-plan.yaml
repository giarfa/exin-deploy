    id: TASK-05
    title: 'Copertura della schermata di dettaglio'
    body: |-
      ## Descrizione

      Coprire con test di funzionalita ogni criterio di accettazione della schermata: contenuto dell'intestazione, ordine e stati della catena, valori degli step chiusi, assenza di campi sugli step bloccati, visibilita del comando di apertura, resa di link e conferme, lettura aperta a ogni membro autenticato.

      Livello `NORMAL`: feature, unit e policy. **Nessun** Playwright, Dusk, Pest browser o matrice di viewport.

      ## File coinvolti

      - tests/Feature/Releases/ReleaseDetailScreenTest.php (nuovo)

      ## Passi

      1. Comporre lo scenario dalle factory esistenti: release in corso di 5 step — primo completato con i quattro tipi di campo (uno lasciato non fornito), secondo attivo, restanti bloccati — piu una release conclusa.
      2. **Trappola nota** (`.ai/rules/tests.md`): `completed_at` e `completed_by` non sono mass-assignable. Usare lo stato `completed()` oppure `forceFill([...])->save()`; un `update([...])` le lascia cadere in silenzio e il test passerebbe per la ragione sbagliata.
      3. Casi da coprire:
         - intestazione con etichetta, progetto, stato, template di origine, autore e istante di avvio
         - i cinque step compaiono nell'ordine congelato, ognuno con il proprio stato
         - ruolo congelato e nome del responsabile su ogni step, anche dopo la rinomina del ruolo nel catalogo (prova che si legge `role_name`)
         - lo step completato mostra i valori forniti, l'autore e l'istante di chiusura; il campo non compilato compare come "non fornito"
         - lo step bloccato non mostra alcun campo compilabile ne valore
         - il comando di apertura compare al responsabile dello step attivo e a un amministratore, e **non** compare a un membro estraneo
         - un campo link con `http(s)` e reso come collegamento; un valore con schema diverso resta testo
         - un campo conferma compilato e reso come esito affermativo
         - un membro autenticato senza alcuno step assegnato apre il dettaglio in sola lettura
         - un ospite viene reindirizzato all'accesso
         - una release conclusa mostra la catena tutta completata e nessun comando di apertura
      4. `php artisan test --compact --filter=ReleaseDetailScreenTest`

      ## Criteri di completamento

      - [x] Un test per ciascun criterio di accettazione della spec
      - [x] Coperti il percorso felice, il diniego (membro estraneo, ospite) e i casi limite (campo non fornito, link non conforme, release conclusa)
      - [x] I nomi dei test descrivono il comportamento atteso, non il metodo invocato
      - [x] Suite verde

      ## Dati di prova

      - Riuso delle factory e degli stati esistenti; nessuna definizione duplicata dentro i test

      ## Consegne Git

      - Commit: `test(US-008): TASK-05 copertura della schermata di dettaglio`
