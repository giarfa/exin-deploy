code: US-008
plan_body: |-
  ## Soluzione tecnica

  Il dettaglio della release e una schermata di **sola lettura** su dati che esistono gia: US-004 congela lo snapshot, US-005/US-006 lo fanno avanzare, questa spec lo rende leggibile. **Nessuna migrazione, nessun modello nuovo, nessuna colonna nuova** — il costo della spec e tutto in lettura, autorizzazione e resa.

  ### Rotta e autorizzazione

  - Rotta `GET /rilasci/{release}` -> `Route::livewire('/rilasci/{release}', 'releases.show')->can('view', 'release')->name('releases.show')`, dentro il gruppo `auth` di `routes/web.php`.
  - Doppia protezione come tutte le rotte che hanno qualcosa da autorizzare: middleware `->can()` **piu** `Gate::authorize('view', $this->release)` nel `mount()` del componente. Non e la deroga di `/step/{releaseStep}`: qui non c'e alcun tentativo da registrare nel registro delle transizioni, quindi il middleware puo rifiutare per primo (vedi `.ai/rules/routes.md`).
  - `ReleasePolicy::view()` passa da `false` a `true`: **ogni membro autenticato** consulta il dettaglio in sola lettura, anche senza essere responsabile di alcuno step. E il criterio esplicito della spec e la ragione per cui la Policy oggi porta il commento "appartiene a US-008". `viewAny()` resta `false`: l'elenco e la sua Policy sono US-009.
  - Il comando "Apri e compila" sullo step attivo compare sotto `@can('fill', $step)`. Nasconderlo non e autorizzazione: `ReleaseStepPolicy::fill()` decide lato server e la schermata di chiusura la riapplica al montaggio e su ogni azione.

  ### Componente

  `resources/views/components/releases/⚡show.blade.php` — componente Livewire 4 monofile, come tutti gli altri di questo progetto. `public Release $release` risolta dal binding di rotta; nessuna azione Livewire, nessuna scrittura.

  Una sola lettura di dominio, interamente in eager loading:

  ```php
  $this->release->load([
      'project',
      'workflowTemplate',
      'startedBy',
      'steps' => fn ($steps) => $steps
          ->withActivationInstant()
          ->with(['fields', 'assignedUser', 'completedBy']),
  ]);
  ```

  Vincoli noti da rispettare, tutti gia documentati nel codice:

  1. `withActivationInstant()` **ridefinisce la select** (`select('{tabella}.*')`): va applicato prima di qualunque `addSelect`/`withCount`, altrimenti le colonne aggiunte spariscono senza avviso.
  2. `ReleaseStep::activationInstant()` ripiega su `release->started_at` sul primo della catena e **solleva** se l'alias manca. La relazione inversa va popolata a mano dopo il caricamento (`$this->release->steps->each(fn (ReleaseStep $step) => $step->setRelation('release', $this->release))`), altrimenti il primo step attivo pagherebbe una query per risalire alla release.
  3. Si legge **soltanto** lo snapshot (`releases`, `release_steps`, `release_step_fields`): nessuna lettura di `step_definitions` o `field_definitions` (`.ai/rules/app.md`).
  4. Il ruolo si mostra da `role_name` congelato, mai da `role()->name`.

  ### Resa della catena

  Lista ordinata (`<ol>`) dei tre stati dello step, nell'ordine congelato dallo snapshot:

  - **Completato** — ruolo e nome del responsabile, autore e istante di chiusura (`completed_by` / `completed_at`, con ripiego sul responsabile assegnato come gia fa `⚡step.blade.php`), e i valori forniti.
  - **Attivo** — ruolo e nome del responsabile, da quanto e aperto (`activationInstant()->diffForHumans()`), numero di informazioni richieste, e il comando di apertura **solo** se la Policy lo consente.
  - **Bloccato** — ruolo e nome del responsabile e cosa lo sblocca. **Nessun campo compilabile e nessun valore**: e criterio di accettazione, non una scelta di stile.

  Ogni stato e reso con **icona e parola**, mai dal solo colore: e il contratto di accessibilita gia adottato da "i miei step" e dalla catena di avvio.

  ### Riuso: i valori forniti in un posto solo

  Il blocco `<dl>` che rende i valori di uno step chiuso — "non fornito" per il `null`, esito affermativo per la conferma, collegamento cliccabile per il link con verifica dello schema `http(s)` — esiste gia dentro `⚡step.blade.php` e serve identico qui. Va **estratto** in `resources/views/components/releases/step-values.blade.php` e usato da entrambe le schermate, come gia fatto per `step-instructions.blade.php`.

  Due copie della verifica dello schema del link sono due posti in cui dimenticare di correggerla: la riga arrivata da un import o da una correzione a mano sul database non passa da `WellFormedLink`, e un `javascript:` reso come `href` sarebbe una superficie offerta proprio a chi consulta lo storico.

  ### Vie di accesso

  La voce di navigazione "Release" resta **in arrivo**: quella voce promette l'elenco (US-009), non il dettaglio. Senza punti di accesso il dettaglio sarebbe una pagina irraggiungibile, quindi la spec ne apre tre, tutti su schermate esistenti:

  - `my-steps/⚡index.blade.php` — le card del blocco "release in attesa" diventano collegamenti al dettaglio. E la risposta esatta alla domanda che quel blocco pone ("dove siamo e chi stiamo aspettando").
  - `releases/⚡step.blade.php` — collegamento al dettaglio della release accanto al ritorno a "i miei step".
  - `releases/⚡start.blade.php` — dalla conferma di avvio, il ponte verso la catena appena congelata (il commento nel file dichiara gia questa transizione come temporanea in attesa di US-008).

  ### Layout (mockup `dettaglio-release.html`)

  - Colonna singola sotto 1024 px; due colonne da 1024 px (`lg:grid-cols-3`, catena su 2 e riquadro dati su 1) — la stessa soglia `lg:` gia usata dalla shell applicativa, nessuna soglia nuova.
  - Riquadro "Dati della release": progetto, etichetta, stato, template di origine, avviata da, avviata il, step completati su totale, piu la nota "il template e congelato all'avvio".
  - Nessuno scorrimento orizzontale a 375 px: liste di definizione e non tabelle, come nelle schermate gia consegnate.
  - Un solo `h1` (progetto + etichetta), le due sezioni come `h2`, i nomi degli step come `h3`.

  ## Decisioni

  **Il nome del template e provenienza, non definizione.** Il riquadro mostra `release->workflowTemplate->name`, cioe il nome **attuale** del template. Non contraddice la regola dello snapshot: la catena, l'ordine e i campi arrivano tutti da `release_steps`/`release_step_fields`, e il template e citato solo per dire da dove la release e nata. La nota accanto ("modifiche successive non alterano questa release") toglie l'ambiguita a chi legge. Alternativa scartata: congelare `template_name` su `releases` — una colonna in piu per un dato che nessun percorso di esecuzione interroga.

  **Briciole di navigazione senza l'elenco.** Il mockup mostra "Release / Portale Clienti / v2.4.0", ma `releases.index` non esiste (US-009) e `projects.index` e riservata agli amministratori: entrambe le voci sarebbero un vicolo cieco o un 403 per un membro. Le briciole di questa spec sono quindi **"I miei step" (collegamento) / nome del progetto (testo) / etichetta della release (corrente)**. US-009 sostituira la prima voce con l'elenco delle release e riportera il mockup alla lettera.

  **Da quanto lo step attivo e aperto.** Si riusa `withActivationInstant()` cosi com'e, con il ripiego su `release->started_at` sul primo della catena. Nessuna colonna `activated_at`: la decisione e gia registrata nel piano di US-007 e questa spec non porta la ragione (ordinare o filtrare in database) che la giustificherebbe.

  ## Git e branching

  - Modalita: **GITFLOW** (`settings.git_mode`) — nessun push automatico, PR interna preparata in locale.
  - **Precondizione**: US-008 e bloccata da US-004 (gia su `develop`), ma tocca `my-steps/⚡index.blade.php`, che vive su `feature/US-007-vista-i-miei-step` e **non e ancora integrato in `develop`**. US-007 e approvata: TASK-00 verifica l'integrazione e, se manca, la esegue prima di ramificare.
  - Ramo: `feature/US-008-dettaglio-release` da `develop`.
  - Un commit atomico per task, Conventional Commits `tipo(US-008): TASK-NN sintesi`. Nessun push, nessuna PR remota se non richiesti esplicitamente in sessione.
  - Merge su `develop` solo dopo approvazione umana in `larapilot-review`.
  - `CHANGELOG.md` sezione Unreleased aggiornata nell'ultimo task: la schermata e comportamento visibile all'utente.

  ## Strategia dei dati di prova

  Nessuna modifica di schema, quindi **nessuna factory nuova e nessuna nuova migrazione**. Le factory esistenti coprono gia lo scenario:

  - `ReleaseStepFactory` — stati `blocked()`, `active()`, `completed()` (quest'ultimo scrive `completed_by` e `completed_at`).
  - `ReleaseStepFieldFactory` — stati `shortText()`, `longText()`, `link()`, `confirmation()`, `filled()`, `optional()`: i quattro tipi e il caso "non fornito" sono tutti esprimibili.
  - `ReleaseFactory` — stato `completed()` per la release conclusa in sola lettura.

  Scenario di riferimento dei test: una release in corso di 5 step — il primo completato con i quattro tipi di campo (uno lasciato vuoto), il secondo attivo, i restanti bloccati — piu una release conclusa.

  **`DatabaseSeeder` non viene toccato**: lo scenario di esecuzione (release a meta catena e release conclusa) e di competenza di US-011, che lo compone. Anticiparlo qui creerebbe due sorgenti dello stesso dataset.

  Trappola nota (`.ai/rules/tests.md`): `completed_at` e `completed_by` non sono mass-assignable. Nei test si usano gli stati di factory `completed()` oppure `forceFill([...])->save()`; un `update([...])` le lascia cadere **in silenzio** e il test passa per la ragione sbagliata.

  ## Strategia di test

  - Livello: **NORMAL** (`settings.testing`) — feature, unit, policy. **Nessun** Playwright, Dusk, Pest browser, matrice di viewport o E2E.
  - `tests/Feature/Releases/ReleaseDetailScreenTest.php` — un test per criterio di accettazione: intestazione con etichetta/progetto/stato/template/autore/istante di avvio; sequenza completa nell'ordine congelato; ruolo e nome del responsabile su ogni step; valori, autore e istante sugli step chiusi; assenza di campi compilabili sugli step bloccati; comando di apertura visibile al responsabile e all'amministratore e assente agli altri; link resi come collegamenti e conferme come esito affermativo; lettura consentita a un membro estraneo alla release; ospite reindirizzato all'accesso; release conclusa in sola lettura.
  - `tests/Feature/Releases/ReleaseDetailQueryBudgetTest.php` — l'invariante gia adottata dalle altre schermate: **stesso costo** con 3 e con 12 step, e con 1 e con 5 campi per step. Nessun numero assoluto, che ogni ottimizzazione legittima cambierebbe.
  - `tests/Feature/Releases/ReleasePolicyTest.php` — aggiornato: `view` concessa a ogni membro autenticato, `viewAny` ancora negata (US-009), `delete` sempre negata.
  - Regressione: `CloseStepScreenTest` deve restare verde dopo l'estrazione del componente dei valori — e la prova che l'estrazione non ha cambiato comportamento.
  - Handoff manuale per la revisione: aprire il dettaglio a 375 px e a 1280 px e verificare colonna singola / due colonne, assenza di scorrimento orizzontale, e stati leggibili in tema chiaro e scuro.
  - Gate di qualita prima della consegna: `php artisan larapilot:quality` (Pint + Larastan livello 5) e `php artisan test --compact`.
tasks:
  -
    id: TASK-00
    title: 'Ramo di lavoro e integrazione di US-007 in develop'
    body: |-
      ## Descrizione

      Predisporre Gitflow per la spec: verificare che US-007 (approvata) sia integrata in `develop` e creare il ramo di lavoro. **Precondizione reale, non ceremonia**: questa spec modifica `resources/views/components/my-steps/⚡index.blade.php`, che oggi esiste solo su `feature/US-007-vista-i-miei-step`. Ramificando da un `develop` senza US-007 il task delle vie di accesso non avrebbe il file da modificare.

      Sotto `git_mode: GITFLOW` non si esegue alcun push: la PR interna verso `develop` si prepara in locale.

      ## File coinvolti

      - (solo git — nessun file applicativo)

      ## Passi

      1. `git ls-tree -r --name-only develop | grep my-steps` — se non torna nulla, US-007 non e integrata.
      2. Se manca: `git checkout develop && git merge --no-ff feature/US-007-vista-i-miei-step` (Sarah guida la risoluzione di eventuali conflitti; nessun push).
      3. `php artisan test --compact` su `develop` dopo il merge: l'integrazione e verde prima di ramificare, non dopo.
      4. `git checkout -b feature/US-008-dettaglio-release`
      5. Redigere titolo e corpo della PR interna verso `develop` (`US-008: Dettaglio della release con catena e informazioni fornite`), tenuti in locale.
      6. Commit di ancoraggio del ramo (commit vuoto ammesso).

      ## Criteri di completamento

      - [x] US-007 risulta integrata in `develop` (il file `my-steps/⚡index.blade.php` e presente su `develop`)
      - [x] La suite e verde su `develop` dopo l'integrazione
      - [x] Il ramo `feature/US-008-dettaglio-release` esiste in locale
      - [x] Titolo e corpo della PR verso `develop` sono redatti

      ## Dati di prova

      - N/A — nessuna modifica di schema o di modelli in questo task

      ## Consegne Git

      - Commit: `chore(US-008): TASK-00 ramo di lavoro per il dettaglio della release` (commit vuoto ammesso)
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: preparata in locale; apertura remota solo su richiesta esplicita
