    id: TASK-01
    title: 'Apertura della lettura della release a ogni membro e rotta di dettaglio'
    body: |-
      ## Descrizione

      Aprire `ReleasePolicy::view()` a ogni membro autenticato e registrare la rotta del dettaglio. E il criterio "ogni membro autenticato puo consultare il dettaglio in sola lettura, anche senza essere responsabile di alcuno step": la Policy oggi nega a tutti i non amministratori e porta gia il commento che rimanda a questa spec.

      `viewAny()` **resta negata**: l'elenco delle release e la sua Policy appartengono a US-009. Aprirla qui darebbe un'autorizzazione senza una schermata che la usi.

      ## File coinvolti

      - app/Policies/ReleasePolicy.php
      - routes/web.php
      - tests/Feature/Releases/ReleasePolicyTest.php

      ## Passi

      1. `ReleasePolicy::view()` torna `true`; aggiornare il PHPDoc — la lettura del dettaglio e aperta a chiunque sia autenticato, perche sapere dove e fermo un rilascio non e un privilegio: e la funzione stessa dello strumento. Il commento deve dire cosa **resta** chiuso (`viewAny` -> US-009, `delete` -> mai).
      2. Registrare nel gruppo `auth` di `routes/web.php`, accanto alle altre rotte di release:
         `Route::livewire('/rilasci/{release}', 'releases.show')->can('view', 'release')->name('releases.show');`
      3. Commentare la rotta come le altre: perche qui il `->can()` c'e (nessun tentativo da registrare, a differenza di `/step/{releaseStep}` — vedi `.ai/rules/routes.md`) e perche il segmento e `/rilasci/` al plurale, coerente con `/progetti/`.
      4. Aggiornare `ReleasePolicyTest`: `view` concessa a un membro qualunque, estraneo alla release; concessa all'amministratore; negata all'ospite (a livello di rotta); `viewAny` ancora negata a un membro; `delete` negata anche all'amministratore.
      5. `php artisan test --compact --filter=ReleasePolicyTest`

      ## Criteri di completamento

      - [x] `ReleasePolicy::view()` concede a ogni utente autenticato, con PHPDoc aggiornato che dice cosa resta chiuso
      - [x] `viewAny()` e `delete()` invariate
      - [x] La rotta `releases.show` risponde su `/rilasci/{release}` con doppia protezione dichiarata nel commento
      - [x] `ReleasePolicyTest` copre membro estraneo, amministratore e i due dinieghi residui
      - [x] `php artisan route:list --path=rilasci` mostra la rotta con il middleware `can:view,release`

      ## Dati di prova

      - N/A — nessuna modifica di schema, modelli o relazioni

      ## Consegne Git

      - Commit: `feat(US-008): TASK-01 apre la lettura della release e registra la rotta di dettaglio`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
