    id: TASK-02
    title: 'Estrarre i valori forniti in un componente condiviso'
    body: |-
      ## Descrizione

      Estrarre da `⚡step.blade.php` il blocco che rende le informazioni fornite di uno step chiuso e portarlo in un componente Blade condiviso, come gia fatto per `step-instructions.blade.php`. Il dettaglio della release ha bisogno **della stessa resa** su ogni step completato della catena.

      Non e un abbellimento: dentro quel blocco vive la verifica dello schema `http(s)` prima di rendere un valore come collegamento cliccabile. Duplicarla significa avere due posti in cui dimenticare di correggerla, e la riga arrivata da un import o da una correzione a mano sul database non passa da `WellFormedLink`.

      **Refactoring a comportamento invariato**: nessuna modifica alla resa attuale della schermata di chiusura.

      ## File coinvolti

      - resources/views/components/releases/step-values.blade.php (nuovo)
      - resources/views/components/releases/⚡step.blade.php

      ## Passi

      1. Creare `step-values.blade.php` con `@props(['fields'])`, contenente la lista di definizione: "non fornito" per il valore `null`, esito affermativo con icona per la conferma, collegamento per il link con schema verificato, testo altrimenti.
      2. Trasferire nel nuovo file i commenti che spiegano le due scelte non ovvie (verifica dello schema anche in lettura, `rel="noopener noreferrer"` esplicito, lista di definizione invece di tabella a 375 px): il ragionamento deve viaggiare con il codice che lo giustifica.
      3. Sostituire il blocco in `⚡step.blade.php` con `<x-releases.step-values :fields="$this->fields" />`, rimuovendo l'import di `Str` se non piu usato altrove nel file.
      4. `php artisan test --compact --filter=CloseStepScreenTest`
      5. `vendor/bin/pint --dirty --format agent`

      ## Criteri di completamento

      - [x] `x-releases.step-values` rende i quattro tipi di campo e il caso "non fornito"
      - [x] I link con schema diverso da `http`/`https` restano testo, non diventano `href`
      - [x] `⚡step.blade.php` usa il componente e non contiene piu una seconda copia della logica
      - [x] `CloseStepScreenTest` verde senza modifiche: la resa della schermata di chiusura e invariata

      ## Dati di prova

      - N/A — nessuna modifica di schema o di modelli in questo task

      ## Consegne Git

      - Commit: `refactor(US-008): TASK-02 estrae i valori forniti in un componente condiviso`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
