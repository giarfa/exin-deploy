    id: TASK-07
    title: 'Changelog e nota sulla lettura aperta della release'
    body: |-
      ## Descrizione

      Documentare la consegna: voce nel `CHANGELOG.md` sotto Unreleased, con il fatto rilevante per chi usa lo strumento — il dettaglio di una release e consultabile da **ogni** membro autenticato, anche estraneo alla catena.

      Registrare inoltre come regola condivisa la decisione non ovvia di questa spec, cosi che la prossima revisione non la legga come una svista.

      ## File coinvolti

      - CHANGELOG.md
      - .ai/rules/ (nuova regola tramite il comando `record-rule`)

      ## Passi

      1. Aggiungere in `CHANGELOG.md` -> Unreleased -> Added la voce del dettaglio della release (US-008, FR-014), nello stile delle voci esistenti: cosa cambia per chi usa, non l'elenco dei file toccati. Citare la lettura aperta a ogni membro e il fatto che la catena mostrata e lo snapshot congelato.
      2. Registrare con `record-rule` (glob `app/Policies/ReleasePolicy.php`) la decisione: `view` e concessa a ogni membro autenticato mentre `viewAny` resta negata; le due non si allineano per sbaglio — sapere dove e fermo un rilascio non e un privilegio, ma l'elenco con i suoi filtri appartiene a US-009 e la sua Policy si decide li.
      3. Verificare che non restino riferimenti nel codice al dettaglio come "non ancora esistente" (commenti di `⚡start.blade.php`, `⚡step.blade.php`, Policy).

      ## Criteri di completamento

      - [x] `CHANGELOG.md` aggiornato nella sezione Unreleased
      - [x] La regola sulla Policy e registrata in `.ai/rules`
      - [x] Nessun commento nel codice descrive ancora il dettaglio della release come non esistente
      - [x] `php artisan larapilot:quality` senza rilievi e `php artisan test --compact` verde

