    id: TASK-04
    title: 'Vie di accesso al dettaglio dalle schermate esistenti'
    body: |-
      ## Descrizione

      Collegare il dettaglio alle schermate gia consegnate. La voce di navigazione "Release" resta **in arrivo**: quella voce promette l'elenco (US-009), non il dettaglio, e cambiarne la destinazione ora prometterebbe una pagina diversa da quella che apre.

      Senza questo task il dettaglio esisterebbe come indirizzo raggiungibile solo a mano. Il collegamento piu importante e il primo: il blocco "release in attesa" di "i miei step" pone la domanda "chi trattiene il flusso e da quanto", e il dettaglio e la risposta estesa.

      ## File coinvolti

      - resources/views/components/my-steps/⚡index.blade.php
      - resources/views/components/releases/⚡step.blade.php
      - resources/views/components/releases/⚡start.blade.php
      - lang/it/releases.php
      - lang/it/my-steps.php

      ## Passi

      1. In `my-steps/⚡index.blade.php`: le card del blocco "release in attesa" diventano collegamenti a `route('releases.show', $release)`. Rispettare il contratto gia adottato per le card degli step — bersaglio di almeno 44x44 px, `block` e non `flex`, nessun comando annidato dentro il collegamento.
      2. In `releases/⚡step.blade.php`: aggiungere il collegamento al dettaglio della release accanto al ritorno a "i miei step", disponibile in tutti e tre gli stati dello step (attivo, completato, bloccato).
      3. In `releases/⚡start.blade.php`: dalla conferma di avvio, collegamento al dettaglio della release appena avviata. Aggiornare il commento del "ponte" che oggi dichiara il dettaglio come non ancora esistente.
      4. Aggiungere le chiavi di testo necessarie; nessuna stringa a codice nelle viste.
      5. Verificare a 375 px che i nuovi collegamenti non introducano scorrimento orizzontale ne bersagli sotto i 44 px.
      6. `php artisan test --compact --filter="MyStepsScreenTest|CloseStepScreenTest|StartReleaseScreenTest"`

      ## Criteri di completamento

      - [x] Dal blocco "release in attesa" si raggiunge il dettaglio della release
