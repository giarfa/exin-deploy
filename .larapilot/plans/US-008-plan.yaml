    id: TASK-03
    title: 'Schermata di dettaglio della release con catena e dati del rilascio'
    body: |-
      ## Descrizione

      Costruire `releases.show`: la catena completa nell'ordine congelato con lo stato di ogni step, il ruolo e il nome del responsabile, i valori forniti sugli step chiusi, e il riquadro con i dati della release. Una sola lettura di dominio, interamente in eager loading.

      E la risposta strutturale alla domanda "dove siamo e chi stiamo aspettando" (FR-014), e per questo la pagina non chiede nulla a chi la apre: non ha azioni, non ha form, non scrive.

      ## File coinvolti

      - resources/views/components/releases/⚡show.blade.php (nuovo)
      - lang/it/releases.php

      ## Passi

      1. Creare il componente monofile Livewire 4 con `public Release $release` risolta dal binding di rotta e `Gate::authorize('view', $this->release)` nel `mount()` (secondo livello dopo il middleware, come nelle altre schermate).
      2. Caricare in una sola volta: `project`, `workflowTemplate`, `startedBy`, e `steps` con `withActivationInstant()` piu `fields`, `assignedUser`, `completedBy`.
      3. Popolare la relazione inversa sugli step (`setRelation('release', $this->release)`): senza, `activationInstant()` sul primo step della catena risalirebbe alla release con una query propria.
      4. Rendere l'intestazione: `h1` con progetto ed etichetta, sottotitolo con lo stato attuale ("step 2 di 5, in attesa di ..." oppure la conclusione) in una regione `aria-live="polite"`, come in "i miei step".
      5. Rendere la catena come `<ol>` ordinata, tre stati distinti:
         - **completato**: ruolo e responsabile, autore e istante di chiusura, `<x-releases.step-values :fields="$step->fields" />`
         - **attivo**: ruolo e responsabile, da quanto e aperto (`activationInstant()->diffForHumans(syntax: CarbonInterface::DIFF_ABSOLUTE)`), numero di informazioni richieste, comando `route('releases.step', $step)` racchiuso in `@can('fill', $step)`, con la nota che il comando e riservato al responsabile o a un amministratore
         - **bloccato**: ruolo e responsabile, cosa lo sblocca (chiusura dello step precedente, oppure "ultimo step: la sua chiusura conclude il rilascio"). **Nessun campo, nessun valore.**
      6. Ogni stato reso con **icona e parola**, mai dal solo colore; i nomi degli step come `h3`, le due sezioni come `h2`, un solo `h1`.
      7. Rendere il riquadro laterale "Dati della release": progetto, etichetta, stato, template di origine, avviata da, avviata il, step completati su totale, piu la nota che il template e congelato all'avvio.
      8. Layout mobile-first secondo `.larapilot/mockups/superficie-operativa/dettaglio-release.html`: colonna singola sotto 1024 px, due colonne da `lg:` (catena su due terzi, riquadro su uno). Nessuna soglia nuova oltre la `lg:` gia usata dalla shell.
      9. Briciole di navigazione in cima: "I miei step" (collegamento a `route('home')`) / nome del progetto (testo) / etichetta (corrente). Commentare la deviazione dal mockup e il fatto che US-009 sostituira la prima voce con l'elenco.
      10. Aggiungere le chiavi in `lang/it/releases.php` sotto un blocco commentato "Dettaglio della release (US-008)". Copia in italiano, tono coerente con le schermate esistenti: nessun testo inglese, nessun segnaposto.
      11. Verificare a mano a 375 px e a 1280 px, in tema chiaro e scuro: nessuno scorrimento orizzontale, comando primario raggiungibile, stati leggibili.
      12. `php artisan test --compact --filter=Releases` e `vendor/bin/pint --dirty --format agent`

      ## Criteri di completamento

      - [x] La vista mostra etichetta, progetto, stato, template di origine, autore e istante di avvio
      - [x] La sequenza degli step segue l'ordine congelato dello snapshot, con lo stato di ciascuno
      - [x] Ogni step mostra ruolo (`role_name` congelato) e nome del responsabile risolto
      - [x] Gli step completati mostrano valori, autore e istante di chiusura
      - [x] Gli step bloccati non mostrano alcun campo compilabile
      - [x] Il comando di apertura appare solo dove `@can('fill', $step)` lo consente
      - [x] I campi link sono collegamenti, le conferme un esito affermativo (via `x-releases.step-values`)
      - [x] Nessuna lettura di `step_definitions` o `field_definitions` in tutto il componente
