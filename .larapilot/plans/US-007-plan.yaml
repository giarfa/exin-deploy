    id: TASK-04
    title: 'Budget di query: nessun N+1 su step in attesa e release coinvolte'
    body: |-
      ## Description
      Il PRD indica l'N+1 come rischio strutturale delle catene annidate e nomina "i miei step" fra i candidati naturali. Il criterio di accettazione chiede che sia **verificato**, non dichiarato. Stesso stile gia adottato da `CloseStepQueryBudgetTest` e `StartReleaseQueryBudgetTest`.

      ## Files Involved
      - tests/Feature/MySteps/MyStepsQueryBudgetTest.php (nuovo)

      ## Steps
      1. **Nessun numero assoluto di query**: un numero fisso andrebbe riscritto a ogni ottimizzazione legittima. Fissa l'invariante che conta: **stesso costo** con uno step in attesa e con dieci, su piu progetti e release diversi.
      2. Secondo caso: stesso costo con una release coinvolta e con dieci nel blocco secondario, responsabili e progetti inclusi.
      3. Terzo caso: l'istante di attivazione non costa una query per step — leggere `activationInstant()` su una collezione gia caricata dallo scope non deve produrre query.
      4. Conta con `DB::listen`, raccogliendo davvero gli attributi mostrati dalla schermata (nome, ruolo congelato, progetto, etichetta, posizione, responsabile, istante): e la lettura a poter far scattare un caricamento pigro, cioe la query che il test misura.
      5. `php artisan test --filter=MyStepsQueryBudgetTest`

      ## Completion Criteria
      - [ ] Il costo non cresce con il numero di step in attesa
      - [ ] Il costo non cresce con il numero di release coinvolte
      - [ ] L'istante di attivazione non costa una query per riga
      - [ ] Il messaggio di fallimento dice **quale** eager loading manca, non solo che i numeri differiscono

