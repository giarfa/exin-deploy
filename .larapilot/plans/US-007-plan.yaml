    id: TASK-01
    title: 'Seam di lettura sui modelli: step attivo della release e istante di attivazione'
    body: |-
      ## Description
      Introduce i due seam di lettura che la vista operativa richiede e che US-008 e US-009 riuseranno: la relazione verso lo **step attivo** di una release e la derivazione dell'**istante di attivazione** di uno step. Nessuna migrazione, nessuna colonna nuova: la decisione e motivata nel corpo del piano ("Decisione — da quanto uno step e aperto").

      ## Files Involved
      - app/Models/Release.php
      - app/Models/ReleaseStep.php
      - tests/Unit/Models/ReleaseTest.php
      - tests/Unit/Models/ReleaseStepTest.php

      ## Steps
      1. `Release::activeStep(): HasOne` — `hasOne(ReleaseStep::class)->where('status', ReleaseStepStatus::Active)`. Deve essere eager-loadable (`with('activeStep')`), quindi una relazione e non un metodo che filtra in PHP. Documenta nel PHPDoc l'invariante che la rende sensata: al massimo uno step attivo per release, zero quando la release e conclusa — quindi `null` su una release conclusa e un esito legittimo, non un errore.
      2. `Release` — scope `#[Scope] involving(Builder $query, User $user)`: release che hanno almeno uno step assegnato a quella persona, in qualunque stato. Serve al blocco delle release in attesa.
      3. `ReleaseStep` — scope `#[Scope] awaitingUser(Builder $query, User $user)`: step in stato `Active`, assegnati a quella persona, su release in corso. Il filtro e sull'assegnazione e **non** sulla Policy: un amministratore non deve vedere qui gli step altrui.
      4. `ReleaseStep` — scope `#[Scope] withActivationInstant(Builder $query)`: `select('release_steps.*')` piu `addSelect` di una sottoquery correlata che legge il `completed_at` dello step precedente della stessa release (`whereColumn('release_id', ...)`, `whereColumn('position', '<', ...)`, `orderByDesc('position')`, `limit(1)`), con alias `previous_step_completed_at`. Attenzione: senza il `select('release_steps.*')` esplicito la sola `addSelect` produrrebbe una query con quella unica colonna.
      5. Aggiungi `'previous_step_completed_at' => 'datetime'` ai cast di `ReleaseStep`, cosi che l'alias torni come istante e non come stringa.
      6. `ReleaseStep::activationInstant(): CarbonInterface` — restituisce `previous_step_completed_at` quando c'e, altrimenti `release->started_at`. Documenta perche i due istanti coincidono: `CloseStep` chiude lo step precedente e attiva il successivo nella **stessa transazione**, quindi non e un'approssimazione. Il metodo richiede la release caricata: dichiaralo nel PHPDoc come fa `ReleaseStep::closingRules()` per i campi.
      7. Solo Eloquent e costrutti portabili: nessuna funzione specifica di SQLite (vincolo permanente 1 del README).
      8. Test di unita nello stesso commit: relazione `activeStep` presente/assente, scope `awaitingUser` che esclude bloccati, completati, step altrui e release concluse, scope `involving`, `activationInstant()` sullo step in posizione 1 (ripiego su `started_at`) e su uno successivo (istante del precedente).
      9. `php artisan test --filter=ReleaseStepTest` e `--filter=ReleaseTest`

      ## Completion Criteria
      - [x] `Release::activeStep()` e eager-loadable e restituisce `null` su release conclusa
      - [x] `Release::involving()` e `ReleaseStep::awaitingUser()` filtrano per assegnazione, non per Policy
      - [x] `withActivationInstant()` non esegue query per riga e non usa SQL specifico di SQLite
      - [x] `activationInstant()` corretto sia sullo step iniziale sia sui successivi
      - [x] Nessuna lettura di `StepDefinition` o `FieldDefinition` in questi percorsi
      - [x] Test di unita verdi

      ## Test Data
      - Nessuna modifica di schema o di modello dati: le factory esistenti (`ReleaseFactory`, `ReleaseStepFactory` con stati `active()`, `blocked()`, `completed()`) coprono i casi
      - [x] Se un caso richiede uno stato di factory non presente (per esempio una catena a posizioni coerenti), aggiungilo in **questo stesso** commit
      - [x] Nessuna modifica al seeder: lo scenario dimostrativo di esecuzione e perimetro di US-011

      ## Git Deliverables
      - Commit: `feat(US-007): TASK-01 seam di lettura per la vista operativa`
      - Push: **da non eseguire** (`git_mode: GITFLOW`)
      - PR: aggiorna le note locali della PR
