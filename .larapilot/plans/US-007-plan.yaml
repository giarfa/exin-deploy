      ## Description
      Allinea la documentazione al comportamento consegnato: la schermata di ingresso cambia, ed e visibile a chiunque usi lo strumento. Documentazione **baseline** (`effort: STANDARD`, nessuna documentazione estesa approvata per questa spec); nessun OpenAPI da aggiornare, il PRD dichiara superficie API assente.

