    id: TASK-02
    title: 'Pagina «I miei step» come schermata di ingresso'
    body: |-
      ## Description
      Sostituisce la home segnaposto con la vista operativa: gli step attivi di cui l'utente autenticato e responsabile su tutti i progetti, piu il blocco delle release in corso in attesa di altri. Contratto visivo e di accessibilita: `.larapilot/mockups/superficie-operativa/index.html` e il `README.md` del mockup.

      ## Files Involved
      - resources/views/components/my-steps/⚡index.blade.php (nuovo)
      - routes/web.php
      - resources/views/home.blade.php (da rimuovere)
      - lang/it/my-steps.php (nuovo)
      - lang/it/app.php (rimozione di `home_heading` e `home_placeholder`)

      ## Steps
      1. Crea il componente Livewire monofile `resources/views/components/my-steps/⚡index.blade.php`, come le altre pagine del progetto. Due proprieta `#[Computed]`:
         - **`mySteps`** — `ReleaseStep::query()->awaitingUser($user)->withActivationInstant()->with(['release' => fn ($query) => $query->with('project')->withCount('steps')])`, ordinati **dal piu vecchio istante di attivazione**, con spareggio deterministico su nome progetto ed etichetta.
         - **`waitingReleases`** — `Release::query()->inProgress()->involving($user)` escludendo le release il cui step attivo e dell'utente (`whereDoesntHave`), con `with(['project', 'activeStep' => fn ($query) => $query->withActivationInstant()->with('assignedUser')])`.
      2. Sostituisci la rotta: `Route::livewire('/', 'my-steps.index')->name('home')` dentro il gruppo `auth`. **Il nome `home` resta invariato** — logo di sidebar, voce di navigazione e redirect di Fortify vi puntano gia. Aggiorna il commento della rotta: non e piu un segnaposto.
      3. Elimina `resources/views/home.blade.php` e le chiavi `home_heading` / `home_placeholder` da `lang/it/app.php`, insieme al commento che le dichiarava provvisorie.
      4. Ogni voce dell'elenco mostra: **progetto**, **etichetta della release**, **nome dello step**, **posizione** ("Step 2 di 5", da `position` e `steps_count`), **ruolo** letto da `role_name` congelato — mai da `role()->name` — e da quanto e aperto (`activationInstant()` con `diffForHumans()`).
      5. Comando primario per voce verso `route('releases.step', $step)`. L'autorizzazione resta quella di `ReleaseStepPolicy` lato server: nascondere un comando non e autorizzazione.
      6. Blocco secondario "Release in corso su cui sei coinvolto": progetto, etichetta, **chi** trattiene il flusso (responsabile dello step attivo), **su quale step** e **da quanto**. E la mitigazione del rischio accettato n.1 del PRD (assenza di notifiche), non un abbellimento.
      7. Stato vuoto esplicito quando nessuno step attende l'utente: dice **quando** ne comparira uno, con il copy del mockup.
      8. Implementazione **mobile first** per il mockup: card a piena larghezza a 375 px, una sola azione primaria per card, area cliccabile ≥ 44x44 px sotto 1024 px, nessuno scroll orizzontale a nessun breakpoint. Nessuna soglia responsive nuova: il drawer a 1024 px e gia in `x-layouts.app` (vincolo permanente 4). Verifica a vista a 375, 768, 1024 e 1280 px.
      9. Accessibilita non negoziabile: contatore degli step in `aria-live="polite"`; stato reso con **icona + parola** (`flux:badge` con `icon`), mai dal solo colore; un solo `h1` con le due sezioni come `h2`; contrasto verificato in tema chiaro **e** scuro. Solo componenti Flux gratuiti (vincolo permanente 2).
      10. Tutto il testo in `lang/it/my-steps.php`, mai nelle viste. Tono diretto e operativo, seconda persona singolare, come da sezione Copy del README del mockup: "Tocca a te", "Apri e compila", non "Azione richiesta" o "Salva".
      11. `vendor/bin/pint --dirty --format agent`
      12. `php artisan test --filter=Release` per verificare che nulla di gia consegnato si sia rotto con il cambio di rotta

      ## Completion Criteria
      - [ ] Dopo l'accesso la schermata di ingresso e "i miei step", non una dashboard
      - [ ] L'elenco contiene solo gli step attivi assegnati all'utente autenticato, su tutti i progetti
      - [ ] Ogni voce mostra progetto, etichetta, nome, posizione su totale e ruolo
      - [ ] Blocco delle release in attesa con chi trattiene il flusso e da quanto
      - [ ] Stato vuoto esplicito che spiega quando comparira uno step
      - [ ] Contatore in `aria-live="polite"`; stati con icona e parola; un solo `h1`
      - [ ] Usabile a 375 px con target touch ≥ 44x44 px e nessuno scroll orizzontale
      - [ ] `home.blade.php` e i testi segnaposto rimossi; nessun `route('home')` rotto
      - [ ] Nessun testo incastonato nelle viste

      ## Test Data
      - N/A — nessuna modifica di modello, schema, factory o seeder in questo task

      ## Git Deliverables
      - Commit: `feat(US-007): TASK-02 vista i miei step come schermata di ingresso`
      - Push: **da non eseguire** (`git_mode: GITFLOW`)
      - PR: aggiorna le note locali della PR
