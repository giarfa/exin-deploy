    id: TASK-03
    title: 'Test della schermata: cosa compare, cosa no, e cosa viene annunciato'
    body: |-
      ## Description
      Copertura di funzionalita della vista operativa al bar `NORMAL`: chi vede cosa, lo stato vuoto, il blocco delle release in attesa e il contratto di accessibilita dichiarato dal mockup. Il criterio piu facile da sbagliare — e quindi da coprire per primo — e che **anche un amministratore** non vede qui gli step altrui.

      ## Files Involved
      - tests/Feature/MySteps/MyStepsScreenTest.php (nuovo)

      ## Steps
      1. Usa le factory esistenti in `database/factories/` — non ridefinire dati di test in loco.
      2. Casi da coprire:
         - il responsabile vede i propri step attivi su piu progetti, con progetto, etichetta, nome dello step, "Step N di M" e ruolo;
         - uno step attivo assegnato a un'altra persona **non** compare, e non compare **nemmeno per un amministratore**;
         - uno step bloccato, uno completato e uno step di una release conclusa non compaiono;
         - stato vuoto quando nessuno step attende l'utente, con il testo che spiega quando ne comparira uno;
         - blocco delle release in corso su cui l'utente e coinvolto: nome di chi trattiene il flusso, step su cui e fermo, da quanto tempo;
         - una release il cui step attivo e dell'utente compare nel primo blocco e **non** nel secondo;
         - il comando di apertura porta a `route('releases.step', $step)`;
         - il ruolo mostrato e quello **congelato** (`role_name`): rinominare il `Role` dopo l'avvio non cambia cio che la schermata mostra.
      3. Contratto di accessibilita, che e criterio di accettazione e non rifinitura: presenza di `aria-live="polite"` sul contatore, stato reso con icona **e** parola, un solo `h1`.
      4. Nessun Playwright, Dusk, Pest browser o suite di viewport: `settings.testing` e `NORMAL`.
      5. `php artisan test --filter=MyStepsScreenTest`
      6. Se un'asserzione sulla risposta fallisce in modo incomprensibile ("Call to a member function all() on array"), leggi `.ai/rules/tests.md`: e l'arricchimento del messaggio di Laravel, non il difetto.

      ## Completion Criteria
