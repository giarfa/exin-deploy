      2. `README.md`, sezione `### Schermate`: descrivi la nuova home, le due query che la compongono e **la derivazione dell'istante di attivazione** — che e la decisione tecnica non ovvia di questa spec, e va trovata da chi legge il codice senza doverla ricostruire.
      3. Annota che `Release::activeStep()` e `ReleaseStep::withActivationInstant()` nascono qui ma sono seam condivisi: US-008 (dettaglio) e US-009 (elenco) li riusano.
      4. Nessun nuovo vincolo permanente da aggiungere all'elenco del README: questa spec non ne introduce.

