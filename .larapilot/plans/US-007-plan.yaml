code: US-007
plan_body: |-
  ## Soluzione tecnica

  US-007 e una spec di sola lettura: nessuna migrazione, nessuna scrittura, nessuna Action nuova. La schermata di ingresso diventa una pagina Livewire che esegue **due query** sullo snapshot congelato (`release_steps`, `releases`) e non tocca mai le tabelle di definizione (`step_definitions`, `field_definitions`) — vincolo permanente del progetto, vedi `.ai/rules/app.md`.

  **Rotta.** `Route::view('/', 'home')` diventa `Route::livewire('/', 'my-steps.index')`, mantenendo il nome `home`: ogni `route('home')` gia scritto (logo di sidebar, voce di navigazione, redirect di Fortify) continua a funzionare senza modifiche. Il gruppo `auth` resta. `resources/views/home.blade.php` viene rimosso, e con esso i testi segnaposto `app.home_heading` / `app.home_placeholder`.

  **Componente.** `resources/views/components/my-steps/⚡index.blade.php`, come tutte le altre pagine del progetto (componente Livewire monofile con prefisso ⚡). Due proprieta `#[Computed]`: gli step che attendono l'utente e le release in corso su cui e coinvolto senza avere il turno.

  ### Blocco 1 — gli step che attendono l'utente

  ```php
  ReleaseStep::query()
      ->where('assigned_user_id', $user->id)
      ->where('status', ReleaseStepStatus::Active)
      ->whereHas('release', fn (Builder $query) => $query->inProgress())
      ->withActivationInstant()
      ->with(['release' => fn ($query) => $query->with('project')->withCount('steps')])
  ```

  Il filtro e **sull'assegnazione**, non sulla Policy: `ReleaseStepPolicy::before()` concede a un amministratore la lettura di qualsiasi step, ma questa vista si chiama "i miei step" e un amministratore non deve vedere gli step altrui (criterio di accettazione esplicito). L'indice `(assigned_user_id, status)` esiste gia dalla migrazione di US-004 ed e stato creato proprio per questa query.

  `withCount('steps')` sulla release fornisce il denominatore di "Step 2 di 5"; il ruolo si legge da `role_name`, congelato, mai da `role()->name` (vincolo permanente 7 del README).

  Ordinamento: **dal piu vecchio al piu recente** per istante di attivazione — chi aspetta da piu tempo sta in cima, che e l'unica priorita utile a chi entra. Spareggio deterministico su nome progetto ed etichetta.

  ### Blocco 2 — release in corso su cui l'utente e coinvolto

  Mitigazione del rischio accettato n.1 del PRD (assenza di notifiche, FR-025 fuori perimetro): rende visibile **chi** trattiene il flusso e **da quanto**, senza reintrodurre la feature.

  ```php
  Release::query()
      ->inProgress()
      ->whereHas('steps', fn ($query) => $query->where('assigned_user_id', $user->id))
      ->whereDoesntHave('steps', fn ($query) => $query
          ->where('assigned_user_id', $user->id)
          ->where('status', ReleaseStepStatus::Active))
      ->with(['project', 'activeStep' => fn ($query) => $query->withActivationInstant()->with('assignedUser')])
  ```

  "Coinvolto" significa avere almeno uno step assegnato nella release, in qualunque stato. La seconda condizione esclude le release gia presenti nel blocco 1: se il turno e tuo, la release non e in attesa di qualcun altro.

  Serve una relazione nuova su `Release`: `activeStep(): HasOne` — `hasOne(ReleaseStep::class)->where('status', ReleaseStepStatus::Active)`. E eager-loadable (a differenza di un metodo che filtra in PHP) e sara riusata da US-008 e US-009. Su una release conclusa e `null`: la vista non la incontra mai qui, ma il rendering deve reggerlo comunque.

  ### Decisione — da quanto uno step e aperto

  Il mockup chiede "aperto da 4 ore" e "in attesa di Davide Rossi da 2 giorni". Non esiste una colonna `release_steps.activated_at`.

  **Scelta: derivare l'istante, non aggiungere la colonna.**

  - per lo step in posizione 1 l'istante di attivazione e `release.started_at` (lo crea `StartRelease` gia attivo);
  - per ogni altro step e il `completed_at` dello step precedente, che `CloseStep` scrive **nella stessa transazione** in cui attiva il successivo — quindi i due istanti coincidono per costruzione, non per approssimazione.

  Si legge con uno scope `#[Scope] withActivationInstant()` su `ReleaseStep` che aggiunge una sottoquery correlata (alias `previous_step_completed_at`, castato a `datetime`), piu un metodo `activationInstant()` che applica il ripiego su `release.started_at`. Costo costante, nessun N+1, solo Eloquent portabile (vincolo permanente 1).

  **Alternativa scartata:** colonna `activated_at` scritta da `StartRelease` e `CloseStep`. Sarebbe piu diretta in lettura, ma imporrebbe di riaprire due Action gia consegnate e verificate contro il doppio invio concorrente (US-004, US-005), piu un backfill sulle release esistenti, per un dato che i dati gia contengono. Se un domani servisse ordinare o filtrare **in database** su quell'istante — per esempio le metriche di processo, FR-024 — la colonna diventerebbe giustificata: allora si aggiunge, con backfill nella stessa migrazione.

  ### Prestazioni e N+1

  Invariante da dimostrare, non da dichiarare: **stesso numero di query** con uno step in attesa e con dieci, con una release coinvolta e con dieci. Concretamente due query per il blocco 1 (step + release con progetto e conteggio) e due per il blocco 2 (release con progetto + step attivo con responsabile), piu quelle di sessione. Nessuna lettura di relazione dentro un `foreach` nella vista: cio che la Blade mostra deve essere gia caricato.

  Indici: nessuno da creare. `(assigned_user_id, status)` su `release_steps` e `status` su `releases` esistono; `(project_id, label)` copre il prefisso `project_id`.

  ### Interfaccia, accessibilita e copy

  Contratto: `.larapilot/mockups/superficie-operativa/index.html` + `README.md` del mockup. Nessuna soglia responsive nuova — la sidebar permanente a 1024 px con drawer sotto e gia nel layout `x-layouts.app` (vincolo permanente 4).

  - Mobile first a 375 px: card a piena larghezza, una sola azione primaria per card ("Apri e compila"), testo base 16 px, nessuno scroll orizzontale.
  - Target touch ≥ 44x44 px sotto 1024 px: la card e cliccabile per intero, non solo il bottone.
  - Stati resi con **icona + parola** (`flux:badge` con `icon`), mai dal solo colore.
  - Contatore degli step in attesa in `aria-live="polite"`, perche cambia dopo un aggiornamento Livewire senza ricarica.
  - Un solo `h1` per pagina; le due sezioni sono `h2`. Skip link gia nel layout.
  - Contrasto verificato in tema chiaro **e** scuro.
  - Stato vuoto esplicito che dice *quando* comparira uno step, non solo che non ce n'e (copy del mockup: "Quando un collega chiude il proprio step e tocca a te, lo trovi qui").
  - Solo componenti **Flux gratuiti** (vincolo permanente 2).
  - Tutto il testo in `lang/it/`, mai incastonato nelle viste (prescrizione del PRD).
  - Durate relative ("da 2 giorni", "aperto da 4 ore") via `Carbon::diffForHumans()` con locale italiano.

  Il comando "Apri e compila" punta a `route('releases.step', $step)`, gia esistente da US-005: l'autorizzazione lato server resta quella di `ReleaseStepPolicy` — nascondere un comando non e autorizzazione.

  ## Git & Branching

  - Modalita: **GITFLOW** (da `settings.git_mode`) — **nessun push automatico**
  - Ramo: `feature/US-007-vista-i-miei-step` da `develop`
  - TASK-00: bootstrap del ramo; descrizione della PR verso `develop` preparata **in locale**, remoto non aperto salvo richiesta esplicita
  - Un commit atomico per task, Conventional Commits: `type(US-007): TASK-NN sintesi`
  - `CHANGELOG.md` sezione Unreleased aggiornato: la schermata di ingresso cambia, ed e comportamento visibile
  - Merge su `develop` solo dopo approvazione umana in `/larapilot-review`

  ## Test Data Strategy

  - **Nessuna modifica di schema o di modello dati**: nessuna migrazione, nessuna colonna, nessun nuovo Eloquent model. Le factory esistenti bastano — `ReleaseFactory` (con stato `completed()`), `ReleaseStepFactory` (stati `active()`, `blocked()`, `completed()`), `ProjectFactory::withTemplate()`.
  - Se TASK-01 introducesse uno stato di factory mancante (per esempio una catena a piu step con posizioni coerenti), va aggiunto **nello stesso commit** del codice che lo richiede.
  - **Seeder: nessuna modifica in questa spec.** Lo scenario dimostrativo di esecuzione — release a meta catena e release conclusa — e perimetro di **US-011** (FR-018) ed e li che deve restare: duplicarlo qui produrrebbe due sorgenti divergenti dello stesso scenario. Conseguenza operativa da conoscere: finche US-011 non e consegnata, `migrate:fresh --seed` produce un ambiente **senza release**, quindi la schermata mostra lo stato vuoto. Per la verifica manuale si avvia una release dall'interfaccia (US-004, `/progetti/{project}/rilascio`).
  - Volumi usati nei test: almeno 2 step attivi su 2 progetti diversi per l'utente, 1 step attivo di un altro utente, 1 step bloccato e 1 completato dell'utente, 1 release conclusa con uno step gia suo, 2 release in corso in attesa di altri.

  ## Test Strategy

  - Bar: **NORMAL** (da `settings.testing`). Nessun Playwright, nessun Dusk, nessun Pest browser, nessuna matrice di viewport automatica.
  - Test di modello (`tests/Unit/Models/`) sui seam di lettura: relazione `activeStep`, scope `withActivationInstant()` con e senza step precedente, ripiego su `started_at`.
  - Test di funzionalita (`tests/Feature/MySteps/`) sulla schermata: elenco filtrato per responsabile, esclusione degli step di altri **anche per un amministratore**, esclusione di bloccati/completati/release concluse, dati mostrati per voce (progetto, etichetta, nome, posizione su totale, ruolo), stato vuoto, blocco delle release in attesa con chi trattiene e da quanto, contratto di accessibilita (`aria-live`, stato come icona + parola, un solo `h1`).
  - Test di budget query (`tests/Feature/MySteps/MyStepsQueryBudgetTest.php`) nello stile gia adottato da `CloseStepQueryBudgetTest` e `StartReleaseQueryBudgetTest`: **nessun numero assoluto**, ma l'invariante "stesso costo con 1 e con N", perche un numero fisso lo cambierebbe ogni ottimizzazione legittima.
  - Qualita: `vendor/bin/pint --dirty` e `php artisan larapilot:quality` prima della consegna (richiede `composer install`, vedi `.ai/rules/general.md`).
  - **Consegna manuale ad Anne** (ammessa a ogni bar, necessaria qui): verifica a 375 / 768 / 1024 / 1280 px in tema chiaro e scuro, apertura e chiusura del drawer con tastiera, annuncio del contatore con screen reader, rotazione in landscape su telefono. Non automatizzabile sotto `NORMAL` e da annotare nelle note di revisione.

  ## Rischi e note

  1. **Le durate relative sono la sola leva contro il rischio n.1 del PRD.** Se "da quanto" risultasse impreciso o assente, il blocco 2 perde la sua ragione d'essere: e il criterio da verificare per primo in revisione.
  2. **Ambiente vuoto fino a US-011.** Chi prova la schermata dopo un `migrate:fresh --seed` vede lo stato vuoto e potrebbe leggerlo come un difetto. Va detto nella consegna, non scoperto in revisione.
  3. **La sottoquery di attivazione e correlata.** Se un domani serve ordinare o filtrare in database su quell'istante su volumi grandi, la colonna `activated_at` diventa la scelta giusta: la decisione e registrata sopra proprio per non doverla ri-derivare.
  4. **US-008 e US-009 riusano questi seam.** `Release::activeStep()` e `withActivationInstant()` nascono qui ma servono anche al dettaglio e all'elenco: vanno documentati come tali, non come dettaglio interno di questa schermata.
