code: US-006
plan_body: |-
  ## Soluzione tecnica

  Ultima spec di EP-003, e la piu piccola: US-005 ha costruito l'intera macchina di avanzamento e si e fermata **un passo prima** del capolinea. Il ramo terminale di `App\Actions\Releases\CloseStep` oggi solleva `ReleaseCompletionIsNotAvailableYet`; questa spec sostituisce quel `throw` con la conclusione della release. Il predecessore ha lasciato il punto di innesto documentato nell'eccezione stessa: "la scrittura di `completed_by` e `completed_at` su `releases`, il passaggio a `conclusa` e l'evento `release_conclusa`. Il ramo terminale di `CloseStep` e il punto in cui quel codice entra — non serve altro."

  Il piano prende quella frase alla lettera. Il valore di questa spec non e la quantita di codice: e chiudere il ciclo di vita in modo che l'invariante portante del PRD valga **a ogni istante**, doppio invio incluso.

  ### Nessuna migrazione, nessuna classe nuova

  | Cosa serve | Dove esiste gia | Da quando |
  | --- | --- | --- |
  | `releases.completed_by`, `releases.completed_at` | migrazione `create_releases_table` | US-004 (vincolo permanente 11 del README) |
  | `ReleaseStatus::Completed` (`conclusa`) | `App\Enums\ReleaseStatus` | US-004 |
  | `ReleaseEventAction::ReleaseCompleted` (`release_conclusa`) | `App\Enums\ReleaseEventAction` | US-004, nato completo per non migrare dati dopo |
  | `Release::completedBy()` | `App\Models\Release` | US-004 |
  | `Release::inProgress()` (scope) | `App\Models\Release` | US-004 |
  | `ReleaseFactory::completed()` | `database/factories/ReleaseFactory.php` | US-004 |

  Zero migrazioni, zero indici nuovi, zero tabelle. Le colonne sono nate nullable proprio per essere riempite qui.

  ### Perche la conclusione resta dentro `CloseStep`

  Un'Action `CompleteRelease` separata sarebbe la scelta ovvia per SOLID, e qui e la scelta sbagliata: introdurrebbe un **secondo percorso pubblico** di scrittura sullo stato della release, invocabile fuori dalla transazione che chiude lo step. L'invariante del PRD (numero 2) non e "esistono classi piccole", e "chiusura, attivazione e scrittura del registro stanno in una sola transazione": una release che passa a `conclusa` senza che l'ultimo step sia chiuso — o viceversa — e proprio lo stato intermedio che nessuna schermata sa raccontare.

  La conclusione diventa quindi un **metodo privato** di `CloseStep`, invocato dal ramo `next === null` dentro la stessa `DB::transaction`. La deviazione da "una Action per operazione" e deliberata e va annotata nel PHPDoc della classe, altrimenti la prossima revisione la estrae.

  ### Il ramo terminale, riscritto

  L'ordine attuale del codice — calcolo di `$next`, poi scrittura dei due eventi in fondo — non regge due esiti diversi. La sequenza dentro la transazione diventa:

  1. lock sulla riga della release + rilettura dello step (invariati)
  2. controlli di stato, normalizzazione, validazione (invariati)
  3. scrittura dei valori sui campi dello snapshot (invariata)
  4. **compare-and-swap sullo step** condizionato a `attivo` (invariato); zero righe -> `StepAlreadyClosed`
  5. evento `step_completato` (spostato qui: appartiene a entrambi i rami)
  6. `$next = $step->nextStep()`
      - **`$next !== null`** -> attivazione condizionata a `bloccato` + evento `step_attivato` (invariato)
      - **`$next === null`** -> conclusione della release + evento `release_conclusa` (nuovo)

  ### Compare-and-swap anche sulla release

  La conclusione **non** e un `$release->update()` sul modello gia letto: e un update condizionato, con la stessa forma della chiusura dello step.

  ```php
  $concluded = Release::query()
      ->whereKey($release->getKey())
      ->where('status', ReleaseStatus::InProgress->value)
      ->update([
          'status' => ReleaseStatus::Completed->value,
          'completed_by' => $actor->id,
          'completed_at' => $now,
          'updated_at' => $now,
      ]);

  if ($concluded === 0) {
      throw StepAlreadyClosed::whileConcludingRelease($step);
  }
  ```

  Il motivo e identico a quello gia registrato in `.ai/rules/releases.md`: su SQLite `lockForUpdate()` non produce SQL — la grammatica non supporta `FOR UPDATE` — quindi la garanzia effettiva contro la doppia conclusione e l'update condizionato. Il lock serve su MySQL e PostgreSQL, dove il vincolo di portabilita impone che il codice resti corretto.

  In pratica il secondo invio viene gia rifiutato prima, dalla rilettura dello step dentro la transazione (`StepIsNotOpen::stepIsCompleted`). Il CAS sulla release e la difesa che regge anche se quel controllo un giorno cambiasse forma: costa una clausola `where`, e senza di essa la correttezza dipenderebbe da un `if` scritto trenta righe piu su.

  ### `StepAlreadyClosed` porta la propria chiave di traduzione

  Oggi il componente rende `__('releases.closing_already_closed')` con la chiave scritta a mano, e quel messaggio dice "il flusso e gia passato al responsabile successivo" — falso sull'ultimo step, dove non c'e nessun successivo. L'eccezione adotta quindi la forma gia usata da `StepIsNotOpen`: costruttore privato piu `public readonly string $reasonKey`, due costruttori nominati (`during()`, `whileConcludingRelease()`), e il componente rende `__($refused->reasonKey)`. Una sola fonte per il messaggio, accanto al motivo che lo ha prodotto.

  ### Due eventi sul capolinea, non uno

  Lo stesso principio di US-005: il registro documenta le **transizioni** (FR-016), e sull'ultimo step ne avvengono due — un passaggio si chiude e un rilascio si conclude. Il payload di `release_conclusa` porta `label`, `step` e `position` dello step finale: niente conteggio degli step, che costerebbe una query per dire cio che la posizione dell'ultimo gia dice.

  ### La sola lettura non e codice nuovo: e una dimostrazione

  Tre dei sette criteri di accettazione sono gia soddisfatti dal codice esistente, e il piano li **verifica** invece di reimplementarli:

  | Criterio | Chi lo soddisfa gia |
  | --- | --- |
  | nessuno step compilabile o riapribile su release conclusa, **nemmeno da un amministratore** | `ReleaseStepPolicy::mayAct()` — nega quando `release->status !== InProgress`, e `fill`/`close` sono in `NOT_FILTERED`, quindi il filtro `before()` non le decide |
  | tentativo di chiudere/modificare rifiutato con 403 | `authorizeOrRecord()` in `⚡step.blade.php`, al montaggio e su ogni azione Livewire |
  | release conclusa fuori da quelle in corso | scope `Release::inProgress()` |

  In piu, come difesa di dominio indipendente dall'interfaccia, `CloseStep` e `SaveStepValues` sollevano gia `StepIsNotOpen::releaseIsCompleted()` quando la release non e `in_corso`.

  Nota di sicurezza (Lars): il 403 su una release conclusa passa da `authorizeOrRecord()` e quindi **lascia una riga nel registro** come tentativo non autorizzato. E il comportamento voluto — un tentativo di modificare un rilascio consegnato e esattamente cio che il registro deve provare — e va annotato, perche a prima lettura sembra rumore.

  ### Cosa questa spec non fa

  FR-019 (riapertura o correzione di uno step da parte di un amministratore) resta **fuori perimetro**, rinviata oltre l'MVP dal PRD. Il criterio di accettazione chiede in piu che **il messaggio all'utente non prometta il contrario**: `lang/it/releases.php` contiene oggi due stringhe che dopo questa spec mentono, e vanno trattate come deliverable e non come rifinitura.

  | Chiave | Oggi | Dopo |
  | --- | --- | --- |
  | `step_hands_over_last` | "la conclusione del rilascio arriva con una prossima versione dello strumento, e per ora lo step non si chiude" | dice che alla chiusura la release risulta consegnata e conclusa |
  | `closing_last_step` | rifiuto "la conclusione non e ancora disponibile" | **rimossa** insieme al `catch` che la rendeva |
  | `step_closing_is_final` | "riaprire uno step non e previsto in questa versione" | invariata: gia corretta, ed e la frase che tiene fede a FR-019 |

  Fuori perimetro anche: elenco e filtri delle release (US-009), dettaglio con catena e valori (US-008), registro consultabile (US-010), scenario dimostrativo con una release conclusa nel seeder (US-011, FR-018). Questa spec scrive l'evento; mostrarlo appartiene a US-010.

  ## Git & Branching

  - Modalita: **`GITFLOW`** (da `settings.git_mode`) — nessun push automatico, nessuna PR remota
  - **Precondizione**: `feature/US-005-chiusura-step-avanzamento` e approvata (`DONE`) ma non ancora integrata: `develop` e indietro di 18 commit. TASK-00 la integra prima di ramificare, come ha fatto TASK-00 di US-005 con US-004
  - Branch: `feature/US-006-conclusione-release` da `develop`
  - Un solo commit atomico per task, Conventional Commits `type(US-006): TASK-NN sintesi`
  - Descrizione di PR verso `develop` preparata **in locale**; apertura remota solo se richiesta esplicitamente in sessione
  - Merge in `develop` solo dopo approvazione umana in `/larapilot-review`

  ## Strategia dei dati di prova

  - **Nessuna nuova entita, nessuna migrazione**: non c'e factory da creare
  - `ReleaseFactory::completed()` esiste gia e produce release concluse con autore e istante coerenti (`completed_by` = `started_by`); il suo PHPDoc dice "che US-006 scrivera" e va allineato al presente nello stesso task che scrive la conclusione
  - `ReleaseStepFactory::completed()` esiste gia: gli scenari di release conclusa nei test si compongono da queste due
  - Lo **scenario dimostrativo** nel `DatabaseSeeder` (release a meta catena + release conclusa con registro popolato) resta di US-011 per esplicita delimitazione della sua spec: qui il seeder non si tocca
  - Verifica comunque `php artisan migrate:fresh --seed` prima di ogni `task-done` che tocchi modelli o factory

  ## Strategia di test

  - Bar: **`NORMAL`** (da `settings.testing`) — feature/unit/policy PHPUnit. **Nessun** Playwright, Dusk, Pest browser, matrice di viewport o E2E di percorso
  - Test interlacciati con l'implementazione: TASK-02 subito dopo l'Action, TASK-04 subito dopo la schermata
  - **Il confine di US-005 inverte di segno**: `CloseStepTest::test_the_last_step_is_refused_because_completing_the_release_is_not_available_yet` e `CloseStepScreenTest::test_the_last_step_of_the_chain_explains_that_it_cannot_be_closed_yet` asseriscono il rifiuto che questa spec toglie. Vanno **sostituiti**, non cancellati: ogni asserzione che descriveva il confine deve ricomparire come asserzione sulla conclusione

  | Copertura | Dove | Criterio |
  | --- | --- | --- |
  | chiusura dell'ultimo step -> release conclusa con autore e istante | `CloseStepTest` | AC 1 |
  | zero step attivi su release conclusa; catena a un solo step | `CloseStepTest` | AC 2 |
  | evento `release_conclusa` nel registro, dopo `step_completato`, senza `step_attivato` | `CloseStepTest` | AC 5 |
  | release conclusa assente dallo scope `inProgress`, e ancora leggibile | `CloseStepTest` | AC 6 |
  | `fill`/`close` negate anche a un amministratore su release conclusa | `ReleaseStepPolicyTest` | AC 3 |
  | `CloseStep` e `SaveStepValues` rifiutano con `StepIsNotOpen::releaseIsCompleted` | `CloseStepTest`, `SaveStepValuesTest` | AC 4 |
  | azione Livewire invocata direttamente -> 403 + tentativo registrato | `CloseStepScreenTest` | AC 3, AC 4 |
  | schermata: conclusione annunciata, nessuna promessa di riapertura | `CloseStepScreenTest` | AC 1, AC 7 |
  | doppio invio sull'ultimo step -> una sola conclusione, un solo evento | `CloseStepConcurrencyTest` | invariante 3 del PRD |
  | transazione unica: interruzione a meta non lascia la release conclusa | `CloseStepConcurrencyTest` | invariante 2 del PRD |

  **Consegna manuale (Anne)**: percorrere la catena dimostrativa fino all'ultimo step da 375 px e verificare che il riquadro di conclusione sia leggibile senza scorrimento orizzontale e che nessun comando suggerisca la riapertura.

  ## Cancello di qualita

  `vendor/bin/pint --dirty` e `php artisan larapilot:quality` (Pint + Larastan livello 5) prima di ogni `task-done`. Nota da `.ai/rules/general.md`: `larastan/larastan` e in `require-dev` ma potrebbe non essere in `vendor/` — serve `composer install` perche il comando sia eseguibile.

  ## Rischi e trappole

  1. **Il `catch` orfano.** Rimuovere `ReleaseCompletionIsNotAvailableYet` senza togliere il `catch` nel componente lascia un ramo morto che Larastan segnala; toglierlo senza aggiornare `lang/it/releases.php` lascia una chiave che nessuno rende. I tre file si toccano insieme (TASK-01 il dominio, TASK-03 interfaccia e testi).
  2. **L'ordine degli eventi.** Spostare la scrittura di `step_completato` prima del bivio e la parte piu facile da sbagliare: se resta in fondo al solo ramo con successore, la chiusura dell'ultimo step non lo registra piu e US-010 mostrerebbe una catena con un buco.
  3. **`forceFill` sul valore di ritorno.** La chiusura passa dal query builder, quindi lo step in memoria va riallineato come oggi; sul ramo terminale va riallineata **anche** la release, altrimenti la schermata dopo `reload()` mostrerebbe una release ancora `in_corso` accanto a uno step completato.
  4. **Il registro si riempie di tentativi legittimi.** Un amministratore che apre uno step di release conclusa passa da `view`, non da `fill`: nessuna riga. Solo l'invocazione diretta di `close`/`save` la produce. Verificarlo esplicitamente evita che una revisione futura "corregga" `authorizeOrRecord` credendo a un difetto.
  5. **Vincolo permanente 11 del README** dichiara `release_conclusa` fra i valori non ancora scritti, con un conteggio ("due") gia incoerente col proprio elenco. Va chiuso e corretto in TASK-06, non lasciato a marcire.
tasks:
  -
    id: TASK-00
    title: 'Integrare US-005 in develop e creare il branch di lavoro'
    body: |-
      ## Description
      US-005 e approvata (`DONE`) ma vive ancora solo su `feature/US-005-chiusura-step-avanzamento`: `develop` e indietro di 18 commit e non contiene ne `CloseStep` ne la schermata di chiusura, cioe esattamente il codice che questa spec modifica. Ramificare da `develop` senza integrare produrrebbe un branch su cui il ramo terminale da riscrivere non esiste.

      Stessa sequenza gia adottata da TASK-00 di US-005 con US-004. Modalita `GITFLOW`: nessun push, nessuna PR remota.

      ## Files Involved
      - (solo git — nessun file applicativo)

      ## Steps
      1. Verificare che l'albero di lavoro sia pulito: `git status --short`
      2. `git checkout develop`
      3. `git merge --no-ff feature/US-005-chiusura-step-avanzamento -m "merge: integra US-005 chiusura step e avanzamento sequenziale"`
      4. Verificare che la suite resti verde sul merge: `php artisan test --compact`
      5. `git checkout -b feature/US-006-conclusione-release`
      6. Commit di ancoraggio del branch: `git commit --allow-empty -m "chore(US-006): TASK-00 bootstrap feature branch"`
      7. Redigere titolo e corpo della PR verso `develop` (titolo `US-006: Conclusione della release come consegna in produzione`; corpo con collegamento al piano e elenco dei task) e tenerli **in locale**

      ## Completion Criteria
      - [ ] `develop` contiene il merge di US-005 e la suite e verde su quel commit
      - [ ] Il branch `feature/US-006-conclusione-release` esiste in locale e parte da `develop`
      - [ ] Descrizione di PR verso `develop` redatta in locale (nessuna apertura remota)

      ## Test Data
      - N/A — nessuna modifica a modelli o schema

      ## Git Deliverables
      - Commit di merge: `merge: integra US-005 chiusura step e avanzamento sequenziale` su `develop`
      - Commit: `chore(US-006): TASK-00 bootstrap feature branch` (vuoto)
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: preparata in locale; apertura remota solo su richiesta esplicita
    type: Impl
