    id: TASK-05
    title: 'Test: doppia conclusione concorrente e transazione unica'
    body: |-
      ## Description
      Estendere le due prove che nessuna verifica manuale puo dare, dal capolinea: due invii dell'ultimo step producono **una sola** conclusione e un solo evento `release_conclusa`, e una transazione interrotta a meta non lascia la release conclusa con lo step ancora aperto (o viceversa).

      Stessa premessa gia documentata in `CloseStepConcurrencyTest`: la suite gira su SQLite, dove due connessioni concorrenti non sono riproducibili in modo deterministico. Cio che si verifica e la difesa che regge su tutti i motori — il compare-and-swap sullo stato — non il `lockForUpdate()`, che su SQLite non produce SQL e quindi non e osservabile.

      ## Files Involved
      - tests/Feature/Releases/CloseStepConcurrencyTest.php

      ## Steps
      1. Riusare gli helper e le factory gia presenti nella classe
      2. `test_a_second_submission_of_the_last_step_does_not_complete_the_release_twice`: seconda chiamata a partire dal modello che il chiamante aveva in mano prima della prima. Un solo evento `release_conclusa`, `completed_by` e `completed_at` invariati rispetto alla prima conclusione
      3. Annotare quale rifiuto arriva e perche: la rilettura dentro la transazione intercetta il secondo invio prima del compare-and-swap sulla release, quindi `StepIsNotOpen` e non `StepAlreadyClosed`. Il CAS sulla release resta la difesa che regge se quel controllo cambiasse forma — lo stesso ragionamento gia scritto per la chiusura dello step
      4. `test_an_interrupted_completion_leaves_neither_the_step_closed_nor_the_release_completed`: far fallire una scrittura dentro la transazione sul ramo terminale e verificare che release e step tornino entrambi allo stato di partenza, registro compreso (invariante 2 del PRD)
      5. `php artisan test --compact tests/Feature/Releases/CloseStepConcurrencyTest.php`

      ## Completion Criteria
      - [ ] Il doppio invio sull'ultimo step produce una sola conclusione e un solo evento
      - [ ] Una conclusione interrotta non lascia stati intermedi persistiti
      - [ ] Il commento spiega cosa il test dimostra su SQLite e cosa no
      - [ ] Suite verde

      ## Git Deliverables
      - Commit: `test(US-006): TASK-05 doppia conclusione concorrente e transazione unica`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
