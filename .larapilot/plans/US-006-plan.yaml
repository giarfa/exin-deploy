  -
    id: TASK-01
    title: 'Conclusione della release nel ramo terminale di CloseStep'
    body: |-
      ## Description
      Sostituire il `throw ReleaseCompletionIsNotAvailableYet` con la conclusione vera: passaggio della release a `conclusa` in compare-and-swap, scrittura di `completed_by` e `completed_at`, evento `release_conclusa` — tutto dentro la transazione che chiude l'ultimo step.

      E il punto di innesto che US-005 ha lasciato documentato nell'eccezione stessa. La conclusione resta un **metodo privato** di `CloseStep` e non diventa una Action pubblica: una `CompleteRelease` invocabile dall'esterno sarebbe un secondo percorso di scrittura sullo stato della release, cioe l'opposto dell'invariante "chiusura, avanzamento ed evento in una sola transazione". La deviazione va annotata nel PHPDoc, altrimenti la prossima revisione estrae la classe.

      ## Files Involved
      - app/Actions/Releases/CloseStep.php
      - app/Exceptions/ReleaseCompletionIsNotAvailableYet.php (**eliminato**)
      - app/Exceptions/StepAlreadyClosed.php
      - app/Models/Release.php (PHPDoc)
      - app/Enums/ReleaseEventAction.php (PHPDoc)
      - database/factories/ReleaseFactory.php (PHPDoc dello stato `completed()`)

      ## Steps
      1. Riordinare il corpo della transazione: dopo il compare-and-swap sullo step, scrivere l'evento `step_completato` **prima** del bivio, perche appartiene a entrambi i rami. Verificare che il payload resti quello odierno (`position`, `step`, `fields_filled`)
      2. Calcolare `$next = $step->nextStep()`; ramo con successore invariato (attivazione condizionata a `bloccato` + evento `step_attivato`)
      3. Ramo `$next === null`: invocare il nuovo metodo privato `completeRelease(Release $release, ReleaseStep $step, User $actor, CarbonInterface $now): void`
      4. Dentro `completeRelease`, update condizionato: `Release::query()->whereKey(...)->where('status', ReleaseStatus::InProgress->value)->update([...])` con `status`, `completed_by`, `completed_at`, `updated_at`. Zero righe -> `throw StepAlreadyClosed::whileConcludingRelease($step)`
      5. Commentare **perche** il CAS non e ridondante col `lockForUpdate()` gia presente, richiamando `.ai/rules/releases.md`: su SQLite il lock non produce SQL, la garanzia effettiva e l'update condizionato; il lock serve su MySQL e PostgreSQL, dove il vincolo di portabilita impone che il codice resti corretto
      6. Scrivere l'evento `ReleaseEventAction::ReleaseCompleted` con `release_step_id` = lo step finale e payload `['label' => $release->label, 'step' => $step->name, 'position' => $step->position]`. **Non** contare gli step: la posizione dell'ultimo dice gia la lunghezza della catena, e un `count()` sarebbe una query per un dato gia in mano
      7. Riallineare in memoria **anche** la release oltre allo step: senza, dopo `reload()` la schermata mostrerebbe una release ancora `in_corso` accanto a uno step completato
      8. `StepAlreadyClosed`: costruttore privato con `public readonly string $reasonKey`, come `StepIsNotOpen`. `during()` -> `'releases.closing_already_closed'`; nuovo `whileConcludingRelease()` -> `'releases.closing_already_concluded'`. Aggiornare il PHPDoc della classe: ora descrive due doppi invii distinti
      9. Eliminare `app/Exceptions/ReleaseCompletionIsNotAvailableYet.php` e il suo `use` in `CloseStep` (il `catch` nel componente e di TASK-03)
      10. Aggiornare i PHPDoc che rinviano a US-006 al presente: `Release` ("ricevono significato in US-006"), `ReleaseEventAction` ("`ReleaseCompleted` di US-006"), `ReleaseFactory::completed()` ("che US-006 scrivera"). Il `@throws` di `handle()` perde `ReleaseCompletionIsNotAvailableYet`
      11. `vendor/bin/pint --dirty --format agent` e `php artisan larapilot:quality`
      12. `php artisan test --compact tests/Feature/Releases/` — a questo punto i due test di confine di US-005 **falliscono**, ed e atteso: li sostituisce TASK-02

      ## Completion Criteria
      - [ ] La chiusura dell'ultimo step porta la release a `conclusa` con `completed_by` e `completed_at` valorizzati
      - [ ] La conclusione avviene in compare-and-swap condizionato a `in_corso`, con il motivo commentato nel codice
      - [ ] Il registro riceve `step_completato` **e** `release_conclusa`; sul ramo terminale nessun `step_attivato`
      - [ ] `ReleaseCompletionIsNotAvailableYet` non esiste piu e non e piu referenziata dal dominio
      - [ ] `StepAlreadyClosed` porta `reasonKey` e distingue chiusura dello step da conclusione della release
      - [ ] Lo step **e** la release restituiti sono riallineati in memoria
      - [ ] Pint e Larastan livello 5 verdi

      ## Test Data
      - [ ] Nessuna nuova entita: nessuna factory da creare, nessuna migrazione
      - [ ] `ReleaseFactory::completed()` verificata coerente con cio che l'Action scrive (stato, autore, istante) e PHPDoc allineato al presente
      - [ ] `php artisan migrate:fresh --seed` completa senza errori

      ## Git Deliverables
      - Commit: `feat(US-006): TASK-01 conclusione della release alla chiusura dell'ultimo step`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
    type: Impl
    status: TODO
    dependencies:
      - TASK-00
  -
    id: TASK-02
    title: 'Test: conclusione, invariante degli step attivi e registro'
    body: |-
      ## Description
      Invertire di segno il confine lasciato da US-005 e coprire i criteri che nessuna prova manuale dimostra: la release conclusa non ha alcuno step attivo, la conclusione e nel registro, e la release esce da quelle in corso restando leggibile.

      `CloseStepTest::test_the_last_step_is_refused_because_completing_the_release_is_not_available_yet` va **sostituito**, non cancellato: ogni asserzione che descriveva il rifiuto deve ricomparire come asserzione sulla conclusione. Riusare gli helper privati gia presenti nella classe (`releaseInProgress()`, `validValuesFor()`): duplicarli in un file nuovo darebbe due scenari destinati a divergere.

      ## Files Involved
      - tests/Feature/Releases/CloseStepTest.php
      - tests/Feature/Releases/SaveStepValuesTest.php
      - tests/Unit/Models/ReleaseTest.php (commenti che rinviano a US-006)

      ## Steps
      1. Usare le factory esistenti (`ReleaseFactory`, `ReleaseStepFactory`, `ReleaseStepFieldFactory`) e gli helper della classe — nessuna definizione di factory nei test
      2. Sostituire il test di confine con `test_closing_the_last_step_completes_the_release`: stato `conclusa`, `completed_by` = attore, `completed_at` valorizzato, lo step finale completato
      3. `test_a_completed_release_has_no_active_step`: percorrere l'intera catena e verificare zero step in stato `attivo`; e l'invariante 1 del PRD, il caso "zero"
      4. `test_a_single_step_chain_completes_on_the_first_closure`: catena da un solo step, conclusione immediata
      5. `test_the_completion_is_recorded_in_the_register`: presenza di `release_conclusa` con attore, istante e riferimento allo step finale; ordine cronologico dopo `step_completato`; **assenza** di `step_attivato` sul ramo terminale
      6. `test_a_completed_release_leaves_those_in_progress_but_stays_readable`: assente da `Release::query()->inProgress()`, ancora recuperabile per chiave con la catena leggibile (AC 6, storico a tempo indeterminato)
      7. `test_a_step_of_a_completed_release_cannot_be_closed`: `CloseStep` su una release conclusa solleva `StepIsNotOpen::releaseIsCompleted` senza scrivere nulla
      8. In `SaveStepValuesTest`, test speculare: nemmeno il salvataggio di una bozza passa su release conclusa
      9. Aggiornare i commenti di `ReleaseTest` che rinviavano a "chi implementera la conclusione (US-006)"
      10. `php artisan test --compact tests/Feature/Releases/CloseStepTest.php tests/Feature/Releases/SaveStepValuesTest.php tests/Unit/Models/ReleaseTest.php`
      11. Nessuna suite browser, Dusk, Playwright o matrice di viewport (`settings.testing: NORMAL`)

      ## Completion Criteria
      - [ ] Il test di confine di US-005 e sostituito, non rimosso: le sue asserzioni ricompaiono invertite
      - [ ] Coperti AC 1, 2, 4, 5, 6
      - [ ] Verificata l'assenza di `step_attivato` sul ramo terminale
      - [ ] Suite verde

      ## Git Deliverables
      - Commit: `test(US-006): TASK-02 conclusione della release, invariante e registro`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
    type: Test
    status: TODO
    dependencies:
      - TASK-01
  -
    id: TASK-03
    title: 'Schermata e testi: consegna annunciata, riapertura mai promessa'
    body: |-
      ## Description
      La schermata di chiusura dice ancora che la conclusione "arriva con una prossima versione dello strumento". Dopo TASK-01 e falso, e il criterio di accettazione 7 chiede esplicitamente che il messaggio all'utente non prometta cio che il rilascio non fa: la conclusione ora c'e, la **riapertura** (FR-019) no.

      ## Files Involved
      - resources/views/components/releases/⚡step.blade.php
      - lang/it/releases.php

      ## Steps
      1. Rimuovere il `catch (ReleaseCompletionIsNotAvailableYet)` e il relativo `use`: la classe non esiste piu, e lasciarlo produrrebbe un ramo morto segnalato da Larastan
      2. Rendere il rifiuto del doppio invio da `__($refused->reasonKey)` invece della chiave scritta a mano, cosi che la conclusione concorrente mostri il proprio messaggio
      3. `lang/it/releases.php`: rimuovere `closing_last_step`; aggiungere `closing_already_concluded` ("La release e stata conclusa da un altro invio: la conclusione e avvenuta una sola volta.")
      4. Riscrivere `step_hands_over_last`: alla chiusura di questo step la release risulta consegnata e conclusa. Nessun accenno a versioni future dello strumento
      5. Aggiungere il riquadro di conclusione mostrato dopo la chiusura dell'ultimo step (ramo `$closed` con `nextStep` nullo): etichetta della release, istante della consegna, e il fatto che lo storico resta consultabile. **Nessun comando** e nessuna frase che suggerisca la riapertura
      6. Sullo step gia completato di una release conclusa, indicare lo stato del rilascio accanto ai valori in sola lettura — chi arriva da un collegamento salvato deve capire che il rilascio e chiuso, non solo il proprio passaggio
      7. `step_closing_is_final` resta invariata: e la frase che tiene fede a FR-019
      8. Mobile first: il riquadro nasce a 375 px, nessuno scorrimento orizzontale, `aria-live="polite"` come gli altri annunci della pagina. Soglia unica `max-lg:` — vincolo permanente 4 del README. Solo componenti Flux gratuiti — vincolo 2
      9. `npm run build` se necessario; smoke visivo a 375, 768 e 1280 px
      10. `vendor/bin/pint --dirty --format agent`; `php artisan test --compact tests/Feature/Releases/`

      ## Completion Criteria
      - [ ] Nessun riferimento residuo a `ReleaseCompletionIsNotAvailableYet` o a `closing_last_step` nel codice e nei testi
      - [ ] La chiusura dell'ultimo step annuncia la consegna con etichetta e istante
      - [ ] Nessun testo promette la riapertura di uno step (AC 7)
      - [ ] Il rifiuto del doppio invio rende il messaggio coerente col caso che lo ha prodotto
      - [ ] Riquadro leggibile a 375 px senza scorrimento orizzontale

