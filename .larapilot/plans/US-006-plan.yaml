    id: TASK-04
    title: 'Test: sola lettura della release conclusa e rifiuto tracciato'
    body: |-
      ## Description
      Dimostrare che una release conclusa e in sola lettura **per chiunque**, amministratori inclusi, e che il tentativo di forzarla e rifiutato con 403 e registrato. Non c'e codice nuovo da coprire: `ReleaseStepPolicy::mayAct()` nega gia quando la release non e `in_corso`, e `fill`/`close` sono in `NOT_FILTERED` proprio perche quel vincolo valga anche per un amministratore. Il criterio di accettazione chiede la prova, e senza test una revisione futura potrebbe spostare quelle ability sotto il filtro `before()` senza accorgersi di cosa rompe.

      ## Files Involved
      - tests/Feature/Releases/ReleaseStepPolicyTest.php
      - tests/Feature/Releases/CloseStepScreenTest.php

      ## Steps
      1. Riusare le factory esistenti; comporre la release conclusa con `ReleaseFactory::completed()` e `ReleaseStepFactory::completed()`
      2. `ReleaseStepPolicyTest`: `fill` e `close` negate al responsabile assegnato su release conclusa
      3. Stesso caso per un **amministratore**: la negazione non passa dal filtro `before()`, che per queste due ability non decide (AC 3)
      4. `view` resta consentita: lo storico si consulta a tempo indeterminato, e negarla renderebbe illeggibile cio che la spec vuole conservare
      5. `CloseStepScreenTest`: sostituire `test_the_last_step_of_the_chain_explains_that_it_cannot_be_closed_yet` con il percorso completo dall'interfaccia — il responsabile compila l'ultimo step, chiude, e la pagina annuncia la conclusione con la release passata a `conclusa`
      6. Verificare che nessun testo reso contenga una promessa di riapertura (AC 7)
      7. Invocazione **diretta** dell'azione Livewire `close` su uno step di release conclusa, saltando il percorso dell'interfaccia: esito 403 e tentativo registrato nel registro delle transizioni (AC 4). E il percorso che il middleware non copre, per la deroga dichiarata al vincolo permanente 12
      8. Verificare l'altro lato della stessa moneta: la sola **consultazione** di uno step di release conclusa non genera righe di tentativo non autorizzato — passa da `view`. Senza questo, una revisione futura leggerebbe le righe legittime come un difetto
      9. `php artisan test --compact tests/Feature/Releases/ReleaseStepPolicyTest.php tests/Feature/Releases/CloseStepScreenTest.php`
      10. Nessuna suite browser o E2E (`settings.testing: NORMAL`)

      ## Completion Criteria
      - [ ] Coperti AC 3 e AC 4, amministratore incluso
      - [ ] Lo screen test di confine di US-005 e sostituito dal percorso di conclusione
      - [ ] Il rifiuto sull'invocazione diretta lascia traccia; la consultazione no
      - [ ] Suite verde

