    id: TASK-06
    title: 'Documentazione: ciclo di vita chiuso, CHANGELOG e regola di progetto'
    body: |-
      ## Description
      Chiudere nella documentazione il ciclo di vita che il codice ora completa. Il README descrive ancora la macchina a stati come se `in_corso --> conclusa` non esistesse, e il vincolo permanente 11 elenca `release_conclusa` fra i valori mai scritti — con un conteggio ("due") gia incoerente col proprio elenco.

      Sotto `effort: STANDARD` la documentazione di baseline e dovuta: nessun documento nuovo, solo l'allineamento di cio che oggi dice il falso.

      ## Files Involved
      - README.md
      - CHANGELOG.md
      - .ai/rules/releases.md (via `record-rule`)

      ## Steps
      1. README, diagramma Mermaid della macchina a stati: la transizione `in_corso --> conclusa` non e piu annotata come futura; rimuovere il paragrafo "Finche `in_corso --> conclusa` non esiste (US-006), la chiusura dell'ultimo step della catena viene rifiutata" e sostituirlo con cio che accade ora, ribadendo che nessuna freccia torna indietro (FR-019 fuori perimetro)
      2. README, sezione sull'esecuzione: descrivere la conclusione come parte della stessa transazione della chiusura dell'ultimo step, e l'invariante nel suo caso "zero step attivi"
      3. README, vincolo permanente 11: `releases.completed_by` e `completed_at` sono ora scritte; correggere il conteggio degli `ReleaseEventAction` non ancora usati e lasciare intatto il **motivo** per cui l'enum e nato completo
      4. CHANGELOG, sezione `Unreleased` -> `Added`: "**Conclusione della release** (US-006, FR-017): la chiusura dell'ultimo step della catena conclude il rilascio con autore e istante della consegna. Una release conclusa non ha alcuno step attivo, non compare fra quelle in corso ed e in sola lettura per chiunque, amministratori inclusi. La conclusione e registrata nel registro delle transizioni. La riapertura di uno step resta fuori perimetro." — stile e lingua delle voci esistenti
      5. Registrare con `record-rule` (glob `app/Actions/Releases/**`) la regola durevole che il codice da solo non spiega: **anche** la conclusione della release passa da un update condizionato a `in_corso`, per lo stesso motivo gia registrato per la chiusura dello step. Aggiornare la regola esistente in `.ai/rules/releases.md` invece di crearne una seconda sullo stesso perimetro
      6. Verificare che i diagrammi Mermaid siano ancora resi correttamente
      7. `php artisan test --compact` — suite completa prima della consegna
      8. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Il README descrive il ciclo di vita completo; nessuna nota che dia la conclusione per futura
      - [ ] Vincolo permanente 11 chiuso e conteggio corretto
      - [ ] CHANGELOG `Unreleased` aggiornato
      - [ ] Regola di progetto registrata via `record-rule` sul perimetro delle Action di rilascio
      - [ ] Suite completa verde, Pint e Larastan livello 5 verdi

