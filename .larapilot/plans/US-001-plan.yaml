      ## Files Involved
      - resources/views/components/layouts/app.blade.php
      - resources/views/components/ (sidebar, navigazione, menu utente)
      - resources/css/app.css
      - public/robots.txt
      - public/favicon.svg
      - public/images/brand/logo.svg
      - routes/web.php

      ## Steps
      1. Layout con sidebar Flux secondo `.larapilot/design-systems/starter-kit/components.md`:
         sidebar chiara, logo in alto, gruppi di navigazione con etichette maiuscole, menu utente in fondo
      2. Gruppi di navigazione predisposti: "Operativo" (I miei step, Release, Progetti) e
         "Configurazione" (Template di workflow, Ruoli, Membri del team). Le voci non ancora implementate
         restano disabilitate, non nascoste: la struttura del prodotto deve essere leggibile da subito
      3. **Soglia unica a 1024 px** in tutta l'applicazione: sopra la sidebar e permanente, sotto diventa
         un drawer aperto dall'hamburger. `tokens.css` del design system usa 768 px e `components.md` usa
         1024 px: la scelta di progetto e 1024 px, motivata nel README dei mockup
      4. Comportamento del drawer: `aria-expanded` aggiornato sul trigger, `aria-controls` verso il
         contenitore, focus intrappolato mentre e aperto, `Esc` chiude, alla chiusura il focus torna sul
         trigger
      5. Skip link "Salta al contenuto" come primo elemento focalizzabile; landmark semantici
         (`header`, `nav`, `main`, `footer`); un solo `h1` per pagina; focus visibile su ogni elemento
         interattivo
      6. Tema chiaro e scuro con i token del design system; preferenza persistita sull'account o in
         `localStorage`; contrasto verificato in entrambi i temi
      7. Target touch minimo 44x44 px sotto 1024 px; densita desktop consentita da 1024 px
      8. `prefers-reduced-motion` rispettato
      9. Asset di brand dai mockup: copiare `favicon.svg` in `public/` e `logo.svg` in
         `public/images/brand/`; collegare la favicon nel layout con
         `<link rel="icon" href="/favicon.svg" type="image/svg+xml">`
      10. Esclusione dagli indici: `public/robots.txt` con `User-agent: *` e `Disallow: /`, piu meta
          `robots: noindex, nofollow` nel layout come seconda barriera. **Nessun** `sitemap.xml` ne
          `llms.txt`: esporrebbero un elenco di URL interni (deroga motivata nel README dei mockup)
      11. `<title>` parlante e unico per pagina, utile per schede e cronologia del browser
      12. `npm run build`; `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [ ] Layout con sidebar conforme al design system Starter Kit, senza componenti Flux Pro
      - [ ] Sidebar permanente da 1024 px, drawer sotto, con una sola soglia in tutta l'applicazione
