    id: TASK-05
    title: 'Autenticazione Fortify: login, reset password, 2FA e blocco degli utenti disattivati'
    type: Impl
    status: TODO
    dependencies:
      - TASK-04
    body: |
      ## Description
      Rendere operativa l'autenticazione: login, reset password e 2FA TOTP, con schermate proprie in
      Livewire e Flux allineate al layout auth dello Starter Kit. Nessuna registrazione pubblica, e login
      rifiutato per gli utenti disattivati.

      ## Files Involved
      - app/Providers/FortifyServiceProvider.php
      - config/fortify.php
      - resources/views/auth/ (login, reset password, conferma password, 2FA challenge, enrolment)
      - app/Livewire/Auth/ (componenti dei form)
      - routes/web.php

      ## Steps
      1. In `FortifyServiceProvider` registrare le viste di login, reset password, conferma password,
         challenge 2FA ed enrolment 2FA, usando il layout auth del kit come riferimento
         (`.larapilot/design-systems/starter-kit/html/login.html`)
      2. Sostituire l'autenticazione con `Fortify::authenticateUsing()`: verificare le credenziali **e**
         `is_active`. Un utente disattivato riceve un messaggio esplicito ("account disattivato"), distinto
         dal messaggio di credenziali errate, perche il caso e legittimo e non un tentativo di intrusione
      3. Verificare che non esista alcuna rotta pubblica di registrazione (`registration` disattivata) e
         che `/register` restituisca 404
      4. Attivare 2FA TOTP con conferma: schermata di enrolment con QR e codici di recupero, schermata di
         challenge al login
      5. Applicare il middleware `auth` a tutte le rotte applicative: la rotta `/` di serie che restituisce
         la vista `welcome` va sostituita con un redirect verso il login o verso la home autenticata
      6. Copy in italiano nei file `lang/` — non incastonato nelle viste (vincolo del PRD)
