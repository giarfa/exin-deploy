code: US-001
plan_body: |
  ## Technical Solution

  Spec di fondamenta: porta il repository da scheletro Laravel a applicazione autenticata con
  shell operativa, e stabilisce la baseline di sicurezza su cui poggiano tutte le spec successive.

  **Stack installato** (compatibilita verificata in discovery con dry-run su Laravel 13.24 / PHP 8.4):

  - `livewire/livewire` ^4.4 e `livewire/flux` ^2.16 — solo componenti Flux **free**; l'adozione di
    componenti Flux Pro richiede una licenza a pagamento non acquistata e va decisa dall'utente
  - `laravel/fortify` ^1.38 — login, reset password, 2FA TOTP, con viste proprie in Livewire

  Gli Starter Kit ufficiali si applicano alla creazione del progetto (`laravel new`), mentre questo
  repository esiste gia con Larapilot installato: la variante `livewire` registrata nel PRD si ottiene
  installando i tre pacchetti e costruendo layout, navigazione e schermate di autenticazione allineati
  alle convenzioni del kit. Riferimento visivo: `.larapilot/design-systems/starter-kit/` e i mockup in
  `.larapilot/mockups/superficie-operativa/`.

  **Nessuna registrazione pubblica.** La feature `registration` di Fortify resta disattivata: gli
  account nascono solo da un amministratore. Anche la feature **passkeys** resta disattivata — Fortify
  1.38 installa `laravel/passkeys` come dipendenza, ma le passkey non sono nel perimetro del PRD e
  attivarle aprirebbe una superficie di autenticazione non specificata.

  **Modello User.** Chiave primaria UUID (`HasUuids`, UUIDv7), livello applicativo come enum PHP
  nativo (`App\Enums\UserLevel`: `Admin`, `Member`), flag `is_active`. Il file `app/Models/User.php`
  di Laravel 13 usa gli attributi `#[Fillable]` e `#[Hidden]`: mantenere quella convenzione, non
  reintrodurre le proprieta `$fillable`/`$hidden`.

  **Migrazione della chiave primaria.** La tabella `users` di serie usa `$table->id()` autoincrementale
  e `sessions.user_id` e una `foreignId` (bigint). Il passaggio a UUID richiede di cambiare **entrambe**
  le colonne, altrimenti la chiave esterna si rompe in modo silenzioso. Poiche l'applicazione non e mai
  stata rilasciata e non esistono dati, si modifica direttamente la migrazione di serie
  `0001_01_01_000000_create_users_table.php` invece di aggiungere una migrazione correttiva: e piu
  leggibile e non lascia debito. Questa e una deroga consapevole alla regola "una migrazione per
  concern", valida solo prima del primo rilascio.

  **Autorizzazione.** `UserPolicy` con metodo `before()` che concede tutto agli utenti `Admin`
  (vedi Policy Filters nella documentazione Laravel 13). Il controllo vive nella Policy lato server:
  nascondere comandi nell'interfaccia non e autorizzazione. Vale per tutta la gestione dei membri.

  **Utente disattivato.** Il login di un utente con `is_active = false` viene rifiutato con messaggio
  esplicito tramite `Fortify::authenticateUsing()`, e il record non viene mai cancellato: la traccia
  storica sui rilasci passati deve restare leggibile (requisito del registro, FR-016).

  **Baseline di sicurezza** (per Security baseline in `runtime-delivery.md`): `HASH_DRIVER=argon2id`
  (supporto PHP verificato: `password_algos()` include `argon2id`), `Password::defaults()` registrato in
  `AppServiceProvider::boot()`, chiavi primarie UUID, 2FA TOTP.

  **Configurazione SQLite.** Laravel 13 espone nativamente `journal_mode`, `busy_timeout` e
  `synchronous` nel blocco `sqlite` di `config/database.php`: si impostano WAL e un timeout di attesa
  per contenere il rischio di concorrenza in scrittura registrato tra i rischi accettati del PRD.
  Vincolo permanente: solo Eloquent e migrazioni portabili, nessuna funzione SQLite-specifica, perche
  la migrazione a PostgreSQL deve restare un cambio di configurazione.

  **Fuori perimetro di questa spec** (nessun criterio di accettazione lo richiede): Socialite/SSO,
  code e worker, API HTTP, pipeline CI. La pipeline CI e un impegno del PRD non coperto da alcun
  requisito funzionale: va aperta come spec propria o affrontata in `/larapilot-ship`.

  ## Git & Branching

  - Mode: `GITFLOW` — branch e commit atomici per task, descrizione di PR preparata **in locale**,
    nessun push automatico
  - **Prerequisito non standard:** il progetto **non e ancora un repository git**. TASK-00 inizializza
    il repository, committa lo scheletro esistente e gli artefatti Larapilot, crea `main` e `develop`,
    poi crea il branch di lavoro
  - Branch: `feature/US-001-accesso-membri-team` da `develop`
  - Per task: un solo Conventional Commit nel formato `type(US-001): TASK-NN riassunto`
  - Push e apertura PR remota: **omessi** (`GITFLOW` non pubblica). Da eseguire solo su richiesta
    esplicita dell'utente in sessione
  - Merge su `develop` solo dopo approvazione umana in `/larapilot-review`
  - `.gitignore` di serie: verificare che `database/database.sqlite`, `/vendor`, `/node_modules` e
    `.env` siano esclusi prima del primo commit

  ## Test Data Strategy

  - Alex mantiene factory e seeder nello stesso task che modifica migrazioni, modelli o enum
  - `UserFactory`: campi realistici in italiano, con stati `admin()`, `member()` e `inactive()`
  - `DatabaseSeeder`: un amministratore con credenziali note per lo sviluppo piu quattro membri con
    nomi plausibili. Sostituire il "Test User" di serie
  - Lo scenario dimostrativo completo (progetti, template, release a meta catena, release conclusa)
    appartiene a **US-011**: qui si seminano solo i membri del team
  - Verificare `php artisan migrate:fresh --seed` prima di ogni `task-done` che toccchi lo schema

  ## Test Strategy

  - Bar: `NORMAL`. Il repository usa **PHPUnit 12.5**, non Pest: i test sono classi PHPUnit create con
    `php artisan make:test --phpunit`
  - **Nessun** Playwright, Laravel Dusk, Pest browser, matrice di viewport o E2E di journey
  - Test interlacciati con l'implementazione (TASK-04, TASK-06, TASK-09), non accumulati alla fine
  - Copertura richiesta:
    - Modello e enum: UUID generato, cast del livello, stati della factory, hashing Argon2id effettivo
    - `Password::defaults()`: una password debole viene rifiutata dalla validazione
    - Autenticazione: login valido, credenziali errate, **utente disattivato rifiutato**, reset
      password, enrolment e challenge 2FA, assenza di rotte pubbliche di registrazione
    - Autorizzazione: un `Member` riceve 403 su ogni rotta di gestione dei membri, un `Admin` passa;
      verifica a livello di rotta, non solo di Policy in isolamento
    - Disattivazione: il membro non accede ma resta leggibile nei riferimenti storici
  - **Verifica manuale (handoff per l'umano)** sulla shell applicativa, poiche il bar non prevede test
    browser: layout a 375 / 768 / 1280 px, apertura e chiusura del drawer sotto 1024 px, ritorno del
    focus sul trigger, skip link raggiungibile con Tab, tema chiaro e scuro. Il contratto e la sezione
    "Responsive & navigazione" del README dei mockup

  ## Documentation

  Baseline per Technical Documentation in `runtime-delivery.md`: README (prerequisiti, avvio via
  Laravel Herd, variabili d'ambiente, comandi di test e di seed), nota architetturale iniziale sulla
  separazione fra tabelle di definizione e di istanza, `CHANGELOG.md` in formato Keep a Changelog.
  Nessun OpenAPI: la spec non introduce API. I diagrammi Mermaid (ER e macchina a stati) approvati in
  fase di backlog appartengono a **US-005**, quando modello e transizioni sono completi.

  ## Quality gate

  `larastan/larastan` e dichiarato in `require-dev` ma **non e installato** in `vendor/`: senza
  `composer install` il comando `php artisan larapilot:quality` non e eseguibile. Risolto in TASK-01.
  Prima di ogni `task-done`: `vendor/bin/pint --dirty --format agent` e Larastan a livello 5.
tasks:
