    body: |
      ## Description
      Costruire il guscio dell'applicazione secondo lo Starter Kit variante `livewire`: layout con sidebar,
      drawer sotto 1024 px, tema chiaro e scuro, navigazione. E la cornice in cui vivranno tutte le
