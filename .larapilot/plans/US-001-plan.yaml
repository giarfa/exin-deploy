    id: TASK-08
    title: 'Gestione dei membri del team con autorizzazione lato server'
    type: Impl
    status: TODO
    dependencies:
      - TASK-07
    body: |
      ## Description
      Consentire a un amministratore di creare, modificare e disattivare i membri del team, con
      autorizzazione applicata a livello di Policy e non solo nascondendo comandi nell'interfaccia.

      ## Files Involved
      - app/Policies/UserPolicy.php
      - app/Livewire/Members/ (elenco e form)
      - app/Http/Requests/ (o regole di validazione nei componenti Livewire)
      - resources/views/livewire/members/
      - routes/web.php
      - lang/it/

      ## Steps
      1. `php artisan make:policy UserPolicy --model=User`
      2. Nella Policy definire `before(User $user, string $ability): bool|null` che restituisce `true`
         quando `$user->isAdministrator()` e `null` altrimenti, cosi che i `Member` cadano sui metodi
         specifici (vedi Policy Filters nella documentazione Laravel 13). Attenzione alla nota della
         documentazione: `before()` non viene invocato per ability che non hanno un metodo corrispondente
         nella Policy, quindi ogni ability usata deve esistere come metodo
      3. Elenco dei membri: nome, email, livello, stato attivo. Eager loading dove servono relazioni;
         nessuna query dentro cicli
      4. Form di creazione: nome, email (univoca), livello (`UserLevel`), password iniziale validata con
         `Password::defaults()`
      5. Form di modifica: nome, email, livello. La disattivazione e un'azione distinta e dichiarata, non
         una spunta nascosta in un form
      6. **Disattivazione, non cancellazione**: non esporre alcuna azione di eliminazione di un utente. La
         traccia storica sui rilasci deve restare leggibile (requisito del registro, FR-016)
      7. Applicare l'autorizzazione sulle rotte con il middleware `can` o `Gate::authorize` nei
         componenti: un `Member` che invoca direttamente la rotta riceve 403
      8. Copy in italiano in `lang/`; messaggi di errore che dicono cosa correggere
      9. Interfaccia conforme al design system Starter Kit; leggibile a 375 px
      10. `vendor/bin/pint --dirty --format agent` e Larastan livello 5

      ## Completion Criteria
      - [ ] Un amministratore crea un membro con nome, email e livello
      - [ ] Un amministratore modifica un membro esistente
      - [ ] Un amministratore disattiva un membro; nessuna azione di cancellazione e esposta
      - [ ] Un `Member` che invoca una rotta di gestione riceve 403, anche chiamandola direttamente
      - [ ] L'email e univoca: il duplicato viene rifiutato in validazione
      - [ ] La password iniziale rispetta `Password::defaults()`
      - [ ] Un membro disattivato resta visibile nell'elenco con il proprio stato
      - [ ] Nessuna query N+1 nell'elenco
      - [ ] I testi vivono in `lang/`

      ## Test Data
      - [ ] Nessuna nuova entita: `UserFactory` e `DatabaseSeeder` da TASK-03 restano validi
      - [ ] Verificare che il seeder produca sia amministratori sia membri, cosi che le schermate di
            gestione siano valutabili su dati reali

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-08 gestione dei membri del team con Policy`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
