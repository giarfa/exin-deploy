    id: TASK-03
    title: 'Modello User con UUID, livello applicativo e stato attivo'
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |
      ## Description
      Portare `User` alla forma richiesta dal PRD: chiave primaria UUID, livello applicativo come enum
      nativo, flag di attivazione. Include factory e seeder nello stesso task, come prescritto dalla
      disciplina di progetto.

      ## Files Involved
      - app/Models/User.php
      - app/Enums/UserLevel.php
      - database/migrations/0001_01_01_000000_create_users_table.php
      - database/factories/UserFactory.php
      - database/seeders/DatabaseSeeder.php

      ## Steps
      1. `php artisan make:enum UserLevel` (o creazione manuale in `app/Enums/`): enum `string` con casi
         `Admin = 'admin'` e `Member = 'member'`. Chiavi in TitleCase per le convenzioni PHP del progetto
      2. Modificare la migrazione di serie `create_users_table`:
         - `users.id`: da `$table->id()` a `$table->uuid('id')->primary()`
         - aggiungere `$table->string('level')->default('member')` e
           `$table->boolean('is_active')->default(true)->index()`
         - **`sessions.user_id`: da `$table->foreignId(...)` a `$table->foreignUuid('user_id')->nullable()->index()`**
           — senza questa modifica la chiave esterna si rompe in modo silenzioso
         - `password_reset_tokens` usa l'email come chiave primaria: non richiede modifiche
         Deroga consapevole a "una migrazione per concern": l'applicazione non e mai stata rilasciata e non
         esistono dati, quindi modificare la migrazione di serie e piu leggibile di una correttiva
      3. In `app/Models/User.php` aggiungere il trait `Illuminate\Database\Eloquent\Concerns\HasUuids`
         (genera UUIDv7, ordinabili e quindi efficienti come indice)
      4. Estendere gli attributi **mantenendo la convenzione Laravel 13 gia presente nel file**:
         `#[Fillable(['name', 'email', 'password', 'level', 'is_active'])]` — non reintrodurre `$fillable`
      5. In `casts()` aggiungere `'level' => UserLevel::class` e `'is_active' => 'boolean'`
      6. Aggiungere il metodo `isAdministrator(): bool` (nome descrittivo per le convenzioni di progetto),
         usato dal filtro `before()` della Policy in TASK-08
      7. `UserFactory`: nomi e email realistici in italiano; stati `admin()`, `member()`, `inactive()`
      8. `DatabaseSeeder`: sostituire il "Test User" di serie con un amministratore dalle credenziali note
         per lo sviluppo piu quattro membri con nomi plausibili. Lo scenario dimostrativo completo
         (progetti, template, release) appartiene a US-011
      9. `php artisan migrate:fresh --seed`
      10. `vendor/bin/pint --dirty --format agent` e Larastan livello 5

      ## Completion Criteria
      - [x] `users.id` e un UUID e i nuovi record lo ricevono automaticamente
      - [x] `sessions.user_id` e una `foreignUuid` e il login mantiene la sessione senza errori
      - [x] `App\Enums\UserLevel` esiste con casi `Admin` e `Member`, ed e usato come cast
      - [x] `is_active` presente, indicizzato, con default `true`
      - [x] `User` usa `HasUuids` e mantiene la convenzione ad attributi `#[Fillable]` / `#[Hidden]`
      - [x] `isAdministrator()` restituisce `true` solo per il livello `Admin`
      - [x] `migrate:fresh --seed` completa senza errori e senza chiavi esterne orfane

      ## Test Data
      - [x] `database/factories/UserFactory.php` aggiornata con stati `admin()`, `member()`, `inactive()`
      - [x] `DatabaseSeeder` crea un amministratore e almeno quattro membri con dati realistici in italiano
      - [x] Factory e seeder aggiornati in **questo stesso task** delle modifiche a migrazione e modello

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-03 User con UUID, livello applicativo e stato attivo`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
