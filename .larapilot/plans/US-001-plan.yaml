    id: TASK-02
    title: 'Baseline di sicurezza e configurazione SQLite'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |
      ## Description
      Applicare la baseline di sicurezza del progetto (Argon2id, regole password globali) e configurare
      SQLite in modalita WAL con timeout di attesa, per contenere il rischio di concorrenza in scrittura
      registrato fra i rischi accettati del PRD.

      ## Files Involved
      - .env / .env.example
      - config/hashing.php
      - config/database.php
      - app/Providers/AppServiceProvider.php

      ## Steps
      1. Impostare `HASH_DRIVER=argon2id` in `.env` e `.env.example`; verificare `config/hashing.php`.
         Supporto PHP verificato in fase di piano: `password_algos()` su questo PHP 8.4 include `argon2id`
      2. In `AppServiceProvider::boot()` registrare le regole password globali:
         `Password::defaults(fn (): Password => Password::min(8)->mixedCase()->numbers()->symbols()->uncompromised())`
      3. Nel blocco `sqlite` di `config/database.php` valorizzare le chiavi che Laravel 13 espone
         nativamente: `'journal_mode' => env('DB_JOURNAL_MODE', 'WAL')`,
         `'busy_timeout' => env('DB_BUSY_TIMEOUT', 5000)`,
         `'synchronous' => env('DB_SYNCHRONOUS', 'NORMAL')`
      4. Documentare le tre variabili in `.env.example` con un commento di una riga sul perche
      5. Verificare che WAL sia attivo: `php artisan tinker --execute 'echo DB::select("PRAGMA journal_mode")[0]->journal_mode;'`
      6. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] `HASH_DRIVER=argon2id` attivo e documentato in `.env.example`
      - [x] Una password creata dall'applicazione risulta hashata con Argon2id, non con bcrypt
      - [x] `Password::defaults()` registrato in `AppServiceProvider::boot()`
      - [x] `PRAGMA journal_mode` restituisce `wal`
      - [x] `busy_timeout` e `synchronous` configurati e documentati
      - [x] Nessuna funzione SQLite-specifica introdotta nel codice applicativo

      ## Test Data
      - N/A — nessuna modifica a schema o modelli in questo task

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-02 baseline di sicurezza Argon2id e SQLite in WAL`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
