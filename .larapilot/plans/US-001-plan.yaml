    id: TASK-00
    title: 'Inizializzare il repository git e il branch di lavoro'
    type: Impl
    status: DONE
    dependencies: {}
    body: |
      ## Description
      Portare il progetto sotto controllo di versione e preparare Gitflow per questa spec. Il progetto
      **non e ancora un repository git**: non esiste `.git`, quindi non esistono `main` ne `develop` da
      cui derivare il branch. Questo task colma il prerequisito prima di qualsiasi modifica al codice.

      ## Files Involved
      - (solo git e `.gitignore` — nessun file applicativo)

      ## Steps
      1. Verificare `.gitignore`: `/vendor`, `/node_modules`, `.env`, `database/database.sqlite`,
         `/storage/*.key` devono essere esclusi. Aggiungere `database/*.sqlite*` se assente (il file WAL e
         il file SHM di SQLite non devono finire in versione)
      2. `git init -b main`
      3. `git add -A && git commit -m "chore: initial commit - scheletro Laravel 13 con Larapilot"` —
         include lo scheletro, gli artefatti `.larapilot/` (PRD, backlog, spec, mockup) e `.ai/rules/`
      4. `git checkout -b develop`
      5. `git checkout -b feature/US-001-accesso-membri-team`
      6. Redigere titolo e corpo della PR interna verso `develop` e **tenerli in locale**:
         titolo `US-001: Accesso allo strumento e gestione dei membri del team`; corpo con link al piano
         e l'elenco dei task previsti
      7. Commit di ancoraggio del branch (commit vuoto ammesso)

      ## Completion Criteria
      - [x] Il repository git esiste, con commit iniziale che include codice e artefatti Larapilot
      - [x] `.gitignore` esclude `.env`, `vendor`, `node_modules` e i file del database SQLite
      - [x] I branch `main` e `develop` esistono
      - [x] Il branch `feature/US-001-accesso-membri-team` esiste in locale e ne deriva da `develop`
      - [x] Titolo e corpo della PR interna redatti e tenuti in locale

      ## Test Data
      - N/A — nessuna modifica a schema o modelli

      ## Git Deliverables
      - Commit: `chore(US-001): TASK-00 bootstrap feature branch` (commit vuoto ammesso)
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: preparata in locale; apertura remota solo su richiesta esplicita dell'utente
