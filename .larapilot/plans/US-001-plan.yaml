    id: TASK-01
    title: 'Installare Livewire 4, Flux e Fortify'
    type: Impl
    status: DONE
    dependencies:
      - TASK-00
    body: |
      ## Description
      Installare lo stack di interfaccia e autenticazione registrato nel PRD, e completare le dipendenze
      di sviluppo mancanti. Solo installazione e configurazione: le schermate arrivano nei task successivi.

      ## Files Involved
      - composer.json / composer.lock
      - config/fortify.php (pubblicato)
      - bootstrap/providers.php
      - app/Providers/FortifyServiceProvider.php
      - database/migrations/ (migrazioni pubblicate da Fortify)
      - resources/views/, resources/css/app.css, resources/js/app.js
      - package.json / package-lock.json

      ## Steps
      1. `composer install` — `larastan/larastan` e dichiarato in `require-dev` ma non presente in
         `vendor/`: senza questo passaggio `php artisan larapilot:quality` non e eseguibile
      2. `composer require livewire/livewire:^4.4 livewire/flux:^2.16`
      3. `composer require laravel/fortify:^1.38`
      4. `php artisan fortify:install` (o pubblicazione di config e provider secondo la versione
         installata); registrare `FortifyServiceProvider` in `bootstrap/providers.php`
      5. In `config/fortify.php` abilitare **solo** le feature necessarie: `resetPasswords`,
         `updatePasswords`, `twoFactorAuthentication` con conferma. **Disattivare** `registration`
         (nessuna registrazione pubblica) ed **eventuali feature passkeys**: Fortify 1.38 installa
         `laravel/passkeys` come dipendenza, ma le passkey non sono nel perimetro del PRD
      6. Verificare il layout Flux e le direttive Livewire in `resources/`; installare gli asset frontend
         con `npm install && npm run build`
      7. `composer audit` — nessuna vulnerabilita nota
      8. `php artisan test` — la suite di serie resta verde

      ## Completion Criteria
      - [x] Livewire 4, Flux 2 e Fortify 1.38 installati e risolti senza conflitti
      - [x] `larastan/larastan` presente in `vendor/` e `php artisan larapilot:quality` eseguibile
      - [x] `config/fortify.php` pubblicato, con `registration` e passkeys disattivate
      - [x] `FortifyServiceProvider` registrato
      - [x] `npm run build` completa senza errori
      - [x] `composer audit` non segnala vulnerabilita
      - [x] Nessun componente Flux Pro utilizzato

      ## Test Data
      - N/A — nessuna modifica a schema o modelli in questo task

      ## Git Deliverables
      - Commit: `chore(US-001): TASK-01 installa Livewire 4, Flux e Fortify`
      - Push: **omesso** (`git_mode: GITFLOW`)
      - PR: aggiornare le note locali
