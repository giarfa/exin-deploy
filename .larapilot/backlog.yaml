  -
    code: US-002
    title: 'Ruoli funzionali, progetti e responsabili'
    epic:
      code: EP-002
      title: 'Configurazione del processo'
    priority: HIGH
    points: 8
    status: DONE
    body: |
      #### US-002: Ruoli funzionali, progetti e responsabili

      **Epic:** EP-002 | **Priority:** HIGH | **Points:** 8 | **Status:** TODO
      **Blocked by:** US-001
      **Traces to:** FR-002, FR-003, FR-004, FR-005 (MoSCoW: Must)

      **Storia utente**
      Come Release Owner,
      voglio definire i ruoli funzionali del processo, i progetti su cui rilasciamo e chi ricopre ciascun ruolo — con una mappatura predefinita a livello di team —
      così che lo stesso processo si applichi a tutti i progetti senza riconfigurarlo ogni volta.

      **Dimostra**
      Dopo questa spec creo i ruoli, imposto la mappatura predefinita ruolo→persona, creo un progetto e
      ritrovo quella mappatura già precompilata, modificabile sul progetto senza alterare il valore predefinito.

      **Criteri di accettazione**
      - [x] Un amministratore crea, modifica e disattiva ruoli funzionali (nome, descrizione)
      - [x] Un ruolo referenziato da un template o da una release non è cancellabile: il tentativo è rifiutato con messaggio esplicito e il ruolo resta disattivabile
      - [x] Un amministratore crea, modifica e disattiva progetti (nome, slug, descrizione)
      - [x] Lo slug del progetto è univoco: il duplicato è rifiutato in validazione e vincolato a livello di schema
      - [x] Un amministratore definisce la mappatura predefinita ruolo→persona valida per il team
      - [x] Alla creazione di un progetto la mappatura predefinita viene precompilata sul progetto
      - [x] Modificare la mappatura di un progetto non altera la mappatura predefinita, e viceversa
      - [x] Una sola persona per coppia progetto/ruolo, con vincolo di unicità a livello di schema e non solo di validazione
      - [x] Assegnare a un ruolo una persona disattivata è rifiutato con messaggio esplicito
      - [x] Un `member` non accede alla configurazione di ruoli, progetti e mappature (Policy lato server)
      - [x] Factory e seeder aggiornati per ruoli, progetti e mappature nello stesso commit delle migrazioni
    status_history:
